<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stack Markets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Stack Markets v3 look (2026-10-01): flat and quiet. Surfaces are told apart by tone, not borders; labels are small and
   dim; the chart gets the room. Nothing announces itself on top of the page: news has its own line under the top bar,
   results land in the status bar at the bottom. */
:root{--bg:#0b0e13;--bg2:#08090d;--panel:#11151b;--panel2:#181d25;--hov:#151a21;--line:#1f2530;--mute:#9aa3b2;--dim:#636c7b;--txt:#e9ecf1;--green:#16c784;--red:#ea3943;--gold:#f0b90b;--blue:#3b82f6;--pur:#6e7bff;--r:8px;--gt:rgba(22,199,132,.13);--rt:rgba(234,57,67,.13);--at:rgba(110,123,255,.15);--yt:rgba(240,185,11,.13)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum","cv11","ss01";letter-spacing:-.005em;-webkit-font-smoothing:antialiased;height:100%}
body{overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}button:disabled{cursor:not-allowed;opacity:.45}
input,select{font:inherit;color:inherit}
.up{color:var(--green)}.dn{color:var(--red)}.gd{color:var(--gold)}.mut{color:var(--mute)}
.mono{font-family:"JetBrains Mono",monospace}
.sp{flex:1}
*{scrollbar-width:thin;scrollbar-color:#2a313c transparent}
#app{position:fixed;inset:0;display:grid;grid-template-rows:50px 30px minmax(0,1fr) 30px}
/* top bar: brand, sections, market, money */
.top{display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--bg2)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}.brand svg{width:22px;height:22px}.brand b{color:var(--mute);font-weight:500}
nav{display:flex;align-items:stretch;height:100%;gap:2px}
nav button{position:relative;padding:0 11px;font-weight:600;font-size:13.5px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}nav button:hover{color:#fff}
nav button.on{color:#fff}nav button.on::after{content:'';position:absolute;left:11px;right:11px;bottom:0;height:2px;border-radius:2px;background:var(--pur)}
nav .bd{font-size:10px;font-weight:800;padding:0 6px;line-height:16px;border-radius:8px;background:var(--gold);color:#1e1700}nav .bd.g{background:var(--green);color:#03140c}
.hk{display:flex;flex-direction:column;line-height:1.2;white-space:nowrap}.hk small{font-size:10.5px;color:var(--dim);font-weight:600}.hk b{font-size:13.5px;font-weight:700}.hk b span{font-size:12px;margin-left:5px;font-weight:600}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 5px var(--green);animation:bl 1.4s infinite;vertical-align:1px}@keyframes bl{50%{opacity:.35}}
body.paused .live{background:var(--gold);box-shadow:0 0 6px var(--gold);animation:none}
.money{display:flex;align-items:center;gap:18px}
#bal.flash-up{color:var(--green)}#bal.flash-dn{color:var(--red)}
.btn-top{background:var(--blue);color:#fff;font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:8px}
/* the news line: announcements live here and nowhere else */
.rail{display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12.5px;min-width:0;overflow:hidden}
.annc{flex:1;min-width:0;display:flex;align-items:center;gap:9px;white-space:nowrap;overflow:hidden;color:var(--mute);transition:color .3s}
.annc em{font-style:normal;flex:none;font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--mute)}
.annc .tx{overflow:hidden;text-overflow:ellipsis}.annc b{color:#fff;margin-right:4px}.annc .mv{font-weight:800;flex:none}
.annc.sty{color:#fff}.annc.sty em{background:var(--pur);color:#fff}.annc.brk{color:#fff}.annc.brk em{background:var(--red);color:#fff}.annc.soon{color:#fff}.annc.soon em{background:var(--gold);color:#1e1700}
.annc.fresh .tx{animation:fin .35s}@keyframes fin{from{opacity:0;transform:translateY(6px)}}
.rk{display:flex;align-items:center;gap:7px;white-space:nowrap;color:var(--mute);font-weight:600}.rk b{color:#fff;font-weight:700}.rk canvas{width:38px;height:21px}
#hNext small{color:var(--dim);font-size:12px;font-weight:600;margin-right:6px}#hNext b{font-weight:700}
/* the status bar: results and the pause state */
.status{display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--bg2);font-size:12.5px;min-width:0;overflow:hidden}
#pauseSt{flex:none;color:var(--dim);font-weight:600;white-space:nowrap}body.paused #pauseSt{color:var(--gold)}
#toasts{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow:hidden}
.toast{flex:none;display:flex;align-items:center;gap:8px;padding:3px 10px;border-radius:7px;background:var(--panel);font-weight:600;white-space:nowrap;animation:tin .3s}.toast b{font-weight:800}.toast .ts{color:var(--mute);font-weight:500}
.toast.win{box-shadow:inset 2px 0 0 var(--green)}.toast.lose{box-shadow:inset 2px 0 0 var(--red)}.toast.big{background:var(--yt);box-shadow:inset 2px 0 0 var(--gold)}.toast.big .tt0{color:var(--gold)}
.toast.old{opacity:.45;transition:opacity .6s}@keyframes tin{from{transform:translateX(-16px);opacity:0}}
#stHint{flex:none;color:var(--dim);white-space:nowrap}
/* sections */
.sec{display:none;position:absolute;inset:0;overflow:auto;padding:14px 16px}.sec.on{display:block}
#sTerm.on{display:grid;grid-template-columns:236px minmax(0,1fr) 332px;gap:12px;overflow:hidden;padding:12px 14px}
.card{background:var(--panel);border-radius:var(--r);min-width:0}
.ch{padding:11px 14px 7px;display:flex;align-items:center;justify-content:space-between;gap:8px}.ch h3{font-size:11px;letter-spacing:.08em;color:var(--dim);font-weight:700}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
/* watchlist */
.wl{display:flex;flex-direction:column;min-height:0}.wf{display:flex;flex-wrap:wrap;gap:3px;padding:0 10px 8px}.wf button{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:12px;color:var(--mute)}.wf button:hover{color:#fff}.wf button.on{background:var(--panel2);color:#fff}
.wrows{overflow:auto;flex:1}.wr{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:0 8px;padding:7px 12px;text-align:left;width:100%;position:relative;border-radius:0}
.wr:hover{background:var(--hov)}.wr.on{background:var(--panel2);box-shadow:inset 2px 0 0 var(--pur)}
.wr .sy{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}.wr .nm{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:86px}.wr .pr{font-weight:700;font-size:13px;text-align:right}.wr .cg{font-size:11.5px;font-weight:600;text-align:right}
.wr svg{position:absolute;right:86px;top:9px;width:42px;height:20px;opacity:.75}
.cls{display:none}
.evdot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 5px var(--gold);display:inline-block}.hold{width:6px;height:6px;border-radius:50%;background:var(--blue);display:inline-block}
/* instrument header + stats (one quiet line) */
.ih{padding:12px 16px 4px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}.ih .id b{font-size:20px;font-weight:800}.ih .id span{display:block;font-size:12px;color:var(--dim)}
.ih .px b{font-size:24px;font-weight:800}.ih .px span{display:block;font-size:12.5px;font-weight:600}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--panel2);color:var(--mute);margin:2px 4px 2px 0;display:inline-block}.tag.ev{background:var(--yt);color:var(--gold)}.tag.halt{background:var(--rt);color:#ff7a82}
.risk{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px}.risk.Low{background:var(--gt);color:#3ddc97}.risk.Medium{background:var(--yt);color:#f5c84c}.risk.High{background:rgba(255,140,40,.14);color:#ff9f43}.risk.Extreme{background:rgba(255,60,120,.14);color:#ff6b9a}
.stats{display:flex;flex-wrap:wrap;gap:4px 22px;padding:4px 16px 10px}.stats div{display:flex;gap:6px;align-items:baseline;white-space:nowrap}.stats small{font-size:10.5px;letter-spacing:.06em;color:var(--dim);font-weight:600}.stats b{font-size:12.5px;font-weight:700}
.about{display:none}
.chartbox{display:flex;flex-direction:column;flex:1;min-height:200px}.cwrap{position:relative;flex:1;min-height:0}#chart{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.ctools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px 12px 6px}.cgrp{display:flex;gap:1px}
.ctools button{font-size:11.5px;font-weight:600;padding:4px 7px;border-radius:6px;color:var(--dim)}.ctools button:hover{color:#fff}.ctools button.on{color:#fff;background:var(--panel2)}.ctools button.sep{margin-left:6px}.ctools>button{color:var(--mute)}
.ctools select{background:var(--panel2);border:0;border-radius:6px;padding:4px 6px;font-size:11.5px;font-weight:600;color:var(--mute)}
#sTerm.wide{grid-template-columns:minmax(0,1fr) 332px !important}#sTerm.wide .wl,#sTerm.wide #botCard{display:none}
.co{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;padding:8px 16px 14px}.co h4{font-size:11px;letter-spacing:.08em;color:var(--dim);font-weight:700;margin-bottom:5px;text-transform:uppercase}.kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0}.kv span{color:var(--mute)}.kv b{text-align:right;font-weight:600}
/* bottom panel in the terminal */
.btabs{display:flex;align-items:center;gap:2px;padding:8px 10px 4px}.btabs button{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:7px;color:var(--mute)}.btabs button:hover{color:#fff}.btabs button.on{background:var(--panel2);color:#fff}
.btabs .bmin{margin-left:auto;color:var(--dim);font-size:13px;padding:4px 8px}
.blist{max-height:200px;overflow:auto}
#botCard.min .blist{display:none}#botCard.min{flex:none!important}
table{width:100%;border-collapse:collapse}th{font-size:11px;color:var(--dim);font-weight:600;text-align:right;padding:7px 12px;position:sticky;top:0;background:var(--panel);z-index:1}th:first-child,td:first-child{text-align:left}
td{padding:7px 12px;border-top:1px solid var(--line);text-align:right;font-size:12.5px;font-weight:500}tr:hover td{background:var(--hov)}
.empty{padding:16px;text-align:center;color:var(--dim);font-size:12.5px}
/* ticket */
.tt{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--bg2);padding:3px;border-radius:9px;margin:4px 12px 6px}.tt button{font-weight:600;font-size:12.5px;padding:7px 2px;border-radius:7px;color:var(--mute)}.tt button.on{background:var(--panel2);color:#fff}
.tbody{padding:0 14px 14px;overflow:auto}
.lab{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--dim);margin:10px 0 5px}
.stake{display:flex;align-items:center;background:var(--bg2);border-radius:8px;overflow:hidden}.stake span{padding:0 9px;color:var(--dim);font-weight:700}.stake input{flex:1;min-width:0;background:none;border:0;padding:9px 4px;font-weight:700;font-size:15px;outline:none}
.stake button{padding:9px 9px;font-weight:600;font-size:12px;color:var(--mute)}.stake button:hover{color:#fff}
.chips{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}.chips button{flex:1;font-size:11.5px;font-weight:600;padding:5px 0;border-radius:6px;background:var(--bg2);color:var(--mute);min-width:44px}.chips button:hover{color:#fff}
.seg{display:flex;gap:3px;flex-wrap:wrap}.seg button{flex:1;font-size:12px;font-weight:600;padding:7px 0;border-radius:7px;background:var(--bg2);color:var(--mute);min-width:40px;box-shadow:inset 0 0 0 1px transparent}.seg button:hover{color:#fff}.seg button.on{background:var(--at);color:#fff;box-shadow:inset 0 0 0 1px var(--pur)}
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.dirs button{padding:10px;font-weight:800;border-radius:8px;background:var(--bg2);color:var(--mute)}.dirs .l.on{background:var(--gt);color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}.dirs .s.on{background:var(--rt);color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.odds{margin-top:10px;background:var(--bg2);border-radius:8px;padding:9px 11px;font-size:12.5px}.odds .big{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.odds .big b{font-size:19px;font-weight:800}
.odds .row{display:flex;justify-content:space-between;padding:2px 0;color:var(--mute)}.odds .row b{color:#fff;font-weight:600}
.meter{display:flex;height:5px;border-radius:4px;overflow:hidden;background:#1c222b;margin:6px 0}
.go{width:100%;margin-top:10px;padding:12px;border-radius:9px;background:var(--green);color:#03140c;font-weight:800;font-size:14px}.tbody .go,.tbody .ud{position:sticky;bottom:0;z-index:2;box-shadow:0 0 0 6px var(--panel),0 -14px 18px 4px var(--panel)}.tbody .ud{background:var(--panel)}.go:hover{filter:brightness(1.08)}.go.sell{background:var(--red);color:#fff}
.note{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.4}
.ud{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.ud button{padding:10px;border-radius:9px;font-weight:800;display:flex;flex-direction:column;align-items:center}.ud .r{background:var(--gt);color:var(--green)}.ud .f{background:var(--rt);color:var(--red)}.ud span{font-size:11px;font-weight:600;color:#fff;margin-top:3px}
.slider{width:100%;accent-color:var(--pur);margin-top:8px}
/* feed */
.feed{overflow:auto;flex:1;min-height:0}.ni{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:7px 14px;border-top:1px solid var(--line);font-size:12.5px;align-items:start}.ni time{color:var(--dim);font-size:11.5px}.ni .sy{font-weight:700;margin-right:5px}.ni .pend{color:var(--gold);font-weight:700}.ni .mv{font-weight:700}
#breaking .tx b{font-weight:800}
/* generic grids for the other sections */
.g{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.tile{padding:12px 16px}.tile small{display:block;font-size:10.5px;letter-spacing:.07em;color:var(--dim);font-weight:600;text-transform:uppercase}.tile b{display:block;font-size:21px;font-weight:800;margin-top:2px}.tile em{font-style:normal;font-size:12px;font-weight:500}
h1{font-size:21px;font-weight:800;margin-bottom:2px}.lead{color:var(--mute);font-size:13px;margin-bottom:14px}
.btn{padding:7px 12px;border-radius:8px;font-weight:700;font-size:12px;background:var(--pur);color:#fff}.btn.g{background:var(--green);color:#03140c}.btn.r{background:var(--rt);color:#ff7a82}.btn.gh{background:var(--panel2);color:var(--mute)}.btn.gh:hover{color:#fff}
.pcard{padding:14px 16px}.pcard .q{font-weight:700;font-size:14px;margin-bottom:6px;min-height:38px}.yn{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.yn button{padding:9px;border-radius:8px;font-weight:800}.yn .y{background:var(--gt);color:var(--green)}.yn .n{background:var(--rt);color:var(--red)}
.bar{height:5px;border-radius:4px;background:#1c222b;overflow:hidden}.bar i{display:block;height:100%}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;padding:12px}.heat div{padding:12px 10px;border-radius:8px;font-weight:600;text-align:center}.heat div:hover{filter:brightness(1.2)}.heat b{display:block;font-size:15px}.heat small{font-size:11px;opacity:.85}
.chain td{cursor:pointer}.chain td.pick{background:var(--at) !important;color:#fff}.chain .atm td{background:#161c25}
.guide h2{font-size:15px;margin:4px 0 6px}.guide p{color:var(--mute);font-size:13px;line-height:1.55;margin-bottom:8px}.guide ul{margin:0 0 8px 18px;color:var(--mute);font-size:13px;line-height:1.55}
#confetti{display:none}
.help{position:fixed;inset:0;background:rgba(5,7,10,.72);z-index:90;display:flex;align-items:center;justify-content:center}.help .box{width:min(560px,92vw);background:var(--panel);border-radius:14px;padding:24px}.help h2{margin-bottom:12px}.help li{margin:0 0 8px 18px;color:var(--mute)}
.ipohero{padding:18px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}.ipologo{width:84px;height:84px;border-radius:18px;display:grid;place-items:center;font-weight:700;font-size:26px}
@media (max-height:860px){.tt{margin:2px 12px 4px}.lab{margin:7px 0 4px}.seg button{padding:6px 0}.dirs button{padding:8px}.odds{margin-top:7px}.go{margin-top:8px;padding:10px}}
@media (max-width:1300px){#sTerm.on{grid-template-columns:210px minmax(0,1fr) 316px}.hk.idx,.rk.vol{display:none}nav button{padding:0 8px}}
.jump{display:flex;gap:10px;align-items:center;padding:10px 14px;margin-bottom:12px;border-radius:10px;background:var(--panel);cursor:pointer;max-width:420px}.jump input{width:18px;height:18px;accent-color:var(--gold);flex:none}.jump small{display:block;font-size:11.5px;color:var(--mute);font-weight:500}.jump:has(input:checked){box-shadow:inset 0 0 0 1px var(--gold);background:rgba(240,185,11,.07)}
.tkh{display:flex;align-items:center;gap:6px;padding:10px 12px 4px}.tkh button{font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:7px;color:var(--mute)}.tkh button:hover{color:#fff}.tkh button.on{background:var(--yt);color:var(--gold)}
.oneBar{position:absolute;left:12px;top:8px;display:none;gap:6px;z-index:3}.ob{display:flex;flex-direction:column;align-items:flex-start;padding:7px 14px;border-radius:9px;font-weight:800;font-size:14px}.ob small{font-size:10.5px;font-weight:600;opacity:.85}.ob.l{background:var(--green);color:#03140c}.ob.s{background:var(--red);color:#fff}.ob:hover{filter:brightness(1.1)}
.star{color:#3a424f;font-size:12px;cursor:pointer;margin-right:1px}.star:hover{color:#f5c84c}.star.on{color:var(--gold)}
#wSort{background:none;border:0;padding:2px;font-size:11.5px;font-weight:600;color:var(--dim);max-width:120px}
.lim{margin-left:6px;white-space:nowrap}.lim i{font-style:normal;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:9px;background:var(--bg2);margin-right:4px}.lim i b{margin-left:4px;cursor:pointer;color:var(--mute)}.lim>b{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:9px;border:1px dashed #3a424f;color:var(--mute);margin-right:4px;cursor:pointer}.lim>b:hover{color:#fff;border-color:#fff}
.bact{display:flex;align-items:center;gap:6px;padding:4px 12px 8px;font-size:11.5px}.bact .btn{padding:4px 10px;font-size:11.5px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:6px 0 14px;align-items:center}.keys kbd{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;background:var(--bg2);border-radius:6px;padding:3px 8px;text-align:center;white-space:nowrap;box-shadow:inset 0 -2px 0 var(--line)}.keys span{color:var(--mute);font-size:13px}
.jsel{background:var(--panel);border:0;border-radius:8px;padding:7px 9px;font-weight:600;font-size:12.5px;color:var(--mute)}table.jt td{text-align:left}table.jt td:last-child{text-align:right}tr.jon td{background:var(--at) !important}
textarea{width:100%;background:var(--bg2);border:0;border-radius:8px;padding:9px 11px;font:500 13px Inter,sans-serif;color:#fff;resize:vertical;outline:none}
tr.soon td{background:rgba(240,185,11,.1)}
@media (max-height:760px){.stats{padding-bottom:6px}.ih{padding:8px 16px 2px}}
#botCard{flex:0 0 clamp(150px,32%,260px)!important;display:flex;flex-direction:column;min-height:0}#botCard .blist{flex:1;max-height:none;min-height:0;overflow:auto}.chartbox{min-height:150px!important}
.bell{font-size:40px;animation:ring .6s 3}@keyframes ring{25%{transform:rotate(18deg)}75%{transform:rotate(-18deg)}}
/* live stories */

.story .sh em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--pur);white-space:nowrap}.story .sh em.lc{color:var(--gold)}

/* ================= EARNINGS SEASON =================
   Every 15 minutes of market time, every company reports, one after another about 45 s apart. Each report is
   scheduled as that company's pending news the moment the season opens (with its own bigger size), so every
   price, option and prediction already knows exactly when it lands and how big it can be. Beat or miss is a
   true 50/50. The quiet period before a report means no other company news for it until then. */
const EARN_GAP=900,EARN_STEP=45,EARN_FIRST=30,EARN_PRE=90;
let EARN=Object.assign({st:'off',next:240,list:[],pre:false,n:0},save.earn||{});
const earnX=S=>EARNX[S.sym]||S.earnX||0;
const reporters=()=>STOCKS.filter(S=>earnX(S)>0&&!S.gone);
function epsEst(S){const P=PROFILE[S.sym],e=P&&P.eps!=null?P.eps/4:.05;return Math.round(e*(.9+Math.random()*.2)*100)/100}
function earnSecond(){
 if(EARN.st==='off'){EARN.next-=1;
  if(!EARN.pre&&EARN.next<=EARN_PRE){EARN.pre=true;headline(-1,`Earnings season opens in ${Math.round(EARN.next)}s: ${reporters().length} companies report back to back`,0,'ann')}
  if(EARN.next<=0)startSeason()}
 else{let open=false;for(const e of EARN.list){const i=byS(e.sym);if(i<0){e.res=e.res||'gone';continue}
   if(!e.set&&!e.res){open=true;const m=M[i];if(!m.pend){const left=Math.max(8,e.due-T);m.pend={t:Math.round(left/DT)*DT,x:earnX(STOCKS[i]),k:'earn'};e.set=true;e.due=T+m.pend.t}}
   else if(!e.res)open=true}
  if(!open)endSeason()}
 EARN.list.forEach(e=>e.left=e.due-T);save.earn=EARN;if(SEC==='pulse')drawEarn()}
function startSeason(){EARN.st='on';EARN.n++;EARN.pre=false;const rs=reporters().sort(()=>Math.random()-.5);
 EARN.list=rs.map((S,k)=>({sym:S.sym,due:T+EARN_FIRST+k*EARN_STEP,x:earnX(S),est:epsEst(S),set:false,res:null,act:null}));
 headline(-1,`Earnings season is open: ${rs.map(S=>S.sym).join(', ')} report in that order`,0,'res');earnSecond();drawNav()}
function endSeason(){const b=EARN.list.filter(e=>e.res==='beat').length,m=EARN.list.filter(e=>e.res==='miss').length;EARN.last={list:EARN.list,b,m};EARN.st='off';EARN.next=EARN_GAP;EARN.list=[];
 headline(-1,`Earnings season wraps up: ${b} beat, ${m} missed`,0,'flav');drawNav()}
function earnResult(i,up){const S=STOCKS[i],e=EARN.list.find(x=>x.sym===S.sym&&!x.res),x=e?e.x:earnX(S),est=e?e.est:epsEst(S),act=Math.round(est*(up?1.06+Math.random()*.2:.94-Math.random()*.2)*100)/100;
 if(e){e.res=up?'beat':'miss';e.act=act}
 headline(i,`${S.name} ${up?'beats':'misses'}: EPS ${eps(act)} vs ${eps(est)} expected, ${up?'guidance raised':'guidance cut'}`,up?x:-x,'res')}
const eps=v=>(v<0?'−$':'$')+Math.abs(v).toFixed(2);
const earnFor=sym=>EARN.st==='on'?EARN.list.find(e=>e.sym===sym):null;

 else{const L=EARN.last;el.innerHTML=`<div class="ch"><h3>📊 EARNINGS SEASON</h3><span class="mut" style="font-size:12px">every 15 minutes of market time</span></div>

  ${L?`<div style="font-size:12.5px"><div class="mut" style="font-size:11px;font-weight:900;letter-spacing:.1em">LAST SEASON</div><b class="up">${L.b} beat</b> · <b class="dn">${L.m} missed</b><div class="mut">${L.list.filter(e=>e.res==='beat'||e.res==='miss').map(e=>`${e.sym} ${e.res==='beat'?'▲':'▼'}`).join(' ')}</div></div>`:''}</div>`}}
/* ================= NEWSROOM: live stories and company lifecycles (v3, 2026-10-01) =================
   News is slow now (Alex: "not just a new headline every 20 seconds"). A company's news is a live story: a CEO press
   conference (or a central-bank briefing, an OPEC meeting, a founder livestream) announced ~a minute ahead, then 4
   updates 14-24 s apart. Each update is a true 50/50 of a size the pricing already knows (core: storyShape), so every
   quote stays fair. The text is written after the coin lands.
   Lifecycles ride the same machinery: a takeover vote, a merger vote or a bankruptcy hearing is a story whose last
   update decides the company's fate. Taken over or liquidated: it leaves the market, open bets close at the final
   price (target / up-down bets are void and refunded) and shares are paid out at that price. Merged: shares become
   the acquirer's shares at market value. Splits are announced 30 s ahead and change nothing but the share count. */
const HOSTS={GLDN:['the World Gold Council','briefing','The Council'],OIL:['OPEC ministers','press briefing','OPEC'],AUDUSD:['RBA Governor Ana Lindqvist','press conference','Lindqvist'],
 VLTC:['Voltcoin founder Theo Vance','livestream','Vance'],NBLA:['Nebula lead developer Kira Song','livestream','Song'],STK:['the exchange','briefing','The exchange']};
const IPO_CEOS=['Priya Natarajan','Leo Marchetti','Hannah Cole','Tomás Ruiz','Grace Okafor','Ivan Petrov','Mei Lin','Sam Whitlock'];
function hostOf(S){const h=HOSTS[S.sym];if(h)return{who:h[0],what:h[1],short:h[2],co:false};const P=PROFILE[S.sym],r=P&&P.rows.find(x=>x[0]==='CEO');
 const ceo=r?r[1]:IPO_CEOS[S.sym.charCodeAt(0)%IPO_CEOS.length];return{who:`${S.name} CEO ${ceo}`,what:'press conference',short:ceo.split(' ').pop(),co:true}}
const PRESS={co:[[['{short} opens upbeat: "our strongest quarter yet"','{short} opens cautiously and warns of "a tough few months"'],['{short} walks out smiling and thanks the team','{short} looks tense and skips the small talk'],['Opening remarks: demand is "off the charts"','Opening remarks: "we have work to do"']],
  [['{short} brushes off a tough question on costs','{short} dodges a question on debt and analysts frown'],['Q&A: {short} says margins are improving','Q&A: {short} admits margins are under pressure'],['Q&A: {short} hints at "something big" this year','Q&A: {short} says a key project is running late']],
  [['{co} lifts its full-year outlook','{co} trims its full-year outlook'],['{co} announces a share buyback','{co} announces a hiring freeze'],['{short}: new customers are signing faster than ever','{short} reveals a major customer has walked away']]],
 other:[[['{short} opens on a confident note','{short} opens on a worried note'],['{short} says conditions are "better than expected"','{short} says conditions are "worse than we hoped"'],['Opening remarks lean upbeat','Opening remarks lean gloomy']],
  [['{short} plays down the risks in Q&A','{short} flags new risks in Q&A'],['Q&A: {short} sees strong demand ahead','Q&A: {short} sees demand cooling'],['{short} hints at support for the market','{short} hints at pulling back support']],
  [['{short} signals more good news to come','{short} signals tougher times ahead'],['A surprise upbeat forecast from {short}','A surprise downbeat forecast from {short}'],['{short} sounds more confident than expected','{short} sounds more worried than expected']]]};
const BUYERS=['Titan Capital','Harbor Peak Partners','Orion Holdings','Silverline Group','Northgate Equity','Bluewater Partners'];
const LC={takeover:{title:'Takeover vote',tag:'TAKEOVER VOTE',fin:[.22,.3],ann:'{buyer} bids for {co}, a {prem} premium. Shareholders vote in {s}s',
  b:[['{co}’s board backs the {buyer} offer','{co}’s board calls the {buyer} offer "too low"'],['Big shareholders say they will vote yes','A top-10 shareholder says it will vote no'],['Regulators wave the deal through','Regulators open an inquiry into the deal']],
  up:'Shareholders approve: {buyer} takes {co} private at {price}. {co} leaves the market',dn:'Shareholders reject {buyer}’s bid, {co} stays listed'},
 merger:{title:'Merger vote',tag:'MERGER VOTE',fin:[.12,.18],ann:'{co} and {A} agree to merge. Vote in {s}s: {co} shares would become {A} shares',
  b:[['Analysts call the {A} merger "a perfect fit"','Analysts question the {A} merger'],['{A} promises big cost savings','Staff unions push back on the merger'],['Regulators clear the merger','Regulators raise concerns over the merger']],
  up:'Merger approved: every {co} share becomes {A} shares at market value',dn:'{co} shareholders vote the {A} merger down'},
 bust:{title:'Bankruptcy hearing',tag:'BANKRUPTCY',fin:[.5,.5],ann:'{co} files for bankruptcy protection. The court rules in {s}s',
  b:[['Lenders agree to a standstill','Lenders demand their money back'],['A rescue investor emerges','Rescue talks collapse'],['Staff are paid and operations continue','Suppliers stop deliveries']],
  up:'The court approves a rescue plan: {co} survives',dn:'{co} is liquidated. Shareholders are paid out at {price}'}};
const RECENT_ST=[];let stid=0;
const fill=(t,v)=>t.replace(/\{(\w+)\}/g,(_,k)=>v[k]!=null?v[k]:'');
const storyVars=(S,st,i)=>Object.assign({co:S.name,short:st.host?st.host.short:'',who:st.host?st.host.who:'',price:price(M[i].p)},st.v||{});
const storyOf=i=>M[i]&&M[i].pend&&M[i].pend.story||null;
const liveStories=()=>STOCKS.map((S,i)=>[S,i,storyOf(i)]).filter(x=>x[2]&&!x[0].gone);
/* a normal story was just announced by the engine: write it up */
function storyAnn(i){const S=STOCKS[i],m=M[i],h=hostOf(S),pool=h.co?PRESS.co:PRESS.other;
 m.pend.story={id:++stid,kind:'press',sym:S.sym,host:h,title:`${h.what[0].toUpperCase()+h.what.slice(1)}`,tag:h.what.toUpperCase(),tpl:pool.map(a=>Math.floor(Math.random()*a.length)),beats:[],topic:S.evTag||'an update',at:clock()};
 const tx=`${h.who} holds a ${h.what}${S.evTag?` (${S.evTag.toLowerCase()})`:''} in ${Math.round(m.pend.t)}s`;headline(i,tx,0,'ann','COMING UP');drawStory()}
/* one update landed (up = the coin): pv is the beat that just resolved */
function storyBeat(i,up,pv){const S=STOCKS[i],st=pv.story;if(!st){headline(i,S.ev[up?1:2],up?pv.x||S.evX:-(pv.x||S.evX),'res');return}
 const n=pv.n||4,k=n-(pv.q?pv.q.length:0),last=k>=n,mv=(up?1:-1)*(pv.x||S.evX),V=storyVars(S,st,i);let tx;
 if(st.kind==='press'){const pool=st.host.co?PRESS.co:PRESS.other;tx=last?S.ev[up?1:2]:fill(pool[k-1][st.tpl[k-1]][up?0:1],V)}
 else{const L=LC[st.kind];tx=last?fill(up?L.up:L.dn,V):fill(L.b[k-1][up?0:1],V)}
 st.beats.push({k,up,mv,tx,t:clock()});headline(i,tx,mv,'story',`LIVE · ${st.tag} ${k}/${n}`);SND.news();
 if(last){RECENT_ST.unshift(Object.assign({},st,{end:clock()}));RECENT_ST.length=Math.min(RECENT_ST.length,8);if(st.kind!=='press')lcEnd(i,st,up)}drawStory()}
/* ---- lifecycles ---- */
const lcable=i=>{const S=STOCKS[i],m=M[i];return(S.cls==='Stock'||S.cls==='IPO')&&!S.gone&&!m.pend&&!m.splitAt&&!(earnFor(S.sym)&&!earnFor(S.sym).res)&&!(S.lcCool>T)};
function lcStart(i,kind,v){const S=STOCKS[i],m=M[i],L=LC[kind],fin=L.fin[0]+Math.random()*(L.fin[1]-L.fin[0]),sm=Math.max(.012,S.evX*.45);
 const b=[{t:rndT([60,90]),x:sm*.8},{t:rndT([16,26]),x:sm},{t:rndT([16,26]),x:sm*1.2},{t:rndT([18,28]),x:fin}];
 const st={id:++stid,kind,sym:S.sym,title:L.title,tag:L.tag,beats:[],v:Object.assign({prem:Math.round(fin*100)+'%'},v||{}),at:clock()};
 m.pend=storyPend(b,{story:st});S.lcCool=T+600;headline(i,fill(L.ann,Object.assign(storyVars(S,st,i),{s:Math.round(m.pend.t)})),0,'ann',L.tag);SND.news();drawStory();snapshot()}
let LCT=0;
function lcSecond(){if(liveStories().some(x=>x[2].kind!=='press'))return;
 /* deep trouble: a stock down to a third of where it started goes to a bankruptcy hearing */
 for(let i=0;i<STOCKS.length;i++)if(lcable(i)&&M[i].p<STOCKS[i].p0*.35&&!STOCKS[i].bustDone)return lcStart(i,'bust');
 if(++LCT<240||Math.random()>1/300)return;const el=STOCKS.map((S,i)=>i).filter(lcable);if(el.length<4)return;LCT=0;
 const i=pickA(el);if(Math.random()<.55)lcStart(i,'takeover',{buyer:pickA(BUYERS)});else{const j=pickA(el.filter(x=>x!==i));lcStart(i,'merger',{A:STOCKS[j].name,Asym:STOCKS[j].sym})}}

function drawIdx(){const c=$('idxC');if(!c)return;const W=c.clientWidth,H=200,dpr=Math.min(2,devicePixelRatio||1);c.width=W*dpr;c.height=H*dpr;const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);if(IDXH.length<2)return;
 let lo=Math.min(...IDXH),hi=Math.max(...IDXH);const pd=(hi-lo)*.1||1;lo-=pd;hi+=pd;const X=k=>50+k/(IDXH.length-1)*(W-60),Y=v=>10+(hi-v)/(hi-lo)*(H-30);
 x.font='600 10.5px Inter';for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;x.strokeStyle='rgba(255,255,255,.05)';x.beginPath();x.moveTo(50,Y(v));x.lineTo(W-10,Y(v));x.stroke();x.fillStyle='#5f6877';x.fillText(fmt(v,0),4,Y(v)+3)}
 const up=IDXH[IDXH.length-1]>=IDXH[0],col=up?'#16c784':'#ea3943';x.beginPath();IDXH.forEach((v,k)=>k?x.lineTo(X(k),Y(v)):x.moveTo(X(k),Y(v)));x.strokeStyle=col;x.lineWidth=2;x.stroke();x.lineTo(X(IDXH.length-1),H-20);x.lineTo(X(0),H-20);x.closePath();
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,up?'rgba(22,199,132,.22)':'rgba(234,57,67,.22)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fill()}
function drawGauge(){const c=$('vg'),x=c.getContext('2d'),v=stackVol();x.clearRect(0,0,116,64);x.lineWidth=10;[['#16c784',0,.25],['#f5c84c',.25,.5],['#ff9a3a',.5,.75],['#ea3943',.75,1]].forEach(([col,a,b])=>{x.strokeStyle=col;x.globalAlpha=.35;x.beginPath();x.arc(58,58,44,Math.PI+a*Math.PI,Math.PI+b*Math.PI);x.stroke()});x.globalAlpha=1;
 const a=Math.PI+v/100*Math.PI;x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.moveTo(58,58);x.lineTo(58+Math.cos(a)*40,58+Math.sin(a)*40);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(58,58,5,0,7);x.fill();$('hVol').textContent=v.toFixed(0)+(v<25?' calm':v<50?' normal':v<75?' nervous':' panic')}
function buildGuide(){$('sGuide').innerHTML=`<div class="guide" style="max-width:1100px"><h1>Guide</h1><div class="lead">Everything on Stack Markets, in plain English. All prices come from one live market model, and every product returns 96–98.5% on average. Nothing here is real money in real companies.</div>
 <div class="g g2"><div class="card" style="padding:14px 16px"><h2>The market</h2><p>Every price moves randomly and fairly: on average it doesn't go up or down. Some markets are calm (gold, forex, the index), some are wild (crypto, meme stocks, penny miners).</p><ul><li><b>Company news is live</b>: a press conference (or a briefing, an OPEC meeting, a founder livestream) is announced about a minute ahead, then plays out in 4 updates 14–24s apart. Each update is a true 50/50, sized in advance, and trading on that market pauses for the last 3 seconds before each one. Follow them in Market Pulse under <b>Live now</b>.</li><li><b>Company lifecycles</b>: rarely, a company faces a takeover vote, a merger vote or (if its price collapses) a bankruptcy hearing, announced first and decided 50/50 on the last update. Taken over or liquidated: it leaves the market, open trades close at the final price, target and up/down bets are refunded, and your shares are paid out at that price. Merged: your shares become the other company's shares at market value. Big runs or collapses trigger a stock split, announced 30s ahead; it changes the share count, never the value.</li><li><b>Market calls</b> (rate decisions, inflation, jobs) move everything at once, scaled by each market's <b>beta</b>.</li><li><b>Flash moves</b> are rare 6% shocks with no warning.</li><li>The market pauses while Stack Markets is closed, and your bets carry on when you come back.</li></ul></div>
 <div class="card" style="padding:14px 16px"><h2>Trade (leverage)</h2><p>Go long (up) or short (down) with up to 50x leverage on forex. Leverage multiplies both ways: at 10x a 1% move is 10% of your stake. If you lose the whole stake you're <b>liquidated</b> and the bet closes. You can't lose more than your stake.</p><p>The fee covers the edge, so trades return 97% on average. Shorting a dividend payer earns a small credit instead of paying a fee.</p></div>
 <div class="card" style="padding:14px 16px"><h2>Target and Up/Down</h2><p><b>Target</b>: pick a price. If it's touched before time runs out, you win the shown multiplier. <b>Up/Down</b>: higher or lower than now when the window closes. Payouts are the fair odds × 0.97.</p></div>
 <div class="card" style="padding:14px 16px"><h2>Invest</h2><p>Buy real shares in the sim and hold them as long as you like. They're kept in your Portfolio. You buy 1.5% above the price and sell 1.5% below it. GLDN and AURA pay dividends every 3 minutes, and their price drifts down by the same amount (like real stocks going ex-dividend).</p></div>
 <div class="card" style="padding:14px 16px"><h2>IPO Centre</h2><p>A new company lists about every 5 minutes. Order shares at the IPO price during the 75-second book. The opening price is random: 98.5% of the IPO price on average. Big pops and big flops both happen.</p></div>
 <div class="card" style="padding:14px 16px"><h2>Earnings season</h2><p>Every 15 minutes of market time every company reports, one after another about 45 seconds apart. Each report is a true 50/50 beat or miss, and bigger than normal news (AURA ±4% up to MOON ±22%). The whole schedule is known the moment the season opens, and every price already includes it. Market Pulse shows the calendar and the results.</p></div>
 <div class="card" style="padding:14px 16px"><h2>Terminal tools</h2><ul><li><b>★ Favourites</b> pin to the top of the watchlist; sort by movers, volume or news.</li><li><b>One-click</b> puts BUY / SELL on the chart using your ticket.</li><li><b>Drag</b> the take profit and stop loss lines on the chart; the fee is re-balanced so it still returns 97%.</li><li><b>🔔 Alerts</b>: press A and click the chart, or use the Alerts tab.</li><li>Each market remembers your last ticket. Press <b>?</b> for every keyboard shortcut.</li></ul></div>
 <div class="card" style="padding:14px 16px"><h2>Stakes</h2><p>Max stakes: <b>$1M</b> on the majors (STK 500, gold, oil, AUD/USD, Aurora) and market calls, <b>$100K</b> on everything else, <b>$20K</b> on Penny Mining. Invest orders go up to 10× the max stake.</p><p>Up to ${MAXOPEN} open bets at once.</p></div></div></div>`}

(function warm(){const keep=M.map(m=>({p:m.p,open:m.open,pend:m.pend?Object.assign({},m.pend):null})),gk=G.pend?{t:G.pend.t,e:G.pend.e}:null;

/* ---- away = paused (Alex, 2026-10-01): the market only runs while you can see it. Leave Markets for another Stack game,
   switch browser tab, or alt-tab to another app, and it stops dead; it carries on from the same moment when you come back.
   Nothing resolves while you're away (the old 10-minute catch-up replay is gone). A long gap between frames means the
   page wasn't being drawn (hidden), so it counts as away too. ---- */
const AWAY={on:false,w:0};
function isAway(){if(window.__gPaused||document.hidden)return true;if(window.__noFocusPause)return false;try{return !window.top.document.hasFocus()}catch(e){return !document.hasFocus()}}
function awayHeld(){return positions.length+OPTS.length+(typeof PRED_OWN!=='undefined'?PRED_OWN.length:0)}
function goAway(){if(AWAY.on)return;AWAY.on=true;AWAY.w=AWAY_AT=Date.now();document.body.classList.add('paused');$('pauseSt').textContent='Paused · you’re away';safe('save',()=>{snapshot();persist()})}
function comeBack(gapMs){const ms=AWAY.on?Date.now()-AWAY.w:gapMs;AWAY.on=false;AWAY_AT=0;PAUSED_MS+=ms;document.body.classList.remove('paused');$('pauseSt').textContent='Live';acc=0;lastReal=performance.now();
 if(ms>3000){const n=awayHeld(),s=Math.round(ms/1000),d=s<60?s+'s':s<3600?Math.floor(s/60)+'m '+(s%60)+'s':Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m';toast('Welcome back',`the market waited ${d} for you${n?` · your ${n} open bet${n>1?'s':''} picked up where ${n>1?'they':'it'} left off`:''}`,'','')}}
