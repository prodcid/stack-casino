<style>

body{overflow:hidden}

.slider{width:100%;accent-color:var(--pur);margin-top:8px}

/* generic grids for the other sections */
.g{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}

h1{font-size:22px;font-weight:900;margin-bottom:2px}.lead{color:var(--mute);font-size:13px;margin-bottom:12px}
.btn{padding:7px 12px;border-radius:8px;font-weight:800;font-size:12px;background:var(--pur);color:#fff}.btn.g{background:var(--green);color:#022b06}.btn.r{background:#3a0808;color:#ff8a8a;border:1px solid #5a1a1a}.btn.gh{background:var(--bg2);color:var(--mute);border:1px solid var(--line)}
.pcard{padding:12px 14px}.pcard .q{font-weight:800;font-size:14px;margin-bottom:6px;min-height:38px}.yn{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.yn button{padding:9px;border-radius:8px;font-weight:900}.yn .y{background:#063a12;color:var(--green)}.yn .n{background:#3a0808;color:var(--red)}
.bar{height:5px;border-radius:4px;background:#0c1f2b;overflow:hidden}.bar i{display:block;height:100%}

.bigwin{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:80;text-align:center;pointer-events:none;animation:bw 2.2s forwards}.bigwin small{display:block;font-weight:900;letter-spacing:.2em;color:var(--gold)}.bigwin b{font-size:64px;font-weight:900;color:var(--green);text-shadow:0 0 30px rgba(0,231,1,.6)}@keyframes bw{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-50%) scale(1.1);opacity:1}80%{opacity:1}100%{opacity:0}}

.help{position:fixed;inset:0;background:rgba(3,10,16,.8);z-index:90;display:flex;align-items:center;justify-content:center}.help .box{width:min(560px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.help h2{margin-bottom:10px}.help li{margin:0 0 8px 18px;color:var(--mute)}
.ipohero{padding:18px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}.ipologo{width:84px;height:84px;border-radius:18px;display:grid;place-items:center;font-weight:900;font-size:26px}
/* smaller windows (inside Stack): the news moves to the ticker and the "News for this" tab so the ticket fits */
@media (max-height:900px){#newsCard{display:none !important}.tt{margin:8px 10px 4px}.lab{margin:7px 0 4px}.seg button{padding:6px 0}.dirs button{padding:8px}.odds{margin-top:7px}.go{margin-top:8px;padding:10px}}
@media (max-width:1300px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stats div:nth-child(3){border-right:0}.stats div:nth-child(-n+3){border-bottom:1px solid var(--line)}#sTerm.on{grid-template-columns:220px minmax(0,1fr) 330px}}
.bell{font-size:40px;animation:ring .6s 3}@keyframes ring{25%{transform:rotate(18deg)}75%{transform:rotate(-18deg)}}
</style>

/* ================= STACK MARKETS: the engine =================
   Every instrument is a fair (martingale) price process: diffusion + random jumps + scheduled 50/50
   news. Market-wide events (rate calls, inflation prints, jobs numbers, flash moves) hit everything by
   its beta. Every product is priced from this same engine by Monte Carlo (or a matched closed form for
   the always-on prediction quotes) and then marked to return 97%:
     Trade      a fee covers the chance of losing more than the stake (gain) and the 3% edge
     Target / Up-Down / Predictions / Options   payouts = fair value / 0.97
     Invest     buying at the ask and selling at the bid costs 3% round trip; the price itself is fair
     IPO        the opening price averages 98.5% of the IPO price, so flipping at the bid returns 97% */

let _spare=null;

const MAJOR=1e6,STD=1e5;
const STOCKS=[

  ev:['OPEC output decision due in {s}s','OPEC cuts output, oil spikes','OPEC opens the taps, oil slides'],about:'Crude oil. OPEC meetings swing it hard.',tags:['Up to 10x','OPEC swings']},

 if(!spend(stake)){toast('Not enough balance','Lower the stake','','lose');return}const ask=yesAsk(sp),n=stake/ask;
 const o=PRED_OWN.find(x=>x.cid===id&&x.side===side);if(o){o.n+=n;o.cost+=stake}else PRED_OWN.push({id:++poid,cid:id,side,n,cost:stake});
 SND.lock();toast(`Bought ${side>0?'YES':'NO'}`,`${fmt(n,1)} contracts at ${(ask*100).toFixed(2)}¢`,'-'+moneyS(stake),'');snapshot();drawPred();drawNav()}
function sellPred(id){SND.init();const j=PRED_OWN.findIndex(o=>o.id===id);if(j<0)return;const o=PRED_OWN[j],c=PRED.find(x=>x.id===o.cid);if(!c||!cOpen(c))return;const P=cP(c,4000),bid=yesBid(o.side>0?P:1-P);
 PRED_OWN.splice(j,1);settle(c.sym,`${o.side>0?'YES':'NO'} · ${c.q}`,o.cost,Math.floor(o.n*bid*100)/100,'Sold before the result');drawPred();drawNav()}

function predRestore(s){if(!s||!s.c)return;for(const d of s.c){const i=d.sym==='MARKET'?-1:byS(d.sym);if(d.kind==='px'&&i<0)continue;
  if(d.kind==='ev'&&(i<0?!G.pend:!M[i].pend))continue;/* the event isn't pending any more: refund below */

function holdings(){return Object.entries(save.port).filter(([,h])=>h.q>0).map(([sym,h])=>{const i=byS(sym),p=i>=0?M[i].p:0;return{sym,i,S:STOCKS[i],q:h.q,cost:h.cost,p,v:h.q*p}}).sort((a,b)=>b.v-a.v)}

if(save.ipoPend){const {d,sub}=save.ipoPend;if(!STOCKS.some(S=>S.sym===d.sym))listIpo(d,sub,true);else delete save.ipoPend}

/* ---- the loop: 4 ticks a second; slower things once a second ---- */
let acc=0,lastF=performance.now(),secAcc=0,qAcc=0,pvAcc=0;
function frame(now){const dt=Math.min(3600e3,now-lastF);lastF=now;acc+=dt;
 if(acc>5000){/* came back after a while: replay what was missed (up to 10 minutes) quietly */QUIET=true;let n=Math.min(2400,Math.floor(acc/(DT*1000)));acc=0;while(n--){marketTick(false);if(n%4===0)everySecond(true)}QUIET=false;lastReal=now;yLo=null;if(BUILD[SEC])showSec(SEC)}
 while(acc>=DT*1000){acc-=DT*1000;marketTick(false);lastReal=now;secAcc+=DT;qAcc+=DT;pvAcc+=DT;
  if(SEC==='term'){drawWatch();drawHead();if(BT==='open')drawBottom()}
  if(secAcc>=1){secAcc=0;everySecond(false)}}
 tickerFrame(dt/1000);if(SEC==='term')drawChart();requestAnimationFrame(frame)}
let snapN=0;
function everySecond(quiet){ipoSecond();predSecond(quiet);if(quiet)return;optSecond();drawTop();drawGauge();drawNav();IDXH.push(M[0].p);if(IDXH.length>300)IDXH.shift();
 if(SEC==='port')drawPort();else if(SEC==='pulse')drawPulse();
 if(SEC==='term'){const N=(tab==='trade'?ui.T:tab==='target'?ui.tT:ui.uT);qAcc>=(N>=120?3:1)&&(qAcc=0,quote())}
 if(pvAcc>=15){pvAcc=0;samplePV()}if(++snapN%5===0)snapshot()}
addEventListener('pagehide',()=>{snapshot();persist()});addEventListener('beforeunload',()=>{snapshot();persist()});

drawNav();showSec('term');select(sel);drawTop();drawGauge();predRefill();PRED.forEach(c=>c.hist.push(c.P));if(!save.seen)help();samplePV();requestAnimationFrame(frame);
