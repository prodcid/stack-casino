<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stack Markets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f212e;--panel:#1a2c38;--panel2:#213743;--line:#2f4553;--mute:#b1bad3;--dim:#557086;--txt:#fff;
  --green:#00e701;--red:#ff4f4f;--gold:#ffc800;--blue:#1475e1;--r:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:Outfit,system-ui,sans-serif;font-variant-numeric:tabular-nums}
body{min-height:100vh}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{cursor:not-allowed}
.up{color:var(--green)}.dn{color:var(--red)}

/* top bar */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 14px;background:#0d1c27;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;white-space:nowrap}
.brand svg{width:26px;height:26px}.brand b{color:var(--green);font-weight:900}
.idx{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}.idx b{color:#fff;margin:0 3px}
.balbox{margin-left:auto;display:flex;align-items:stretch;border-radius:var(--r);overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.bal{padding:8px 12px;font-weight:800;font-size:15px;min-width:92px;text-align:right;transition:color .3s}
.bal.flash-up{color:var(--green)}.bal.flash-dn{color:var(--red)}
.btn-top{background:var(--blue);color:#fff;font-weight:800;font-size:13px;padding:0 14px}
.btn-top:active{filter:brightness(.9)}

/* news ticker */
.ticker{display:flex;align-items:center;height:34px;background:#0a1620;border-bottom:1px solid var(--line);overflow:hidden;position:relative}
.live{flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;height:100%;font-size:11px;font-weight:900;letter-spacing:.06em;background:var(--red);color:#fff;z-index:2}
.live i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.track-wrap{flex:1;overflow:hidden;height:100%;position:relative}
.track{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;will-change:transform}
.ti{display:inline-flex;align-items:center;gap:6px;padding:0 18px;font-size:13px;font-weight:600;color:#dfe5f2;border-right:1px solid var(--line)}
.ti .sy{font-weight:900;color:#fff}.ti.q{color:var(--mute);font-weight:500}

/* layout */
.grid{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;grid-template-areas:"board center panel";gap:12px;padding:12px;max-width:1500px;margin:0 auto}
.board{grid-area:board;display:flex;flex-direction:column;gap:6px}
.center{grid-area:center;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{grid-area:panel;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border-radius:10px;border:1px solid var(--line)}
@media (max-width:1100px){.grid{grid-template-columns:minmax(0,1fr) 330px;grid-template-areas:"board board" "center panel"}
  .board{flex-direction:row;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.board::-webkit-scrollbar{display:none}.sc{flex:none;width:168px}}
@media (max-width:760px){.grid{display:flex;flex-direction:column;padding:10px;gap:10px}
  .center,.panel{display:contents}.shead{order:1}.newsbar{order:2}.chartbox{order:3}.bet{order:4}.pos{order:5}.feed{order:6}.board{order:0}
  .idx{display:none}.brand span.w{display:none}}

/* stock cards */
.sc{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:2px 8px;padding:9px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);text-align:left;position:relative}
.sc.on{background:var(--panel2);border-color:#4a6a80;box-shadow:inset 3px 0 0 var(--green)}
.sc .s1{display:flex;align-items:center;gap:6px;min-width:0}
.sc .sy{font-weight:900;font-size:14px}
.sc .nm{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:1}
.sc .pr{font-weight:800;font-size:14px;text-align:right}
.sc .ch{font-size:12px;font-weight:700;text-align:right}
.sc svg{grid-column:1/-1;width:100%;height:26px;margin-top:3px}
.risk{font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:4px;letter-spacing:.02em}
.risk.Low{background:rgba(0,231,1,.14);color:#6aff6a}.risk.Medium{background:rgba(255,200,0,.14);color:#ffd84a}
.risk.High{background:rgba(255,130,40,.16);color:#ff9a4a}.risk.Extreme{background:rgba(255,79,79,.18);color:#ff7a7a}
.evdot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:blink .8s infinite}
.hold{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 6px var(--blue)}

/* stock header */
.shead{padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.shead .id{display:flex;flex-direction:column}
.shead .id b{font-size:22px;font-weight:900;line-height:1}.shead .id span{font-size:12px;color:var(--mute);font-weight:600;margin-top:3px}
.shead .px{display:flex;flex-direction:column;align-items:flex-end;margin-left:auto}
.shead .px b{font-size:26px;font-weight:900;line-height:1}.shead .px span{font-size:13px;font-weight:700;margin-top:3px}
.tags{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.tag.ev{background:rgba(255,200,0,.12);border-color:rgba(255,200,0,.5);color:var(--gold)}
.tag.halt{background:rgba(255,79,79,.15);border-color:rgba(255,79,79,.5);color:#ff8a8a}

/* chart */
.chartbox{position:relative;height:clamp(260px,42vh,440px);overflow:hidden}
.chartbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.newsbar{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--mute);transition:border-color .3s,background .3s}
.newsbar em{font-style:normal;font-size:10px;font-weight:900;letter-spacing:.06em;padding:3px 7px;border-radius:4px;flex:none;background:var(--panel2);color:var(--mute)}
.newsbar .nt{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.newsbar .nt b{color:#fff;font-weight:900;margin-right:4px}
.newsbar .mv{font-weight:900;flex:none}
.newsbar.on{color:#fff;border-color:rgba(255,79,79,.6);background:linear-gradient(90deg,rgba(255,79,79,.14),var(--panel) 60%)}
.newsbar.on em{background:var(--red);color:#fff}
.newsbar.on.soon{border-color:rgba(255,200,0,.6);background:linear-gradient(90deg,rgba(255,200,0,.12),var(--panel) 60%)}
.newsbar.on.soon em{background:var(--gold);color:#1a1400}
.lockfx{position:absolute;inset:0;pointer-events:none;border-radius:10px;box-shadow:inset 0 0 0 2px var(--green),inset 0 0 50px rgba(0,231,1,.25);opacity:0}
.lockfx.go{animation:lockfx .9s ease-out}
@keyframes lockfx{0%{opacity:1}100%{opacity:0}}

/* positions */
.pos{padding:12px 14px}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.phead h3{font-size:15px;font-weight:800}
.phead .stat{margin-left:auto;font-size:12px;color:var(--mute);font-weight:600}
.ptabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:8px}
.ptabs button{font-size:12px;font-weight:700;padding:5px 10px;border-radius:6px;color:var(--mute)}.ptabs button.on{background:var(--panel2);color:#fff}
.plist{display:flex;flex-direction:column;gap:6px}
.pi{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;padding:9px 10px;border-radius:8px;background:var(--panel2)}
.pi .sy{font-weight:900;font-size:13px}
.pi .ds{font-size:12px;color:var(--mute);font-weight:600}
.pi .pl{font-weight:900;font-size:15px;text-align:right}
.pi .bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}.pi .bar i{display:block;height:100%;background:var(--mute)}
.pi .co{grid-row:1/3;grid-column:4;background:var(--green);color:#022a06;font-weight:900;font-size:12px;padding:8px 10px;border-radius:7px}
.pi.h{grid-template-columns:auto 1fr auto}
.empty{font-size:13px;color:var(--dim);padding:10px 2px}

/* bet panel */
.bet{padding:12px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);padding:4px;border-radius:9px;margin-bottom:12px}
.tabs button{font-weight:800;font-size:13px;padding:9px 4px;border-radius:7px;color:var(--mute)}
.tabs button.on{background:var(--panel2);color:#fff}
.lab{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mute);margin:10px 0 5px}
.lab b{color:#fff}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;padding:8px 4px;border-radius:7px;background:var(--panel2);font-weight:800;font-size:13px;color:var(--mute);border:1px solid transparent}
.seg button.on{background:#2c4a5c;color:#fff;border-color:#4a7088}
.seg button:disabled{opacity:.35}
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dirs button{padding:11px;border-radius:8px;font-weight:900;font-size:15px;background:var(--panel2);color:var(--mute);border:2px solid transparent}
.dirs .l.on{background:rgba(0,231,1,.14);color:var(--green);border-color:var(--green)}
.dirs .s.on{background:rgba(255,79,79,.14);color:var(--red);border-color:var(--red)}
.dirs button:disabled{opacity:.35}
.stake{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stake span{padding-left:10px;color:var(--mute);font-weight:700}
.stake input{flex:1;min-width:0;background:none;border:0;color:#fff;font:800 16px Outfit,sans-serif;padding:10px 6px}
.stake button{padding:0 11px;height:40px;font-weight:800;font-size:12px;color:var(--mute);border-left:1px solid var(--line)}
.odds{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--bg);border:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:6px}
.odds .row{display:flex;justify-content:space-between;color:var(--mute);font-weight:600}
.odds .row b{color:#fff;font-weight:800}
.odds .big{display:flex;justify-content:space-between;align-items:baseline}
.odds .big span{font-size:12px;color:var(--mute);font-weight:700}
.odds .big b{font-size:24px;font-weight:900}
.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.go{margin-top:12px;width:100%;padding:14px;border-radius:9px;background:var(--green);color:#022a06;font-weight:900;font-size:16px;box-shadow:0 4px 0 #00a301}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #00a301}
.go:disabled{background:var(--line);color:var(--dim);box-shadow:none;transform:none}
.note{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.4}
.ud{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ud button{padding:14px 8px;border-radius:10px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.ud button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.ud .r{background:var(--green);color:#022a06}.ud .f{background:var(--red);color:#2a0404}
.ud b{font-size:22px}.ud span{font-size:12px;font-weight:700;opacity:.8}
.ud button:disabled{background:var(--line);color:var(--dim);box-shadow:none}
.slider{width:100%;accent-color:var(--gold)}
.tgtline{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.tgtline b{font-size:18px;font-weight:900;color:var(--gold)}.tgtline span{font-size:12px;color:var(--mute);font-weight:700}

/* leverage explainer */
.lev{margin-top:12px;padding:10px 12px;border-radius:9px;background:rgba(20,117,225,.08);border:1px solid rgba(20,117,225,.35);font-size:13px;display:flex;flex-direction:column;gap:7px}
.lev .row{display:flex;justify-content:space-between;color:var(--mute);font-weight:600}.lev .row b{color:#fff;font-weight:800}
.lev .ex{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lev .ex div{padding:8px;border-radius:7px;background:var(--bg);text-align:center;font-size:12px;font-weight:700;color:var(--mute);line-height:1.35}
.lev .ex b{display:block;font-size:17px;font-weight:900}
.paynote{font-size:12px;color:var(--mute);font-weight:600;text-align:center;margin-top:7px}

/* pinned open bets */
.dockw{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(96vw,460px);z-index:55;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.dk{pointer-events:auto;cursor:pointer;background:rgba(19,36,48,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;
  box-shadow:0 10px 30px rgba(0,0,0,.55);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.dk.in{animation:tin .35s cubic-bezier(.2,.8,.2,1)}
.dk.g{border-color:rgba(0,231,1,.55)}.dk.r{border-color:rgba(255,79,79,.55)}.dk.y{border-color:rgba(255,200,0,.55)}
.dk .a{font-size:12px;color:var(--mute);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dk .a b{color:#fff;font-weight:900}
.dk .v{font-size:19px;font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dk .v small{font-size:12px;font-weight:800;margin-left:6px}
.dk .co{grid-row:1/3;grid-column:2;background:var(--green);color:#022a06;font-weight:900;padding:8px 12px;border-radius:9px;font-size:13px;line-height:1.15;text-align:center;box-shadow:0 3px 0 #00a301}
.dk .co:active{transform:translateY(2px);box-shadow:0 1px 0 #00a301}
.dk .co span{display:block;font-size:15px}
.dk .st{grid-row:1/3;grid-column:2;font-size:12px;font-weight:800;color:var(--mute);text-align:right}
.dk .bar{grid-column:1/-1;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:5px}.dk .bar i{display:block;height:100%;background:#fff;transition:width .25s linear}
.dkmore{pointer-events:auto;align-self:center;font-size:12px;font-weight:800;color:#fff;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 12px}
/* news feed */
.feed{padding:12px 14px;max-height:420px;overflow-y:auto}
.feed h3{font-size:15px;font-weight:800;margin-bottom:8px}
.ni{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;font-weight:600;align-items:start}
.ni:first-of-type{border-top:0}
.ni time{font-size:11px;color:var(--dim);font-weight:700;padding-top:1px}
.ni .sy{font-weight:900;margin-right:4px}
.ni .mv{font-weight:900;font-size:12px}
.ni.up2{animation:nflash 1.2s}@keyframes nflash{0%{background:rgba(255,200,0,.18)}100%{background:none}}
.ni .pend{color:var(--gold);font-weight:800}

/* toasts + result */
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{width:100%;padding:12px 16px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;animation:tin .35s cubic-bezier(.2,.8,.2,1)}
.toast b{margin-left:auto;font-size:18px;font-weight:900}
.toast.win{border-color:var(--green);background:linear-gradient(90deg,rgba(0,231,1,.18),var(--panel2))}
.toast.lose{border-color:rgba(255,79,79,.6)}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{transform:translateY(20px);opacity:0}}@keyframes tout{to{transform:translateY(10px);opacity:0}}
.bigwin{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle,rgba(0,231,1,.18),transparent 60%);animation:bw 2.2s ease-out forwards}
.bigwin small{font-size:15px;font-weight:800;color:var(--mute)}
.bigwin b{font-size:clamp(44px,12vw,80px);font-weight:900;color:var(--green);text-shadow:0 0 30px rgba(0,231,1,.6)}
@keyframes bw{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:69}

/* help */
.help{position:fixed;inset:0;z-index:80;background:rgba(5,12,18,.85);display:flex;align-items:center;justify-content:center;padding:16px}
.help .box{max-width:420px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.help h2{font-size:22px;font-weight:900;margin-bottom:12px}
.help ol{padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.45;color:#dfe5f2}
.help ol b{color:#fff}
.help .go{margin-top:18px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 32 32"><rect x="3" y="18" width="6" height="10" rx="1.5" fill="#00e701"/><rect x="13" y="11" width="6" height="17" rx="1.5" fill="#00e701" opacity=".8"/><rect x="23" y="4" width="6" height="24" rx="1.5" fill="#00e701" opacity=".6"/></svg><span>Stack <b>Markets</b></span></div>
  <div class="idx" id="idx"></div>
  <div class="balbox"><div class="bal" id="bal">$0.00</div><button class="btn-top" id="topup" title="Add $1,000">Top up</button></div>
</header>
<div class="ticker"><div class="live"><i></i>LIVE</div><div class="track-wrap" id="twrap"><div class="track" id="track"></div></div></div>
<main class="grid">
  <section class="board" id="board" aria-label="Stocks"></section>
  <section class="center">
    <div class="card shead" id="shead"></div>
    <div class="card newsbar" id="breaking"><em>LATEST</em><span class="nt">Markets open: welcome to Stack Markets</span></div>
    <div class="card chartbox" id="chartbox"><canvas id="chart"></canvas><div class="lockfx" id="lockfx"></div></div>
    <div class="card pos">
      <div class="phead"><div class="ptabs"><button class="on" data-p="open" id="pOpenBtn">Open</button><button data-p="hist">History</button></div><div class="stat" id="stat"></div></div>
      <div class="plist" id="plist"></div>
    </div>
  </section>
  <aside class="panel">
    <div class="card bet">
      <div class="tabs" id="tabs"><button data-t="trade" class="on">Trade</button><button data-t="target">Target</button><button data-t="ud">Up / Down</button></div>
      <div id="tabbody"></div>
          </div>
    <div class="card feed"><h3>Market news</h3><div id="feed"></div></div>
  </aside>
</main>
<div class="dockw" id="dock" aria-live="polite"></div>
<div id="toasts"></div>
<canvas id="confetti"></canvas>
<script>
/* ================= STACK MARKETS ENGINE =================
   Every price is a fair random walk (a martingale): no stock drifts up or down on average,
   news jumps are 50/50, so the only house edge is the one we set on purpose (3%).
   The odds shown to the player come from Monte Carlo runs of this exact same step function. */
const DT=0.25;                         // one market tick = 0.25s
let _spare=null;
function randn(){if(_spare!==null){const v=_spare;_spare=null;return v}
  let u=0;while(u===0)u=Math.random();const v=Math.random(),r=Math.sqrt(-2*Math.log(u)),a=6.283185307179586*v;
  _spare=r*Math.sin(a);return r*Math.cos(a)}
const HOUSE=0.97;                      // return to player on every bet type
const G_RATE=1/120,G_X=0.02,G_DELAY=[18,26];
const STOCKS=[
 {sym:'GLDN',name:'Golden Reserve Trust',sector:'Commodities',p0:184.20,m60:.006,jr:1/150,js:.006,beta:.3,evRate:1/100,evX:.01,dl:[16,26],

/* one tick of the market-wide event clock. returns +1/-1 when a rate decision lands, else 0 */
function stepGlobal(G,cb){
  if(G.pend){G.pend.t-=DT;if(G.pend.t<=1e-9){const s=Math.random()<.5?1:-1;G.pend=null;cb&&cb('gres',s);return s}return 0}
  if(Math.random()<G_RATE*DT){G.pend={t:delayOf(G_DELAY)};cb&&cb('gann',G.pend)}
  return 0}
/* one tick for one stock: fair diffusion + random jumps + scheduled 50/50 news */
function stepStock(S,st,cb){
  let lr=S.dr+S.sd*randn(),jump=0;
  if(Math.random()<S.jr*DT){const j=S.jl+S.js*randn();lr+=j;jump=Math.exp(j)-1}
  let f=Math.exp(lr);
  if(S.rug&&Math.random()<S.rug*DT){const up=Math.random()<2/7;f*=up?3:.2;cb&&cb('rug',up)}
  if(st.pend){st.pend.t-=DT;if(st.pend.t<=1e-9){const up=Math.random()<.5;f*=up?1+S.evX:1-S.evX;cb&&cb('res',up);st.pend=null}}
  else if(Math.random()<S.evRate*DT){st.pend={t:delayOf(S.dl)};cb&&cb('ann',st.pend)}
  st.p*=f;return jump}

/* Monte Carlo from the live state. Same step functions as the real market. */
function cl(st){return{p:st.p,pend:st.pend?{t:st.pend.t}:null}}
function mcTrade(S,st0,G0,o,n){ // o:{dir,L,N,tp,sl}
  let over=0,profit=0,liq=0;
  for(let i=0;i<n;i++){const st=cl(st0),G={pend:G0.pend?{t:G0.pend.t}:null},p0=st.p;
    for(let k=1;k<=o.N;k++){const g=stepGlobal(G);stepStock(S,st);if(g)st.p*=1+g*S.beta*G_X;
      const V=1+o.L*o.dir*(st.p/p0-1);
      if(V<=0){liq++;over+=-V;break}
      if(o.tp&&V>=1+o.tp){profit++;break}
      if(o.sl&&V<=1-o.sl)break;
      if(k===o.N&&V>1)profit++}}
  return{gain:over/n,pProfit:profit/n,pLiq:liq/n}}
function mcTarget(S,st0,G0,rel,N,n){
  let hit=0;
  for(let i=0;i<n;i++){const st=cl(st0),G={pend:G0.pend?{t:G0.pend.t}:null},tgt=st.p*(1+rel);
    for(let k=1;k<=N;k++){const g=stepGlobal(G);stepStock(S,st);if(g)st.p*=1+g*S.beta*G_X;
      if(rel>0?st.p>=tgt:st.p<=tgt){hit++;break}}}
  return hit/n}
function mcUpDown(S,st0,G0,N,n){
  let up=0;
  for(let i=0;i<n;i++){const st=cl(st0),G={pend:G0.pend?{t:G0.pend.t}:null},p0=st.p;
    for(let k=1;k<=N;k++){const g=stepGlobal(G);stepStock(S,st);if(g)st.p*=1+g*S.beta*G_X}
    if(st.p>p0)up++}
  return up/n}

/* ---------- odds (Monte Carlo from the live market) ---------- */
let Q=null,qTimer=0;
function validStake(){const S=STOCKS[sel];if(ui.stake<S.minStake)return`Min stake is ${money(S.minStake)}`;if(ui.stake>S.maxStake)return`Max stake is ${money(S.maxStake)}`;return''}
function quote(){clearTimeout(qTimer);qTimer=setTimeout(doQuote,60)}
function doQuote(){const S=STOCKS[sel],m=M[sel],od=$('odds');if(!od&&tab!=='ud')return;
  const halted=isHalted(sel),bad=validStake(),openN=positions.length>=6;
  if(tab==='trade'){const N=ui.T/DT,q=mcTrade(S,m,G,{dir:ui.dir,L:ui.L,N,tp:ui.tp,sl:ui.sl},900),fee=feeFor(ui.stake,q.gain);Q={q,fee};
    const liqP=m.p*(1-ui.dir/ui.L),be=m.p*(1+ui.dir*(fee/ui.stake)/ui.L),pw=q.pProfit,pl=q.pLiq;

      <div class="row"><span>Typical ${ui.T<60?ui.T+'s':ui.T/60+'m'} move for ${S.sym}</span><b>±${(typ*100).toFixed(1)}% (±${money(ui.stake*ui.L*typ)})</b></div>`;
    od.innerHTML=`<div class="big"><span>Chance to finish in profit</span><b>${(pw*100).toFixed(1)}%</b></div>

      <div class="row"><span>Chance of liquidation</span><b class="dn">${(pl*100).toFixed(1)}%</b></div>
      <div class="row"><span>Liquidates at</span><b>${price(liqP)}</b></div>

      <div class="row"><span>Trading fee</span><b>${money(fee)}</b></div>

/* ---------- positions ---------- */
const positions=[];let pid=0;
function lockIn(up){SND.init();const S=STOCKS[sel],m=M[sel];if(isHalted(sel)||validStake()||positions.length>=6)return;
  doQuote();const stake=ui.stake;let o,cost=stake;
  if(tab==='trade'){const fee=Q.fee;cost=stake+fee;o={kind:'trade',dir:ui.dir,L:ui.L,N:ui.T/DT,tp:ui.tp,sl:ui.sl,fee,liq:m.p*(1-ui.dir/ui.L)}}
  else if(tab==='target'){if(!(Q.mult>=1.05&&Q.mult<=100))return;o={kind:'target',rel:ui.rel,tgt:m.p*(1+ui.rel),m:Q.mult,N:ui.tT/DT}}
  else{const mult=up?Q.mu:Q.md;if(mult<1.01)return;o={kind:'ud',up,m:mult,N:ui.uT/DT}}
  if(!spend(cost)){toast('Not enough balance','Top up to keep playing','','lose');return}
  Object.assign(o,{id:++pid,i:sel,stake,cost,p0:m.p,t0:T,k:0});positions.push(o);
  SND.lock();const fx=$('lockfx');fx.classList.remove('go');void fx.offsetWidth;fx.classList.add('go');
  drawPositions();drawDock();quote()}
function desc(o){return o.kind==='trade'?`${o.dir>0?'Long':'Short'} ${o.L}x · ${o.N*DT}s`:o.kind==='target'?`Target ${o.rel>0?'▲':'▼'}${Math.abs(o.rel*100).toFixed(1)}% · ${o.m.toFixed(2)}x`:`${o.up?'Rise':'Fall'} ${o.m.toFixed(2)}x · ${o.N*DT}s`}
function valueOf(o){const p=M[o.i].p;if(o.kind==='trade')return o.stake*Math.max(0,1+o.L*o.dir*(p/o.p0-1));return null}
function resolvePositions(){for(let j=positions.length-1;j>=0;j--){const o=positions[j],p=M[o.i].p;o.k++;let pay=null,why='';
  if(o.kind==='trade'){const V=1+o.L*o.dir*(p/o.p0-1);
    if(V<=0){pay=0;why='Liquidated'}else if(o.tp&&V>=1+o.tp){pay=V;why='Take profit hit'}else if(o.sl&&V<=1-o.sl){pay=V;why='Stop loss hit'}else if(o.k>=o.N){pay=V;why='Closed at time'}
    if(pay!==null)pay*=o.stake}
  else if(o.kind==='target'){if(o.rel>0?p>=o.tgt:p<=o.tgt){pay=o.stake*o.m;why='Target hit!'}else if(o.k>=o.N){pay=0;why='Target missed'}}
  else if(o.k>=o.N){const w=o.up?p>o.p0:p<o.p0;pay=w?o.stake*o.m:0;why=w?(o.up?'It rose!':'It fell!'):(o.up?'It fell':'It rose')}
  const left=o.N-o.k;if(pay===null&&left<=12&&left>0&&left%4===0&&o.i===sel)SND.beat();
  if(pay!==null){positions.splice(j,1);settle(o,Math.round(pay*100)/100,why)}}}
function settle(o,pay,why){const S=STOCKS[o.i],net=pay-o.cost;if(pay>0)credit(pay);
  const st=save.stats;st.n++;st.pl=Math.round((st.pl+net)*100)/100;if(net>0){st.w++;st.best=Math.max(st.best,net)}
  save.hist.unshift({sym:S.sym,d:desc(o),net,why,time:clock()});save.hist=save.hist.slice(0,30);persist();
  if(net>0){const big=pay>=o.cost*3;big?SND.big():SND.win();toast(why,`${S.sym} · ${desc(o)}`,'+'+money(net),'win');if(big)bigWin(net)}
  else{SND.lose();toast(why,`${S.sym} · ${desc(o)}`,money(net),'lose')}
  drawPositions();drawDock()}
function cashOut(id){const j=positions.findIndex(o=>o.id===id);if(j<0)return;const o=positions[j];positions.splice(j,1);settle(o,Math.round(valueOf(o)*100)/100,'Cashed out')}
let pView='open';
document.querySelectorAll('.ptabs button').forEach(b=>b.onclick=()=>{pView=b.dataset.p;document.querySelectorAll('.ptabs button').forEach(x=>x.classList.toggle('on',x===b));drawPositions()});
function drawPositions(){const st=save.stats;$('stat').innerHTML=`Session <b class="${st.pl>=0?'up':'dn'}">${st.pl>=0?'+':''}${money(st.pl)}</b> · ${st.n} bets · ${st.n?Math.round(st.w/st.n*100):0}% won`;
  $('pOpenBtn').textContent=`Open (${positions.length})`;
  if(pView==='hist'){$('plist').innerHTML=save.hist.length?save.hist.map(h=>`<div class="pi h"><span class="sy">${h.sym}</span><span class="ds">${h.why} · ${h.d}</span><span class="pl ${h.net>=0?'up':'dn'}">${h.net>=0?'+':''}${money(h.net)}</span></div>`).join(''):'<div class="empty">No finished bets yet.</div>';return}
  if(!positions.length){$('plist').innerHTML='<div class="empty">No open bets. Pick a stock and lock one in.</div>';return}
  $('plist').innerHTML=positions.map(o=>{const S=STOCKS[o.i],v=o.kind==='trade'?valueOf(o):null,net=v!==null?v-o.cost:null,left=Math.max(0,(o.N-o.k)*DT);
    const live=o.kind==='trade'?`<span class="pl ${net>=0?'up':'dn'}">${net>=0?'+':''}${money(net)}</span>`:`<span class="pl" style="color:var(--gold)">${money(o.stake*o.m)}</span>`;
    return `<div class="pi" style="grid-template-columns:auto 1fr auto${o.kind==='trade'?' auto':''}"><span class="sy">${S.sym}</span><span class="ds">${desc(o)} · ${Math.ceil(left)}s</span>${live}${o.kind==='trade'?`<button class="co" data-id="${o.id}">Cash out</button>`:''}
      <div class="bar"><i style="width:${(1-o.k/o.N)*100}%"></i></div></div>`}).join('');
}
const dockSeen=new Set();
function dockRow(o){const S=STOCKS[o.i],p=M[o.i].p,left=Math.max(0,(o.N-o.k)*DT),head=`<b>${S.sym}</b> · ${desc(o)} · ${Math.ceil(left)}s left`;
  let body,side,cls;
  if(o.kind==='trade'){const v=valueOf(o),net=v-o.cost;cls=net>=0?'g':'r';
    body=`Worth ${money(v)}<small class="${net>=0?'up':'dn'}">${net>=0?'+':''}${money(net)} after fee</small>`;
    side=`<button class="co" data-id="${o.id}">Cash out<span>${money(v)}</span></button>`}
  else if(o.kind==='target'){const d=Math.abs(o.tgt/p-1);cls='y';body=`<span style="color:var(--gold)">${(d*100).toFixed(2)}% to target</span><small class="up">gets ${money(o.stake*o.m)}</small>`;side=`<span class="st">Target<br>${price(o.tgt)}</span>`}
  else{const w=o.up?p>o.p0:p<o.p0;cls=w?'g':'r';body=`<span class="${w?'up':'dn'}">${w?'Winning':'Losing'}</span><small style="color:var(--mute)">${w?'gets':'would get'} ${money(o.stake*o.m)}</small>`;side=`<span class="st">${o.up?'Rise':'Fall'} from<br>${price(o.p0)}</span>`}
  const fresh=!dockSeen.has(o.id);dockSeen.add(o.id);
  return `<div class="dk ${cls}${fresh?' in':''}" data-i="${o.i}"><div class="a">${head}</div>${side}<div class="v">${body}</div><div class="bar"><i style="width:${(1-o.k/o.N)*100}%"></i></div></div>`}
function drawDock(){const d=$('dock'),ord=positions.slice().reverse().sort((a,b)=>(b.kind==='trade')-(a.kind==='trade')),list=ord.slice(0,innerWidth<600?2:3),extra=positions.length-list.length;
  d.innerHTML=list.map(dockRow).join('')+(extra>0?`<button class="dkmore" id="dkmore">+${extra} more open ${extra>1?'bets':'bet'}</button>`:'');
  const h=positions.length?d.offsetHeight+16:0;document.body.style.paddingBottom=h+'px';$('toasts').style.bottom=(h?h+4:18)+'px'}
// pointerdown so a tap still lands even though the bar refreshes 4 times a second
$('dock').addEventListener('pointerdown',e=>{const co=e.target.closest('.co');if(co){e.preventDefault();SND.init();cashOut(+co.dataset.id);drawDock();return}
  if(e.target.closest('#dkmore')){document.querySelector('.pos').scrollIntoView({behavior:'smooth',block:'center'});return}
  const row=e.target.closest('.dk');if(row&&+row.dataset.i!==sel)select(+row.dataset.i)});
/* ---------- toasts + big win ---------- */
function toast(title,sub,amt,cls){const t=document.createElement('div');t.className='toast '+cls;t.innerHTML=`<div><div>${title}</div><div style="font-size:12px;color:var(--mute);font-weight:600">${sub}</div></div><b class="${cls==='win'?'up':cls==='lose'?'dn':''}">${amt}</b>`;
  $('toasts').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)},2600);while($('toasts').children.length>3)$('toasts').firstChild.remove()}
function bigWin(net){const d=document.createElement('div');d.className='bigwin';d.innerHTML=`<small>Big win</small><b>+${money(net)}</b>`;document.body.appendChild(d);setTimeout(()=>d.remove(),2300);confetti()}
function confetti(){const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*6.28,s:4+Math.random()*5,c:['#00e701','#ffc800','#ffffff','#1475e1'][Math.floor(Math.random()*4)]}));
  const t0=performance.now();(function f(){const e=performance.now()-t0;x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(e<2200)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

/* ---------- select stock ---------- */
$('plist').addEventListener('pointerdown',e=>{const co=e.target.closest('.co');if(co){e.preventDefault();SND.init();cashOut(+co.dataset.id);drawDock()}});
function select(i){sel=i;yLo=null;buildTab();drawHead();drawBoard();drawDock()}

/* ---------- loops ---------- */
for(let k=0;k<560;k++){marketTick(true);if(k===420)M.forEach(m=>m.open=m.p)}   // warm up 140s of chart history
let acc=0,lastF=performance.now(),uiT=0,qT=0;
function frame(now){const dt=Math.min(.25,(now-lastF)/1000);lastF=now;acc+=dt;let n=0;
  while(acc>=DT&&n<40){acc-=DT;marketTick(false);lastReal=now;n++}
  uiT+=dt;qT+=dt;
  if(n){drawHead();drawDock();if(tickN%2===0){drawBoard();drawIdx();if(pView==='open')drawPositions()}}
  if(qT>1.2){qT=0;doQuote()}
  tickerFrame(dt);drawChart();requestAnimationFrame(frame)}
buildBoard();drawBal();drawFeed();drawPositions();select(sel);
headline(-1,'Markets open: welcome to Stack Markets',0,'flav');
requestAnimationFrame(t=>{lastF=t;lastReal=t;requestAnimationFrame(frame)});

/* ---------- first visit help ---------- */
if(!save.seen){const h=document.createElement('div');h.className='help';h.innerHTML=`<div class="box"><h2>How it works</h2><ol>
  <li><b>Pick a stock.</b> Each one moves differently. Low risk ones barely move, meme and penny stocks go wild.</li>
  <li><b>Choose a bet.</b> <b>Trade</b> rides the price with leverage. <b>Target</b> pays if the price touches your number in time. <b>Up/Down</b> is higher or lower when the clock runs out.</li>
  <li><b>Watch the news.</b> Yellow markers on the chart show announcements coming up. They're 50/50 and can move a stock a lot.</li>
  <li><b>Lock in and watch.</b> Your odds and payout are shown before you commit. Every bet returns 97% on average.</li></ol>
  <button class="go" id="helpGo">Start trading</button></div>`;document.body.appendChild(h);$('helpGo').onclick=()=>{SND.init();save.seen=true;persist();h.remove()}}
})();
</script>
</body>
