/* ================= STACK HQ: the company simulation =================
   A monthly model of Stack as a global company, with a simulated world around the real one.
   Per country and product: attractiveness = quality x brand x price x satisfaction; your share of
   the market moves toward attractiveness / (you + rivals + local players). Users = market size x fit
   x share; revenue = users x spend x margin, so a greedy margin earns more per user but loses users.
   Costs are staff, servers, support, marketing, R&D, licences, execs and tax. Cash below zero at a

   is the Australian home market's boost. None of this touches the real games' 97%. */
const HQ_TYPES={casino:{n:'Casino',w:.34,arpu:1.2},sports:{n:'Sports',w:.36,arpu:1},markets:{n:'Markets',w:.14,arpu:.8},cards:{n:'Cards',w:.16,arpu:.6},arcade:{n:'Arcade',w:.2,arpu:.5},tables:{n:'Tables',w:.12,arpu:.9},

const HQ_IDEAS=[

const HQ_TRAITS={growth:{n:'Growth hacker',d:'Campaigns work 30% harder'},pincher:{n:'Penny pincher',d:'Running costs 8% lower'},visionary:{n:'Visionary',d:'R&D quality +8 and 20% faster'},fixer:{n:'Fixer',d:'Licences 40% faster, regulators calmer'},cannon:{n:'Loose cannon',d:'Very skilled, but scandals happen'},veteran:{n:'Veteran',d:'Players happier everywhere'},poacher:{n:'Poacher',d:'Steals share from rivals'}};
const HQ_FIRST=['Mia','Arjun','Chloe','Kenji','Sofia','Liam','Aisha','Mateo','Hannah','Tariq','Yuki','Oliver','Priya','Lucas','Zara','Noah','Amara','Felix','Leila','Hugo'];
const HQ_LAST=['Chen','Okafor','Walsh','Tanaka','Silva','Brennan','Kapoor','Novak','Haddad','Larsen','Moreau','Nguyen','Reyes','Fischer','Adeyemi','Kowalski','Ito','Murphy','Santos','Berg'];
const HQ_SU_A=['Nova','Pixel','Lucky','Orbit','Kite','Blaze','Echo','Zen','Vault','Pulse','Drift','Spark'],HQ_SU_B=['Labs','Play','Games','Loop','Studio','Works','Club','Bet','Hub','Stack'];
function hqPick(a,r){return a[Math.floor(r()*a.length)]}
function hqNew(r){const st={v:1,month:0,day:0,cash:1.2e7,shares:1e8,mine:6e7,board:60,bailouts:0,ipo:false,brandId:{mark:0,col:'#00e701',slogan:'Stack it up.',mascot:11,score:55},

 for(const c of HQ_C)st.countries[c.id]={st:c.id==='AU'?'live':'none',due:0,brand:c.id==='AU'?14:2,sat:.72,margin:{},share:{},users:{},rev:{}};
 for(const k of['casino','sports','markets','cards','arcade','tables'])st.products[k]={q:{casino:62,sports:70,markets:55,cards:68,arcade:72,tables:58}[k],live:true};
 st.rivals=HQ_RIVALS.map(x=>({id:x.id,n:x.n,col:x.col,home:x.home,cash:x.cash,agg:x.agg,q:Object.assign({},x.q),cs:Object.assign({},x.cs),margin:{},share:{},rev:0,val:0,price:0,alive:true,hist:[]}));

function hqCands(role,r,n){const out=[];const tr=Object.keys(HQ_TRAITS);for(let i=0;i<n;i++){const sk=.3+r()*.6,t=hqPick(tr,r);out.push({name:hqPick(HQ_FIRST,r)+' '+hqPick(HQ_LAST,r),role,skill:Math.round((t==='cannon'?Math.min(1,sk+.2):sk)*100)/100,trait:t,salary:Math.round((1.2e5+sk*3.5e5)/1e3)*1e3})}return out}

const hqTrait=(st,t)=>Object.values(st.execs).some(e=>e&&e.trait===t);

const hqA=(q,brand,m,sat)=>Math.pow(Math.max(5,q)/60,1.6)*(.25+brand/100)*hqPF(m)*(.6+.8*sat);

function hqMonth(st,r,real,init){const out={rev:0,cost:0,users:0,byC:{},lines:{}};const ex=k=>hqExec(st,k);
 const cmoK=1+(ex('cmo')?ex('cmo').skill*.5:0)+(hqTrait(st,'growth')?.3:0),ctoQ=hqTrait(st,'visionary')?8:0;
 const idF=.7+st.brandId.score/150,down=st.downturn>0?.9:1;
 /* real play: the home market's boost */
 if(real&&!init){const d=st.lastReal?Math.max(-5e4,real.ggr-st.lastReal.ggr):0;st.realBoost={users:real.players*1500,rev:Math.max(0,d)*200+real.players*3000,players:real.players,ggr:d};st.lastReal={ggr:real.ggr}}
 else if(real&&init)st.lastReal={ggr:real.ggr};
 /* marketing: campaigns + sponsorships move brand */

const T0=()=>performance.now()/1000;
/* the share price walks between month ends and lands on the real valuation each month */
function dayTick(){const tgt=st.price,p=st.dayPrice||tgt;st.dayPrice=Math.max(.01,p+(tgt-p)*.15+p*(Math.random()-.5)*.03);st.ticks.push(st.dayPrice);if(st.ticks.length>360)st.ticks.shift()}
function monthEnd(){const before=st.bailouts,news0=st.news.length?st.news[0]:null;const rec=hqAdvance(st,Math.random,real());st.brandId.score=Math.min(95,st.brandId.score+1.2);
 publish(false);save();snd('month');
 if(st.bailouts>before){snd('no');modal(`<h1 class="dn">Emergency bailout</h1><p>Stack ran out of cash. Investors stepped in with a rescue round at a steep discount, and your stake has fallen to <b>${P(st.mine/st.shares)}</b>. The board's confidence is badly shaken.</p><p class="sub">Cut costs, fix pricing, and grow your way back.</p>`)}
 else{const fresh=st.news.filter(n=>n.m===st.month-1&&n.kind==='milestone');if(fresh.length){snd('big');modal(`<h1 class="gg">${fresh[0].t}</h1><p>${fresh[0].d}</p>`)}}
 render()}
function modal(html){$('modalBody').innerHTML=html+`<div style="margin-top:14px"><button class="btn" id="mX">Continue</button></div>`;$('modal').classList.add('on');$('mX').onclick=()=>$('modal').classList.remove('on')}
let lastF=0,mapT=0;
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.25,(ts-lastF)/1000||0);lastF=ts;if(window.__gPaused)return;
 if(SPEED>0&&!$('modal').classList.contains('on')){acc+=dt*SPEED;while(acc>=DAYSEC){acc-=DAYSEC;DAY++;dayTick();if(DAY>=30){DAY=0;monthEnd()}}}
 hdr();mapT+=dt;if(mapT>.1&&$('map')){mapT=0;drawMap($('map'),st,SEL,T0(),TAB==='overview')}}
document.querySelectorAll('#speed button').forEach(b=>b.onclick=()=>{SPEED=+b.dataset.s;snd('click');save();hdr()});
addEventListener('resize',()=>render());
/* ---- a little sound ---- */
let AC=null;function snd(k){try{if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A()}const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
 const f={click:[900,1200,.05,.04],ok:[660,990,.12,.06],cash:[1200,1800,.18,.07],no:[300,180,.2,.07],month:[520,780,.25,.04],big:[440,1320,.5,.08]}[k]||[800,800,.05,.03];
 o.type='triangle';o.frequency.setValueAtTime(f[0],t);o.frequency.exponentialRampToValueAtTime(f[1],t+f[2]);g.gain.setValueAtTime(f[3],t);g.gain.exponentialRampToValueAtTime(.0005,t+f[2]+.05);o.start(t);o.stop(t+f[2]+.1)}catch(e){}}
window.StackFrame={refresh:()=>{render()}};
render();requestAnimationFrame(frame);
if(st.fresh){delete st.fresh;save();publish(false);modal(`<h1>Welcome to Stack HQ</h1><p>You're the founder and CEO. Stack is a young company live in Australia, valued at about <b>${M(st.val)}</b>, and you own <b>${P(st.mine/st.shares)}</b> of it.</p>
 <p>Grow it into a global empire: launch in new countries, set prices, run campaigns and sponsorships, hire executives, fund R&amp;D, buy startups and take over rivals.</p>
 <p class="sub">Time moves while HQ is open: a month every 10 minutes at 1× (use 5× or 20× to speed up). Real Stack play feeds the Australian market. Run out of cash and investors bail you out, at a heavy cost to your stake.</p>`)}
</script></body></html>
