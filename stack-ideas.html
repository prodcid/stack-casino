<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stack Ideas Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#0a1120;--s:#111b30;--s2:#16223b;--ink:#eef3ff;--ink2:#9fb0d0;--ink3:#61719a;--line:#22335a;--acc:#c8f53a;--pink:#ff6ad5;--cyan:#46e0ff;--gold:#f2b632;--red:#ff5a6a;--grn:#34d074;--sc:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#1c2d5a,transparent 60%),var(--bg);color:var(--ink);font:14px/1.5 'Plus Jakarta Sans',sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{padding:40px 32px 10px;max-width:1400px;margin:auto}h1{font:800 64px/1 var(--sc);text-transform:uppercase;margin:0}h1 em{color:var(--acc);font-style:normal}
.lead{color:var(--ink2);max-width:700px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}nav button{height:36px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);font:800 14px var(--sc);text-transform:uppercase;color:var(--ink2)}nav button.on{background:var(--acc);color:#0a1120;border-color:var(--acc)}
main{max-width:1400px;margin:auto;padding:0 32px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px}
.card{background:var(--s);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:8px}.n{font:800 13px var(--sc);background:var(--s2);border-radius:6px;padding:2px 8px;color:var(--acc)}
.tag{font:500 10px 'IBM Plex Mono';letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}.sz{margin-left:auto;font:800 12px var(--sc);padding:2px 8px;border-radius:6px}
.S{background:#173d22;color:var(--grn)}.M{background:#3a2e0b;color:var(--gold)}.L{background:#3d1520;color:var(--red)}
h3{margin:0;font:800 24px var(--sc);text-transform:uppercase}.d{color:var(--ink2);margin:0;font-size:13px}
.demo{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:150px;position:relative;overflow:hidden}
.ob{display:inline-flex;justify-content:space-between;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--s2);min-width:120px}.ob b{font:800 17px var(--sc);color:var(--acc)}.ob:hover{border-color:var(--acc)}.ob.on{background:var(--acc)}.ob.on b,.ob.on span{color:#0a1120}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mut{color:var(--ink2)}.small{font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}th{font:500 10px 'IBM Plex Mono';color:var(--ink3);text-transform:uppercase}
.f{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font:800 11px var(--sc);color:#0a1120}.W{background:var(--grn)}.D{background:var(--ink3)}.L2{background:var(--red)}
.bar{height:8px;background:var(--s2);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--cyan));transition:width .5s}
.big{font:800 34px var(--sc)}.pill{display:inline-block;padding:2px 8px;border-radius:99px;font:700 11px 'IBM Plex Mono';background:var(--s2)}
.btn{height:38px;padding:0 16px;border-radius:9px;background:var(--acc);color:#0a1120;font:800 15px var(--sc);text-transform:uppercase}.btn.g{background:var(--s2);color:var(--ink);border:1.5px solid var(--line)}
canvas{display:block;width:100%;border-radius:8px}
.reel{display:inline-grid;place-items:center;width:64px;height:64px;font-size:38px;background:var(--s2);border-radius:10px;border:1.5px solid var(--line)}
.feed div{padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;animation:in .4s}@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.tiers{display:flex;gap:4px;overflow:auto;padding-bottom:4px}.tier{flex:none;width:58px;height:70px;border-radius:8px;background:var(--s2);border:1.5px solid var(--line);display:grid;place-items:center;font:800 13px var(--sc);text-align:center}.tier.got{border-color:var(--acc);color:var(--acc)}.tier.pr{border-style:dashed;border-color:var(--gold)}
.skin{width:56px;height:76px;border-radius:8px;border:2px solid transparent;cursor:pointer}.skin.on{border-color:var(--acc)}
.res div{padding:6px 8px;border-radius:7px;background:var(--s2);margin-bottom:4px;font-size:13px}
input.q{width:100%;height:38px;border-radius:9px;border:1.5px solid var(--line);background:var(--s2);color:var(--ink);padding:0 12px;font:inherit}
kbd{font:700 11px 'IBM Plex Mono';background:var(--s2);border:1px solid var(--line);border-bottom-width:3px;border-radius:5px;padding:1px 6px}
.toast{position:absolute;left:12px;right:12px;bottom:12px;padding:10px 12px;border-radius:10px;background:linear-gradient(90deg,var(--pink),#7c4dff);font-weight:700;animation:in .4s}
.hide{display:none!important}
</style></head><body>
<header><span class="tag">Stack · test page · nothing here is live</span><h1>Ideas <em>Lab</em></h1><p class="lead">Twenty update ideas, each with a working mock you can poke at. Sizes: <b class="sz S">S</b> one session · <b class="sz M">M</b> two or three · <b class="sz L">L</b> big rebuild. All mocks keep the house rules: odds shown, no fake near misses, RTP 96–99%.</p>
<nav id="nav"></nav></header>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s),R=Math.random,pick=a=>a[Math.floor(R()*a.length)];
const IDEAS=[
['Sports','League season mode','M','Teams play a full season with a table, form and a title race. Title markets open late in the season.',el=>{const T=[['Northbank FC',66,'WWDWW'],['Kingsway',63,'WLWWD'],['Harbour City',58,'DWWLW'],['Port Elm',51,'LWDWL'],['Redcliffe',44,'LLWDL']];
 el.innerHTML=`<table><tr><th>#</th><th>Team</th><th>Form</th><th>Pts</th></tr>${T.map((t,i)=>`<tr><td>${i+1}</td><td>${t[0]}</td><td>${[...t[2]].map(c=>`<i class="f ${c==='L'?'L2':c}">${c}</i>`).join(' ')}</td><td><b>${t[1]}</b></td></tr>`).join('')}</table><div class="row" style="margin-top:10px"><span class="pill">🏆 Title winner · 2 games left</span><span class="sp"></span><button class="ob"><span>Northbank</span><b>1.45</b></button><button class="ob"><span>Kingsway</span><b>2.90</b></button></div>`}],
['Sports','Named players and props','M','Five named players per team. Goals credit real names; props go in the bet builder.',el=>{const P=[['R. Okoye','Anytime scorer',3.2],['R. Okoye','2+ shots on target',1.9],['L. Brandt','Anytime assist',4.5],['T. Vance','To be booked',5.0]];
 el.innerHTML=P.map(p=>`<div class="row" style="margin-bottom:6px"><b style="width:90px">${p[0]}</b><span class="mut small sp">${p[1]}</span><button class="ob" onclick="this.classList.toggle('on')"><span>Add</span><b>${p[2].toFixed(2)}</b></button></div>`).join('')}],
['Sports','Bet from the tracker','S','When the pitch shows a dangerous attack, a micro bet appears right on the canvas.',el=>{el.innerHTML=`<canvas width="760" height="300"></canvas><div class="row" style="position:absolute;right:20px;bottom:20px" id="tb"></div>`;const c=el.querySelector('canvas'),x=c.getContext('2d');let bx=.5,tx=.5,mode='safe',t=0;
 (function f(){if(!c.isConnected)return;t++;if(t%120===0){mode=pick(['safe','attack','danger']);tx=mode==='safe'?.4+R()*.2:mode==='attack'?.7:.88}bx+=(tx-bx)*.03;for(let i=0;i<10;i++){x.fillStyle=i%2?'#1f7a3d':'#238944';x.fillRect(i*76,0,76,300)}x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(4,4,752,292);x.beginPath();x.moveTo(380,4);x.lineTo(380,296);x.stroke();
  if(mode==='danger'){x.fillStyle=`rgba(230,57,70,${.3+Math.sin(t/8)*.15})`;x.fillRect(600,4,156,292)}x.fillStyle='#fff';x.beginPath();x.arc(bx*760,150+Math.sin(t/30)*60,9,0,7);x.fill();
  x.font='800 22px Barlow Condensed';x.fillText(mode==='danger'?'DANGEROUS ATTACK · KINGSWAY':mode==='attack'?'ATTACK · KINGSWAY':'BALL SAFE',20,34);
  el.querySelector('#tb').innerHTML=mode==='danger'?`<button class="ob" style="background:#0a1120"><span>Goal in next 60s?</span><b>7.40</b></button>`:'';requestAnimationFrame(f)})()}],
['Sports','Multi insurance','S','On 5+ leg multis, if exactly one leg loses you get your stake back. The cost is in the price, shown openly.',el=>{const legs=['Northbank win','Over 1.5','Metro Kings ML','Okafor win','BTTS yes'];let res=[];
 const draw=()=>{el.innerHTML=legs.map((l,i)=>`<div class="row small" style="padding:3px 0"><span class="sp">${l}</span><b style="color:${res[i]==null?'var(--ink3)':res[i]?'var(--grn)':'var(--red)'}">${res[i]==null?'pending':res[i]?'won':'lost'}</b></div>`).join('')+`<div class="row" style="margin-top:8px"><span class="pill">🛡 1 leg lets you down? Stake back</span><span class="sp"></span><button class="btn" id="go">Settle</button></div><div id="o" class="small" style="margin-top:6px"></div>`;
  el.querySelector('#go').onclick=()=>{res=legs.map(()=>R()<.8);draw();const l=res.filter(r=>!r).length;el.querySelector('#o').innerHTML=l===0?'<b style="color:var(--grn)">All won · 10.00 → 118.40</b>':l===1?'<b style="color:var(--cyan)">One leg lost · 10.00 stake back as a free bet</b>':`<span class="mut">${l} legs lost · bet lost</span>`}};draw()}],
['Sports','Darts, racing, cricket','M','New sports, each with its own simple tracker. Here: a darts board with live throws.',el=>{el.innerHTML=`<canvas width="300" height="300" style="width:200px;margin:auto"></canvas><div class="row" style="justify-content:center"><span class="pill" id="sc">Leg 1 · 501</span><button class="ob"><span>180 this leg</span><b>3.10</b></button></div>`;const c=el.querySelector('canvas'),x=c.getContext('2d');let left=501,darts=[];
 const board=()=>{const C=['#111','#eee'];for(let i=0;i<20;i++){x.beginPath();x.moveTo(150,150);x.arc(150,150,140,i*Math.PI/10-Math.PI/20,(i+1)*Math.PI/10-Math.PI/20);x.fillStyle=C[i%2];x.fill()}[[100,108,'#e63946'],[60,66,'#e63946']].forEach(([a,b,col])=>{x.lineWidth=b-a;x.strokeStyle=col;x.beginPath();x.arc(150,150,(a+b)/2,0,7);x.stroke()});x.fillStyle='#2a9d3f';x.beginPath();x.arc(150,150,14,0,7);x.fill();x.fillStyle='#e63946';x.beginPath();x.arc(150,150,6,0,7);x.fill()};
 const iv=setInterval(()=>{if(!c.isConnected)return clearInterval(iv);if(darts.length===3)darts=[];const a=R()*7,r=R()<.5?62:20+R()*110;darts.push([150+Math.cos(a)*r,150+Math.sin(a)*r]);left=Math.max(2,left-Math.floor(R()*60));board();darts.forEach(([a,b])=>{x.fillStyle='#46e0ff';x.beginPath();x.arc(a,b,6,0,7);x.fill()});el.querySelector('#sc').textContent='Leg 1 · '+left+' left'},700);board()}],
['Casino','Live-dealer tables','L','2D dealers with names, a shared countdown, and other players\' chips landing on the felt.',el=>{el.innerHTML=`<div class="row"><b>👩 Dealer Mia</b><span class="mut small">Roulette Table 3 · 14 players</span><span class="sp"></span><span class="pill" id="cd">Bets close in 12s</span></div><div style="position:relative;height:120px;margin-top:10px;background:#0f5132;border-radius:10px" id="felt"></div><div class="small mut" style="margin-top:6px" id="hist"></div>`;let n=12;const felt=el.querySelector('#felt'),H=[];
 const iv=setInterval(()=>{if(!el.isConnected)return clearInterval(iv);n--;if(n<0){const r=Math.floor(R()*37);H.unshift(r);felt.innerHTML='';n=12}el.querySelector('#cd').textContent=n>0?`Bets close in ${n}s`:'No more bets';if(R()<.6){const c=document.createElement('i');c.style.cssText=`position:absolute;left:${R()*90}%;top:${R()*75}%;width:20px;height:20px;border-radius:50%;background:${pick(['#c8f53a','#ff6ad5','#46e0ff','#f2b632'])};border:3px dashed #fff;animation:in .3s`;felt.append(c)}el.querySelector('#hist').textContent='Last: '+H.slice(0,12).join(' · ')},1000)}],
['Casino','Honest slots','M','RTP printed on the card; reels stop where they stop. No near-miss staging.',el=>{const S=['🍒','🍋','🍇','⭐','7️⃣','💎'];el.innerHTML=`<div class="row" style="justify-content:center"><span class="reel">🍒</span><span class="reel">🍋</span><span class="reel">🍇</span></div><div class="row" style="margin-top:12px"><span class="pill">RTP 97.2% · low volatility</span><span class="sp"></span><b id="w" class="small"></b><button class="btn" id="sp">Spin 1.00</button></div>`;
 el.querySelector('#sp').onclick=()=>{const r=[...el.querySelectorAll('.reel')];let k=0;const iv=setInterval(()=>{r.forEach((e,i)=>{if(k<8+i*4)e.textContent=pick(S)});if(++k>16){clearInterval(iv);const v=r.map(e=>e.textContent);el.querySelector('#w').innerHTML=v[0]===v[1]&&v[1]===v[2]?'<span style="color:var(--grn)">WIN 12×</span>':v[0]===v[1]?'<span style="color:var(--grn)">WIN 2×</span>':'<span class="mut">No win</span>'}},60)}}],
['Casino','Game show wheel','M','A big wheel with bonus rounds. Paytable always visible.',el=>{const seg=['1','2','5','1','PLINKO','2','1','10','1','COIN','2','5'],col={'1':'#3a86ff','2':'#f2b632','5':'#ff6ad5','10':'#c8f53a',PLINKO:'#e63946',COIN:'#46e0ff'};el.innerHTML=`<canvas width="280" height="280" style="width:180px;margin:auto"></canvas><div class="row" style="justify-content:center"><b id="wr" class="big">—</b><button class="btn" id="sw">Spin</button></div>`;
 const c=el.querySelector('canvas'),x=c.getContext('2d');let a=0;const draw=()=>{x.clearRect(0,0,280,280);seg.forEach((s,i)=>{const a0=a+i*Math.PI*2/seg.length;x.beginPath();x.moveTo(140,140);x.arc(140,140,130,a0,a0+Math.PI*2/seg.length);x.fillStyle=col[s];x.fill();x.save();x.translate(140,140);x.rotate(a0+Math.PI/seg.length);x.fillStyle='#0a1120';x.font='800 15px Barlow Condensed';x.fillText(s,70,5);x.restore()});x.fillStyle='#fff';x.beginPath();x.moveTo(270,140);x.lineTo(285,130);x.lineTo(285,150);x.fill()};draw();
 el.querySelector('#sw').onclick=()=>{let v=.4+R()*.3;const f=()=>{a+=v;v*=.985;draw();if(v>.002)requestAnimationFrame(f);else{const i=Math.floor(((Math.PI*2-(a%(Math.PI*2)))%(Math.PI*2))/(Math.PI*2/seg.length));el.querySelector('#wr').textContent=/\d/.test(seg[i])?seg[i]+'×':seg[i]+'!'}};f()}}],
['Casino','Tournaments','M','Timed leaderboards where the best multiplier wins, not the biggest spend.',el=>{const P=[['jaz',31.2],['kev',18.7],['mo',14.1],['YOU',12.4],['sam',9.8]];el.innerHTML=`<div class="row"><b>⏱ Crash Sprint</b><span class="sp"></span><span class="pill" id="tt">28:14 left</span></div><table style="margin-top:6px">${P.map((p,i)=>`<tr style="${p[0]==='YOU'?'color:var(--acc)':''}"><td>${i+1}</td><td>${p[0]}</td><td><b>${p[1]}×</b></td><td class="mut">${[500,250,100,50,25][i]} cr</td></tr>`).join('')}</table>`;let s=1694;const iv=setInterval(()=>{if(!el.isConnected)return clearInterval(iv);s--;el.querySelector('#tt').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} left`},1000)}],
['Social','Friends and shared slips','M','Share a slip by code; friends tail it in one click.',el=>{el.innerHTML=`<div class="res"><div>🎟 <b>Your 4-leg multi</b> · 12.40 · code <b style="color:var(--acc)">STK-7Q2</b></div></div><div class="feed" id="fd"></div>`;const F=['🙌 Mate tailed your 4-leg multi','💰 J won 84.00 on Hold\'em','🔥 Kev is on a 5-win streak at blackjack','🎟 Sam shared a bet builder: Kingsway + BTTS @ 6.20'];let i=0;const iv=setInterval(()=>{if(!el.isConnected)return clearInterval(iv);const d=document.createElement('div');d.textContent=F[i++%F.length];el.querySelector('#fd').prepend(d);if(el.querySelector('#fd').children.length>4)el.querySelector('#fd').lastChild.remove()},1600)}],
['Social','Private poker clubs','L','Create a table with a code, set blinds, seat friends, and see a ledger at the end.',el=>{el.innerHTML=`<div class="row"><b>♠ Friday Club</b><span class="pill">0.5/1</span><span class="pill">code CLUB-42</span><span class="sp"></span><span class="mut small">ends 23:00</span></div><table style="margin-top:8px"><tr><th>Player</th><th>Buy-in</th><th>Now</th><th>Net</th></tr>${[['You',100,142],['Mate',100,71],['Kev',200,215],['Sam',100,72]].map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td style="color:${p[2]>=p[1]?'var(--grn)':'var(--red)'}"><b>${p[2]-p[1]>0?'+':''}${p[2]-p[1]}</b></td></tr>`).join('')}</table>`}],
['Social','Watch parties','S','See how many people are watching a match and live reactions to big bets.',el=>{el.innerHTML=`<div class="row"><b>Northbank v Kingsway</b><span class="sp"></span><span class="pill" id="wc">👀 214 watching</span></div><div class="feed" id="rf"></div>`;const R2=['🔥 someone backed Over 3.5 @ 4.10','😱 412 people just lost Under 2.5','⚡ a 9-leg multi is one leg away','🎉 Kingsway corner: 63 micro bets won'];const iv=setInterval(()=>{if(!el.isConnected)return clearInterval(iv);el.querySelector('#wc').textContent=`👀 ${200+Math.floor(R()*40)} watching`;const d=document.createElement('div');d.textContent=pick(R2);el.querySelector('#rf').prepend(d);if(el.querySelector('#rf').children.length>4)el.querySelector('#rf').lastChild.remove()},1800)}],
['Retention','Season pass','M','30 tiers, free and premium lanes. Every reward is visible up front.',el=>{let xp=1160;const draw=()=>{const t=Math.floor(xp/100);el.innerHTML=`<div class="row"><b>Tier ${t}/30</b><span class="sp"></span><span class="mut small">${100-xp%100} XP to Golden Chips</span></div><div class="bar" style="margin:8px 0"><i style="width:${xp%100}%"></i></div><div class="tiers">${Array.from({length:30},(_,i)=>`<div class="tier ${i<t?'got':''} ${i%5===4?'pr':''}">${i+1}<br>${i%5===4?'👑':pick(['🪙','🎰','🃏','⚡'])}</div>`).join('')}</div><button class="btn g" style="margin-top:8px">Play a round (+40 XP)</button>`;el.querySelector('button').onclick=()=>{xp+=40;draw()}};draw()}],
['Retention','Daily challenges and streaks','S','Three a day. A 7-day streak gives 1.5× XP; missing a day resets it, and it says so.',el=>{const C=[['Win 3 blackjack hands with a soft total',2,3],['Back a draw in football',0,1],['Cash out a crash round above 3×',1,1]];el.innerHTML=C.map(c=>`<div style="margin-bottom:8px"><div class="row small"><span class="sp">${c[0]}</span><b>${c[1]}/${c[2]}</b></div><div class="bar"><i style="width:${c[1]/c[2]*100}%"></i></div></div>`).join('')+`<div class="row">${'MTWTFSS'.split('').map((d,i)=>`<span class="f ${i<4?'W':'D'}" style="width:28px;height:28px">${d}</span>`).join('')}<span class="sp"></span><span class="pill">🔥 4-day streak · 3 to 1.5×</span></div>`}],
['Retention','Come-back offers','S','After a few days away: a clear, small offer with plain terms.',el=>{el.innerHTML=`<div class="row"><span class="mut small">Simulate days away:</span>${[1,3,7].map(d=>`<button class="btn g" data-d="${d}">${d}d</button>`).join('')}</div><div id="of"></div>`;el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=+b.dataset.d;el.querySelector('#of').innerHTML=`<div class="toast">${d===1?'Welcome back. Your daily spin is waiting.':d===3?'We kept your seat warm · 10 free spins on Neon Fruits · no wagering needed':'Missed you · 25 credit free bet on any sport · expires in 48h'}</div>`})}],
