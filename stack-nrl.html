<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stack League</title>
<style>

<div class="wrap">

<script>
/*==CORE==*/
/* ================= STACK LEAGUE ENGINE =================
   A rugby league match played one tackle at a time. Each play is rolled from the attacking
   team's strength against the defence (plus home ground, day form, fatigue, momentum and
   numbers when someone is in the sin bin): hit-ups and shifts gain metres, some become line
   breaks, errors hand the ball over, penalties and six-agains reset the set, the last tackle
   is kicked for territory or at the line, tries are converted, and a draw at 80 minutes goes to
   golden point. The match you watch IS this loop: every play is recorded as a script the
   viewer animates. Every price is a Monte Carlo of this exact function, priced to 97%. */
const HOUSE=.97,HALF=2400,FULL=4800,GOLD=600,LUCK=.12;
let _sp=null;function randn(){if(_sp!==null){const v=_sp;_sp=null;return v}let u=0;while(u===0)u=Math.random();const v=Math.random(),r=Math.sqrt(-2*Math.log(u)),a=6.283185307*v;_sp=r*Math.sin(a);return r*Math.cos(a)}
const rnd=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v;
/* ---------- the league ---------- */
// sp = jersey sponsor (index into the sponsor library), pat = jersey pattern
const TEAMS=[
 {name:'Canberra Comets',short:'CAN',nick:'Comets',c:['#16235c','#b6f23a','#ffffff'],pat:'v',sp:2,ground:'Stack Stadium, Canberra',att:.56,def:.58,disc:.6,kick:.6},
 {name:'Stack Park Stallions',short:'STK',nick:'Stallions',c:['#111316','#f2c230','#ffffff'],pat:'yoke',sp:0,ground:'Stack Park',att:.64,def:.6,disc:.55,kick:.66},
 {name:'Harbour Hammerheads',short:'HAR',nick:'Hammerheads',c:['#1f6fd6','#ffffff','#0b2a52'],pat:'hoops',sp:1,ground:'Harbour Stack Arena',att:.6,def:.52,disc:.5,kick:.58},
 {name:'Outback Scorpions',short:'OUT',nick:'Scorpions',c:['#ff7a1a','#15171a','#ffffff'],pat:'sash',sp:9,ground:'Red Centre Stack Oval',att:.48,def:.5,disc:.42,kick:.5},
 {name:'Alpine Avalanche',short:'ALP',nick:'Avalanche',c:['#f2f6fa','#3aa0e8','#12324f'],pat:'stripes',sp:12,ground:'Snowy Stack Field',att:.46,def:.56,disc:.62,kick:.52},
 {name:'Riverina Rams',short:'RIV',nick:'Rams',c:['#7a1630','#f3e6c4','#3d0a18'],pat:'v',sp:3,ground:'Riverina Stack Ground',att:.52,def:.46,disc:.5,kick:.48},
 {name:'Brindabella Bushrangers',short:'BRI',nick:'Bushrangers',c:['#0f6b35','#f2c230','#08361b'],pat:'hoops',sp:4,ground:'Brindabella Stack Park',att:.44,def:.44,disc:.48,kick:.46},
 {name:'Ridgeway Rhinos',short:'RID',nick:'Rhinos',c:['#5a626c','#e8242c','#23282f'],pat:'yoke',sp:11,ground:'Ridgeway Freight Stack Dome',att:.5,def:.54,disc:.58,kick:.55}];
const POS=['','Fullback','Wing','Centre','Centre','Wing','Five-eighth','Halfback','Prop','Hooker','Prop','Second row','Second row','Lock'];
const POSS=['','FB','WG','CE','CE','WG','FE','HB','PR','HK','PR','2R','2R','LK'];
const TW=[0,1.25,1.7,1.25,1.25,1.7,.8,.7,.42,.5,.42,.8,.8,.62];
const FN=['Jack','Tom','Josh','Sam','Luke','Ben','Nathan','Ryan','Kane','Tyson','Jai','Brodie','Lachlan','Mitch','Cody','Zac','Liam','Isaiah','Jordan','Blake','Tevita','Sione','Jahrome','Kyle','Harry','Noah','Cooper','Reece','Dylan','Taine','Bailey','Latrell','Api','Viliami','Kotoni','Hudson','Xavier','Corey','Dane','Wade'];
const LN=['Morrison','Tuala','Walker','Fifita','Hughes','Taufa','Kelly','Brennan','Havili','Stanley','Coates','Nikora','Watene','Roberts','Papali','Hunt','Leilua','Carrigan','Kaufusi','Moses','Pearce','Walsh','Fonua','Crichton','Gutherson','Saifiti','Campbell','Tago','Marsters','Faalogo','Fletcher','Olam','Luai','Martin','Dunn','Tamou','Ryan','Nanai','Hopoate','Lomax','Sua','Taylor','Donovan','Burgess','Kiraz','Mahoney','Payne','Kenny','Tuipulotu','Wright'];
/* a fixed league: the same players every time you open it */
let _sd=1;const srnd=()=>{_sd=(_sd*16807)%2147483647;return _sd/2147483647};
const PLAYERS=[];TEAMS.forEach((tm,t)=>{tm.id=t;tm.pl=[];_sd=1000+t*977;const used=new Set();
  for(let n=1;n<=17;n++){let nm;do nm=FN[Math.floor(srnd()*FN.length)]+' '+LN[Math.floor(srnd()*LN.length)];while(used.has(nm));used.add(nm);
    const back=n<=7,fwd=n>=8&&n<=13,q=()=>.35+.6*srnd();
    const p={id:PLAYERS.length,team:t,num:n,name:nm,short:nm.split(' ')[0][0]+'. '+nm.split(' ')[1],spd:back?.5+.45*srnd():.25+.4*srnd(),str:fwd?.55+.4*srnd():.3+.4*srnd(),hand:q(),kick:n===6||n===7||n===1?.5+.45*srnd():.1+.3*srnd(),
      tw:n<=13?TW[n]*(.7+.6*srnd()):0,skin:Math.floor(srnd()*5),hair:Math.floor(srnd()*4)};
    PLAYERS.push(p);tm.pl.push(p)}
  tm.goalKicker=[6,7,1,2].map(n=>tm.pl[n-1]).sort((a,b)=>b.kick-a.kick)[0]});
/* ---------- a match ---------- */
function mkMatch(h,a,round){const M={h,a,round,T:[TEAMS[h],TEAMS[a]],home:.012};
  M.form=[randn()*.018,randn()*.018];return M}
function newMatch(M){return{M,t:0,half:1,sc:[0,0],ht:null,pos:1,p:22,y:34,tk:0,sets:0,fat:[0,0],mom:0,bin:[[],[]],gold:false,done:false,
  luck:0,tries:[],log:[],first:null,firstTry:null,rec:false,plays:null,ev:null,stats:null,pn:0,lastScore:-1,kickoff:1}}
function cloneMatch(s){const c={...s,rec:false,plays:null,ev:null,stats:null};c.sc=s.sc.slice();c.fat=s.fat.slice();c.bin=[s.bin[0].slice(),s.bin[1].slice()];c.tries=s.tries.slice();c.log=s.log.slice();c.ht=s.ht&&s.ht.slice();return c}
const numsOn=(s,t)=>13-s.bin[t].filter(u=>u>s.t).length;
/* how much the team in possession is on top right now (roughly -0.3 .. 0.3) */
function edge(s){const A=s.pos,D=1-A,M=s.M,tA=M.T[A],tD=M.T[D];
  return (tA.att-tD.def)*.34+(A===0?M.home:-M.home)+(M.form[A]-M.form[D])+(s.fat[D]-s.fat[A])*.12+(numsOn(s,A)-numsOn(s,D))*.075+(A===0?s.mom:-s.mom)*.05+s.luck}
/* pick a try scorer for the kind of play that scored */
const KIND={fwd:[0,.5,.4,.8,.8,.4,.9,.9,2.6,2.2,2.6,2.4,2.4,2.4],wide:[0,1.3,2.6,1.6,1.6,2.6,.6,.4,.15,.2,.15,.5,.5,.3],brk:[0,1.8,1.6,1.4,1.4,1.6,1,.9,.3,.5,.3,.6,.6,.5],kick:[0,1,3,1.3,1.3,3,.3,.2,.1,.1,.1,.4,.4,.2]};
function scorer(s,team,kind){const pl=s.M.T[team].pl,k=KIND[kind];let tot=0;for(let n=1;n<=13;n++)tot+=pl[n-1].tw*k[n];let r=rnd()*tot;for(let n=1;n<=13;n++){r-=pl[n-1].tw*k[n];if(r<=0)return pl[n-1]}return pl[1]}
/* recorded play (live only): the viewer turns these into movement */
function rec(s,o){if(!s.rec)return;o.t=s.t;o.A=s.pos;o.half=s.half;o.sc=s.sc.slice();o.tk=s.tk;s.plays.push(o)}
function ev(s,o){if(s.ev){o.t=s.t;o.i=s.plays?s.plays.length-1:0;s.ev.push(o)}}
function stat(s,team,k,v){if(s.stats)s.stats[team][k]=(s.stats[team][k]||0)+(v==null?1:v)}
/* ---------- scoring ---------- */
function score(s,team,pts,type,pl){s.sc[team]+=pts;s.log.push(team);s.mom=clamp(s.mom+(team===0?.15:-.15),-1,1);s.lastScore=team;
  if(!s.first)s.first={team,type,pl:pl?pl.id:-1};if(type==='try'){s.tries.push(pl.id);if(!s.firstTry)s.firstTry=pl.id}
  if(s.gold)s.done=true}
function tryScored(s,kind,y0){const A=s.pos,pl=scorer(s,A,kind),y=clamp(y0!=null?y0:kind==='wide'||kind==='kick'?(rnd()<.5?4+rnd()*6:58+rnd()*6):10+rnd()*48,3,65);
  score(s,A,4,'try',pl);stat(s,A,'tries');ev(s,{ty:'try',team:A,pl:pl.id,kind});
  if(s.done){rec(s,{ty:'try',pl:pl.id,kind,y,gold:1});return}
  const K=s.M.T[A].goalKicker,ang=Math.abs(y-34),pk=clamp(.93-.0125*ang+.2*(K.kick-.6),.25,.98),ok=rnd()<pk;
  rec(s,{ty:'try',pl:pl.id,kind,y,conv:{k:K.id,ok}});if(ok)score(s,A,2,'conv',K);ev(s,{ty:'conv',team:A,pl:K.id,ok});
  s.t+=70+rnd()*20;kickOff(s,1-A)}
/* the kicking team kicks off from halfway; the other side takes it up */

/* ================= THE MATCH ON SCREEN =================
   Every recorded play becomes a short piece of choreography. The players who matter in that
   play (dummy half, passers, the runner, tacklers, kicker, catcher, try scorer) follow scripted

   attacking or defensive shape with real acceleration and top speeds. The ball is scripted too:

   case 6:dx=-8;y=R.y+open*14;break;case 7:dx=-5;y=R.y+open*7;break;case 8:dx=-4.5;y=R.y-3;break;case 9:dx=-1.2;y=R.y;break;case 10:dx=-4.5;y=R.y+3;break;
   case 11:dx=-6;y=R.y+open*20;break;case 12:dx=-6;y=R.y-open*15;break;default:dx=-5;y=R.y-open*6}
  return cl(R.x+dx*dir,clamp(y,2.5,65.5))}

   case 7:y=R.y-15;break;case 6:y=R.y+15;break;case 3:y=Math.min(16,R.y-20);break;case 4:y=Math.max(52,R.y+20);break;case 2:x+=3*dir;y=5;break;case 5:x+=3*dir;y=63;break;

    const cs=C.createBufferSource();cs.buffer=noise;cs.loop=true;const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=600;bp.Q.value=.35;crowd=C.createGain();crowd.gain.value=0;cs.connect(bp).connect(crowd).connect(master);cs.start()}catch(e){C=null}}
  const on=()=>C&&!S.mute;

  const mw=150,mh=mw*.62,mx=w-mw-12,my=h-mh-12;x.fillStyle='rgba(8,14,20,.8)';rr(x,mx,my,mw,mh,6);x.fill();const fx=v=>mx+6+(v+10)/120*(mw-12),fy=v=>my+6+v/68*(mh-12);
  x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=1;x.strokeRect(fx(-10),fy(0),fx(110)-fx(-10),fy(68)-fy(0));x.beginPath();x.moveTo(fx(0),fy(0));x.lineTo(fx(0),fy(68));x.moveTo(fx(100),fy(0));x.lineTo(fx(100),fy(68));x.moveTo(fx(50),fy(0));x.lineTo(fx(50),fy(68));x.stroke();
  for(const f of V.F){if(f.team<0)continue;x.fillStyle=KIT[f.team===0?M.h:M.a][0];x.beginPath();x.arc(fx(f.x),fy(f.y),2.2,0,7);x.fill()}if(V.ball){x.fillStyle='#fff';x.beginPath();x.arc(fx(V.ball.x),fy(V.ball.y),2.4,0,7);x.fill()}
  if(paused&&phase==='live'){x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,0,w,h);x.fillStyle='#fff';x.font=`italic 900 22px ${FONT}`;x.textAlign='center';x.fillText('PAUSED · PRICING',w/2,h/2);x.textAlign='left'}}
function statsBoard(x,w,h,title){const st=MT.s.stats,M=MT.M,pos=MT.poss,tp=pos[0]+pos[1]||1,rows=[['Possession',Math.round(100*pos[0]/tp)+'%',Math.round(100*pos[1]/tp)+'%'],['Run metres',Math.round(st[0].metres||0),Math.round(st[1].metres||0)],['Line breaks',st[0].breaks||0,st[1].breaks||0],['Errors',st[0].errors||0,st[1].errors||0],['Penalties won',st[0].penFor||0,st[1].penFor||0],['Tries',st[0].tries||0,st[1].tries||0]];
  const bw=340,bh=58+rows.length*22,bx=w/2-bw/2,by=Math.max(54,h/2-bh/2-20);x.fillStyle='rgba(8,14,20,.93)';rr(x,bx,by,bw,bh,10);x.fill();x.fillStyle='#35f0c8';x.fillRect(bx,by,bw,4);
  x.textAlign='center';x.font=`italic 900 12px ${FONT}`;x.fillStyle='#35f0c8';x.fillText('STACK MARKETS STATS · '+title,w/2,by+18);x.font=`italic 900 16px ${FONT}`;x.fillStyle='#fff';x.fillText(`${M.T[0].short} ${V.shown[0]} - ${V.shown[1]} ${M.T[1].short}`,w/2,by+38);
  rows.forEach((r,k)=>{const y=by+62+k*22;x.font=`700 12px ${FONTB}`;x.fillStyle='#8a9aac';x.fillText(r[0],w/2,y);x.font=`900 13px ${FONTB}`;x.fillStyle='#fff';x.fillText(r[1],bx+44,y);x.fillText(r[2],bx+bw-44,y)});x.textAlign='left'}

  b.innerHTML=cams.map(([k,n])=>`<button data-cam="${k}" class="${V.camMode===k?'on':''}">${n}</button>`).join('')+`<span class="sp"></span>`+(phase==='live'?[1,2,4].map(s=>`<button data-sp="${s}" class="${speed===s?'on':''}">${s}x</button>`).join('')+`<button id="skip">Skip to full time</button>`:'');

    const tabs=[['h2h','Head to head'],['line','Line & total'],['mg','Margin'],['htft','HT / FT'],['fts','First try'],['ats','Anytime try'],['spec','Specials']],m=id=>MT.mk.find(q=>q.id===id),g=MT.k;let body='';

    else if(mkTab==='mg'||mkTab==='htft')body=m(mkTab).sel.map(s=>`<div class="pair">${priceWide(g,mkTab,s)}</div>`).join('');
    else if(mkTab==='fts'||mkTab==='ats'){const sels=m(mkTab).sel;body=[0,1].map(t=>`<h3>${crest(t?M.a:M.h,18)} ${esc(M.T[t].name)}</h3>`+sels.filter(s=>s.pl!=null&&PLAYERS[s.pl].team===(t?M.a:M.h)).sort((a,b)=>(a.price||999)-(b.price||999)).map(s=>{const p=PLAYERS[s.pl];return `<div class="row"><span class="pos">${p.num}</span><span class="nm">${esc(p.name)}<small>${POS[p.num]}</small></span>${priceBtn(g,mkTab,s)}</div>`}).join('')).join('')+(mkTab==='fts'?`<div class="pair">${priceWide(g,'fts',sels[0])}</div>`:'')}

    el.querySelectorAll('#mtabs button').forEach(b=>b.onclick=()=>{mkTab=b.dataset.t;drawPanel(true)});wirePrices(el);return}
  if(phase==='live'){const L=MT.live,open=liveOpen(),tabs=[['lw','Head to head'],['line','Line'],['tot','Total points'],['nts','Next try scorer'],['nsc','Next to score']];
    let rows='';const lm=L&&L.LM.find(m=>m.id===liveTab);

      if(liveTab==='nts'){rows=`<div class="pair">${btn(lm.sel[0])}</div>`+lm.sel.slice(1).filter(s=>s.price).sort((a,b)=>a.price-b.price).slice(0,16).map(s=>`<div class="pair">${btn(s)}</div>`).join('')}
      else rows=`<div class="pair">${lm.sel.map(btn).join('')}</div>`}
    else rows=`<div class="sub">Pricing…</div>`;
    const st=MT.s.stats,pos=MT.poss,tp=pos[0]+pos[1]||1;

      ${[['Possession',Math.round(100*pos[0]/tp)+'%',Math.round(100*pos[1]/tp)+'%'],['Run metres',Math.round(st[0].metres||0),Math.round(st[1].metres||0)],['Line breaks',st[0].breaks||0,st[1].breaks||0],['Errors',st[0].errors||0,st[1].errors||0],['Penalties won',st[0].penFor||0,st[1].penFor||0]].map(r=>`<span class="l">${r[1]}</span><span class="sub">${r[0]}</span><span>${r[2]}</span>`).join('')}</div></div>`;
