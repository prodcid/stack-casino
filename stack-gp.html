/* ================= STACK GP ENGINE =================
   An event simulation run segment by segment: each lap is split at the corner apexes, and
   every time a car enters a segment its time through it is rolled from car + driver pace,
   tyres, fuel, form and dirty air. If that would take it past the car ahead, an overtake is
   resolved there and then (clean pass, side by side, failed attempt or contact). Pit stops,
   safety cars, VSCs, mistakes, failures and rain all live in the same loop. The race you watch

   segment times it produced. Every price is a Monte Carlo of this exact function, priced to 97%. */

/* ---------- track geometry: spline -> 1m samples -> speed profile -> segments ---------- */
function spline(pts,per){const n=pts.length,out=[];const d=(a,b)=>Math.pow(Math.hypot(b[0]-a[0],b[1]-a[1]),.5)||1e-4;
  for(let i=0;i<n;i++){const P0=pts[(i-1+n)%n],P1=pts[i],P2=pts[(i+1)%n],P3=pts[(i+2)%n],t0=0,t1=d(P0,P1),t2=t1+d(P1,P2),t3=t2+d(P2,P3);
    for(let s=0;s<per;s++){const t=t1+(t2-t1)*s/per,o=[0,0];
      for(let q=0;q<2;q++){const A1=((t1-t)*P0[q]+(t-t0)*P1[q])/(t1-t0),A2=((t2-t)*P1[q]+(t-t1)*P2[q])/(t2-t1),A3=((t3-t)*P2[q]+(t-t2)*P3[q])/(t3-t2),
        B1=((t2-t)*A1+(t-t0)*A2)/(t2-t0),B2=((t3-t)*A2+(t-t1)*A3)/(t3-t1);o[q]=((t2-t)*B1+(t-t1)*B2)/(t2-t1)}out.push(o)}}
  return out}
const wrapA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const accOf=v=>1.5+16*(1-v/(VMAX*1.06));
function profile(x,y,n){const W=i=>(i%n+n)%n,ang=new Float64Array(n),k0=new Float64Array(n),kap=new Float64Array(n),v=new Float64Array(n);

const THEMES={

 classic:{ground:['#4c9442','#52993f'],tar:'#393c40',runoff:'mix',sand:'#dcc792',decor:'trees',verge:'#468a3c'},
 night:{ground:['#1d3326','#20382a'],water:'#0b2440',tar:'#26282c',runoff:'mix',sand:'#8f835f',decor:'lights',verge:'#1a2e22',night:1},

/* ================= RACE VIEWER =================
   Cars are placed from their recorded segment times: inside a segment the time fraction is
   mapped onto the circuit's speed profile, so cars brake, turn and accelerate naturally and

function invCum(T,tau){const c=T.cumT;let lo=0,hi=T.n;tau=clamp(tau,0,c[T.n]);while(hi-lo>1){const m=(lo+hi)>>1;if(c[m]<=tau)lo=m;else hi=m}return lo+(tau-c[lo])/Math.max(1e-9,c[lo+1]-c[lo])}

/* the whole field for this frame: positions, heading, speed, lateral spacing */
function framePoses(V,t,dt){const T=V.T,n=T.n,W=V.Wd,out=V.P;const N=V.nCars;
  for(let i=0;i<N;i++){const o=rawPose(V,i,t);out[i]=o;if(!o)continue;o.prog=o.lap*n+(o.d||0)}

  for(let q=0;q<ord.length;q++){const i=ord[q],o=out[i],p=trackPt(W,o.d,0);let base=o.latBlend?o.latBlend[0]*(1-ease(o.latBlend[1]))+p.rl*ease(o.latBlend[1]):p.rl;
    if(o.pit===2)base=base*clamp((o.d-T.pit.dOut)/60,0,1)+T.pit.side*(TW/2-1.3)*(1-clamp((o.d-T.pit.dOut)/60,0,1));
    if(o.pit===1&&o.lane==null){const u=clamp((o.d-(T.pit.dIn-50))/50,0,1);base=base*(1-u)+T.pit.side*(TW/2-1)*u}

/* ---------- particles (one fixed pool, reused) ---------- */

  if(V.scDeploy&&t-V.scDeploy<9&&bs<12){best={sc:1,why:'sc'};bs=12}
  for(let q=0;q+1<ord.length&&q<16;q++){const a=ord[q],b=ord[q+1];if(!P[a]||!P[b]||P[a].lane!=null||P[b].lane!=null)continue;const g=V.gap[b]-V.gap[a];if(g>0&&g<.6){const s=10-q*.45+(V.mine&&(V.mine.has(a)||V.mine.has(b))?2:0);if(s>bs){bs=s;best={f:[b,a],why:'battle'}}}}

    if(['win','pod','pts','fl'].includes(mkTab))body=drvList(mkTab);

    else if(mkTab==='team')body=m('team').sel.map(s=>`<div class="row"><i class="chip" style="background:${tcol(s.team)}"></i><span class="nm">${esc(s.name)}<small>${esc(DRIVERS[2*s.team].code)} P${WK.grid.indexOf(2*s.team)+1} · ${esc(DRIVERS[2*s.team+1].code)} P${WK.grid.indexOf(2*s.team+1)+1}</small></span>${priceBtn('team',s)}</div>`).join('');
    else{body=['sc','nf','mg'].map(id=>`<h3>${m(id).name}</h3><div class="pair">${m(id).sel.map(s=>priceBtn(id,s,1)).join('')}</div>`).join('')+`<h3>First retirement</h3>`+m('fr').sel.slice().sort((a,b)=>(a.price||999)-(b.price||999)).slice(0,12).map(s=>`<div class="pair">${priceBtn('fr',s,1)}</div>`).join('')}
    el.innerHTML=`<div class="card"><div class="tabs" id="mtabs">${tabs.map(([k,n])=>`<button data-t="${k}" class="${mkTab===k?'on':''}">${n}</button>`).join('')}</div><div class="sub" style="margin-bottom:8px">Priced from 2,000 simulations of this exact race · returns 97% on average${phase==='start'?' · <b style="color:#ffd400">markets closed</b>':''}</div>${body}</div>`;
    el.querySelectorAll('#mtabs button').forEach(b=>b.onclick=()=>{mkTab=b.dataset.t;drawPanel(true)});if(phase==='grid')wirePrices(el);else el.querySelectorAll('.pr').forEach(b=>b.disabled=true);return}
  if(phase==='race'){const L=WK.live,open=liveOpen(),tabs=[['lw','Winner'],['l3','Top 3'],['np','Next to pit']];
    const px=(mk,id)=>{if(!L)return null;const m=L.LM.find(m=>m.id===mk),s=m&&m.sel.find(s=>s.id===id);return s?s.price:null};
    let rows='';if(liveTab==='np'&&L){rows=L.LM[2].sel.map(s=>{const p=s.price;return `<div class="row"><span class="nm">${esc(s.name)}</span><button class="pr" data-lm="np" data-lid="${s.id}"${open&&p?'':' disabled'}>${p?p.toFixed(2):'—'}</button></div>`}).join('')}
    else rows=V.order.map((i,p)=>{const d=DRIVERS[i],o=V.P[i],out=o&&(o.stop||o.e&&o.e.ty===3&&V.t>=o.e.stop),id=(liveTab==='lw'?'lw':'l3')+i,pr=px(liveTab,id);
      return `<div class="row${V.mine.has(i)?' me':''}"><span class="pos">${p+1}</span><i class="chip" style="background:${tcol(d.team)}"></i><span class="nm"><span class="code">${d.code}</span> ${esc(d.name)}<small>${out?'<span class="dn">Retired</span>':p?'+'+V.gap[i].toFixed(1)+'s':'Leader'}</small></span>${tyreH(o&&o.tyre!=null?o.tyre:0)}<button class="pr" data-lm="${liveTab}" data-lid="${id}"${open&&pr&&!out?'':' disabled'}>${pr&&!out?'Back '+pr.toFixed(2):'—'}</button></div>`}).join('');
    el.innerHTML=`<div class="card"><div class="tabs" id="ltabs">${tabs.map(([k,n])=>`<button data-t="${k}" class="${liveTab===k?'on':''}">${n}</button>`).join('')}</div><div class="sub" style="margin-bottom:8px">${WK.done?'Race over.':open?'Live · tap a price to pause and reprice from this exact moment':'<b style="color:#ffd400">Suspended</b>'+(V.flag==='SC'||V.flag==='VSC'?' under the safety car':' on the final lap')}</div>${rows}</div>`;
    el.querySelectorAll('#ltabs button').forEach(b=>b.onclick=()=>{liveTab=b.dataset.t;drawPanel(true)});el.querySelectorAll('[data-lm]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();liveTap(b.dataset.lm,b.dataset.lid)});return}
  if(phase==='result'){if(!force)return;const st=WK.st,o=WK.out,w=st.cars[o.o[0]].fin;
    const rows=o.o.map((i,p)=>{const c=st.cars[i],d=DRIVERS[i],fin=p<o.nf,g=p===0?fmtT(c.fin):fin?(c.lap<WK.W.N?`+${WK.W.N-c.lap} lap`:'+'+(c.fin-w).toFixed(3)+'s'):'DNF';
      return `<tr class="${V.mine.has(i)?'me':''}"><td>${fin?p+1:'—'}</td><td><i class="chip" style="background:${tcol(d.team)};display:inline-block;height:14px;vertical-align:-2px;margin-right:6px"></i>${flagH(d.nat)}${esc(d.name)}${o.fl===i?' <span style="color:#b56cff">⏱</span>':''}</td><td class="sub">${esc(TEAMS[d.team].short)}</td><td class="r">${g}</td><td class="r">${c.stops}</td><td class="r"><b>${fin&&p<10?'+'+POINTS[p]:''}</b></td></tr>`}).join('');
    const fl=o.fl>=0?`${esc(DRIVERS[o.fl].name)} · ${fmtT(st.fl.t)}`:'—';
    el.innerHTML=`<div class="card"><h2>Classification</h2><div class="sub" style="margin-bottom:6px">Winning margin ${o.m<90?o.m.toFixed(3)+'s':'—'} · fastest lap ${fl} · ${o.nf} classified · safety car: ${o.sc?'yes':'no'}</div>
     <table class="cls"><tr><th>Pos</th><th>Driver</th><th>Team</th><th class="r">Time</th><th class="r">Stops</th><th class="r">Pts</th></tr>${rows}</table></div>
     <div class="card" style="margin-top:12px"><h2>Championship</h2><div class="hub"><div>${standingsH('drv',10)}</div><div>${standingsH('team')}</div></div></div>`;return}}
function drawSide(){const el=$('side');if(!WK)return;
  if(phase==='quali'){el.innerHTML=`<h3>Qualifying</h3><div class="sub">One flying lap each on fresh softs. Sector times: <b style="color:#b56cff">purple</b> fastest overall, <b style="color:#00e701">green</b> within a tenth, <b style="color:#ffd400">yellow</b> slower.</div>`+(bets.length?`<h3>Your bets</h3>`+bets.map(betRow).join(''):'');return}
  if(phase==='grid'){el.innerHTML=`<button class="btn red big" id="lo">Lights out</button><div class="sub">Pre-race markets close at lights out.</div><div id="gslip"></div>`;$('lo').onclick=lightsOut;drawSlip($('gslip'));return}
  if(phase==='start'||phase==='race'){const pend=bets.filter(b=>!b.settled);el.innerHTML=`<h3>Your bets</h3>`+(bets.length?bets.map(betRow).join(''):`<div class="sub">No bets on this race. Tap a live price to back a driver from here.</div>`)+
     (pend.length&&phase==='race'?`<div class="sub" id="ifnow"></div>`:'');if(phase==='race'&&pend.length)ifNow();return}
  if(phase==='result'){const net=WK.net||0;el.innerHTML=`<h3>Your bets</h3>`+(bets.length?bets.map(betRow).join('')+`<div class="net ${net>=0?'up':'dn'}" style="text-align:center;font-weight:900;font-size:18px;padding:6px">${net>=0?'+':''}${money(net)}</div>`:`<div class="sub">No bets this round.</div>`)+
     `<button class="btn go big" id="ngp">${S.season.round>=ROUNDS?'Season finale':'Next GP'}</button>`;$('ngp').onclick=nextGP}}
function ifNow(){const el=$('ifnow');if(!el)return;const P=V.P;let tot=0;const o={o:V.order,nf:V.order.filter(i=>P[i]&&!(P[i].stop)).length,fl:WK.st.fl.i,sc:WK.st.sc.count>0,m:1,fr:WK.st.dnfs[0]??-1,pit:[]};
  for(const b of bets){if(b.settled||b.mk==='pole')continue;try{let ok=false;if(b.live){const m=liveMarkets(b.top5).find(m=>m.id===b.mk);if(b.mk!=='np')ok=m.sel.find(x=>x.id===b.id).test(o)}else{const m=WK.M.find(m=>m.id===b.mk);if(['win','pod','pts','h2h','team'].includes(b.mk))ok=m.sel.find(x=>x.id===b.id).test(o)}if(ok)tot+=b.stake*b.price}catch(e){}}
  el.innerHTML=`If it finished now: <b style="color:#00e701">${money(tot)}</b>`}
setInterval(()=>{if(phase==='race')ifNow()},500);

$('topup').onclick=()=>{A.init();credit(1000);toast('Topped up','+$1,000.00','good')};
if(BR)$('topup').style.display='none';
window.StackFrame={refresh:()=>drawBal()};
$('mute').onclick=()=>{S.mute=!S.mute;save();$('mute').textContent=S.mute?'🔇':'🔊';A.init();A.mute(S.mute)};$('mute').textContent=S.mute?'🔇':'🔊';
$('hist').onclick=()=>{const h=S.hist,net=h.reduce((a,b)=>a+b.ret-b.stake,0);modal(`<h2>Bet history</h2><div class="sub">Last ${h.length} bets · net <b class="${net>=0?'up':'dn'}">${net>=0?'+':''}${money(net)}</b></div><div class="hl">${h.map(b=>`<div><span>${esc(b.name)}<br><small class="sub">${esc(b.m)} · ${esc(b.gp)} · ${money(b.stake)} @ ${b.price.toFixed(2)}</small></span><b class="${b.ret>0?'up':'dn'}">${b.ret>0?'+'+money(b.ret):'-'+money(b.stake)}</b></div>`).join('')||'<div class="sub">No bets yet.</div>'}</div><button class="btn" data-x>Close</button>`)};
$('howb').onclick=()=>modal(`<h2>How Stack GP works</h2><div class="help">
 <p><b>The weekend.</b> Six rounds a season. Each round: bet on pole, watch qualifying (one flying lap each), then bet on the race and watch it live. Points go 25-18-15-12-10-8-6-4-2-1.</p>
 <p><b>Tyres.</b> Softs are fastest but wear out quickest, hards last longest. Grip fades as a tyre ages and falls off a cliff when it's spent. Every car must use two dry compounds, so everyone stops at least once. Inters are for the rain.</p>
 <p><b>DRS.</b> Within a second of the car ahead at the detection line, a driver can open the rear wing flap on the DRS straight for more speed and a much better chance to pass.</p>
 <p><b>Dirty air.</b> Following closely costs grip in the corners and eats the tyres, so passing is never free.</p>
 <p><b>Safety car.</b> A crash can bring out the Stack safety car. The field bunches up behind it and pit stops become cheap. A virtual safety car slows everyone without bunching them.</p>
 <p><b>The odds.</b> The race is one simulation, run corner to corner. Every price is 97% of the fair price from running that exact same simulation thousands of times from the current state (2,000 before the race, 300 when you bet live). Long shots are priced a little shorter than that, and nothing is ever rigged. Tapping a live price pauses the race and reprices it from that moment, so you never get a stale price.</p>
 <p><b>Live markets</b> are suspended on the final lap and under the safety car.</p></div><button class="btn" data-x>Got it</button>`,true);
buildArt();drawBal();startWeekend();requestAnimationFrame(frame);
