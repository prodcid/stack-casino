<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stack — Mates Casino</title>
<style>
:root{--bg:#0f212e;--panel:#1a2c38;--line:#2c4353;--green:#00e701;--mute:#8aa3b4;--dim:#5b7488}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:#fff;font:600 15px/1.5 Outfit,system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}
.card{width:min(94vw,400px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center;display:flex;flex-direction:column;gap:14px}
.logo{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:800;font-size:24px}
.logo svg{width:32px;height:32px}
.msg{color:var(--mute);font-size:14px;min-height:22px}
.bar{height:6px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;width:35%;border-radius:99px;background:var(--green);animation:sl 1.1s ease-in-out infinite}
@keyframes sl{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
.err{color:#ff7a8a;font-size:13px}
button{background:var(--green);color:#03291a;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:800;cursor:pointer}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.tiny{color:var(--dim);font-size:11.5px;line-height:1.5}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo"><svg viewBox="0 0 32 32"><path d="M16 2 29 9v14L16 30 3 23V9z" fill="#00e701"/><path d="M11 12h10M11 16h10M11 20h10" stroke="#0f212e" stroke-width="2.6" stroke-linecap="round"/></svg><span>Stack</span></div>
  <div class="msg" id="msg">Starting…</div>
  <div class="bar" id="bar"><i></i></div>
  <div id="acts"></div>
  <div class="tiny" id="tiny">Keep this file. It pulls the latest build each time you open it, and still works offline once it has one.</div>
</div>
<script>
/* ===================================================================
   Stack launcher — the one file you send your mate.
   It fetches the newest build, caches it locally, and runs it.
   Offline or GitHub down? It runs the last build it cached.
   Edit SRC below if the repo ever moves. Nothing else needs changing.
   =================================================================== */
var SRC = {
  // Set by ship.js setup. "USER" and "REPO" must match your GitHub repo.
  user:   'prodcid',
  repo:   'stack-casino',
  branch: 'main'
};

var CACHE_HTML = 'stack-launcher-build';
var CACHE_VER  = 'stack-launcher-version';

var msg = document.getElementById('msg'),
    bar = document.getElementById('bar'),
    acts = document.getElementById('acts'),
    tiny = document.getElementById('tiny');

function say(t){ msg.textContent = t; }
function stop(){ bar.style.display = 'none'; }
function store(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function put(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }

function urls(path){
  var bust = 't=' + Date.now();
  return [
    'https://raw.githubusercontent.com/' + SRC.user + '/' + SRC.repo + '/' + SRC.branch + '/dist/' + path + '?' + bust,
    'https://cdn.jsdelivr.net/gh/' + SRC.user + '/' + SRC.repo + '@' + SRC.branch + '/dist/' + path
  ];
}

/* Try each mirror in turn; resolve with the first body that comes back. */
function grab(path){
  var list = urls(path), i = 0;
  return new Promise(function(resolve, reject){
    (function next(){
      if (i >= list.length) return reject(new Error('all mirrors failed'));
      fetch(list[i++], { cache: 'no-store' })
        .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(resolve)
        .catch(next);
    })();
  });
}

function boot(html, version){
  // Same origin as this launcher, so the game's saved accounts and wallets
  // survive every update.
  document.open();
  document.write(html);
  document.close();
  try { console.log('Stack build ' + version); } catch(e){}
}

function offerCached(note){
  var cached = store(CACHE_HTML);
  stop();
  if (cached){
    say('Running your last saved build');
    tiny.innerHTML = '<span class="err">' + note + '</span>';
    setTimeout(function(){ boot(cached, store(CACHE_VER) || 'cached'); }, 700);
  } else {
    say('Could not download the game');
    tiny.innerHTML = '<span class="err">' + note + '</span><br><br>' +
      'No saved copy on this device yet, so the first run needs internet. ' +
      'Check your connection and try again.';
    acts.innerHTML = '<button onclick="location.reload()">Try again</button>';
  }
}

function start(){
  if (SRC.user === 'USER'){
    stop();
    say('Launcher not configured yet');
    tiny.innerHTML = 'Run <b>node ship.js setup</b> in the Stack Casino folder to point this file at your repo.';
    return;
  }

  var have = store(CACHE_VER);
  say(have ? 'Checking for updates…' : 'Downloading the latest build…');

  grab('version.json').then(function(txt){
    var v = JSON.parse(txt);

    if (have && have === v.version && store(CACHE_HTML)){
      say('Up to date — build ' + v.version);
      return boot(store(CACHE_HTML), v.version);
    }

    say(have ? 'New build ' + v.version + ' — updating…' : 'Downloading build ' + v.version + '…');
    return grab('stack-casino.html').then(function(html){
      if (html.length < 10000) throw new Error('build looks truncated');
      put(CACHE_HTML, html);
      put(CACHE_VER, v.version);
      boot(html, v.version);
    });
  }).catch(function(e){
    offerCached('Update check failed (' + e.message + ').');
  });
}

start();
</script>
</body>
</html>
