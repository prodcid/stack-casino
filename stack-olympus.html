<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olympus Storm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a1c;--gold:#ffd766;--gold2:#c8901a;--sky:#2a5aff;--txt:#f2f4ff;--mute:#aab4d8;--line:#34407a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.35 "Outfit","Segoe UI",Arial,sans-serif;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0}
#cv,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:30}
#bar{height:92px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;background:linear-gradient(180deg,#141c44,#070a1c);border-top:2px solid #6a5a2a;box-shadow:0 -1px 0 #ffd76633 inset;position:relative;z-index:20}
.bx{display:flex;flex-direction:column;justify-content:center;background:#050716;border:1px solid var(--line);border-radius:12px;padding:6px 14px;min-width:150px;height:60px}
.bx small{font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:800}
.bx b{font-size:20px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
#bal.fu{animation:fu .7s}#bal.fd{animation:fd .5s}
@keyframes fu{0%{color:#7dff8a;transform:scale(1.08)}100%{color:#fff}}@keyframes fd{0%{color:#ff9a8a}100%{color:#fff}}
.ib{width:46px;height:46px;border-radius:12px;background:#10163a;border:1px solid var(--line);display:grid;place-items:center;transition:.15s}
.ib:hover{background:#1a2456;border-color:var(--gold2)}.ib.off{opacity:.45}.ib svg{width:22px;height:22px;fill:var(--gold)}
#betbox{display:flex;align-items:center;gap:8px}#betbox .bx{min-width:130px;align-items:center}
.pm{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c0,#c8901a 60%,#6a4a00);color:#2a1a00;font-weight:900;font-size:24px;line-height:1;box-shadow:0 3px 0 #4a3400,0 0 0 2px #2a1a00}
.pm:active{transform:translateY(2px)}.pm:disabled{filter:grayscale(1);opacity:.5}
#spinbtn{width:84px;height:84px;margin-top:-26px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#8ac8ff,#2a5aff 55%,#0a1a6a);box-shadow:0 0 0 4px #ffd766,0 0 0 7px #3a3a6a,0 6px 18px #000,0 0 30px #4a8aff88;display:grid;place-items:center;transition:transform .1s}
#spinbtn:hover{box-shadow:0 0 0 4px #fff3c0,0 0 0 7px #3a3a6a,0 6px 18px #000,0 0 44px #6aaaffcc}#spinbtn:active{transform:scale(.95)}
#spinbtn svg{width:40px;height:40px;fill:#fff;filter:drop-shadow(0 2px 2px #0008)}#spinbtn.busy svg{animation:rot .6s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.tog{height:46px;padding:0 12px;border-radius:12px;background:#10163a;border:1px solid var(--line);font-weight:900;letter-spacing:.08em;font-size:12px;color:var(--mute)}
.tog.on{color:#1a1200;background:linear-gradient(#fff0a8,#c8901a);border-color:#fff3c0}.tog:hover{border-color:var(--gold2)}
#buyBtn{height:60px;padding:0 16px;border-radius:14px;font-weight:900;letter-spacing:.06em;background:linear-gradient(#ffe58a,#c8901a);color:#1a1000;box-shadow:0 4px 0 #6a4a00,0 0 18px #ffd76655;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
#buyBtn small{font-size:11px;letter-spacing:.12em}#buyBtn:disabled{filter:grayscale(1);opacity:.5}
#topup{height:32px;padding:0 10px;border-radius:8px;background:#1fb07a;color:#032a1a;font-weight:900;font-size:12px}
.sp{flex:1}#winbx b{color:var(--gold)}
.ov{position:absolute;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(10,14,50,.72),rgba(0,0,8,.9));backdrop-filter:blur(2px)}
.ov.on{display:flex;animation:ovIn .35s ease-out}@keyframes ovIn{from{opacity:0}to{opacity:1}}
.panel{background:linear-gradient(180deg,#141c48,#080c24);border:2px solid #c8a040;border-radius:22px;box-shadow:0 0 0 6px #1a1a3a,0 20px 60px #000,0 0 60px #4a8aff22 inset;padding:26px 30px;max-width:94vw;max-height:94%;overflow:auto;position:relative}
.ttl{font-family:"Cinzel",Georgia,serif;font-weight:900;text-align:center;letter-spacing:.06em;background:linear-gradient(#fffbe0,#ffd766 40%,#c8901a 60%,#fff0a8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a2a00) drop-shadow(0 0 16px #8ac8ff88)}
.sub{color:var(--mute);text-align:center}
.gbtn{padding:14px 26px;border-radius:14px;font-weight:900;letter-spacing:.08em;font-size:16px;background:linear-gradient(#ffe58a,#c8901a);color:#1a1000;box-shadow:0 4px 0 #6a4a00,0 0 20px #ffd76655}
.gbtn:hover{filter:brightness(1.1)}.gbtn:active{transform:translateY(3px)}.gbtn.ghost{background:#141c48;color:var(--gold);border:1px solid #4a4a7a;box-shadow:none}
#big{background:radial-gradient(circle,rgba(20,30,90,.5),rgba(0,0,10,.86));flex-direction:column;cursor:pointer}
#bigT{font-size:min(120px,13vw);line-height:1;animation:bigIn .6s cubic-bezier(.3,1.6,.5,1)}
#bigV{font:900 min(84px,9vw) "Outfit";color:#fff;text-shadow:0 4px 0 #3a2a00,0 0 30px #6aaaff;margin-top:10px;font-variant-numeric:tabular-nums}
@keyframes bigIn{from{transform:scale(.2) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
#banner{position:absolute;left:0;right:0;top:34%;z-index:26;display:none;flex-direction:column;align-items:center;pointer-events:none}
#banner.on{display:flex}#banner .ttl{font-size:min(92px,10vw);animation:bigIn .6s cubic-bezier(.3,1.6,.5,1)}#banner .sub{font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 6px #000}
#info .panel{width:min(1000px,94vw)}#info h2{margin:18px 0 8px;font:900 22px "Cinzel",Georgia,serif;color:var(--gold)}#info p{color:#dde4ff;margin:6px 0}
.ptab{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pr{display:flex;align-items:center;gap:10px;background:#050716;border:1px solid var(--line);border-radius:12px;padding:8px}.pr canvas{width:64px;height:64px;flex:none}.pr div{font-size:13px;line-height:1.5}.pr b{color:var(--gold)}
.odds{display:grid;grid-template-columns:1fr auto;gap:4px 18px;max-width:560px}.odds span:nth-child(2n){text-align:right;font-weight:900;color:#fff}
.x{position:absolute;right:14px;top:10px;font-size:26px;color:var(--mute)}.x:hover{color:#fff}
#autoPop{position:absolute;bottom:100px;z-index:24;display:none;background:#0c1030;border:1px solid #c8a040;border-radius:14px;padding:12px;gap:8px;flex-direction:column;box-shadow:0 10px 30px #000}
#autoPop.on{display:flex}#autoPop .r{display:flex;gap:6px}#autoPop button.n{width:52px;height:40px;border-radius:10px;background:#141c48;border:1px solid #4a4a7a;font-weight:900}#autoPop button.n:hover{border-color:var(--gold)}
#autoPop label{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:40;background:#141c48;border:1px solid #c8a040;border-radius:10px;padding:10px 16px;font-weight:800;display:none}#toast.on{display:block;animation:ovIn .2s}
</style></head><body>
<div id="app">
 <div id="stage"><canvas id="cv"></canvas><canvas id="fx"></canvas>
  <div id="banner"><div class="ttl" id="banT"></div><div class="sub" id="banS"></div></div>
  <div class="ov" id="buyOv"><div class="panel" style="width:520px;text-align:center"><div class="ttl" style="font-size:40px">BUY FREE SPINS</div>
   <p class="sub" id="buyTxt"></p><div style="display:flex;gap:12px;justify-content:center;margin-top:16px"><button class="gbtn ghost" id="buyNo">CANCEL</button><button class="gbtn" id="buyYes">BUY</button></div></div></div>
  <div class="ov" id="big"><div class="ttl" id="bigT">BIG WIN</div><div id="bigV">$0.00</div><div class="sub" style="margin-top:18px">click to continue</div></div>
  <div class="ov" id="info"><div class="panel"><button class="x" data-close="info">×</button><div class="ttl" style="font-size:40px">OLYMPUS STORM</div><div id="infoBody"></div></div></div>
  <div id="autoPop"><div class="sub" style="text-align:left;font-weight:800">AUTOPLAY</div><div class="r"><button class="n" data-a="10">10</button><button class="n" data-a="25">25</button><button class="n" data-a="50">50</button><button class="n" data-a="100">100</button><button class="n" data-a="1000">∞</button></div><label><input type="checkbox" id="autoFeat" checked> stop when free spins land</label></div>
  <div id="toast"></div>
 </div>
 <div id="bar">
  <button class="ib" id="infoBtn" title="Paytable and odds"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg></button>
  <button class="ib" id="sndBtn" title="Sound"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
  <button class="ib" id="musBtn" title="Music"><svg viewBox="0 0 24 24"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3z"/></svg></button>
  <div class="bx"><small>BALANCE</small><b id="bal">$0.00</b></div><button id="topup">Top up</button>
  <button id="buyBtn"><small>BUY FREE SPINS</small><span id="buyV">$115.00</span></button>
  <div class="sp"></div>
  <div id="betbox"><button class="pm" id="betDn">−</button><div class="bx"><small>BET</small><b id="betV">$1.00</b></div><button class="pm" id="betUp">+</button></div>
  <button class="tog" id="autoBtn">AUTO</button>
  <button id="spinbtn" title="Spin (space)"><svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
  <button class="tog" id="turboBtn">TURBO</button>
  <div class="sp"></div>
  <div class="bx" id="winbx"><small>WIN</small><b id="winV">$0.00</b></div>
 </div>
</div>
<script>
/*==CORE==*/
/* ================= OLYMPUS STORM: THE MATHS =================
   DOM-free (test-olympus.js evals this slice in Node). Amounts are multiples of the bet.
   6 x 5 grid, scatter pays: 8 or more of a symbol ANYWHERE pay. Winners are removed, the
   rest fall, new symbols drop in from the top ("tumble") until nothing pays. Every cell is an
   independent draw from the published weights (W / WF), so nothing is placed to look close.
   Multiplier orbs stay on the board through a tumble sequence; if the sequence paid, all orbs
   on the board add together and multiply it. In free spins they add to a running total
   multiplier instead, which applies to every later paying sequence. */
const COLS=6,ROWS=5,NCELL=COLS*ROWS;
const BLUE=0,GREEN=1,YELLOW=2,PURPLE=3,RED=4,CHAL=5,RING=6,HOUR=7,CROWN=8,SCAT=9,ORB=10;
const SYMN=['Sapphire','Emerald','Topaz','Amethyst','Ruby','Chalice','Ring','Hourglass','Crown','Thunder Seal','Multiplier Orb'];
/* pays x bet for 8-9 / 10-11 / 12+ of a kind */
const PAY=[[0.4,1.2,3.2],[0.64,1.44,6.4],[0.8,1.6,8.0],[1.28,1.92,12.8],[1.6,2.4,16.0],[2.4,3.2,19.2],[3.2,8.0,24.0],[4.0,16.0,40.0],[16.0,40.0,80.0]];
const SCAT_PAY={4:3,5:5,6:100};
/* weights per cell: base game and free spins */
const W =[260,240,210,190,170,140,120,95,70,27,5.5];
const WF=[260,240,210,190,170,140,120,95,70,22,55];
const ORBV=[[2,300],[3,220],[4,160],[5,120],[6,80],[8,60],[10,50],[12,30],[15,25],[20,16],[25,10],[50,4],[100,1.3],[250,.35],[500,.12]];
const ORBW=ORBV.reduce((a,o)=>a+o[1],0);
const MAXWIN=5000,FS_N=15,FS_RE=5,BUY_X=115;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let UID=1;
function pickSym(R,w){const tot=w.reduce((a,b)=>a+b,0);let v=R()*tot;for(let s=0;s<w.length;s++){if((v-=w[s])<0)return s}return 0}
function orbVal(R){let v=R()*ORBW;for(const[x,w]of ORBV){if((v-=w)<0)return x}return 2}
function mkCell(R,w,noScat){let s=pickSym(R,w);if(noScat&&s===SCAT)s=pickSym(R,w.map((x,i)=>i===SCAT?0:x));const c={id:UID++,s};if(s===ORB)c.v=orbVal(R);return c}
/* board = COLS columns, each an array of ROWS cells, index 0 = top */
function fillBoard(R,w,forceScat){const b=[];for(let c=0;c<COLS;c++){const col=[];for(let r=0;r<ROWS;r++)col.push(mkCell(R,w));b.push(col)}
  if(forceScat){ // bought bonus: exactly `forceScat` scatters in distinct random cells, everything else a normal draw
    for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)if(b[c][r].s===SCAT)b[c][r]=mkCell(R,w,true);
    const cells=[...Array(NCELL).keys()];for(let i=cells.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}
    for(const k of cells.slice(0,forceScat)){const c=Math.floor(k/ROWS),r=k%ROWS;b[c][r]={id:UID++,s:SCAT}}}
  return b}
const tierOf=n=>n>=12?2:n>=10?1:0;
function findWins(b){const cnt={};for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){const s=b[c][r].s;if(s<SCAT)(cnt[s]=cnt[s]||[]).push(c*ROWS+r)}
  const wins=[];for(const s in cnt)if(cnt[s].length>=8)wins.push({s:+s,cells:cnt[s],n:cnt[s].length,pay:PAY[s][tierOf(cnt[s].length)]});return wins}
const snap=b=>b.map(col=>col.map(x=>Object.assign({},x)));
const countOf=(b,s)=>{let n=0;for(const col of b)for(const x of col)if(x.s===s)n++;return n};
/* play one tumble sequence from a filled board. Returns every step for the show. */
function tumble(R,b,w){const steps=[];let win=0;
  for(let guard=0;guard<60;guard++){const wins=findWins(b);if(!wins.length)break;
    const kill=new Set();let pay=0;for(const x of wins){pay+=x.pay;x.cells.forEach(k=>kill.add(k))}win+=pay;
    const drops=[];
    for(let c=0;c<COLS;c++){const keep=b[c].filter((x,r)=>!kill.has(c*ROWS+r)),add=[];while(keep.length+add.length<ROWS)add.push(mkCell(R,w));b[c]=add.concat(keep);drops.push(add.length)}
    steps.push({wins,pay,board:snap(b),drops})}
  return{steps,win}}
const orbSum=b=>{let t=0;for(const col of b)for(const x of col)if(x.s===ORB)t+=x.v;return t};
/* one base-game spin, fully resolved (free spins are played separately) */
function spinBase(R){R=R||Math.random;const b=fillBoard(R,W),start=snap(b),t=tumble(R,b,W);
  const orbs=orbSum(b),mult=t.win>0&&orbs>0?orbs:1,sc=countOf(b,SCAT),scat=sc>=4?SCAT_PAY[Math.min(6,sc)]:0;
  const win=Math.min(MAXWIN,t.win*mult+scat);
  return{start,steps:t.steps,end:snap(b),tw:t.win,orbs,mult,sc,scat,fs:sc>=4,win}}
/* one free spin: `acc` is the running total multiplier before this spin */
function spinFree(R,acc){R=R||Math.random;const b=fillBoard(R,WF),start=snap(b),t=tumble(R,b,WF);
  const orbs=orbSum(b),add=t.win>0?orbs:0,nacc=acc+add,mult=t.win>0?Math.max(1,nacc):1,sc=countOf(b,SCAT);
  return{start,steps:t.steps,end:snap(b),tw:t.win,orbs,add,acc:nacc,mult,sc,retrig:sc>=3?FS_RE:0,win:t.win*mult}}
/* the bought spin: a normal board except it holds exactly 4 scatters, so it always starts the free spins */
function spinBuy(R){R=R||Math.random;const b=fillBoard(R,W,4),start=snap(b),t=tumble(R,b,W);
  const orbs=orbSum(b),mult=t.win>0&&orbs>0?orbs:1,sc=countOf(b,SCAT),scat=sc>=4?SCAT_PAY[Math.min(6,sc)]:0;
  return{start,steps:t.steps,end:snap(b),tw:t.win,orbs,mult,sc,scat,fs:sc>=4,win:Math.min(MAXWIN,t.win*mult+scat),buy:1}}
function playFree(R){let n=FS_N,acc=0,tot=0,i=0;while(n>0&&i<200){n--;i++;const f=spinFree(R,acc);acc=f.acc;tot+=f.win;n+=f.retrig;if(tot>=MAXWIN){tot=MAXWIN;break}}return{tot,spins:i,acc}}
function playRound(R,buy){R=R||Math.random;const b=buy?spinBuy(R):spinBase(R);let tot=b.win,fs=0;
  if(b.fs){fs=playFree(R).tot;tot=Math.min(MAXWIN,tot+fs)}
  return{base:b.tw*b.mult,scat:b.scat,fs,tot,trig:b.fs,tumbles:b.steps.length,orb:b.orbs>0}}
if(typeof module!=='undefined')module.exports={COLS,ROWS,NCELL,BLUE,GREEN,YELLOW,PURPLE,RED,CHAL,RING,HOUR,CROWN,SCAT,ORB,SYMN,PAY,SCAT_PAY,W,WF,ORBV,MAXWIN,FS_N,FS_RE,BUY_X,
  mulberry,fillBoard,findWins,tumble,spinBase,spinFree,spinBuy,playFree,playRound,countOf,orbSum};
/*==END CORE==*/
/* ================= SOUND (building blocks shared with Dragon Stacks) =================
   All synthesised, no files. Master -> compressor -> out, with a generated reverb send.
   Building blocks: osc (pitched voice with pitch + filter envelopes), nz (filtered noise),
   pluck (Karplus-Strong string: the harp), bell (FM), gong (inharmonic partials), taiko.
   Every visible thing has its own sound; the music is generated live on a pentatonic scale
   and changes mood for free games, Hold & Spin and big wins. */
const AU={C:null,out:null,sfx:null,mus:null,rev:null,nb:null,ks:{},mode:'base',nextT:0,step:0,timer:null,loops:new Set()};
function auInit(){if(AU.C){if(AU.C.state==='suspended')AU.C.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const C=new AC();AU.C=C;
  const comp=C.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.2;comp.connect(C.destination);
  AU.out=C.createGain();AU.out.gain.value=S.mute?0:.85;AU.out.connect(comp);
  AU.sfx=C.createGain();AU.sfx.gain.value=1;AU.sfx.connect(AU.out);
  AU.mus=C.createGain();AU.mus.gain.value=S.music?.3:0;AU.mus.connect(AU.out);
  const len=Math.floor(C.sampleRate*2.6),b=C.createBuffer(2,len,C.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)}
  AU.rev=C.createConvolver();AU.rev.buffer=b;const rg=C.createGain();rg.gain.value=.32;AU.rev.connect(rg);rg.connect(AU.out);
  const nl=C.sampleRate*2,nb=C.createBuffer(1,nl,C.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nl;i++)nd[i]=Math.random()*2-1;AU.nb=nb;
  musStart()}
const now=()=>AU.C?AU.C.currentTime:0;
function auMute(m){S.mute=m;if(AU.out)AU.out.gain.setTargetAtTime(m?0:.85,now(),.05)}
function auMusic(m){S.music=m;if(AU.mus)AU.mus.gain.setTargetAtTime(m?.3:0,now(),.2)}
/* a pitched voice */
function osc({f=440,f2,type='sine',t=0,d=.3,v=.2,a=.004,dest,rev=0,lp,lp2,q=1,det=0,pd}={}){if(!AU.C)return;const C=AU.C,T=now()+t;
  const o=C.createOscillator(),g=C.createGain();o.type=type;o.frequency.setValueAtTime(f,T);if(det)o.detune.value=det;
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),T+(pd||d));
  g.gain.setValueAtTime(0,T);g.gain.linearRampToValueAtTime(v,T+a);g.gain.exponentialRampToValueAtTime(.0008,T+d);
  let n=o;if(lp){const fl=C.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(lp,T);fl.Q.value=q;if(lp2)fl.frequency.exponentialRampToValueAtTime(lp2,T+d);o.connect(fl);n=fl}
  n.connect(g);g.connect(dest||AU.sfx);if(rev){const r=C.createGain();r.gain.value=rev;g.connect(r);r.connect(AU.rev)}
  o.start(T);o.stop(T+d+.05);return o}
/* filtered noise */
function nz({t=0,d=.2,v=.2,type='bandpass',f=1000,f2,q=1,a=.003,dest,rev=0,rate=1}={}){if(!AU.C)return;const C=AU.C,T=now()+t;

/* ---------- generated music ----------
   Harp arpeggios over a string pad and timpani. base: calm heavenly; fs: storm, faster, drums;
   big: triumphant brass. Chord progression i - VI - III - VII in D minor. */
const MUS={base:{bpm:76,arp:.6,drum:0,pad:.5},fs:{bpm:100,arp:.85,drum:1,pad:.65},big:{bpm:120,arp:1,drum:2,pad:.7}};
const PROG=[[0,2,4],[5,7,9],[2,4,6],[6,8,10]];
let padV=null;
function musMode(m){if(AU.mode===m)return;AU.mode=m;padSet()}
function musStart(){AU.mode=AU.mode||'base';AU.nextT=now()+.2;AU.timer=setInterval(musTick,60);padSet()}

  while(AU.nextT<now()+.25){const t=AU.nextT-now(),st=AU.step++,bar=st%32,ch=PROG[Math.floor(st/32)%4];
    if(bar===0&&st>0)padSet();
    if(Math.random()<M.arp){const d=ch[st%3]+7*(1+Math.floor((st%8)/3));pluck(sc(d),t,.1,{dest:AU.mus,rev:.5,d:2,pan:(st%2?.3:-.3)})}

    if(M.drum>=1&&bar%8===0)musTimp(t,.25);if(M.drum>=1&&bar%8===6)musTimp(t,.12);

/* ================= ART =================
   All canvas paths, no images. drawSym(x,id,s,t,hl,val) paints a symbol centred on (0,0) in a

function gemShape(id,s){const r=s*.4;switch(id){

  case 3:{return[[0,-r*1.02],[r*.96,r*.7],[-r*.96,r*.7]]}                                                            // trillion amethyst
  default:{const p=[];for(let i=0;i<24;i++){const a=i/24*Math.PI*2,hx=16*Math.pow(Math.sin(a),3),hy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));p.push([hx*r/17,hy*r/17+r*.08])}return p}}} // heart ruby
function drawGem(x,id,s,t,hl){const[c1,c2,c3]=GEMC[id],P=gemShape(id,s);let cx=0,cy=0;P.forEach(p=>{cx+=p[0];cy+=p[1]});cx/=P.length;cy/=P.length;
  x.save();x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=s*.07;x.shadowOffsetY=s*.03;x.fillStyle=c3;x.beginPath();P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fill();x.restore();

/* ================= BUY ================= */
function openBuy(){if(busy)return;auInit();SFX.buyOpen();const p=r2(BUY_X*BET());$('buyTxt').innerHTML=`Pay <b style="color:#ffd766">${money(p)}</b> (${BUY_X}× your ${money(BET())} bet) for a spin that always lands 4 scatters and starts the ${FS_N} free spins.<br><br>Priced so the bonus returns about 97%, the same as spinning for it.`;$('buyOv').classList.add('on')}
$('buyBtn').onclick=openBuy;$('buyNo').onclick=()=>{SFX.click();$('buyOv').classList.remove('on')};$('buyYes').onclick=()=>{$('buyOv').classList.remove('on');auto=0;updAuto();round(true)};
/* ================= INFO ================= */
function openInfo(){SFX.click();const bet=BET(),row=(id,txt)=>`<div class="pr"><canvas width="128" height="128" data-s="${id}"></canvas><div><b>${SYMN[id]}</b><br>${txt}</div></div>`;
  const pays=s=>`12+ ${money(PAY[s][2]*bet)}<br>10-11 ${money(PAY[s][1]*bet)}<br>8-9 ${money(PAY[s][0]*bet)}`;
  const tw=W.reduce((a,b)=>a+b,0),pct=i=>(100*W[i]/tw).toFixed(1)+'%';
  $('infoBody').innerHTML=`<p class="sub">8 or more of a symbol anywhere on the 6×5 grid pays. Winners shatter and the rest tumble down; new symbols drop in until nothing more pays. Prices for your ${money(bet)} bet.</p>
  <h2>Symbols</h2><div class="ptab">${[CROWN,HOUR,RING,CHAL,RED,PURPLE,YELLOW,GREEN,BLUE].map(s=>row(s,pays(s))).join('')}
  ${row(SCAT,`4 / 5 / 6 anywhere pay ${money(3*bet)} / ${money(5*bet)} / ${money(100*bet)} and start ${FS_N} free spins. 3 in free spins add ${FS_RE} more.`)}
  ${row(ORB,'Zeus hurls these onto the board: ×2 up to ×500. If the tumble pays, every orb on the board adds up and multiplies it.')}</div>
  <h2>Free spins</h2><p>Orbs land more often. Each one that lands in a paying tumble adds to a total multiplier for the rest of the bonus, and every later win is multiplied by that total. Max win ${MAXWIN.toLocaleString()}× your bet.</p>
  <p><b>Buy free spins</b> for ${BUY_X}× your bet: a spin that always holds exactly 4 scatters. Priced so it returns about 97%.</p>
  <h2>The honest numbers</h2><div class="odds"><span>Return to player (measured, 6M spins)</span><span>97.5%</span><span>Bought bonus return</span><span>about 97%</span><span>Any win</span><span>1 in 3.4</span><span>Free spins</span><span>1 in 355</span><span>Free spins average</span><span>109× bet</span>
  <span>Chance per cell: Crown / Scatter / Orb</span><span>${pct(CROWN)} / ${pct(SCAT)} / ${pct(ORB)}</span></div>
  <p class="sub" style="text-align:left;margin-top:12px">Every cell, and every symbol that tumbles in, is an independent draw from these weights. Columns only slow down with the drum roll when a 4th scatter can still land.</p>
  <h2>Your play</h2><div class="odds"><span>Spins</span><span>${S.stats.spins.toLocaleString()}</span><span>Bet</span><span>${money(S.stats.wag)}</span><span>Won</span><span>${money(S.stats.won)}</span><span>Biggest round</span><span>${money(S.stats.best)}</span><span>Free spins / bought</span><span>${S.stats.fs} / ${S.stats.buys}</span></div>`;
  $('infoBody').querySelectorAll('canvas').forEach(c=>{const x=c.getContext('2d');x.translate(64,64);drawSym(x,+c.dataset.s,100,.4,0,25)});$('info').classList.add('on')}
/* ================= CONTROLS ================= */
function drawBet(){$('betV').textContent=money(BET());$('buyV').textContent=money(BUY_X*BET());$('betDn').disabled=busy||S.betI<=0;$('betUp').disabled=busy||S.betI>=BETS.length-1;$('buyBtn').disabled=busy}
function setBusyUI(b){$('spinbtn').classList.toggle('busy',b);drawBet()}
function updAuto(){$('autoBtn').classList.toggle('on',auto>0);$('autoBtn').textContent=auto>0?(auto>=900?'AUTO ∞':'AUTO '+auto):'AUTO'}
$('spinbtn').onclick=()=>{$('autoPop').classList.remove('on');round(false)};
$('betUp').onclick=()=>{if(busy||S.betI>=BETS.length-1)return;auInit();S.betI++;SFX.betUp(S.betI);drawBet();save()};
$('betDn').onclick=()=>{if(busy||S.betI<=0)return;auInit();S.betI--;SFX.betDn(S.betI);drawBet();save()};
$('autoBtn').onclick=()=>{auInit();SFX.click();if(auto>0){auto=0;updAuto();return}const p=$('autoPop'),r=$('autoBtn').getBoundingClientRect();p.style.left=(r.left-60)+'px';p.classList.toggle('on')};
document.querySelectorAll('#autoPop [data-a]').forEach(b=>{b.onclick=()=>{auto=+b.dataset.a;$('autoPop').classList.remove('on');updAuto();SFX.click();if(!busy)round(false)};b.onmouseenter=()=>SFX.hover()});
$('turboBtn').onclick=()=>{auInit();S.turbo=!S.turbo;$('turboBtn').classList.toggle('on',S.turbo);SFX.click();save()};
$('sndBtn').onclick=()=>{auInit();auMute(!S.mute);$('sndBtn').classList.toggle('off',S.mute);save()};
$('musBtn').onclick=()=>{auInit();auMusic(!S.music);$('musBtn').classList.toggle('off',!S.music);SFX.click();save()};
$('infoBtn').onclick=()=>{auInit();openInfo()};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{SFX.click();$(b.dataset.close).classList.remove('on')});
$('topup').onclick=()=>{S.bal=r2(S.bal+1000);save();drawBal(1);SFX.countEnd()};
document.querySelectorAll('#bar button').forEach(b=>b.addEventListener('mouseenter',()=>SFX.hover()));
$('cv').addEventListener('pointerdown',()=>{auInit();if(busy){if(phase==='drop')slam=true;else SKIP.on=true}});
addEventListener('pointerdown',()=>auInit(),{once:true});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if($('big').classList.contains('on')){$('big').click();return}if($('info').classList.contains('on')||$('buyOv').classList.contains('on'))return;round(false)}if(e.code==='Escape'){$('info').classList.remove('on');$('buyOv').classList.remove('on')}});
window.StackFrame={refresh:()=>drawBal()};
if(SB)$('topup').style.display='none';
/* a first board so the grid isn't empty */
(()=>{const b=fillBoard(Math.random,W.map((w,i)=>i===SCAT||i===ORB?0:w));for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){const o=spawn(b[c][r],c,r,r,0);o.st='rest';o.landed=true;o.pop=-9}})();
resize();addEventListener('resize',resize);drawBal();drawBet();updAuto();$('turboBtn').classList.toggle('on',S.turbo);$('sndBtn').classList.toggle('off',S.mute);$('musBtn').classList.toggle('off',!S.music);
requestAnimationFrame(frame);
</script></body></html>
