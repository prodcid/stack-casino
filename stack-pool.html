<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800;1,900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f212e;--p1:#1a2c38;--p2:#213743;--line:#2f4553;--txt:#fff;--mute:#b1bad3;--green:#00e701;--gold:#ffc800}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0f212e;color:var(--txt);font:14px/1.4 Outfit,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;touch-action:none;cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer}
kbd{display:inline-block;background:#0b131b;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font:700 11px/1.5 ui-monospace,Menlo,monospace;color:#dfe8f0;margin:0 1px}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(#0b131bf2,#0b131b99 70%,transparent);pointer-events:none}
#hud>*{pointer-events:auto}
.ib{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--p1);font-size:17px;display:grid;place-items:center;flex:none}
.ib:hover{border-color:#456}

#players.multi{display:flex;flex-wrap:wrap;gap:6px}

.pc{position:relative;display:flex;align-items:center;gap:9px;min-width:0;background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);border-radius:14px;padding:6px 10px;transition:border-color .2s,box-shadow .2s}
#players:not(.multi):not(.solo) .pc[data-i="1"]{flex-direction:row-reverse;text-align:right}
#players:not(.multi):not(.solo) .pc[data-i="1"] .pb{justify-content:flex-end}
.pc.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 0 18px #00e70155}
.pc.out{opacity:.4}
.av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;background:hsl(var(--h) 55% 38%);border:2px solid #ffffff22}
.pc.on .av{border-color:var(--green)}
.pn{min-width:0;flex:1}.pn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.pn small{display:block;color:var(--mute);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px;min-height:4px}.pb img{width:17px;height:17px}
.lives{color:#ff3b5c;font-size:13px;letter-spacing:1px}.lives s{color:#ffffff30;text-decoration:none}
.sc{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;flex:none}.sc:empty{display:none}
.think{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--green);font-weight:700;display:none;white-space:nowrap}
.pc.thinking .think{display:block}.think i{font-style:normal;animation:blink 1.2s infinite}.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
#status{text-align:center;min-width:0;padding:0 6px}#status b{display:block;font-size:12px;letter-spacing:1.5px;color:var(--mute);text-transform:uppercase}
#smsg{display:block;margin:0 auto;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.hbtns{display:flex;gap:6px}
/* spin + power */
.spin{position:fixed;z-index:4;left:14px;bottom:44px;width:104px;text-align:center}

.spin b{display:block;font-size:10.5px;letter-spacing:1.5px;color:var(--mute)}.spin small{display:block;font-size:11.5px;font-weight:700;min-height:16px}
.spin.bottom{left:8px;bottom:8px;width:84px}.spin.bottom canvas{width:72px;height:72px}
.power{position:fixed;z-index:4;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:76px}
.power b{font-size:10.5px;letter-spacing:1.5px;color:var(--mute)}
.power .track{position:relative;width:30px;height:min(300px,50vh);border-radius:16px;background:#0a1118;border:1px solid var(--line);overflow:hidden;cursor:ns-resize;touch-action:none;box-shadow:inset 0 2px 8px #000}
.power .track i{position:absolute;left:0;right:0;top:0;height:var(--p,0%);background:linear-gradient(180deg,#00e701,#9dff00 45%,#ffd400 70%,#ff3b3b);background-size:100% min(300px,50vh);border-radius:0 0 14px 14px;box-shadow:0 0 14px #00e70155}

#pw{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}#ms{color:var(--mute);font-size:11.5px;font-variant-numeric:tabular-nums}
.power.kb #pw{color:var(--green)}

.power.bottom .track{flex:1;height:34px;width:auto;cursor:ew-resize}.power.bottom .track i{top:0;bottom:0;height:auto;width:var(--p,0%);background:linear-gradient(90deg,#00e701,#9dff00 45%,#ffd400 70%,#ff3b3b);border-radius:0 14px 14px 0;background-size:100% 100%}

.mwrap{max-width:900px;margin:0 auto;padding:18px 16px 40px}

label{display:block;font-size:12px;color:var(--mute);font-weight:700}
input,select{width:100%;margin-top:4px;background:#0b131b;border:1px solid var(--line);color:#fff;border-radius:10px;padding:9px 10px;font:inherit;font-size:14px}

.note{color:var(--mute);font-size:12.5px;margin:8px 0 0}.note b{color:#fff}
.online .row{display:flex;gap:7px;margin-top:9px;align-items:center}.online input{width:90px;margin:0;text-transform:uppercase;text-align:center;font-weight:900;letter-spacing:3px}

.pty .ptyc{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:9px}.pty .ptyc b{display:block;font-size:16px}.pty .ptyc small{color:var(--mute);font-size:12.5px}.pty .ptyc .av{width:42px;height:42px;font-size:19px}.pty .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);margin-right:6px;vertical-align:1px}
details.looks{margin-top:16px;background:#0b131b99;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
details summary{font-weight:900;font-size:12px;letter-spacing:1.6px;color:var(--mute);cursor:pointer}

.ctl p{color:#d5dfe9;font-size:13px;margin:8px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#1aff1a,#00b801);color:#021a02;font-weight:900;border-radius:12px;padding:11px 18px;border:0;box-shadow:0 4px 0 #007a01;font-size:15px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #007a01}

.box .mark{width:56px;height:46px;margin:0 auto;background:linear-gradient(var(--green) 0 26%,transparent 26% 37%,#eaffea 37% 63%,transparent 63% 74%,var(--green) 74%);transform:skewX(-18deg);border-radius:4px}

@media (max-width:640px){.pc{padding:4px 7px;gap:6px}.av{width:26px;height:26px;font-size:13px}.pn b{font-size:12.5px}.sc{font-size:20px}#status b{font-size:10px}#smsg{font-size:12px}.ib{width:32px;height:32px;font-size:14px}.pb img{width:13px;height:13px}}

<canvas id="cv"></canvas>
<div id="hud"><button class="ib" id="bMenu" aria-label="Menu">☰</button><div id="players"></div><div class="hbtns"><button class="ib" id="bHelp" aria-label="Rules">?</button><button class="ib" id="bSnd" aria-label="Sound">🔊</button></div></div>
<div id="spin" class="spin"><canvas width="192" height="192"></canvas><b>SPIN</b><small>Centre ball</small></div>
<div id="power" class="power"><b>POWER</b><div class="track"><i></i><span></span></div><div id="pw">0%</div><div id="ms">0 m/s</div></div>
<div id="ptools"></div><div id="hint"></div><div id="toast"></div><div id="banner"></div>
<div id="menu"></div><div id="modal"></div>
<script>// ===================== STACK POOL · core (physics, DOM-free) =====================
// Units: metres, seconds, kg (ball mass normalised to 1). World: x right, y down (screen), z DOWN into the slate.
// A ball's contact with the cloth is at +R z. "Top" of the ball (seen by the camera) is -z.
'use strict';
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
function RNG(seed) { let s = (seed >>> 0) || 0x9e3779b9; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function gauss(r) { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }

// Real table specs. cm/sm = corner/side pocket mouth (between jaw tips), cj/sj = jaw facing angle (deg),
// jl = jaw depth, cush = cushion rubber width, wood = rail width, nose = cushion nose height as fraction of ball diameter.
const TABLES = {
  us9: { id: 'us9', name: '9ft American', L: 2.54, W: 1.27, R: 0.028575, cm: 0.117, sm: 0.132, cj: 142, sj: 104, jl: 0.05, cush: 0.05, wood: 0.12, nose: 0.635 },
  pub7: { id: 'pub7', name: '7ft Aussie pub', L: 1.98, W: 0.99, R: 0.0254, cm: 0.093, sm: 0.101, cj: 138, sj: 102, jl: 0.042, cush: 0.045, wood: 0.105, nose: 0.64 },
  snk10: { id: 'snk10', name: '10ft Snooker', L: 3.05, W: 1.525, R: 0.02625, cm: 0.089, sm: 0.099, cj: 138, sj: 102, jl: 0.042, cush: 0.045, wood: 0.12, nose: 0.64 },
};

// Cue/strike constants
const CUE_MASS_RATIO = 0.17 / 0.54;     // ball / cue
const VMAX = 9.0;                        // ball speed at 100% power, centre hit (a hard break)
const powerToSpeed = p => VMAX * Math.pow(clamp(p, 0, 1), 1.5);
const speedToPower = v => Math.pow(clamp(v / VMAX, 0, 1), 1 / 1.5);

function makeWorld(T) {
  const R = T.R, L = T.L, Wd = T.W;
  const sinT = clamp((T.nose * 2 * R - R) / R, 0, 0.6);
  const W = {
    T, L, Wd, R, g: 9.81,
    muS: 0.2,            // sliding friction ball/cloth
    muR: 0.011,          // rolling resistance
    muC: 0.14,           // ball/cushion friction
    eb: 0.95,            // ball/ball restitution
    sinT, cosT: Math.sqrt(1 - sinT * sinT),
    spinDec: 10 * 0.028575 / R,      // vertical-axis spin decay (rad/s^2): contact-patch friction, ~10 rad/s^2
    segs: [], pockets: [], hook: null,
  };
  const seg = (a, b, jaw) => { const dx = b.x - a.x, dy = b.y - a.y; W.segs.push({ ax: a.x, ay: a.y, bx: b.x, by: b.y, dx, dy, l2: dx * dx + dy * dy, jaw: !!jaw }); };
  const corner = (cx, cy, sx, sy, id) => {
    const a = T.cm / Math.SQRT2, ang = (180 - T.cj) * DEG, ca = Math.cos(ang), sa = Math.sin(ang), jl = T.jl;
    const P1 = { x: cx + sx * a, y: cy }, J1 = { x: P1.x - sx * ca * jl, y: P1.y - sy * sa * jl };
    const P2 = { x: cx, y: cy + sy * a }, J2 = { x: P2.x - sx * sa * jl, y: P2.y - sy * ca * jl };
    const rh = T.cm * 0.52, o = rh + 0.5 * R - T.cm / 2;
    const M = { x: (P1.x + P2.x) / 2, y: (P1.y + P2.y) / 2 };
    const p = { id, kind: 'c', cx, cy, sx, sy, P1, P2, J1, J2, r: rh, x: cx - sx * o / Math.SQRT2, y: cy - sy * o / Math.SQRT2,
      ax: M.x - sx * R * 0.3 / Math.SQRT2, ay: M.y - sy * R * 0.3 / Math.SQRT2, mx: M.x, my: M.y, nx: sx / Math.SQRT2, ny: sy / Math.SQRT2, mouth: T.cm };
    W.pockets.push(p); seg(P1, J1, 1); seg(P2, J2, 1); return p;
  };
  const side = (cx, cy, sy, id) => {
    const s = T.sm / 2, ang = (180 - T.sj) * DEG, ca = Math.cos(ang), sa = Math.sin(ang), jl = T.jl;
    const Q1 = { x: cx - s, y: cy }, K1 = { x: Q1.x + ca * jl, y: cy - sy * sa * jl };
    const Q2 = { x: cx + s, y: cy }, K2 = { x: Q2.x - ca * jl, y: cy - sy * sa * jl };

// PARTY INTEGRATION: any transport works. Give StackPool.attach() an adapter: { send(obj), onMessage(fn), close() }.
// Messages are small JSON objects: start, aim, place, shot, sync, rematch, bye. The host is seat 0 and breaks first.

  attachNet(bcAdapter(NetS.code), 'host');

  else toast('Room ' + NetS.code + ': waiting for a player');
}

  }
  if (!A.game) return;
  if (m.t === 'aim' && (A.phase === 'remote' || A.phase === 'rack')) A.remoteAim = m;
  else if (m.t === 'place' && A.phase === 'remote') { const cb = A.game.balls[0]; cb.x = m.x; cb.y = m.y; cb._dirty = true; }
  else if (m.t === 'shot' && A.phase === 'remote') { A.cueVis.a = m.s.a; fireShot(m.s, false); }
  else if (m.t === 'shot' && A.phase === 'rack') A.pendingShot = m.s;   /* your mate broke before your rack finished */
  else if (m.t === 'sync') { if (A.phase === 'run' || A.phase === 'stroke') A.pendingSync = m; else { applySync(m); updateHud(); } }
  else if (m.t === 'rematch' && A.over) { $('#modal').classList.remove('on'); rematch(); }
  else if (m.t === 'bye') toast('Your mate left the game');
}
addEventListener('beforeunload', () => { if (A.net) try { A.net.send({ t: 'bye' }); } catch (e) { } });


// ---------------- Stack party (inside Stack) ----------------
// The casino's PeerJS party carries everything: our pool messages go out wrapped as {t:'pool', m}, and come back in
// through StackFrame.onNet. Whoever invites hosts the game (seat 0, breaks first); the mate who accepts joins.
const PARTY = { st: 'idle', mate: '' };   // idle | inviting | declined
function partyInfo() { try { return window.StackBridge.party() || { on: false, name: '' }; } catch (e) { return { on: false, name: '' }; } }
function partyAdapter() { return { send: m => { try { window.StackBridge.send({ t: 'pool', m }); } catch (e) { } }, onMessage: f => { PARTY.f = f; }, close: () => { PARTY.f = null; } }; }
function poolPartyHTML() {
  const p = partyInfo();
  if (!p.on) return `<div class="online pty"><div class="ptyc"><div class="av" style="--h:200">?</div><div><b>No party yet</b><small>Host or join a party in Online Party (the usual way), then come back here and invite your mate.</small></div></div><div class="row"><button class="btn sm" id="bGoParty">Go to Online Party</button></div></div>`;
  const nm = esc(p.name || 'Your mate'), st = PARTY.st;
  return `<div class="online pty"><div class="ptyc"><div class="av" style="--h:140">${nm[0].toUpperCase()}</div><div><b>${nm}</b><small><i class="dot"></i>In your party · online</small></div></div>
    ${st === 'inviting' ? `<p class="note">Invite sent. Waiting for <b>${nm}</b> to accept… You host and break.</p><div class="row"><button class="btn sm ghost" id="bPartyCancel">Cancel invite</button></div>`
      : `<p class="note">${st === 'declined' ? `<b>${nm}</b> declined. ` : ''}Invite ${nm} to ${esc(MODES[M.mode].name)}. When they accept, Stack Pool opens for them and you break. You both see each other's cue and every ball live.</p><div class="row"><button class="btn" id="bInvite">Invite ${nm}</button></div>`}</div>`;
}
function poolInvite() {
  const p = partyInfo(); if (!p.on) { toast('Join a party first'); return; }
  attachNet(partyAdapter(), 'host'); PARTY.st = 'inviting'; PARTY.mate = p.name;
  try { window.StackBridge.send({ t: 'poolInv', mode: M.mode, modeName: MODES[M.mode].name, name: window.StackBridge.me() }); } catch (e) { }
  renderMenu();
}
function poolCancel() { PARTY.st = 'idle'; try { window.StackBridge.send({ t: 'poolRes', ok: false, cancel: 1 }); } catch (e) { } renderMenu(); }
// the mate accepted in their Party HUD: their Stack opened us; join the inviter's game
function partyJoin() { const me = (() => { try { return window.StackBridge.me(); } catch (e) { return SET.name; } })(); attachNet(partyAdapter(), 'guest'); NetS.adapter.send({ t: 'join', name: me }); toast('Joining your mate’s table…'); }
function partyOnNet(m) {
  if (m.t === 'pool') { if (PARTY.f) PARTY.f(m.m); return; }
  if (m.t === 'poolRes' && !m.ok && PARTY.st === 'inviting') { PARTY.st = 'declined'; toast(`${PARTY.mate || 'Your mate'} declined`, 'bad'); if ($('#menu').classList.contains('on')) renderMenu(); return; }
  if (m.t === 'poolLost') { PARTY.st = 'idle'; if (A.net) { A.net = null; toast('Your mate left the party', 'bad'); if (A.game && !A.over && A.game.G.players.some(p => p.type === 'remote')) { A.phase = 'over'; openMenu(); } } else if ($('#menu').classList.contains('on')) renderMenu(); return; }
  if (m.t === 'poolParty') { if ($('#menu').classList.contains('on')) renderMenu(); }
}

// ---------------- boot ----------------
function boot() {
  A.cv = $('#cv'); A.ctx = A.cv.getContext('2d');
  A.cv.addEventListener('pointerdown', onDown);
  addEventListener('pointermove', onMove);
  addEventListener('pointerup', onUp);
  A.cv.addEventListener('wheel', onWheel, { passive: false });
  A.cv.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => onKey(e, true)); addEventListener('keyup', e => onKey(e, false));
  addEventListener('blur', () => { A.shift = false; });
  addEventListener('resize', () => { clearTimeout(boot.rt); boot.rt = setTimeout(layout, 120); });
  document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement && A.phase === 'pull') A.mouse.last = null; });
  $('#bMenu').onclick = () => toggleMenu();
  $('#bHelp').onclick = () => { M.mode = A.game ? A.game.mode.id : M.mode; openMenu(true); };
  $('#bSnd').onclick = () => { SET.sound = !SET.sound; Store.save(); updateHud(); };
  $('#ptools').addEventListener('click', e => { const b = e.target.closest('[data-pr]'); if (!b) return; const k = b.dataset.pr; if (k === 'undo') doUndo(); else practiceRack(k); });
  powerBar(); spinWidget();
  layout();
  // a table behind the menu so it never looks empty
  startGame({ mode: 'practice', players: [{ name: SET.name, type: 'human' }], seed: 7, breaker: 0 });
  A.attract = true;
  openMenu();
  drawSpin(); showPower(0);
  requestAnimationFrame(frame);
}
window.StackFrame = {
  refresh() { if ($('#menu').classList.contains('on')) renderMenu(); },
  onNet(m) { partyOnNet(m); },
  partyJoin() { partyJoin(); },
  online() { M.opp = 'online'; saveMenu(); if (!A.game || A.over || A.attract || $('#menu').classList.contains('on')) openMenu(); },
};
window.StackPool = {
  attach(adapter, role) { attachNet(adapter, role); },                // party system: plug a transport in
  host(guestName) { netStart(guestName); },
  start(cfg) { startGame(cfg); },
};
addEventListener('DOMContentLoaded', boot);
</script></body></html>
