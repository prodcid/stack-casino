<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stack Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:ital,wght@1,800;1,900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07030f;--neo:#c64bff;--cy:#3cf0ff;--gold:#ffd84a;--txt:#f4ecff;--mute:#b8a6d8;--line:#3a2a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.35 "Outfit","Segoe UI",Arial,sans-serif;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;cursor:default}
#cv,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}#fx{pointer-events:none;z-index:30}
#bar{height:92px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;min-width:0;background:linear-gradient(180deg,#1e0a3a,#08030f);border-top:2px solid #7a3cff;box-shadow:0 -1px 0 #c64bff55 inset,0 -10px 30px #7a3cff22;position:relative;z-index:20}
#bar>*{flex:none}#bar>.sp{flex:1 1 0;min-width:0}
.grp{display:none;align-items:center;gap:10px}.grp.on{display:flex}
.bx{display:flex;flex-direction:column;justify-content:center;background:#0a0514;border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0;height:60px}.bx.w{min-width:124px}
.bx small{font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:800;white-space:nowrap}.bx b{font-size:20px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
#bal.fu{animation:fu .7s}#bal.fd{animation:fd .5s}@keyframes fu{0%{color:#7dff8a;transform:scale(1.08)}100%{color:#fff}}@keyframes fd{0%{color:#ff9a8a}100%{color:#fff}}
.ib{width:46px;height:46px;border-radius:12px;background:#140a26;border:1px solid var(--line);display:grid;place-items:center;transition:.15s}.ib:hover{border-color:var(--neo);box-shadow:0 0 14px #c64bff55}.ib.off{opacity:.45}.ib svg{width:22px;height:22px;fill:var(--cy)}
.pm{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0d8ff,#a04bff 55%,#3a0a7a);color:#fff;font-weight:900;font-size:24px;line-height:1;box-shadow:0 3px 0 #1a0540,0 0 0 2px #0a0214,0 0 12px #c64bff55}.pm:active{transform:translateY(2px)}.pm:disabled{filter:grayscale(1);opacity:.45}
.go{width:84px;height:84px;margin-top:-26px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#fff3b0,#ffc020 45%,#e06a00 72%,#6a2a00);box-shadow:0 0 0 4px #c64bff,0 0 0 7px #3cf0ff,0 6px 18px #000,0 0 40px #c64bff99;display:grid;place-items:center;transition:transform .1s;font:900 15px Bungee,Outfit;color:#4a1400;letter-spacing:.02em;text-shadow:0 1px 0 #fff8}
.go:hover{box-shadow:0 0 0 4px #e070ff,0 0 0 7px #a0fbff,0 6px 18px #000,0 0 56px #c64bffcc}.go:active,.go.held{transform:scale(.94)}.go:disabled{filter:grayscale(1);opacity:.5}
.tog{height:46px;padding:0 12px;border-radius:12px;background:#140a26;border:1px solid var(--line);font-weight:900;letter-spacing:.08em;font-size:12px;color:var(--mute)}.tog.on{color:#1a0536;background:linear-gradient(#a0fbff,#3cc8ff);border-color:#e0fdff;box-shadow:0 0 16px #3cf0ff88}.tog:hover{border-color:var(--neo)}
#topup{height:32px;padding:0 10px;border-radius:8px;background:#1fb07a;color:#032a1a;font-weight:900;font-size:12px}
#hallBtn{height:46px;padding:0 14px;border-radius:12px;background:#140a26;border:1px solid var(--line);font-weight:900;letter-spacing:.06em;font-size:12px;color:var(--cy);display:flex;align-items:center;gap:6px}#hallBtn:hover{border-color:var(--cy);box-shadow:0 0 14px #3cf0ff55}#hallBtn svg{width:18px;height:18px;fill:var(--cy)}
.cab{min-width:138px;align-items:center}.cab b{color:var(--gold)}
#winbx b,#pwon b{color:var(--gold)}
@media (max-width:1300px){#bar{gap:7px}.bx b{font-size:17px}.bx.w{min-width:108px}.tog{padding:0 9px;font-size:11px}}
@media (max-width:1150px){#bar{gap:5px;padding:0 8px}.ib{width:38px;height:38px}.ib svg{width:18px;height:18px}.bx{padding:6px 8px}.bx b{font-size:15px}.bx small{font-size:10px}.pm{width:34px;height:34px;font-size:20px}.go{width:74px;height:74px}.cab{min-width:112px}#hallBtn{padding:0 9px}}
.ov{position:absolute;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(40,10,70,.72),rgba(4,1,10,.93));backdrop-filter:blur(3px)}.ov.on{display:flex;animation:ovIn .35s ease-out}@keyframes ovIn{from{opacity:0}to{opacity:1}}
.panel{background:linear-gradient(180deg,#1e0a3a,#0a0418);border:2px solid #7a3cff;border-radius:22px;box-shadow:0 0 0 5px #140628,0 20px 60px #000,0 0 60px #c64bff33 inset;padding:24px 28px;max-width:94vw;max-height:94%;overflow:auto;position:relative}
.ttl{font-family:Bungee,"Outfit",sans-serif;text-align:center;letter-spacing:.02em;color:#fff;text-shadow:0 0 6px #fff,0 0 18px #c64bff,0 0 40px #c64bff,0 4px 0 #3a0a7a}
.sub{color:var(--mute);text-align:center}
.gbtn{padding:14px 26px;border-radius:14px;font-weight:900;letter-spacing:.08em;font-size:16px;background:linear-gradient(#ffe27a,#e0960a);color:#3a1000;box-shadow:0 4px 0 #6a3a00,0 0 22px #ffb02055}.gbtn:hover{filter:brightness(1.1)}.gbtn:active{transform:translateY(3px)}.gbtn.ghost{background:#140a26;color:var(--cy);border:1px solid #5a3a9a;box-shadow:none}.gbtn.pink{background:linear-gradient(#f0a0ff,#a02bff);color:#fff;box-shadow:0 4px 0 #3a0a7a,0 0 22px #c64bff66}.gbtn:disabled{filter:grayscale(1);opacity:.5}
#reveal{flex-direction:column}#revCv{width:min(760px,90vw);height:min(560px,calc(100vh - 92px - 190px));}
#revInfo{text-align:center;margin-top:4px;min-height:90px}#revInfo .nm{font:28px Bungee,Outfit;color:#fff;text-shadow:0 0 14px #c64bff}#revInfo .fn{font-weight:900;letter-spacing:.2em;font-size:14px;margin-top:2px}#revInfo .vl{font-weight:800;color:var(--mute);margin-top:4px}
#revBtns{display:flex;gap:14px;justify-content:center;margin-top:12px}
#banner{position:absolute;left:0;right:0;top:30%;z-index:26;display:none;flex-direction:column;align-items:center;pointer-events:none}#banner.on{display:flex}#banner .ttl{font-size:min(84px,9vw);animation:bigIn .6s cubic-bezier(.3,1.6,.5,1)}#banner .sub{font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 6px #000}
@keyframes bigIn{from{transform:scale(.2) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
#info .panel{width:min(980px,94vw)}#info h2{margin:18px 0 8px;font:20px Bungee,Outfit;color:var(--cy)}#info p,#info li{color:#e0d4f4;margin:6px 0}
.odds{display:grid;grid-template-columns:1fr auto auto;gap:4px 18px;max-width:620px}.odds span{white-space:nowrap}.odds span.r{text-align:right;font-weight:900;color:#fff}
.x{position:absolute;right:14px;top:10px;font-size:26px;color:var(--mute)}.x:hover{color:#fff}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:40;background:#1e0a3a;border:1px solid #c64bff;border-radius:10px;padding:10px 16px;font-weight:800;display:none;box-shadow:0 0 20px #c64bff55}#toast.on{display:block;animation:ovIn .2s}
#figPop{position:absolute;right:18px;top:18px;z-index:27;display:none;align-items:center;gap:12px;background:linear-gradient(#24104a,#0e061c);border:2px solid #c64bff;border-radius:16px;padding:10px 14px 10px 10px;box-shadow:0 10px 30px #000,0 0 26px #c64bff66}#figPop.on{display:flex;animation:slideIn .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes slideIn{from{transform:translateX(120%)}to{transform:none}}#figPop canvas{width:66px;height:86px}#figPop b{display:block;font:16px Bungee,Outfit}#figPop small{color:var(--mute);font-weight:800}
#shelfUI{position:absolute;inset:0;z-index:5;display:none;overflow:auto;padding:22px 28px 40px}#shelfUI.on{display:block}
.shHead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}.shHead h1{margin:0;font:44px Bungee,Outfit;color:#fff;text-shadow:0 0 8px #fff,0 0 26px #c64bff,0 0 50px #c64bff}
.shStats{display:flex;gap:10px}.shStats .bx{height:auto;padding:8px 14px}
.shelf{position:relative;margin:0 0 26px;padding:14px 16px 0;border-radius:18px;background:linear-gradient(180deg,rgba(40,14,80,.94),rgba(10,4,24,.96));border:1px solid #3a2a6a;box-shadow:0 0 40px #7a3cff22 inset}
.shelf h3{margin:0 0 6px;font:16px Bungee,Outfit;color:var(--cy);letter-spacing:.04em;display:flex;justify-content:space-between}.shelf h3 small{font:800 12px Outfit;color:var(--mute);letter-spacing:.1em}
.row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;align-items:end;padding:4px 2px 0;max-width:1500px;margin:0 auto}
.slot{position:relative;aspect-ratio:118/150;border-radius:12px 12px 0 0;cursor:pointer;transition:transform .15s}.slot:hover{transform:translateY(-4px)}
.slot canvas{position:absolute;left:0;bottom:0;width:100%;height:100%}.slot .n{position:absolute;right:6px;top:6px;background:#c64bff;color:#fff;font-weight:900;font-size:12px;border-radius:10px;padding:1px 7px;box-shadow:0 0 10px #c64bff}
.slot.none canvas{opacity:.18;filter:brightness(0) drop-shadow(0 0 1px #6a5a9a)}.slot .fl{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-weight:900;font-size:10px;letter-spacing:.14em}
.plank{height:16px;margin:0 -16px;border-radius:0 0 18px 18px;background:linear-gradient(#5a3a9a,#24104a 40%,#0e061c);box-shadow:0 6px 18px #000,0 -2px 12px #c64bff55;position:relative}.plank:before{content:"";position:absolute;left:16px;right:16px;top:0;height:2px;background:#e0b0ff;box-shadow:0 0 12px #c64bff,0 0 22px #c64bff}
#figDet .panel{width:min(900px,94vw);text-align:center}.fdRow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}.fdc{width:150px;background:#0e061c;border:1px solid #3a2a6a;border-radius:14px;padding:8px}.fdc canvas{width:134px;height:176px}.fdc b{display:block;font-weight:900;letter-spacing:.12em;font-size:12px}.fdc .own{color:var(--mute);font-weight:800;font-size:12px;margin:3px 0 6px}
.fdc button{width:100%;padding:7px 0;border-radius:9px;font-weight:900;font-size:12px;background:linear-gradient(#ffe27a,#e0960a);color:#3a1000;margin-top:4px}.fdc button:disabled{opacity:.35;filter:grayscale(1)}.fdc button.k{background:#140a26;color:var(--cy);border:1px solid #5a3a9a}
</style></head><body>
<div id="app">
 <div id="stage"><canvas id="cv"></canvas><canvas id="fx"></canvas>
  <div id="shelfUI"></div>
  <div id="banner"><div class="ttl" id="banT"></div><div class="sub" id="banS"></div></div>
  <div id="figPop"><canvas id="figPopCv" width="132" height="172"></canvas><div><small id="figPopK">STACKHEAD</small><b id="figPopN"></b><small id="figPopV"></small></div></div>
  <div class="ov" id="reveal"><canvas id="revCv" width="1520" height="1120"></canvas><div id="revInfo"><div class="nm" id="revN"></div><div class="fn" id="revF"></div><div class="vl" id="revV"></div></div>
   <div id="revBtns"><button class="gbtn pink" id="revKeep">KEEP IT</button><button class="gbtn" id="revSell">SELL</button></div></div>
  <div class="ov" id="figDet"><div class="panel"><button class="x" data-close="figDet">×</button><div id="fdBody"></div></div></div>
  <div class="ov" id="info"><div class="panel"><button class="x" data-close="info">×</button><div class="ttl" style="font-size:38px">STACK ARCADE</div><div id="infoBody"></div></div></div>
  <div id="toast"></div>
 </div>
 <div id="bar">
  <button id="hallBtn" title="Back to the arcade floor"><svg viewBox="0 0 24 24"><path d="M10 19 3 12l7-7 1.4 1.4L6.8 11H21v2H6.8l4.6 4.6z"/></svg>ARCADE</button>
  <button class="ib" id="infoBtn" title="How it works and the odds"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg></button>
  <button class="ib" id="sndBtn" title="Sound"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
  <button class="ib" id="musBtn" title="Music"><svg viewBox="0 0 24 24"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3z"/></svg></button>
  <div class="bx w"><small>BALANCE</small><b id="bal">$0.00</b></div><button id="topup">Top up</button>
  <div class="sp"></div>
  <div class="grp" id="gPush">
   <button class="pm" id="cabDn" title="Cheaper cabinet">‹</button><div class="bx cab"><small>CABINET</small><b id="cabV">$1 COIN</b></div><button class="pm" id="cabUp" title="Bigger cabinet">›</button>
   <button class="tog" id="autoBtn" title="Keep dropping coins">AUTO</button>
   <button class="go" id="dropBtn" title="Drop a coin (space). Hold to keep dropping.">DROP</button>
   <div class="bx w" id="pwon"><small>WON HERE</small><b id="pwonV">$0.00</b></div>
  </div>
  <div class="grp" id="gClaw">
   <button class="pm" id="prDn">−</button><div class="bx cab"><small>PLAY PRICE</small><b id="prV">$1.00</b></div><button class="pm" id="prUp">+</button>
   <button class="go" id="grabBtn" title="Insert coin, then DROP the claw (space)">PLAY</button>
   <div class="bx w"><small>TIME</small><b id="clTime">--</b></div>
  </div>
  <div class="grp" id="gShelf">
   <div class="bx w"><small>SHELF VALUE</small><b id="shVal">$0</b></div>
   <button class="tog" id="sellDupes" title="Sell every Standard figure you have more than one of">SELL STANDARD DUPES</button>
  </div>
  <div class="sp"></div>
  <div class="bx w" id="winbx"><small id="winL">LAST WIN</small><b id="winV">$0.00</b></div>
 </div>
</div>
<script>
/*==CORE==*/
/* ================= STACK ARCADE: the maths =================
   Everything that decides money lives between the CORE markers so test-arcade.js can run it
   in Node with no DOM.

   STACKHEADS. Collectable vinyl figures: 12 characters from across Stack, each in 5 finishes.
   A figure's worth is fixed the moment you win it (finish multiplier x the play price) and it
   can always be sold back for exactly that, so a figure is money you can put on a shelf.

   CLAW. Every box in the cabinet shows its finish, and the chance to win the box under the claw
   is shown before you drop: p = 0.97 / multiplier x lineUp. Perfect line-up returns 97% of the
   play price in figure value on ANY box; sloppy aim returns less. The grip is never rigged: the
   roll happens once, at the drop, against the number on screen.

   COIN PUSHER. Real physics: coins you drop land on the moving pusher, the back wall scrapes
   them off, and the pusher shoves the field toward the front edge. Coins that fall off the
   front pay you; coins that fall into the red HOUSE gutters at the two front corners do not.
   Over time everything you drop leaves the field one way or the other, so the return is the
   share that leaves over the front, plus the Lucky Slot's free coins and prizes. The gutter
   width and the Lucky Slot rate are tuned by simulation (test-arcade.js) to about 97%. Each
   coin value has its own cabinet with its own saved field, so coins never change value. */
const VARS=[
 {k:'std',n:'Standard',m:2},
 {k:'met',n:'Metallic',m:6},
 {k:'glow',n:'Glow',m:20},
 {k:'gold',n:'Gold',m:100},
 {k:'dia',n:'Diamond',m:500}];
const FIGS=[
 {k:'zeus',n:'Zeus',from:'Olympus Storm',c1:'#2a6ae8',c2:'#0c2a7a'},
 {k:'dragon',n:'Lucky Dragon',from:'Dragon Stacks',c1:'#e8242a',c2:'#6a0610'},
 {k:'pharaoh',n:'Pharaoh',from:"Ra's Fortune",c1:'#e0a018',c2:'#6a3a00'},
 {k:'infernax',n:'Infernax',from:'Stack Cards',c1:'#ff7a1a',c2:'#8a2400'},
 {k:'emberfox',n:'Emberfox',from:'Stack Cards 1st Ed.',c1:'#ff9a3a',c2:'#7a3000'},
 {k:'mole',n:'The Mole',from:'Moles',c1:'#ff4d8d',c2:'#7a0a3a'},
 {k:'chicken',n:'Road Chicken',from:'Chicken Road',c1:'#ffc23a',c2:'#8a4a00'},
 {k:'driver',n:'GP Driver',from:'Stack GP',c1:'#ffd400',c2:'#1a1a1a'},
 {k:'league',n:'League Prop',from:'Stack League',c1:'#b6f23a',c2:'#2a5a0a'},
 {k:'boxer',n:'The Champ',from:'Fight Night',c1:'#ff4d5e',c2:'#6a0a14'},
 {k:'trader',n:'The Trader',from:'Stack Markets',c1:'#a57cff',c2:'#3a1a8a'},
 {k:'stacky',n:'Stacky',from:'Stack',c1:'#00e701',c2:'#00600a'}];
const ART_RTP=.97;
const PRICES=[.2,.5,1,2,5,10,20,50,100,200,300];
/* ---- claw ---- */
/* line-up from the distance between the claw and the box centre, in half-box widths:
   dead centre to 35% off is a perfect line-up, then it falls to nothing at the box edge */
function clawQ(d,h){const a=d/h;if(a<=.35)return 1;if(a>=1)return 0;return 1-(a-.35)/.65}
const clawP=(vi,q)=>ART_RTP/VARS[vi].m*q;
const figVal=(vi,price)=>Math.round(VARS[vi].m*price*100)/100;
/* the finish mix of a freshly stocked claw cabinet (doesn't touch the odds: every box is
   priced by its own finish) */
const CLAW_MIX=[.52,.26,.14,.06,.02];
function pickW(w,r){let s=0;for(const x of w)s+=x;let u=r*s;for(let i=0;i<w.length;i++){u-=w[i];if(u<0)return i}return w.length-1}
/* ---- coin pusher ---- */
const PZ={W:22,D:19,R:1,PB:4,PA:4.2,PT:2.6,G:2.35,IT:6,PL:1/65,WALLS:25,AIM:5.5};
const PZ_TIERS=[.2,1,5,20,100];
/* Lucky Slot outcomes (weights). Values are in coins of the cabinet's value. */
const PZ_FEAT=[
 {k:'rain',n:'COIN RAIN',w:40,coins:4},
 {k:'shower',n:'GOLD SHOWER',w:22,coins:10},
 {k:'jumbo',n:'JUMBO COIN',w:14,jumbo:1},
 {k:'walls',n:'WALLS UP',w:10,walls:1},
 {k:'box',n:'STACKHEAD DROP',w:9,box:1},
 {k:'frenzy',n:'PUSHER FRENZY',w:4,coins:20,fr:9},
 {k:'jack',n:'JACKPOT',w:1,coins:50,bar:1}];
const PZ_JUMBO=10,PZ_BAR=100,PZ_BOXX=3;
/* the finish of a Stackhead box dropped onto the field; the box is worth multiplier x 3 coins */
const PZ_BOXMIX=[.8,.15,.04,.009,.001];
function pzNew(){return{t:0,ph:0,amp:1,fr:0,walls:0,c:[],nid:1,ev:[],inV:0,outV:0,houseV:0}}
function pzP(st){return PZ.PB+PZ.PA*st.amp*(1-Math.cos(st.ph*2*Math.PI))/2}
function pzCoin(st,x,y,l,k,v,r,extra){const c=Object.assign({id:st.nid++,x,y,l,k:k||'c',v:v==null?1:v,r:r||PZ.R,m:k==='c'||!k?1:k==='j'?4:8},extra||{});st.c.push(c);return c}
/* drop a coin down the chute: it lands on the pusher top near the aimed x */
function pzDrop(st,x,rnd){const L=PZ.AIM;x=Math.max(-L,Math.min(L,x+(rnd()-.5)*1.4));
 const P=pzP(st),y=1.1+rnd()*Math.max(.2,P-2.4);st.inV+=1;if(st.walls>0)st.walls--;
 const c=pzCoin(st,x,y,2);c.fresh=1;return rnd()<PZ.PL}
/* where free coins and prizes land: over the field, in front of the pusher's reach */
function pzRainAt(st,rnd,wide){const L=PZ.W/2-1.5;return{x:(rnd()*2-1)*(wide?L:L*.7),y:PZ.PB+PZ.PA*1.25+1.2+rnd()*(PZ.D-PZ.PB-PZ.PA*1.25-4.2)}}
function pzLand(st,c){/* a coin arriving from above: on a coin -> stacked, else floor */
 c.l=pzSupported(st,c)?1:0}
function pzSupported(st,c){let n=0;for(const o of st.c){if(o===c||o.l!==0)continue;const dx=o.x-c.x,dy=o.y-c.y,d2=dx*dx+dy*dy;
  if(d2<(o.r*1.2)*(o.r*1.2))return true;if(d2<(o.r+c.r*.95)*(o.r+c.r*.95))n++}return n>=2}
/* a Lucky Slot outcome as a list of pieces to add (the game rains them in one by one, the
   sim adds them at once - both through pzSpawn, so they land in the same places) */
function pzFeatSpecs(st,f,rnd){const out=[];
 const add=(k,v,r,extra)=>{const p=pzRainAt(st,rnd,k==='c');out.push({k,v,r,extra,x:p.x,y:p.y})};
 for(let i=0;i<(f.coins||0);i++)add('c',1,1);
 if(f.jumbo)add('j',PZ_JUMBO,2.1);
 if(f.bar)add('g',PZ_BAR,2.3);

/* ================= SOUND (building blocks shared with Dragon Stacks) =================

   Building blocks: osc (pitched voice with pitch + filter envelopes), nz (filtered noise),

   Every visible thing has its own sound; the music is generated live on a pentatonic scale

  AU.out=C.createGain();AU.out.gain.value=S.mute?0:.85;AU.out.connect(comp);
