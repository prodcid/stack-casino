<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stack Racing</title>
<style>
:root{--bg:#0f1923;--p1:#16222e;--p2:#1c2a38;--p3:#243444;--line:#2a3a4a;--txt:#e8eef4;--mute:#8a9aac;--green:#00e701;--red:#ff4f4f;--gold:#ffc800}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--txt);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}

.hb{width:36px;height:36px;border-radius:10px;background:var(--p2);font-size:16px}
.balw{display:flex;border-radius:10px;overflow:hidden;background:var(--p2)}#bal{padding:8px 10px;font-weight:800;min-width:92px;text-align:right}#bal.fu{color:var(--green)}#bal.fd{color:var(--red)}
#topup{background:#1a6ae8;padding:8px 12px;font-weight:800;color:#fff}

#rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:10px}#rhead b{font-size:18px}
.tag{background:var(--green);color:#021;font-weight:900;border-radius:6px;padding:2px 7px;font-size:12px;vertical-align:2px}
.sub{color:var(--mute);font-size:12.5px}.cond{font-weight:800}.cond.c0{color:#7adf6a}.cond.c1{color:#e8c040}.cond.c2{color:#e87a3a}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}

#cv.sepia{filter:sepia(.85) contrast(1.15)}

#photo{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}#photo.on{display:flex}

.silk{width:38px;height:38px;flex:none}.silk.sm{width:24px;height:24px}

.trs{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.tr{font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--p3);color:#c8d4e0;font-weight:700}

.odds{display:flex;gap:5px;flex:none}

.fg{padding:0 12px 12px;border-top:1px solid var(--line)}.fg>.sub{margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:10px 0}.stats div{display:flex;align-items:center;gap:6px;font-size:12px}.stats span{width:78px;color:var(--mute)}
.stats i{flex:1;height:7px;border-radius:4px;background:var(--p3);overflow:hidden}.stats i b{display:block;height:100%;background:linear-gradient(90deg,#1a6ae8,#00e701)}.stats em{font-style:normal;width:22px;text-align:right;font-weight:800}

.btn{padding:11px 14px;border-radius:11px;background:var(--p3);font-weight:900;width:100%}.btn.go,.btn.big{background:var(--green);color:#021}.btn.big{padding:14px;font-size:16px}.btn.ghost{background:var(--p2);border:1px solid var(--line)}
.row2{display:flex;gap:8px}
.mb{display:flex;align-items:center;gap:8px;background:var(--p2);border-radius:9px;padding:7px 9px;margin-bottom:5px;border-left:3px solid var(--line)}.mb span{flex:1;font-weight:700}.mb small{display:block;color:var(--mute);font-weight:500;font-size:11.5px}
.mb.up{border-left-color:var(--green)}.mb.up b{color:var(--green)}.mb.dn{border-left-color:#4a5a6a}.mb.dn b{color:var(--mute)}
.lrows{position:relative}.lrows .ld{position:absolute;left:0;right:0;top:0;height:40px;transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.sl span:first-child small{display:block;color:var(--mute);font-weight:500;font-size:11.5px}.slr{color:var(--green);font-size:13px}
.stakebox{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}.sin{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 10px;font-weight:900;font-size:17px}
.sin input{width:110px;background:none;border:0;color:var(--txt);font:inherit;padding:9px 0;outline:none;text-align:right}.sin:focus-within{border-color:var(--green)}
.slipsum{font-size:13.5px;color:var(--mute)}.slipsum b{color:var(--green);font-size:15px}
.lh{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;padding:0 4px 6px;font-weight:700}.sus{color:var(--gold);font-style:normal}
.ld,.rr{display:flex;align-items:center;gap:8px;background:var(--p1);border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-bottom:4px}
.ld.me,.rr.me{border-color:var(--green);background:#11261a}.pos{width:30px;font-weight:900;color:var(--mute);font-size:13px}
.nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.blk{color:var(--red);font-style:normal;font-size:11px}
.gap{width:46px;text-align:right;color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums}
.bk{min-width:64px;padding:6px 6px;border-radius:8px;background:#1a3a6a;font-weight:900;color:#cfe4ff}.bk:disabled{background:var(--p3);color:var(--mute)}
.rr.p0{border-color:var(--gold)}.rr.p0 .pos{color:var(--gold)}.rr.p1 .pos{color:#d8dee8}.rr.p2 .pos{color:#e0a060}.sp{width:74px;text-align:right;color:var(--mute);font-size:12px}
.net{text-align:center;font-weight:900;font-size:18px;padding:6px}.net.up,.up{color:var(--green)}.net.dn,.dn{color:var(--red)}
#irm{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px}#irm.on{display:flex}
.irbox{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:16px;width:min(360px,100%);display:flex;flex-direction:column;gap:10px}
.irh{display:flex;gap:10px;align-items:center}.irh img{width:44px}.irh span{display:block}.irp{font-size:36px;font-weight:900;color:var(--green);text-align:center}
.hl{max-height:50vh;overflow:auto}.hl div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:#223344;border:1px solid var(--line);border-radius:10px;padding:9px 14px;display:flex;gap:12px;font-weight:700;animation:pop .3s}.toast.good b{color:var(--green)}.toast.bad b{color:var(--red)}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.side{position:static;order:-1}.left{display:contents}.viewer{order:-3}.callbox{order:-2;margin:0}#panel{order:0}.grid{gap:10px}}
@media (max-width:420px){.wrap{padding:10px}.ob{min-width:56px;font-size:13px}.brand span{display:none}}
</style></head><body>
<header><div class="brand">🏇 <span>Stack <i>Racing</i></span></div><button class="hb" id="hist" title="History">📋</button><button class="hb" id="mute" title="Sound">🔊</button><div class="balw"><span id="bal">$0.00</span><button id="topup">Top up</button></div></header>
<div class="wrap"><div id="rhead"></div>
<div class="grid"><div class="left"><div class="viewer"><canvas id="cv"></canvas><div id="togo"></div><div id="photo"><span>PHOTO</span></div></div>
<div class="callbox"><div id="call"></div><div id="calllog"></div></div><div id="panel"></div></div>
<aside class="side" id="side"></aside></div></div>
<div id="irm"></div><div id="toasts"></div>
<script>
/* ================= STACK RACING ENGINE =================
   A small physics-style race: every horse has early speed, cruising speed, a finishing kick and
   stamina. Speed above cruise burns energy, sitting behind another horse (cover) saves it, running
   wide on the bends costs ground, and horses can get blocked. All the drama comes out of this.
   Odds are Monte Carlo runs of this exact same step function, priced to return 97%. */
const DT=0.25,LEN=2.4,RB=175,LANES=9,HOUSE=0.97;
const COND=[{n:'Good 4',k:1,wet:0},{n:'Soft 6',k:.985,wet:1},{n:'Heavy 8',k:.965,wet:2}];
let _sp=null;function randn(){if(_sp!==null){const v=_sp;_sp=null;return v}let u=0;while(u===0)u=Math.random();const v=Math.random(),r=Math.sqrt(-2*Math.log(u)),a=6.283185307*v;_sp=r*Math.sin(a);return r*Math.cos(a)}
/* track: 2000m loop, anticlockwise. loop coord u: [0,550) bend 1, [550,1000) back straight, [1000,1550) bend 2, [1550,2000) home straight, post at 2000 */
const onBend=(R,s)=>{const u=(R.u0+s)%2000;return u<550||(u>=1000&&u<1550)};
/* per-race horse numbers derived from the horse's ratings (all 0..1) */
function runnerParams(h,R,barrier){const c=COND[R.cond];
  let k=c.k;if(h.traits.includes('wet'))k+=c.wet*.0035;if(h.traits.includes('dry'))k-=c.wet*.0035;
  const vb=(16.55+.16*h.cr)*k-(h.wt-54)*.025;
  return{vb,es:h.es,ki:h.ki,st:h.st,lead:h.traits.includes('lead'),slow:h.traits.includes('slow'),grit:h.traits.includes('grit'),
    lane0:(barrier-1)*.55,sprint:340+120*h.st+(h.traits.includes('late')?-70:0),den:.9+.2*h.st,kick:.5+.95*h.ki}}
function newState(R){return R.P.map(p=>({s:0,v:0,lane:p.lane0,E:1,fin:0,delay:0,form:0,mo:0,kf:NaN,push:0,blk:0,hd:0}))}
/* roll the random bits that are fixed for the whole race: day form and the start */
function rollDay(R,st){st.forEach((h,i)=>{h.form=randn()*.0055;const p=R.P[i].slow?.22:.05;h.delay=Math.random()<p?.35+Math.random()*.9:0})}
function cloneState(st){return st.map(h=>({...h}))}
/* one DT step. t = race clock before the step. returns nothing; fin holds the finish time */
function step(R,st,t){const n=st.length,D=R.D,K=0.0082*Math.sqrt(1600/D)*R.dk;
  const nv=new Float64Array(n),nl=new Float64Array(n);
  let leadS=-1;for(const h of st)if(!h.fin&&h.s>leadS)leadS=h.s;
  for(let i=0;i<n;i++){const h=st[i],p=R.P[i];nl[i]=h.lane;
    if(h.fin){nv[i]=Math.max(5,h.v-.3);nl[i]=h.lane;continue}
    if(t<h.delay){nv[i]=0;continue}
    const rem=D-h.s;let tgt;
    if(h.s<Math.min(380,D*.26))tgt=p.vb-.15+.55*p.es+(p.lead?.25:0);
    else if(rem>p.sprint){const g=leadS-h.s;tgt=g<.5?p.vb-(p.lead?0:.25):p.vb+Math.min(.45,.03*g)}
    else{// empty the tank by the post: the fastest pace the remaining energy can hold, capped by the horse's turn of foot
      const allow=h.E/(rem/Math.max(h.v,14)+.5),rv=1+(allow*p.den/K-1)/11;// how much a horse has left on the day is only found out when the jockey asks for it
      if(h.kf!==h.kf)h.kf=randn()*.42;tgt=Math.min(p.vb*Math.max(.9,rv),p.vb+p.kick)+h.kf+(h.push>0?.3:0)}
    h.mo+=-h.mo*DT/4+randn()*(rem<p.sprint?.0042:.0022);tgt*=1+h.form+h.mo;
    // fatigue caps speed
    const cap=h.E>.25?1:.95+.05*h.E/.25;tgt*=cap;
    let v=h.v+(tgt-h.v)*Math.min(1,DT*(h.v<8?.9:1.3))+randn()*.1;
    // who is directly in front
    let ahead=-1,gap=1e9,cover=false;
    for(let j=0;j<n;j++){if(j===i)continue;const o=st[j],d=o.s-h.s;if(d>0&&d<4.2&&Math.abs(o.lane-h.lane)<.85){cover=true;if(d<gap){gap=d;ahead=j}}}
    h.blk=0;
    if(ahead>=0&&gap<LEN+.35&&v>st[ahead].v){v=Math.max(st[ahead].v-.05,v-1.2);h.blk=1;
      // look for a way out: out first, inside in the straight if there's room
      const tryL=l=>{if(l<0||l>LANES-1)return false;for(let j=0;j<n;j++){if(j===i)continue;const o=st[j];if(Math.abs(o.lane-l)<.85&&Math.abs(o.s-h.s)<LEN+.6)return false}return true};
      const inS=rem<450;if(tryL(h.lane+1))nl[i]=h.lane+Math.min(1,.9*DT*2);else if(inS&&tryL(h.lane-1))nl[i]=h.lane-Math.min(1,.9*DT*2)}
    else if(rem>450&&h.lane>.01){ // drift in towards the rail when there's room
      let ok=true;const l=Math.max(0,h.lane-.6);for(let j=0;j<n;j++){if(j===i)continue;const o=st[j];if(Math.abs(o.lane-l)<.8&&Math.abs(o.s-h.s)<LEN+1){ok=false;break}}
      if(ok)nl[i]=Math.max(0,h.lane-.35*DT)}
    // energy
    const rv=Math.max(v,0)/p.vb;let drain=K*(rv<1?rv*rv:1+11*(rv-1))/p.den;
    if(cover)drain*=.8;else if(onBend(R,h.s)&&h.lane>1.4)drain*=1.08;
    if(p.lead&&h.s<leadS-1.5&&rem>p.sprint)drain*=1.1;
    h.E=Math.max(0,h.E-drain*DT);
    // gritty horses fight back when something ranges up
    if(p.grit&&rem<p.sprint){let beside=false;for(let j=0;j<n;j++){if(j===i)continue;const d=st[j].s-h.s;if(d>-1&&d<1.5)beside=true}h.push=beside?1:Math.max(0,h.push-DT)}
    nv[i]=Math.max(0,v)}
  for(let i=0;i<n;i++){const h=st[i];h.v=nv[i];h.lane=nl[i];
    const f=onBend(R,h.s)?RB/(RB+h.lane):1,ds=h.v*f*DT;
    if(!h.fin&&h.s+ds>=R.D)h.fin=t+DT*((R.D-h.s)/Math.max(ds,1e-6));
    h.s+=ds}}
/* finishing order from state (finished by time, rest by distance) */
function order(st){return st.map((h,i)=>i).sort((a,b)=>{const A=st[a],B=st[b];if(A.fin&&B.fin)return A.fin-B.fin;if(A.fin)return-1;if(B.fin)return 1;return B.s-A.s})}
/* one full run from a state; returns the finishing order (only the first 3 are guaranteed settled) */
function simOnce(R,st0,t0,withDay){const st=cloneState(st0);if(withDay)rollDay(R,st);let t=t0,done=0;const need=Math.min(3,st.length);
  while(t<400){step(R,st,t);t+=DT;done=0;for(const h of st)if(h.fin)done++;if(done>=need)break}
  return order(st)}
/* Monte Carlo from a state. counts wins and top-3. withDay: reroll day form (pre-race) */
function mc(R,st0,t0,n,withDay){const N=st0.length,win=new Float64Array(N),plc=new Float64Array(N),need=Math.min(3,N);
  for(let k=0;k<n;k++){const o=simOnce(R,st0,t0,withDay);win[o[0]]++;for(let j=0;j<need;j++)plc[o[j]]++}
  return{win:[...win].map(x=>x/n),plc:[...plc].map(x=>x/n)}}
/* fair prob -> fixed price with the 3% edge. null = suspended (price would round below fair) */
function priceOf(p,n){const q=(p*n+.5)/(n+1);const pr=Math.floor(HOUSE/q*100)/100;return pr<1.02?null:Math.min(pr,501)}
if(typeof module!=='undefined')module.exports={simOnce,DT,LEN,COND,randn,runnerParams,newState,rollDay,cloneState,step,order,mc,priceOf,onBend,HOUSE};

/* ================= RACE VIEW =================
   Side-on camera from the grandstand. Rail at the back, outside lanes nearest the camera.
   Everything is drawn live on one canvas: sky, hills, stands, turf, rail, markers, horses. */
const COATS={bay:{b:'#7a4122',h:'#9a5a30',d:'#3a1a0c',p:'#140a06'},chestnut:{b:'#9a4e1e',h:'#c26a2c',d:'#5a2a0c',p:'#6a3010'},
  brown:{b:'#4a2614',h:'#64361e',d:'#24120a',p:'#120806'},black:{b:'#1e1916',h:'#3a322c',d:'#0a0808',p:'#050404'},grey:{b:'#a8a8a4',h:'#d0d0cc',d:'#6a6a68',p:'#4a4a48'}};
const V={cam:{x:0,w:30},stands:null,t:0};
function hsh(i,k){let h=Math.imul(i^0x9e3779b9,0x85ebca6b)^Math.imul(k+7,0xc2b2ae35);h^=h>>>13;h=Math.imul(h,0x27d4eb2f);h^=h>>>15;return(h>>>0)/4294967296}
function laneY(l,T,Bt){return T+(Bt-T)*.3+(Math.min(l,7.5)/7.5)*(Bt-T)*.62}
function laneK(l){return .9+.2*Math.min(l,7.5)/7.5}
/* grandstand strip, baked once */
function bakeStands(h){const W=900,c=document.createElement('canvas');c.width=W;c.height=h;const x=c.getContext('2d');
  // roofline + tiers
  x.fillStyle='#2a3440';x.fillRect(0,h*.18,W,h*.82);
  for(let b=0;b<3;b++){const bx=b*300;x.fillStyle='#e8ecf0';x.beginPath();x.moveTo(bx+8,h*.2);x.lineTo(bx+292,h*.2);x.lineTo(bx+280,h*.06);x.lineTo(bx+20,h*.06);x.closePath();x.fill();
    x.fillStyle='#b8c2cc';x.fillRect(bx+8,h*.2,284,h*.04);for(let p=0;p<6;p++){x.fillStyle='#8a96a2';x.fillRect(bx+14+p*55,h*.2,4,h*.3)}}
  // crowd
  for(let i=0;i<2600;i++){const cx=hsh(i,1)*W,cy=h*.26+hsh(i,2)*h*.62,r=hsh(i,3);
    x.fillStyle=r<.18?'#e84a4a':r<.3?'#f0c040':r<.45?'#4a8ae8':r<.55?'#f0f0f0':r<.62?'#3ad07a':`hsl(${20+hsh(i,4)*30},35%,${30+hsh(i,5)*30}%)`;
    x.fillRect(cx,cy,2.2,2.6);x.fillStyle='rgba(240,200,170,.8)';x.fillRect(cx+.3,cy-1.4,1.6,1.5)}
  x.fillStyle='rgba(0,0,0,.18)';x.fillRect(0,h*.24,W,h*.06);
  // front fence + sponsor boards

function buildRace(no){const D=pick([1200,1200,1400,1600,1600,2000,2400]),cr=Math.random(),cond=cr<.58?0:cr<.88?1:2;

    run:field.map((h,i)=>({hid:h.id,num:i+1,bar:bars[i],wt:54+Math.round(6*(rs[i]-lo)/Math.max(1e-6,hi-lo)*2)/2,name:h.name,coat:h.coat,silks:h.silks}))};

function seedPool(){const used=new Set();S.pool=Array.from({length:44},(_,i)=>mkHorse(i,used));
  for(let k=0;k<30;k++){const R=buildRace(0);const st=newState(R);rollDay(R,st);let t=0;while(st.some(h=>!h.fin)&&t<300){step(R,st,t);t+=DT}recordForm(R,order(st),true)}}

  $('stakein').addEventListener('input',ev=>{const v=parseFloat(ev.target.value.replace(/[^0-9.]/g,''));stake=isFinite(v)&&v>0?Math.round(v*100)/100:0;slipSum()});
  slipSum()}
function slipSum(){const tot=stake*slip.length,ret=slip.reduce((a,s)=>a+stake*(pr(s)||0),0);
  document.querySelectorAll('.slr').forEach(el=>{const s=slip.find(q=>q.i+q.type===el.dataset.k);el.textContent=s&&stake?money(stake*(pr(s)||0)):''});
  document.querySelectorAll('[data-a="stk"]').forEach(b=>b.classList.toggle('on',+b.dataset.v===stake));
  $('slipsum').innerHTML=stake?`Total ${money(tot)} · <b>${slip.length>1?'returns up to':'returns'} ${money(ret)}</b>`:'Enter a stake';
  const b=$('placebtn');b.disabled=!stake||!preReady();b.textContent=stake?`Place ${slip.length} bet${slip.length>1?'s':''} · ${money(tot)}`:'Place bet'}
function drawMyBets(){const e=$('mybets');if(!e)return;if(!bets.length){e.innerHTML='';lastMB='';return}
  const o=phase==='card'?null:order(cur);
  const html=`<h3>Your bets</h3>`+bets.map(b=>{const r=R.run[b.i],pos=o?o.indexOf(b.i)+1:0,win=o&&(b.type==='W'?pos===1:pos<=need());
    return `<div class="mb ${o?(win?'up':'dn'):''}"><img class="silk sm" src="${silksIcon(r.silks,'h'+r.hid)}"><span>#${r.num} ${r.name}<small>${b.type==='W'?'Win':'Place'}${b.inrun?' · in running':''} · ${money(b.stake)} @ $${b.price.toFixed(2)}</small></span><b>${o?(pos?ordinal(pos)+' · ':'')+(win?money(b.stake*b.price):'$0'):money(b.stake*b.price)}</b></div>`}).join('');if(html!==lastMB||e.innerHTML===''){lastMB=html;e.innerHTML=html}}
let ladKey=null,lastMB='';
function drawLadder(){const e=$('ladder');if(!e)return;const o=order(cur),L=cur[o[0]].s,M=mine(),sus=suspended(),RH=44;
  if(ladKey!==R){ladKey=R;e.innerHTML=`<div class="lh"><span>Running order</span><span id="lhs"></span></div><div class="lrows" style="height:${o.length*RH}px">${R.run.map((r,i)=>`<div class="ld" id="ld${i}"><span class="pos"></span><img class="silk sm" src="${silksIcon(r.silks,'h'+r.hid)}"><span class="nm"><span class="num">${r.num}</span>${r.name}<em class="blk"></em></span><span class="gap"></span><button class="bk" data-a="back" data-i="${i}"></button></div>`).join('')}</div>`}
  $('lhs').innerHTML=sus?'<em class="sus">Suspended</em>':'Live win price';
  o.forEach((i,k)=>{const row=$('ld'+i),gap=(L-cur[i].s)/LEN,p=livePrice(i);row.style.transform=`translateY(${k*RH}px)`;row.classList.toggle('me',M.has(i));
    row.children[0].textContent=k+1;row.querySelector('.blk').textContent=cur[i].blk&&R.D-cur[i].s<450?' blocked':'';
    row.children[3].textContent=k?(gap<.15?'nk':gap.toFixed(1)+'L'):'';const b=row.children[4];b.disabled=sus||!p;b.textContent=p&&!sus?'$'+p.toFixed(2):'—'});
  drawMyBets()}
const ordinal=n=>n+(n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');
function drawPanel(){const e=$('panel');
  if(phase==='card'){e.innerHTML=`<div class="cardhead"><h3>Race card</h3><span class="sub" id="mform"></span></div><div class="card">${R.run.map((_,i)=>runnerRow(i)).join('')}</div>`;
    $('side').innerHTML=`<h3>Bet slip</h3><div id="slip"></div><div id="mybets"></div><button class="btn big" data-a="start" ${preReady()?'':'disabled'}>${preReady()?'Start race':'Pricing the field…'}</button>
      <p class="sub">Once the gates open you can still back horses to win at live prices, until 250m to go.</p>`;
    drawSlip();drawMyBets();drawOddsCells()}
  else if(phase==='run'){ladKey=null;lastMB='';e.innerHTML=`<div id="ladder"></div>`;$('side').innerHTML=`<div id="mybets"></div><div class="row2"><button class="btn ghost" data-a="speed">Speed ${speed}x</button><button class="btn ghost" data-a="skip">Skip to result</button></div>
      <button class="btn ghost" data-a="follow">${follow>=0?'Following #'+R.run[follow].num:'Camera: leaders'}</button>`;drawLadder()}
  else{const o=R.result;e.innerHTML=`<h3>Result</h3><div class="res">${o.map((i,k)=>{const r=R.run[i],gap=k?(cur[i].fin-cur[o[k-1]].fin)*16.5/LEN:0;
      return `<div class="rr ${k<3?'p'+k:''} ${mine().has(i)?'me':''}"><span class="pos">${ordinal(k+1)}</span><img class="silk sm" src="${silksIcon(r.silks,'h'+r.hid)}"><span class="nm"><span class="num">${r.num}</span>${r.name}</span><span class="gap">${k?marginTxt(gap):''}</span><span class="sp">SP $${(R.sp[i]||0).toFixed(2)}</span></div>`}).join('')}</div>`;
    $('side').innerHTML=`${R.lines.length?`<h3>Your bets</h3>${R.lines.map(l=>{const r=R.run[l.i];return `<div class="mb ${l.won?'up':'dn'}"><span>#${r.num} ${r.name}<small>${l.type==='W'?'Win':'Place'}${l.inrun?' · in running':''} · ${money(l.stake)} @ $${l.price.toFixed(2)}</small></span><b>${l.won?'+'+money(l.pay):'Lost'}</b></div>`}).join('')}
      <div class="net ${R.ret-R.staked>=0?'up':'dn'}">${R.ret-R.staked>=0?'Profit':'Loss'} ${money(Math.abs(R.ret-R.staked))}</div>`:'<p class="sub">No bets on this one.</p>'}
      <button class="btn big" data-a="next">Next race</button>`}}
function marginTxt(l){return l<.08?'nose':l<.15?'sht hd':l<.25?'head':l<.4?'neck':l<.6?'½L':l<.85?'¾L':l.toFixed(1).replace('.0','')+'L'}
/* ---------- input: pointerdown so re-rendered rows never eat a tap ---------- */
function handle(e){const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i;A.init();
  if(a==='odd'){e.preventDefault();toggleSlip(i,b.dataset.t)}
  else if(a==='exp'){if(e.target.closest('.odds'))return;open=open===i?-1:i;drawPanel()}
  else if(a==='rm'){slip=slip.filter(s=>!(s.i===i&&s.type===b.dataset.t));drawSlip();drawOddsCells()}
  else if(a==='stk'){e.preventDefault();stake=+b.dataset.v;const inp=$('stakein');if(inp)inp.value=stake;slipSum()}
  else if(a==='place')placeSlip();
  else if(a==='start')startRace();
  else if(a==='back'){e.preventDefault();backInRun(i)}
  else if(a==='skip')skipRace();
  else if(a==='speed'){speed=speed===1?2:speed===2?4:1;b.textContent='Speed '+speed+'x'}
  else if(a==='follow'){const M=[...mine()];const opts=[-1,...M];follow=opts[(opts.indexOf(follow)+1)%opts.length];if(follow<-1)follow=-1;b.textContent=follow>=0?'Following #'+R.run[follow].num:'Camera: leaders'}
  else if(a==='next'){newRace()}}
['panel','side'].forEach(id=>$(id).addEventListener('pointerdown',handle));
$('topup').onclick=()=>{A.init();credit(1000);toast('Topped up','+$1,000.00','good')};
if(BR)$('topup').style.display='none';
window.StackFrame={refresh:()=>drawBal()};
$('mute').onclick=()=>{S.mute=!S.mute;save();$('mute').textContent=S.mute?'🔇':'🔊';A.init()};$('mute').textContent=S.mute?'🔇':'🔊';
$('hist').onclick=()=>{const t=S.hist.reduce((a,h)=>a+h.ret-h.staked,0);$('irm').classList.add('on');
  $('irm').innerHTML=`<div class="irbox"><b>Your last ${S.hist.length} races</b><div class="hl">${S.hist.map(h=>`<div><span>R${h.no} ${h.name}</span><b class="${h.ret-h.staked>=0?'up':'dn'}">${h.ret-h.staked>=0?'+':'-'}${money(Math.abs(h.ret-h.staked))}</b></div>`).join('')||'<p class="sub">No bets yet.</p>'}</div>
  <p class="sub">Net ${t>=0?'+':'-'}${money(Math.abs(t))}</p><button class="btn" data-a="irno">Close</button></div>`};
drawBal();fit();newRace();requestAnimationFrame(frame);
window.StackRacing={get phase(){return phase},get R(){return R},start:startRace,skip:skipRace,pre:()=>pre};

</script></body></html>
