/* =====================================================================================================

   ===================================================================================================== */
:root{--win:#12a150;--winbg:#e7f6ec;--loss:#d93f45;--lossbg:#fbeaea;--gold:#d99a13;--goldbg:#fbf1db;--live:#ef3b2d;--blue:#3466f6;--bluebg:#e9effe;--violet:#7c4dff;--violetbg:#efe9ff;--tealbg:#e3f5f2;--teal:#11998a;--bg:#f3f3f1;--surface:#ffffff;--s2:#f8f8f6;--ink:#0b0b0b;--ink-2:#5c5c59;--ink-3:#a3a39f;--line:#e1e1de;--hov:#efefec;
 --disp:'Bricolage Grotesque','Plus Jakarta Sans',sans-serif;--body:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
 --q:240ms;--std:420ms;--con:900ms;--io:cubic-bezier(.65,0,.35,1);--out:cubic-bezier(.16,1,.3,1);--back:cubic-bezier(.34,1.56,.64,1);--r:14px;color-scheme:light}
:root[data-theme="dark"]{--win:#34d074;--winbg:#0f2a1a;--loss:#ff6b6f;--lossbg:#2c1213;--gold:#f2b632;--goldbg:#2a2209;--live:#ff5a4c;--blue:#6b8dff;--bluebg:#131d38;--violet:#a585ff;--violetbg:#1d1530;--tealbg:#0c2420;--teal:#3dd2c0;--bg:#070707;--surface:#111111;--s2:#0c0c0c;--ink:#f3f3f1;--ink-2:#9b9b97;--ink-3:#5c5c59;--line:#232323;--hov:#191919;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}a{color:inherit;text-decoration:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dw{font-family:var(--disp);font-weight:700;font-variation-settings:"opsz" 14;letter-spacing:-.025em}
.dn{font-family:var(--disp);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ---------- frame: left rail, top bar, content, bet slip, micro bar ---------- */

.brand:hover svg path{stroke-dasharray:1;animation:draw var(--con) var(--io)}@keyframes draw{from{stroke-dashoffset:1}}

.nav a:hover{background:var(--hov);color:var(--ink)}.nav a.on{background:var(--ink);color:var(--surface)}

@keyframes pulse{50%{opacity:.25}}

.search{position:relative;width:min(360px,30vw)}.search input{width:100%;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 38px;outline:none}
.search input:focus{border-color:var(--ink)}.search svg{position:absolute;left:13px;top:12px;width:16px;height:16px;color:var(--ink-3)}
.sres{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:40;box-shadow:0 20px 40px -20px rgba(0,0,0,.4)}

.btn{height:40px;padding:0 18px;border-radius:999px;border:1.5px solid var(--ink);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;isolation:isolate;background:var(--surface);color:var(--ink);white-space:nowrap;transition:color var(--std) var(--out),transform var(--q)}
.btn:active{transform:scale(.97)}

.btn:hover:not(:disabled){color:var(--surface)}.btn:hover:not(:disabled) i.b{transform:none}

.btn.sm{height:32px;padding:0 13px;font-size:12.5px}.btn.lg{height:52px;padding:0 26px;font-size:15px}.btn.w{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.icb{width:42px;height:42px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);position:relative;transition:border-color var(--q)}

.av{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:800;font-family:var(--disp);font-size:17px}
main{grid-column:2;overflow:auto;min-height:0;position:relative}

.slip.on{width:340px}
.slip>*{min-width:340px}

/* ---------- page parts ---------- */
.sh{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:16px;margin:34px 0 14px}

.hero{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px}
.ban{position:relative;border-radius:18px;overflow:hidden;min-height:220px;padding:26px 28px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform var(--std) var(--out)}
.ban:hover{transform:translateY(-3px)}

.ban.out{background:var(--surface);border:1px solid var(--line)}
.ban h3{font-size:34px;line-height:.95;margin:8px 0 0}.ban p{margin:6px 0 0;font-size:13px;opacity:.75;max-width:34ch}

.chips{display:flex;gap:6px;flex-wrap:wrap}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{position:relative;aspect-ratio:3/3.7;border-radius:16px;border:1.5px solid var(--ink);background:var(--surface);padding:14px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;cursor:pointer;transition:transform var(--std) var(--out),box-shadow var(--std)}
.tile:hover{transform:translateY(-6px);box-shadow:0 22px 30px -20px rgba(0,0,0,.45)}

.tile.inv{background:var(--ink);color:var(--surface)}.tile.inv .tg{background:var(--surface);color:var(--ink)}
.tile .fv{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:13px;opacity:0;transition:opacity var(--q),background var(--q);z-index:2;line-height:1}.tile .tg+.fv,.tile .fv{background:var(--surface);color:var(--ink)}.tile:hover .fv,.tile .fv.on{opacity:1}.tile .fv.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}.tile .tg{right:46px}
.fvb.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tile .pl{position:absolute;left:14px;right:14px;bottom:14px;transform:translateY(130%);transition:transform var(--std) var(--out)}.tile:hover .pl{transform:none}
.tile:hover .bot{opacity:0}.tile .bot{transition:opacity var(--q)}
.feedt{width:100%;border-collapse:collapse}.feedt th{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.feedt td{padding:11px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}.feedt tr:last-child td{border-bottom:0}

.feedt tr.new td{animation:rowin .6s var(--out)}@keyframes rowin{from{background:var(--hov)}}
.feedt .w{font-weight:800}.feedt .l{color:var(--ink-3)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}

.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600}.kv span{color:var(--ink-2);font-weight:500}
.empty{padding:34px;text-align:center;color:var(--ink-3)}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ink);border-radius:999px;transition:width var(--con) var(--out)}
.field{display:flex;flex-direction:column;gap:6px}.field label{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.inp{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;outline:none;width:100%;font-weight:600}.inp:focus{border-color:var(--ink)}
.betin{display:flex;align-items:center;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}

/* ---------- game page ---------- */
.gwrap{display:grid;grid-template-columns:320px minmax(0,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);min-height:560px}

.res.on{transform:translate(-50%,0);opacity:1}.res.l{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink)}
.hist{display:flex;gap:6px;flex-wrap:wrap}.hist i{font:600 11px var(--mono);font-style:normal;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}.hist i.w{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* playing cards (2D, black and white) */
.pc{width:76px;height:108px;border-radius:9px;background:var(--surface);border:1.5px solid var(--ink);position:relative;display:inline-block;flex:none;box-shadow:0 6px 14px -8px rgba(0,0,0,.35);animation:deal .38s var(--out) both;font-family:var(--disp);font-weight:700}
.pc .r{position:absolute;left:7px;top:5px;font-size:19px;line-height:1}.pc .s{position:absolute;left:8px;top:25px;font-size:15px;line-height:1}
.pc .c{position:absolute;inset:0;display:grid;place-items:center;font-size:36px}.pc .r2{position:absolute;right:7px;bottom:5px;font-size:19px;line-height:1;transform:rotate(180deg)}
.pc.red .c,.pc.red .s{opacity:1}.pc.red{background:var(--ink);color:var(--surface)}

.pc.sm{width:56px;height:80px;border-radius:7px}.pc.sm .r{font-size:15px}.pc.sm .s{top:21px;font-size:12px}.pc.sm .c{font-size:26px}.pc.sm .r2{font-size:15px}
.pc.hold{outline:3px solid var(--ink);outline-offset:3px}.pc.win{transform:translateY(-8px);transition:transform .3s var(--back)}
@keyframes deal{from{transform:translate(120px,-90px) rotate(10deg);opacity:0}}
.hand{display:flex;gap:-20px}.hand .pc+.pc{margin-left:-22px}.hand.sp .pc+.pc{margin-left:8px}
.hlab{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:10px;align-items:center;justify-content:center;margin:10px 0 0}
.hlab b{font:700 18px var(--disp);color:var(--ink);letter-spacing:0}
.chipk{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:800 11px var(--disp);background:var(--surface);position:relative;cursor:pointer;flex:none;transition:transform var(--q) var(--back)}
.chipk::before{content:'';position:absolute;inset:4px;border-radius:50%;border:2px dashed var(--ink)}.chipk.on{background:var(--ink);color:var(--surface);transform:translateY(-4px)}.chipk.on::before{border-color:var(--surface)}
/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:color-mix(in oklab,var(--ink) 35%,transparent);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity var(--std) var(--io)}.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;left:50%;top:50%;z-index:90;width:min(520px,92vw);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 28px;transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;transition:transform var(--std) var(--out),opacity var(--q)}
.modal.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.modal h3{font-size:30px;line-height:1;margin:8px 0 10px}.modal .x{position:absolute;top:16px;right:16px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;z-index:90;background:var(--surface);border-left:1px solid var(--line);transform:translateX(102%);transition:transform var(--std) var(--out);display:flex;flex-direction:column}.drawer.on{transform:none}
.drawer header{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}.drawer .body{flex:1;overflow:auto}
.nt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px 22px;border-bottom:1px solid var(--line)}.nt.unread{background:var(--s2)}
.nt .ic{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center}.nt .ic svg{width:16px;height:16px}
.nt b{display:block;font-size:13.5px}.nt p{margin:2px 0 6px;color:var(--ink-2);font-size:12.5px}.nt time{font:500 10px var(--mono);color:var(--ink-3)}
.toasts{position:fixed;right:22px;top:78px;z-index:95;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;min-width:280px;max-width:380px;background:var(--ink);color:var(--surface);border-radius:14px;padding:12px 16px 12px 12px;box-shadow:0 18px 40px -18px rgba(0,0,0,.6);animation:tin var(--std) var(--back) both;cursor:pointer}
.toast .ic{width:32px;height:32px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;flex:none}.toast .ic svg{width:15px;height:15px}
.toast b{display:block;font-size:13px}.toast small{display:block;font-size:12px;opacity:.7}
.toast.lt{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink)}
.toast.out{animation:tout var(--q) ease-in forwards}@keyframes tin{from{transform:translateY(-14px) scale(.95);opacity:0}}@keyframes tout{to{transform:translateX(30px);opacity:0}}
.gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;grid-template-columns:1.1fr 1fr}
.gate .l{background:var(--ink);color:var(--surface);padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.gate .l h1{font-size:72px;line-height:.9;margin:0}.gate .r{display:grid;place-items:center;padding:40px}
.gate form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.bars3{position:fixed;inset:0;z-index:150;pointer-events:none}.bars3 i{position:absolute;left:-10%;width:120%;height:34.3%;border-radius:999px;background:var(--ink);transform:translateX(110%)}
.bars3 i:nth-child(1){top:-.5%}.bars3 i:nth-child(2){top:33%}.bars3 i:nth-child(3){top:66.5%}
.bars3.go i{animation:b3in .42s var(--io) forwards}.bars3.go i:nth-child(2){animation-delay:60ms}.bars3.go i:nth-child(3){animation-delay:120ms}
.bars3.out i{transform:none;animation:b3out .42s var(--io) forwards}.bars3.out i:nth-child(2){animation-delay:60ms}.bars3.out i:nth-child(3){animation-delay:120ms}
@keyframes b3in{to{transform:none}}@keyframes b3out{to{transform:translateX(-110%)}}
.enter>*{animation:penter .7s var(--out) both}.enter>*:nth-child(2){animation-delay:50ms}.enter>*:nth-child(3){animation-delay:100ms}.enter>*:nth-child(4){animation-delay:150ms}.enter>*:nth-child(n+5){animation-delay:200ms}
@keyframes penter{from{opacity:0;transform:translateY(14px)}}
.odo{display:inline-flex;overflow:hidden;line-height:1.15}.odo .d{display:inline-block;height:1.15em;overflow:hidden}.odo .d>span{display:flex;flex-direction:column;transition:transform 1s var(--out)}.odo .d i{font-style:normal;height:1.15em}
.rc{width:min(560px,92vw)}.rc .big{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;margin:16px 0}.rc .big div{padding:14px 16px;border-right:1px solid var(--line)}.rc .big div:last-child{border:0}
.rc .big b{display:block;font-size:24px}.rc .links{display:flex;gap:18px;justify-content:center;margin-top:14px}.rc .links button{font-size:12px;color:var(--ink-3);text-decoration:underline}
footer.site{border-top:1px solid var(--line);margin-top:56px;padding-top:28px;display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:28px;font-size:12.5px;color:var(--ink-2)}
footer.site h4{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}footer.site a{display:block;padding:3px 0}footer.site a:hover{color:var(--ink)}
.badges{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.badges span{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font:500 10px var(--mono);letter-spacing:.06em}

.hist i.w{background:var(--win);border-color:var(--win)}
.nav a .live{background:var(--live);color:var(--live)}
.tile[data-cat="orig"]{background:linear-gradient(160deg,var(--violetbg),var(--surface) 60%)}.tile[data-cat="cards"]{background:linear-gradient(160deg,var(--bluebg),var(--surface) 60%)}

#avBtn{position:relative;overflow:visible}
.fxc{position:fixed;inset:0;pointer-events:none;z-index:120}
.coin{position:fixed;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 60%,#a86f00);box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:none;z-index:121}

@keyframes popup{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-14px) scale(1.12);opacity:1}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
.streak{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--goldbg);color:var(--gold);font:700 12px var(--body)}
.gstage.wonfx{animation:wonfx 1s var(--out)}@keyframes wonfx{0%{box-shadow:inset 0 0 0 0 var(--win)}30%{box-shadow:inset 0 0 0 4px color-mix(in oklab,var(--win) 60%,transparent)}100%{box-shadow:inset 0 0 0 0 transparent}}
.gstage.lostfx{animation:lostfx .5s}@keyframes lostfx{30%{box-shadow:inset 0 0 0 3px color-mix(in oklab,var(--loss) 40%,transparent)}}
/* cards: only a newly dealt card flies in; a revealed card flips; nothing else moves */
.pc{animation:none}.pc.nw{animation:dealin .42s var(--out) both}.pc.fl{animation:flipin .42s var(--io) both}
@keyframes dealin{from{transform:translate(160px,-120px) rotate(14deg) scale(.9);opacity:0}70%{opacity:1}}
@keyframes flipin{0%{transform:rotateY(90deg)}100%{transform:none}}
.pc.red{background:#c9252c;border-color:#8f1117;color:#fff}:root[data-theme="dark"] .pc.red{background:#d7333a}
.pc.back{background:repeating-linear-gradient(45deg,#1b2b5c 0 6px,#26407f 6px 9px);border-color:#14214a}
.help{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.help>div{padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.help b.n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);font:700 13px var(--disp);margin-bottom:8px}
.help h4{margin:0 0 4px;font-size:15px}.help p{margin:0;color:var(--ink-2);font-size:12.5px;line-height:1.5}
.intro{color:var(--ink-2);max-width:62ch;margin:6px 0 0;font-size:13.5px}
.mtag{display:inline-block;font:600 10px var(--mono);letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:var(--bluebg);color:var(--blue);margin-left:6px;vertical-align:middle}
</style>
