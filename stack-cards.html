<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stack Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ STACK CARDS — every selector scoped under #tcg ============ */
#tcg{--bg:#0f212e;--panel:#1a2c38;--panel2:#213743;--line:#2f4553;--mute:#b1bad3;--dim:#557086;--green:#00e701;--cw:min(70vw,300px);
  position:relative;height:100%;min-height:100vh;background:radial-gradient(120% 80% at 50% 0%,#17334a 0%,var(--bg) 60%);
  color:#fff;font-family:Outfit,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#tcg *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
#tcg button{font-family:inherit;cursor:pointer;border:0;color:inherit}
#tcg button:focus-visible{outline:2px solid #ffc800;outline-offset:3px}
html,body{margin:0;height:100%;background:#0f212e;overflow:hidden}
#tcg .bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;z-index:50}
#tcg .title{font-weight:800;font-size:17px}#tcg .title small{display:block;font-weight:600;font-size:12px;color:var(--mute)}
#tcg .bal{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px}#tcg .bal b{color:var(--green)}
#tcg .tabs{display:flex;gap:6px}
#tcg .tab{background:var(--panel);border:1px solid var(--line)!important;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px;color:var(--mute)}
#tcg .tab.on{background:var(--panel2);color:#fff}
#tcg .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1200px}
#tcg .hint{position:absolute;bottom:92px;left:0;right:0;text-align:center;color:var(--mute);font-size:14px;font-weight:600;transition:opacity .3s;pointer-events:none}
#tcg .dock{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:40}
#tcg .btn{background:var(--green);color:#05250a!important;font-weight:800;font-size:15px;border-radius:8px;padding:14px 22px;box-shadow:0 4px 0 #00a301}
#tcg .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #00a301}
#tcg .btn.ghost{background:var(--panel2);color:#fff!important;box-shadow:0 4px 0 #0b1a24}
#tcg .odds{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(26,44,56,.85);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--mute);width:max-content;max-width:92vw;text-align:center;line-height:1.4;z-index:30}
#tcg .odds b{color:#fff}

/* ======================= PACK (realistic foil pillow) ======================= */
#tcg .packwrap{position:relative;width:min(calc(var(--cw) * 1.06),calc((100vh - 240px) * .606));margin-top:10px;aspect-ratio:63/104}
#tcg .pk-shadow{position:absolute;left:8%;right:8%;bottom:-6%;height:10%;border-radius:50%;background:rgba(0,0,0,.6);filter:blur(18px);
  transform:translateX(var(--sx,0px));transition:transform .1s linear}
#tcg .pack{--mx:50%;--my:40%;position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .1s linear}
#tcg .pk-piece{position:absolute;inset:0}
#tcg .pk-body{clip-path:polygon(0 11%,100% 11%,100% 98%,96% 100%,92% 98%,88% 100%,84% 98%,80% 100%,76% 98%,72% 100%,68% 98%,64% 100%,60% 98%,56% 100%,52% 98%,48% 100%,44% 98%,40% 100%,36% 98%,32% 100%,28% 98%,24% 100%,20% 98%,16% 100%,12% 98%,8% 100%,4% 98%,0 100%)}
#tcg .pk-top{clip-path:polygon(0 2%,4% 0,8% 2%,12% 0,16% 2%,20% 0,24% 2%,28% 0,32% 2%,36% 0,40% 2%,44% 0,48% 2%,52% 0,56% 2%,60% 0,64% 2%,68% 0,72% 2%,76% 0,80% 2%,84% 0,88% 2%,92% 0,96% 2%,100% 0,100% 11%,0 11%);
  transition:transform .75s cubic-bezier(.2,.7,.3,1),opacity .75s}
#tcg .pk-top.gone{transform:translate(150px,-240px) rotate(40deg);opacity:0}
#tcg .pk-skin{position:absolute;inset:0;isolation:isolate}
#tcg .pk-skin>*{position:absolute;inset:0;pointer-events:none}
/* 1 metal film */
#tcg .l-foil{background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),
  linear-gradient(180deg,#7f8891 0%,#e9edf1 20%,#a2aab3 42%,#f3f5f7 64%,#8c949d 86%,#c9cfd5 100%)}
/* 2 ink printed on the film (multiply lets foil show through the light ink) */
#tcg .l-print{mix-blend-mode:multiply;background:
  linear-gradient(116deg,#1a3a56 0 33%,#e7b75a 33% 35.5%,#f0cf86 35.5% 57%,#e7b75a 57% 59.5%,#1a3a56 59.5%),
  radial-gradient(70% 40% at 50% 52%,#28506f,transparent)}
#tcg .l-art{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5%;padding-top:6%}
#tcg .l-art .ring{width:46%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,#0f2436 0 58%,transparent 59%),conic-gradient(from 20deg,#f7df9a,#9a7424,#fff1c2,#8c6a1e,#f7df9a);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
#tcg .l-art .ring svg{width:70%}
#tcg .pk-logo{font-weight:900;font-size:calc(var(--cw) * .2);letter-spacing:2px;line-height:.9;
  background:linear-gradient(180deg,#fff6d0,#e0b64e 45%,#8e6a1c 55%,#f7d77a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.55))}
#tcg .pk-sub{font-size:calc(var(--cw) * .045);font-weight:800;color:#f0d690;letter-spacing:2px}
#tcg .pk-badge{margin-top:3%;font-size:calc(var(--cw) * .04);font-weight:800;color:#0f212e;background:linear-gradient(180deg,#fff3c7,#d8ad4c);padding:1.2% 4%;border-radius:40px}
/* 3 crinkle relief (SVG lighting, light follows you) */
#tcg .l-scene img,#tcg .l-scene svg{display:block;width:100%;height:100%;object-fit:cover}
#tcg .pk-skin{container-type:inline-size}
#tcg .l-title{z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:23%;left:0;right:0;gap:0}
#tcg .t3d{position:relative;display:block;font-family:Outfit,system-ui,sans-serif;font-weight:900;line-height:.9;text-align:center;white-space:nowrap}
#tcg .t3d .ex,#tcg .t3d .fc{display:block;letter-spacing:inherit}
#tcg .t3d .ex{position:absolute;left:0;right:0;top:0;color:#024a0c;
  text-shadow:0 .25cqi 0 #02520c,0 .5cqi 0 #02460a,0 .75cqi 0 #023c08,0 1cqi 0 #013206,0 1.25cqi 0 #012805,0 1.5cqi 0 #011e03,0 1.75cqi 0 #001402,0 2cqi 0 #000,0 3.5cqi 3cqi rgba(0,0,0,.85)}
#tcg .t3d .fc{position:relative;background:linear-gradient(180deg,#ffffff 0%,#c8ffb0 22%,#3aff2a 48%,#00c800 62%,#008a00 80%,#5aff4a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 .35cqi #013a08) drop-shadow(0 0 2.2cqi rgba(0,255,40,.5))}
#tcg .t3d.t1{font-size:20cqi;letter-spacing:0}
#tcg .t3d.t2{font-size:14.5cqi;letter-spacing:.08em;margin-top:1cqi}
#tcg .t3d.t2 .ex,#tcg .t3d.t2 .fc{padding-left:.03em}
#tcg .l-badge{position:relative;margin-top:4cqi;width:max-content;height:auto;font-weight:900;font-size:4.2cqi;letter-spacing:.14em;color:#021a04;
  background:linear-gradient(180deg,#d8ffc8,#00e701);padding:1cqi 4cqi;border-radius:40px;box-shadow:0 0 3cqi rgba(0,231,1,.8),inset 0 -.5cqi 0 rgba(0,0,0,.25)}
#tcg .l-gsheen{mix-blend-mode:screen;opacity:calc(var(--so,.8) * .22);background:linear-gradient(105deg,transparent calc(var(--mx) - 22%),rgba(0,255,60,.45) calc(var(--mx) - 6%),rgba(220,255,220,.7) var(--mx),rgba(0,255,60,.45) calc(var(--mx) + 6%),transparent calc(var(--mx) + 22%))}
#tcg .l-crkD{mix-blend-mode:multiply;opacity:.28;background:var(--crkD) 0 0/100% 100%}
#tcg .l-crkS{mix-blend-mode:screen;background-size:100% 100%}#tcg .l-crkS.a{background-image:var(--crkA);opacity:calc((1 - var(--lp,.5)) * .42)}#tcg .l-crkS.b{background-image:var(--crkB);opacity:calc(var(--lp,.5) * .42)}
#tcg .pk-piece,#tcg .pack{will-change:transform}
/* 4 pillow curvature: edges roll away and darken, seals pinch */
#tcg .l-shade{background:
  linear-gradient(90deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.22) 7%,transparent 22%,transparent 78%,rgba(0,0,0,.22) 93%,rgba(0,0,0,.62) 100%),
  linear-gradient(180deg,rgba(0,0,0,.35) 0 11%,rgba(0,0,0,.12) 15%,transparent 24%,transparent 84%,rgba(0,0,0,.2) 92%,rgba(0,0,0,.4) 100%)}
/* 5 specular: a tall streak because the pack only curves side-to-side */
#tcg .l-spec{mix-blend-mode:screen;opacity:calc(var(--so,.9) * .6);background:
  radial-gradient(ellipse 13% 55% at var(--mx) 52%,rgba(255,255,255,.75),rgba(255,255,255,.12) 55%,transparent 75%),
  radial-gradient(ellipse 45% 38% at var(--mx) var(--my),rgba(255,248,230,.28),transparent 70%),
  linear-gradient(180deg,rgba(255,255,255,.1),transparent 30%)}
/* 6 heat-seal ridges */
#tcg .l-seal{background:
  repeating-linear-gradient(90deg,rgba(120,255,120,.35) 0 1px,rgba(0,0,0,.45) 1px 2px,transparent 2px 4px) top/100% 10.5% no-repeat,
  repeating-linear-gradient(90deg,rgba(120,255,120,.35) 0 1px,rgba(0,0,0,.45) 1px 2px,transparent 2px 4px) bottom/100% 7.5% no-repeat,
  linear-gradient(180deg,transparent 10.3%,rgba(0,0,0,.45) 10.8%,rgba(255,255,255,.25) 11.4%,transparent 12.5%,transparent 91.5%,rgba(255,255,255,.2) 92.2%,rgba(0,0,0,.45) 92.7%,transparent 93.3%)}
#tcg .tear{position:absolute;left:0;right:0;top:10.8%;height:3px;z-index:5;background:repeating-linear-gradient(90deg,rgba(0,0,0,.5) 0 6px,transparent 6px 10px)}
#tcg .tear i{position:absolute;left:0;top:-3px;height:9px;width:var(--tp,0%);background:linear-gradient(90deg,#fff,#eaffea);box-shadow:0 0 12px #fff,0 0 30px rgba(0,231,1,.9)}
#tcg .tear-zone{position:absolute;left:-10%;right:-10%;top:-4%;height:26%;z-index:6;cursor:ew-resize}
#tcg .packwrap.shake{animation:pkshake .35s}
@keyframes pkshake{25%{translate:-6px 0}50%{translate:5px 0}75%{translate:-3px 0}}
#tcg .packwrap.drop{transition:transform .8s cubic-bezier(.5,0,.8,.4),opacity .8s;transform:translateY(120vh) rotate(8deg);opacity:.4}

/* ======================= CARD SHELL ======================= */
#tcg .deck{position:absolute;width:var(--cw);aspect-ratio:63/88}
#tcg .slot{position:absolute;inset:0;transition:transform .45s cubic-bezier(.2,.8,.2,1);will-change:transform}
#tcg .slot.drag{transition:none}
#tcg .tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .1s linear}
#tcg .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
#tcg .flip.down{transform:rotateY(180deg)}
#tcg .front,#tcg .back{position:absolute;inset:0;border-radius:4.6%/3.3%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
#tcg .front{container-type:inline-size;isolation:isolate;box-shadow:0 18px 32px rgba(0,0,0,.55)}
#tcg .front>*{position:absolute}
#tcg .back{transform:rotateY(180deg);background:
  radial-gradient(circle at 50% 50%,transparent 26%,rgba(255,200,0,.12) 26.5% 27.5%,transparent 28%),
  repeating-conic-gradient(from 0deg at 50% 50%,#12283a 0 7.5deg,#0d1f2d 7.5deg 15deg),#0f212e;
  box-shadow:inset 0 0 0 calc(var(--cw) * .045) #1a2c38,inset 0 0 0 calc(var(--cw) * .052) #c9a54a,0 18px 30px rgba(0,0,0,.5)}
#tcg .back::after{content:"S";position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:calc(var(--cw) * .32);
  background:linear-gradient(180deg,#fff6d0,#d9ae45 50%,#8e6a1c 52%,#f0cf73);-webkit-background-clip:text;background-clip:text;color:transparent}
#tcg .back .gl{position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.25),transparent 50%);mix-blend-mode:overlay}

/* placeholders instead of text */
#tcg .ph{display:block;height:2.4cqi;border-radius:9px;background:rgba(12,18,28,.4)}
#tcg .ph.t{height:1.5cqi;background:rgba(12,18,28,.26)}
#tcg .orb{flex:none;width:5cqi;height:5cqi;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 9%,hsl(var(--h) 75% 58%) 32%,hsl(var(--h) 65% 30%));
  box-shadow:0 0 0 .5cqi rgba(255,255,255,.85),0 .5cqi 1cqi rgba(0,0,0,.35)}
#tcg .star{flex:none;width:3.2cqi;height:3.2cqi;background:#15171c;clip-path:polygon(50% 0,63% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,37% 36%)}
#tcg .dot{flex:none;width:2.8cqi;height:2.8cqi;border-radius:50%;background:#15171c}
#tcg .syms{display:flex;gap:.6cqi}

/* ======================= COMMON / HOLO (standard layout) ======================= */
#tcg .std{background:linear-gradient(135deg,#ece7da,#bdb6a5 44%,#f7f3e8 56%,#aaa392)}
#tcg .std .body{inset:4.4% 5% 3.4%;border-radius:1.6%/1.2%;overflow:hidden;
  background:linear-gradient(172deg,hsl(var(--h) 40% 70%),hsl(var(--h) 34% 52%) 60%,hsl(var(--h) 30% 44%));box-shadow:inset 0 0 0 .4cqi rgba(0,0,0,.22)}
#tcg .std .body::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(35deg,rgba(255,255,255,.07) 0 1px,transparent 1px 6px),radial-gradient(90% 50% at 50% 0,rgba(255,255,255,.3),transparent)}
#tcg .body>*{position:absolute}
#tcg .nbar{left:4%;right:4%;top:1.4%;height:6%;display:flex;align-items:center;justify-content:space-between}
#tcg .nbar .ph{height:3.4cqi}
#tcg .hp{display:flex;align-items:center;gap:1.6cqi}
#tcg .win{left:4.2%;right:4.2%;top:8.4%;height:43.5%;z-index:3;overflow:hidden;
  box-shadow:0 0 0 .9cqi #efe3b3,0 0 0 1.3cqi #8d7a45,0 .8cqi 1.6cqi .8cqi rgba(0,0,0,.35)}
#tcg .win svg,#tcg .win img{display:block;width:100%;height:100%;object-fit:cover}
#tcg .win::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 2cqi rgba(0,0,0,.45);z-index:4}
#tcg .strip{left:11%;right:11%;top:54%;height:3.4%;display:grid;place-items:center;background:linear-gradient(90deg,#b7ae96,#f2ead0,#b7ae96);clip-path:polygon(3% 0,97% 0,100% 100%,0 100%)}
#tcg .strip .ph{width:62%;height:1.4cqi;background:rgba(0,0,0,.28)}
#tcg .atks{left:5%;right:5%;top:59.5%;height:25.5%;display:flex;flex-direction:column;justify-content:space-between}
#tcg .atk{display:flex;align-items:center;gap:2.4cqi}
#tcg .cost{display:flex;gap:.9cqi;width:22%}
#tcg .atk .nm{width:42%;height:3.4cqi}
#tcg .atk .dmg{margin-left:auto;width:10%;height:3.8cqi}
#tcg .desc{display:flex;flex-direction:column;gap:1.3cqi;padding:0 2%}
#tcg .wrr{left:5%;right:5%;top:86.5%;height:5%;display:flex;justify-content:space-between;align-items:center;border-top:.3cqi solid rgba(0,0,0,.18)}
#tcg .wrr span{display:flex;gap:1cqi;align-items:center}#tcg .wrr .ph{width:8cqi;height:1.4cqi}#tcg .wrr .orb{width:3.6cqi;height:3.6cqi}
#tcg .bot{left:5%;right:5%;bottom:1.2%;height:3.6%;display:flex;justify-content:space-between;align-items:center}
#tcg .bot .ph{width:24%;height:1.3cqi}

/* REVERSE HOLO — whole card is foil, art window stays matte */
#tcg .revfoil{inset:0;z-index:2;pointer-events:none;mix-blend-mode:color-dodge;opacity:var(--ho,.5);
  background:
   radial-gradient(circle,rgba(255,255,255,.9) 0 .5px,transparent 1px) 0 0/7px 7px,
   radial-gradient(circle,rgba(255,255,255,.6) 0 .4px,transparent .9px) 3px 4px/11px 9px,
   repeating-linear-gradient(115deg,hsl(0 90% 60%) 0%,hsl(50 90% 60%) 4%,hsl(120 80% 60%) 8%,hsl(190 90% 60%) 12%,hsl(260 80% 65%) 16%,hsl(320 85% 62%) 20%,hsl(360 90% 60%) 24%) var(--bgx,50%) var(--bgy,50%)/400% 400%;
  filter:brightness(.65) contrast(1.4);
  -webkit-mask:radial-gradient(farthest-corner at var(--mx) var(--my),#000 10%,rgba(0,0,0,.25) 80%);mask:radial-gradient(farthest-corner at var(--mx) var(--my),#000 10%,rgba(0,0,0,.25) 80%)}
/* HOLO RARE — foil lives only in the art window */
#tcg .cosmos{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:color-dodge;opacity:calc(var(--ho,.55) * .7);-webkit-mask:radial-gradient(farthest-corner at var(--mx) var(--my),#000 5%,rgba(0,0,0,.2) 70%);mask:radial-gradient(farthest-corner at var(--mx) var(--my),#000 5%,rgba(0,0,0,.2) 70%);
  background:
   radial-gradient(circle at 20% 30%,#fff 0 .8px,transparent 1.4px) 0 0/19px 17px,
   radial-gradient(circle at 60% 70%,#fff 0 1.2px,transparent 2px) var(--bgx) 0/37px 31px,
   radial-gradient(circle at 50% 50%,rgba(255,255,255,.8) 0 .5px,transparent 1px) 0 var(--bgy)/9px 11px,
   repeating-linear-gradient(90deg,hsl(0 95% 62%) 0%,hsl(55 95% 62%) 5%,hsl(140 85% 60%) 10%,hsl(200 95% 62%) 15%,hsl(275 85% 66%) 20%,hsl(360 95% 62%) 25%) var(--bgx) 0/300% 100%;
  filter:brightness(.5) contrast(1.5)}
#tcg .std.h .win svg{filter:brightness(.72) saturate(1.25)}

/* ======================= FULL ART ======================= */
#tcg .fa{background:linear-gradient(135deg,#f1f4f7,#9aa3ad 44%,#fff 56%,#89929c)}
#tcg .fa .full,#tcg .sir .full{inset:3.2% 4.2%;border-radius:1.8%/1.3%;overflow:hidden}
#tcg .full>svg,#tcg .full>img{display:block;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
#tcg .etchfoil{inset:3.2% 4.2%;z-index:2;pointer-events:none;mix-blend-mode:overlay;
  background:repeating-linear-gradient(-58deg,transparent 0 .8cqi,rgba(255,255,255,.85) .8cqi 1.1cqi),repeating-linear-gradient(32deg,transparent 0 2.4cqi,rgba(255,255,255,.35) 2.4cqi 2.6cqi);
  -webkit-mask:radial-gradient(circle at var(--mx) var(--my),#000 0,rgba(0,0,0,.15) 55%,transparent 75%);mask:radial-gradient(circle at var(--mx) var(--my),#000 0,rgba(0,0,0,.15) 55%,transparent 75%)}
#tcg .rainfoil{inset:3.2% 4.2%;z-index:3;pointer-events:none;mix-blend-mode:color-dodge;opacity:var(--ho,.5);
  background:repeating-linear-gradient(-58deg,hsl(0 90% 55%) 0%,hsl(45 90% 55%) 3%,hsl(120 80% 55%) 6%,hsl(195 90% 58%) 9%,hsl(265 80% 62%) 12%,hsl(330 85% 58%) 15%,hsl(360 90% 55%) 18%) var(--bgx) var(--bgy)/350% 350%;
  filter:brightness(.55) contrast(1.6);
  -webkit-mask:repeating-linear-gradient(-58deg,transparent 0 .8cqi,#000 .8cqi 1.1cqi),radial-gradient(circle at var(--mx) var(--my),#000,transparent 70%);-webkit-mask-composite:source-in;
  mask:repeating-linear-gradient(-58deg,transparent 0 .8cqi,#000 .8cqi 1.1cqi),radial-gradient(circle at var(--mx) var(--my),#000,transparent 70%);mask-composite:intersect}
#tcg .ui{inset:3.2% 4.2%;z-index:5}
#tcg .ui>*{position:absolute}
#tcg .ui .ph{background:rgba(255,255,255,.78);box-shadow:0 .3cqi .8cqi rgba(0,0,0,.4)}
#tcg .ui .ph.t{background:rgba(255,255,255,.55)}
#tcg .ui .star,#tcg .ui .dot{background:#fff}
#tcg .fa .panel{left:0;right:0;bottom:0;height:40%;background:linear-gradient(180deg,transparent,rgba(5,10,20,.35) 18%,rgba(5,10,20,.55))}
#tcg .fa .atks{top:64%;height:22%;left:6%;right:6%}
#tcg .fa .wrr{top:88.5%;height:4%;left:6%;right:6%;border-top-color:rgba(255,255,255,.3)}
#tcg .fa .bot{bottom:.6%;left:6%;right:6%}
#tcg .fa .nbar{left:5%;right:5%;top:1.6%}

/* ======================= SPECIAL ILLUSTRATION RARE ======================= */

    tick(){init();const t=ctx.currentTime;nz(t,.035,3000+Math.random()*3000,6,.16);nz(t+.01,.02,7000,4,.08,'highpass')},
    rip(){init();const t=ctx.currentTime;nz(t,.45,900,1.2,.5,'bandpass',5500);nz(t+.05,.35,4000,.8,.25,'highpass');for(let i=0;i<9;i++)nz(t+i*.04,.03,3000+Math.random()*4000,5,.2);tone(t,90,.25,.3)},
    slide(){init();const t=ctx.currentTime;nz(t,.5,400,.7,.18,'lowpass',2200)},
    swoosh(){init();const t=ctx.currentTime;nz(t,.28,600,1,.35,'bandpass',3500)},
    flip(){init();const t=ctx.currentTime;nz(t,.04,1800,2,.3);nz(t+.12,.05,1200,2,.35);tone(t+.12,180,.08,.12,'triangle')},
    charge(){init();const t=ctx.currentTime;const o=ctx.createOscillator(),v=ctx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(440,t+.95);
      const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(2500,t+.95);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.09,t+.8);v.gain.linearRampToValueAtTime(0,t+1);o.connect(f).connect(v).connect(ctx.destination);o.start(t);o.stop(t+1.05)},
    reveal(r,foil){init();const t=ctx.currentTime;
      if(r==='c'){tone(t,660,.3,.12);tone(t+.06,990,.35,.07)}
      if(r==='r'){[523,659,784,1047].forEach((f,i)=>{tone(t+i*.07,f,.5,.12,'triangle');tone(t+i*.07,f*2,.3,.03)})}
      if(r==='u'){tone(t,65,.9,.35);[523,659,784,1047,1319,1568].forEach((f,i)=>{tone(t+i*.06,f,.9,.11,'triangle');tone(t+i*.06,f*1.5,.6,.03)});nz(t,.8,8000,.5,.08,'highpass')}
      if(foil){for(let i=0;i<10;i++)tone(t+.15+i*.045+Math.random()*.03,2000+Math.random()*3000,.25,.035)}},
    buy(){init();const t=ctx.currentTime;tone(t,880,.08,.1,'square');tone(t+.07,1320,.12,.08,'square')},
    no(){init();const t=ctx.currentTime;tone(t,180,.2,.15,'square')}
  }})();

/* ================= CREATURE ART ENGINE =================
   paint(): any silhouette -> gradient body + cel shadow + light-side rim + texture + ink line, driven by a light vector.
   Builders: tube (serpent bodies/tails), fins, wing (feather rows), mane, eye, flame, clouds.
   Output is an SVG string that gets baked to an <img> once, so it costs nothing while the card moves. */
const Art=(()=>{
const f=p=>p[0].toFixed(1)+' '+p[1].toFixed(1);
const lerp=(a,b,t)=>a+(b-a)*t;
function cr(pts,closed=true){const n=pts.length,P=i=>pts[(i+n)%n];let d='M'+f(pts[0]);
  for(let i=0;i<(closed?n:n-1);i++){const p0=closed?P(i-1):pts[Math.max(0,i-1)],p1=P(i),p2=P(i+1),p3=closed?P(i+2):pts[Math.min(n-1,i+2)];
    d+=` C${f([p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6])} ${f([p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6])} ${f(p2)}`}
  return d+(closed?'Z':'')}
function sample(pts,steps=8){const out=[],n=pts.length,Q=i=>pts[Math.max(0,Math.min(n-1,i))];
  for(let i=0;i<n-1;i++)for(let s=0;s<steps;s++){const t=s/steps,p0=Q(i-1),p1=Q(i),p2=Q(i+1),p3=Q(i+2);
    const c=k=>.5*(2*p1[k]+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t*t+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t*t*t);
    out.push([c(0),c(1),lerp(p1[2],p2[2],t)])}
  out.push(pts[n-1]);return out}
function frames(sp){return sp.map((p,i)=>{const a=sp[Math.max(0,i-1)],b=sp[Math.min(sp.length-1,i+1)];const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return{x:p[0],y:p[1],w:p[2],tx:dx/l,ty:dy/l,nx:-dy/l,ny:dx/l}})}
function tube(pts,off=0,wk=1){const F=frames(sample(pts));const L=[],R=[];
  F.forEach(q=>{const cx=q.x+q.nx*q.w*off,cy=q.y+q.ny*q.w*off,h=q.w*wk/2;L.push([cx+q.nx*h,cy+q.ny*h]);R.push([cx-q.nx*h,cy-q.ny*h])});
  const a=F[0],b=F[F.length-1];return cr([[a.x-a.tx*a.w*.4,a.y-a.ty*a.w*.4],...L,[b.x+b.tx*b.w*.45,b.y+b.ty*b.w*.45],...R.reverse()])}
function ctx(L,sd=7,hd=2.4){return{defs:[],n:0,L,sd,hd}}
function paint(A,d,o){const id='p'+(A.n++),[lx,ly]=o.L||A.L,sd=o.sd??A.sd,hd=o.hd??A.hd,c=o.c;
  const M=(nm,dx,dy)=>`<mask id="${nm}${id}" maskUnits="userSpaceOnUse" x="-100" y="-100" width="500" height="600"><rect x="-100" y="-100" width="500" height="600" fill="#fff"/><path d="${d}" transform="translate(${dx.toFixed(2)} ${dy.toFixed(2)})" fill="#000"/></mask>`;
  A.defs.push(`<linearGradient id="g${id}" x1="${.5+lx*.5}" y1="${.5+ly*.5}" x2="${.5-lx*.5}" y2="${.5-ly*.5}"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient><clipPath id="c${id}"><path d="${d}"/></clipPath>${M('m',lx*sd,ly*sd)}${M('h',-lx*hd,-ly*hd)}`);
  return `<g${o.op?` opacity="${o.op}"`:''}><path d="${d}" fill="url(#g${id})"/><g clip-path="url(#c${id})">${o.tex?`<path d="${d}" fill="url(#${o.tex})" opacity="${o.texo||.28}"/>`:''}<path d="${d}" fill="${c[2]}" mask="url(#m${id})" opacity="${o.so||.78}"/><path d="${d}" fill="${c[3]||'#fff'}" mask="url(#h${id})" opacity="${o.ho||.8}"/>${o.extra||''}</g>${o.lw===0?'':`<path d="${d}" fill="none" stroke="${o.lc||'#1c0e0a'}" stroke-width="${o.lw||1.2}" stroke-linejoin="round" stroke-linecap="round"/>`}</g>`}
function eye(x,y,r,rot,iris,o={}){const id='e'+Math.round(x*7+y*13);
  const al=`M${-r*1.35} 0 Q${-r*.2} ${-r*1.25} ${r*1.35} ${-r*.3} Q${r*.1} ${r*.95} ${-r*1.35} 0Z`;
  return `<g transform="translate(${x} ${y}) rotate(${rot})">${o.glow?`<ellipse rx="${r*2.4}" ry="${r*1.7}" fill="${iris}" opacity=".45" filter="url(#bl3)"/>`:''}
   <defs><clipPath id="${id}"><path d="${al}"/></clipPath><radialGradient id="${id}i"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="${iris}"/><stop offset=".85" stop-color="${o.dark||'#5a2a00'}"/><stop offset="1" stop-color="#140800"/></radialGradient></defs>
   <path d="${al}" fill="${o.sclera||'#fff6e2'}"/><g clip-path="url(#${id})"><circle cx="${r*.05}" cy="${-r*.12}" r="${r*.82}" fill="url(#${id}i)"/>
   ${o.slit?`<ellipse cx="${r*.05}" cy="${-r*.12}" rx="${r*.16}" ry="${r*.72}" fill="#0a0404"/>`:`<circle cx="${r*.05}" cy="${-r*.12}" r="${r*.34}" fill="#0a0404"/>`}
   <path d="M${-r*1.4} ${-r*.2} Q0 ${-r*1.1} ${r*1.4} ${-r*.5} L${r*1.4} ${-r*2} L${-r*1.4} ${-r*2}Z" fill="#000" opacity=".28"/></g>
   <circle cx="${-r*.3}" cy="${-r*.45}" r="${r*.22}" fill="#fff"/><circle cx="${r*.35}" cy="${r*.12}" r="${r*.1}" fill="#fff" opacity=".85"/>
   <path d="M${-r*1.45} ${r*.05} Q${-r*.2} ${-r*1.3} ${r*1.45} ${-r*.3}" fill="none" stroke="#140806" stroke-width="${r*.32}" stroke-linecap="round"/></g>`}
function flame(x,y,h,w,rot,o={}){const P=s=>{const H=h*s,W=w*s;return `M0 0 C${W*.9} ${-H*.12} ${W*.5} ${-H*.55} ${W*.08} ${-H} C${-W*.05} ${-H*.62} ${-W*.8} ${-H*.45} ${-W*.55} ${-H*.12} C${-W*.45} ${-H*.02} ${-W*.2} ${H*.04} 0 0Z`};
  return `<g transform="translate(${x} ${y}) rotate(${rot})">${o.glow===false?'':`<path d="${P(1.15)}" fill="#ff7a1a" opacity=".55" filter="url(#bl3)"/>`}
   <path d="${P(1)}" fill="url(#flA)"/><path d="${P(.66)}" transform="translate(0 ${-h*.04})" fill="url(#flB)"/><path d="${P(.36)}" transform="translate(0 ${-h*.06})" fill="#fffbe0"/></g>`}
function wing(A,S,Wr,a0,a1,n,l0,l1,wd,cols,lc){let out='';const R=Math.PI/180;
  const feather=(bx,by,ang,len,w)=>{const c=Math.cos(ang*R),s=Math.sin(ang*R),T=([u,v])=>[bx+u*c-v*s,by+u*s+v*c];
    const d=cr([[0,0],[len*.3,-w],[len*.78,-w*.72],[len,0],[len*.72,w*.55],[len*.28,w*.8]].map(T));
    const tip=T([len*.86,0]);return paint(A,d,{c:cols,lw:.55,lc,sd:2.2,hd:1.1})+`<path d="M${f([bx,by])} L${f(tip)}" stroke="${lc}" stroke-width=".45" opacity=".55"/>`};
  for(let k=4;k>=0;k--)out+=feather(Wr[0],Wr[1],a1-k*8-4,l1*(1.02-k*.04),wd*1.05);
  [[1,1],[.66,.95],[.42,.9]].forEach(([r,ws])=>{for(let i=0;i<n;i++){const t=i/(n-1);out+=feather(lerp(S[0],Wr[0],t*.96),lerp(S[1],Wr[1],t*.96),lerp(a0,a1,t)+(1-r)*8,lerp(l0,l1,t)*r,wd*ws)}});
  out+=paint(A,tube([[S[0],S[1],9],[lerp(S[0],Wr[0],.5)-2,lerp(S[1],Wr[1],.5),7],[Wr[0],Wr[1],5]]),{c:cols,lw:.6,lc,sd:3,hd:1.4,tex:'fur',texo:.15});
  return out}
function mane(A,cx,cy,rIn,rOut,n,r,cols){const pts=[];for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2,rr=i%2?rIn*(0.95+r()*.1):rOut*(0.85+r()*.3);pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr])}
  return paint(A,cr(pts),{c:cols,tex:'fur',texo:.35,sd:6,hd:2.2})}
function clouds(y,cnt,r,cols,rng,w=200){let s='';const id='cg'+Math.round(y);
  s+=`<defs><radialGradient id="${id}" cx=".62" cy=".28" r=".75"><stop offset="0" stop-color="${cols[0]}"/><stop offset=".55" stop-color="${cols[1]}"/><stop offset="1" stop-color="${cols[2]}"/></radialGradient></defs>`;
  for(let i=0;i<cnt;i++){const x=(i+rng()*.6)/cnt*(w+40)-20,rr=r*(.6+rng()*.7);s+=`<ellipse cx="${x.toFixed(1)}" cy="${(y+rng()*8-4).toFixed(1)}" rx="${(rr*1.4).toFixed(1)}" ry="${rr.toFixed(1)}" fill="url(#${id})"/>`}
  return s}
const rngS=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const head_=(w,h,extra='')=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice"><defs>
  <filter id="bl2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="bl3" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.5"/></filter>
  <filter id="bl8" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  <pattern id="scl" width="7" height="5" patternUnits="userSpaceOnUse"><path d="M0 5 Q3.5 -.5 7 5" fill="none" stroke="#000" stroke-width=".7"/><path d="M-3.5 2.5 Q0 -3 3.5 2.5 M3.5 2.5 Q7 -3 10.5 2.5" fill="none" stroke="#000" stroke-width=".7"/></pattern>
  <pattern id="strp" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(78)"><path d="M0 1 C3 2 6 0 9 1.6 L9 3.6 C6 2.4 3 4 0 3Z" fill="#140602"/></pattern>
  <pattern id="fur" width="5" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><path d="M0 2 L3.4 2" stroke="#000" stroke-width=".55" stroke-linecap="round"/></pattern>
  <linearGradient id="flA" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb02e"/><stop offset=".5" stop-color="#ff5a14"/><stop offset="1" stop-color="#c81e0a"/></linearGradient>
  <linearGradient id="icA" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3a8ad8"/><stop offset=".6" stop-color="#9ae4ff"/><stop offset="1" stop-color="#f0fcff"/></linearGradient>
  <linearGradient id="flB" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff1a0"/><stop offset="1" stop-color="#ffa21e"/></linearGradient>${extra}</defs>`;

function crystal(x,y,h,w,rot){return `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0 0 L${w} ${-h*.7} L0 ${-h} L${-w} ${-h*.7} Z" fill="url(#icA)" stroke="#23456e" stroke-width=".6"/><path d="M0 0 L0 ${-h} L${-w} ${-h*.7}Z" fill="#fff" opacity=".4"/><path d="M0 ${-h} L${(w*.35).toFixed(2)} ${(-h*.72).toFixed(2)}" stroke="#fff" stroke-width=".6"/></g>`}
const faDefs=h=>`<radialGradient id="fab" cx=".5" cy=".45" r=".75"><stop offset="0" stop-color="hsl(${h} 70% 56%)"/><stop offset=".55" stop-color="hsl(${h} 60% 20%)"/><stop offset="1" stop-color="#05070c"/></radialGradient>`;
function faBG(h,r,cx=100,cy=130){let s=`<rect width="200" height="280" fill="url(#fab)"/>`;
  for(let i=0;i<44;i++){const a0=i/44*Math.PI*2,a1=a0+Math.PI/44;s+=`<polygon points="${cx},${cy} ${cx+Math.cos(a0)*340},${cy+Math.sin(a0)*340} ${cx+Math.cos(a1)*340},${cy+Math.sin(a1)*340}" fill="hsl(${h} 90% 75%)" opacity="${(.03+r()*.08).toFixed(3)}"/>`}
  s+=`<circle cx="${cx}" cy="${cy}" r="70" fill="hsl(${h} 90% 70%)" opacity=".35" filter="url(#bl8)"/>`;
  for(let i=0;i<26;i++)s+=`<circle cx="${(r()*200).toFixed(1)}" cy="${(r()*280).toFixed(1)}" r="${(.4+r()*1.3).toFixed(1)}" fill="hsl(${h} 100% 88%)" opacity="${(.3+r()*.6).toFixed(2)}"/>`;

   Every evolution line ends in a black, face-hidden slot in the binder showing
   how much of the line you own. Own all of it - raw, at grading, or slabbed, so
   sending a card off never locks you out - and the slot becomes a Craft button.
   Crafting does NOT consume the line. Crafted cards are pristine collector
   pieces: no condition, no wear, and they can't be sent for grading.
   col.rew[line] = when it was crafted (once per line). */

  p.lanes.forEach((cr,ln)=>{if(!cr)return;cr.canAttack=true;cr.refractUsed=false;
    if(cr.trait==='kindle'){const e=g.players[1-g.turn].lanes[ln];if(e){clHurt(g,1-g.turn,ln,1);clLog(g,cr.name+' kindles for 1')}}
    if(cr.trait==='regrow'&&cr.hp<cr.maxHp){cr.hp=Math.min(cr.maxHp,cr.hp+2);clLog(g,cr.name+' regrows 2')}
    if(cr.trait==='metamorph'){cr.moth++;}});
  clSweepKO(g);}
function clDraw(g,pi){const p=g.players[pi];
  if(!p.deck.length){p.crystals=Math.max(0,p.crystals-1);clLog(g,p.name+' has no cards left and loses a crystal');clWinCheck(g);return}
  const id=p.deck.shift();p.hand.push(id);
  if(p.hand.length>7)p.hand.shift();}       // simple over-7 trim
function clLog(g,t){g.log.push(t);if(g.log.length>6)g.log.shift()}
function clStackBonus(cr){return cr.stack.length}
function clPride(g,side,ln){const cr=g.players[side].lanes[ln];if(cr.trait!=='pride')return 0;
  return g.players[side].lanes.filter((x,i)=>x&&i!==ln).length}
function clEffAtk(g,side,ln){const cr=g.players[side].lanes[ln];if(!cr)return 0;
  let a=cr.atk+clStackBonus(cr)+clPride(g,side,ln);
  if(cr.trait==='ascend'&&cr.stack.length>=2)a+=3;
  a-=cr.chillAtk||0;return Math.max(0,a)}
/* deal `amt` to the creature in (side,ln); handles refract/phase/shell */
function clHurt(g,side,ln,amt,opt){opt=opt||{};const cr=g.players[side].lanes[ln];if(!cr)return;
  if(cr.trait==='refract'&&!cr.refractUsed){cr.refractUsed=true;amt=0}
  if(cr.trait==='phase'&&!cr.phaseUsed){cr.phaseUsed=true;if(Math.random()<.5){clLog(g,cr.name+' phases \u2014 the hit misses');amt=0}}
  if(cr.trait==='shell')amt=Math.max(0,amt-1);
  cr.hp-=amt;}
function clSweepKO(g){for(let side=0;side<2;side++)for(let ln=0;ln<3;ln++){const cr=g.players[side].lanes[ln];if(cr&&cr.hp<=0)clKO(g,side,ln)}}
function clKO(g,side,ln){const cr=g.players[side].lanes[ln];if(!cr)return;const p=g.players[side];
  let replace=null;
  if(cr.trait==='split'&&!cr.blob){replace=clBlob();clLog(g,cr.name+' splits into a Blob')}
  else if(cr.trait==='rebirth'&&cr.id!=null&&Math.random()<.5){p.hand.push(cr.id);clLog(g,cr.name+' is reborn \u2014 back to hand')}
  const loss=cr.blob?0:cr.cry;p.crystals=Math.max(0,p.crystals-loss);
  if(loss)clLog(g,p.name+' loses '+loss+' crystal'+(loss>1?'s':''));
  p.lanes[ln]=replace;clWinCheck(g)}
function clWinCheck(g){if(g.winner!=null)return;
  if(g.players[0].crystals<=0&&g.players[1].crystals<=0)g.winner=g.turn;
  else if(g.players[1].crystals<=0)g.winner=0;else if(g.players[0].crystals<=0)g.winner=1}
/* ---- actions ---- */
function clCanPlay(g,side,hi,ln){const p=g.players[side],id=p.hand[hi];if(id==null)return false;const c=CARD(id),line=ID2LINE[id],dest=p.lanes[ln];
  let cost=clInfo(id).cost;if(p.bonds[line])cost=Math.max(1,cost-1);
  if(cost>p.energy)return false;
  if(c.stage===0)return !dest;                                  // baby into empty lane
  if(!dest||dest.blob)return false;                             // teen/final need the prev stage
  return dest.line===line&&dest.stage===c.stage-1}
function clPlay(g,side,hi,ln){if(!clCanPlay(g,side,hi,ln))return false;const p=g.players[side],id=p.hand[hi],c=CARD(id),line=ID2LINE[id];
  let cost=clInfo(id).cost;if(p.bonds[line])cost=Math.max(1,cost-1);
  p.energy-=cost;p.hand.splice(hi,1);
  if(c.stage===0){const cr=clCreature(id);if(cr.trait==='pounce')cr.canAttack=true;p.lanes[ln]=cr;clLog(g,p.name+' plays '+cr.name);
    if(cr.trait==='guide'){const bi=p.deck.findIndex(x=>CARD(x).stage===0);if(bi>=0){p.hand.push(p.deck.splice(bi,1)[0]);clLog(g,cr.name+' guides a baby to hand')}}
    if(cr.trait==='foresight'&&p.deck.length){if(p.isAI){if(clInfo(p.deck[0]).cost>p.maxEnergy)p.deck.push(p.deck.shift())}else{clFore(g)}}
    if(cr.trait==='lure'){const es=g.players[1-side].lanes;if(!es[ln]){const j=[0,1,2].filter(i=>es[i]);if(j.length){const k=j[Math.floor(Math.random()*j.length)];es[ln]=es[k];es[k]=null;clLog(g,cr.name+' lures a foe across')}}}
  }else{const old=p.lanes[ln],keep=old.canAttack;const cr=clCreature(id);cr.stack=old.stack.concat([old.id]);cr.canAttack=keep;
    p.lanes[ln]=cr;clLog(g,p.name+' evolves into '+cr.name);
    if(cr.trait==='avalanche'){const e=g.players[1-side].lanes[ln];if(e){clHurt(g,1-side,ln,2);clLog(g,cr.name+' avalanche hits for 2')}}}
  clSweepKO(g);return true}
function clMetaTick(g,side){const p=g.players[side];p.lanes.forEach((cr,ln)=>{if(cr&&cr.trait==='metamorph'&&cr.moth>=2&&cr.stage<2){
  const need=lineOf(cr.line).find(c=>c.stage===cr.stage+1),hi=p.hand.findIndex(id=>ID2LINE[id]===cr.line&&CARD(id).stage===cr.stage+1);
  if(hi>=0){const keep=cr.canAttack,id=p.hand.splice(hi,1)[0],nc=clCreature(id);nc.stack=cr.stack.concat([cr.id]);nc.canAttack=keep;nc.moth=0;p.lanes[ln]=nc;clLog(g,cr.name+' metamorphoses free into '+nc.name)}}})}
function clAttack(g,side,ln){const atk=g.players[side].lanes[ln];if(!atk||!atk.canAttack)return null;
  const dmg=clEffAtk(g,side,ln);if(dmg<=0){atk.canAttack=false;return null}
  const def=g.players[1-side].lanes[ln];atk.canAttack=false;let killed=false;
  if(def){let d=dmg;if(CL_STRONG[atk.type]&&CL_STRONG[atk.type].indexOf(def.type)>=0)d+=2;
    if(atk.trait==='ferocity'&&def.hp<def.maxHp)d+=2;
    clHurt(g,1-side,ln,d);
    if(def&&g.players[1-side].lanes[ln]===def){                 // still alive: reflect + debuffs
      if(def.trait==='spines'){atk.hp-=2;clLog(g,'Spines hit back for 2')}
      if(def.trait==='thorns'){atk.hp-=1;clLog(g,'Thorns hit back for 1')}
      if(atk.trait==='chill')def.chillAtk=1;
      if(atk.trait==='sting'&&Math.random()<.5){def.skip=true;clLog(g,def.name+' is stung and will skip its attack')}}
    if(atk.trait==='scorch'){[ln-1,ln+1].forEach(l=>{if(l>=0&&l<3&&g.players[1-side].lanes[l]){clHurt(g,1-side,l,1)}});clLog(g,atk.name+' scorches the neighbours')}
    clLog(g,atk.name+' hits '+def.name+' for '+d);
    clSweepKO(g);killed=g.players[1-side].lanes[ln]!==def;
    return {target:'creature',lane:ln,dmg:d,killed,atkU:atk.u}}
  // empty lane -> crystals, unless blocked by a Bulwark on the defender's board
  const bulwark=g.players[1-side].lanes.some(c=>c&&c.trait==='bulwark');
  if(bulwark){clLog(g,atk.name+' is walled off by Bulwark')}
  else{g.players[1-side].crystals=Math.max(0,g.players[1-side].crystals-1);clLog(g,atk.name+' shatters a crystal');clWinCheck(g)}
  clSweepKO(g);return {target:'crystal',lane:ln,atkU:atk.u}}
function clDice(g,side,ln,targetU){const atk=g.players[side].lanes[ln];const def=g.players[1-side].lanes[ln];
  const roll=1+Math.floor(Math.random()*6);let txt='',dbl=roll===6||(roll===5&&atk&&atk.trait==='surge');
  if(roll===1){if(atk){atk.hp-=1;clLog(g,'Dice 1 \u2014 backfire! '+atk.name+' takes 1')}txt='Backfire!'}
  else if(def&&def.u===targetU){let bonus=dbl?clEffAtk(g,side,ln):roll;clHurt(g,1-side,ln,bonus);txt=dbl?'DOUBLE! +'+bonus:'+'+bonus;clLog(g,'Dice '+roll+' \u2014 '+txt)}
  else{txt='Dice '+roll;clLog(g,'Dice '+roll+' \u2014 target gone')}
  clSweepKO(g);return {roll,txt,dbl}}
function clEndTurn(g){const p=g.players[g.turn];
  p.lanes.forEach(cr=>{if(cr){cr.chillAtk=0;cr.skip=false}});   // clear this side's temp debuffs at end of its turn
  g.turn=1-g.turn;g.seq++;clBeginTurn(g);
  // metamorph free evolve happens at the very start of a turn, after draws
  clMetaTick(g,g.turn);}

function clBegin(mode){SFX.init();SFX.tick();CL.mode=mode;const deck=clActive().cards.slice();

/* ---- deck builder ---- */

/* ---- board ---- */
function clRel(){return CL.mode==='pass'?CL.game.turn:CL.side}       // which side "I" am for this render
function clMyTurn(){const g=CL.game;return g.winner==null&&(CL.mode==='pass'?true:g.turn===CL.side)}
function clToken(cr,side,ln,mine){const drop=mine&&CL.sel!=null&&clMyTurn()&&clCanPlay(CL.game,side,CL.sel,ln)?' drop':'';
  if(!cr)return `<div class="cllane empty${drop}" data-side="${side}" data-ln="${ln}"><span class="cllane-x"></span></div>`;
  const c=cr.id!=null?CARD(cr.id):null,eff=clEffAtk(CL.game,side,ln),tr=CL_TR[cr.trait];
  const hurt=cr.hp<cr.maxHp;
  return `<div class="cllane${mine?' mine':''}${drop}${cr.canAttack&&mine&&clMyTurn()&&CL.sel==null?' ready':''}" data-side="${side}" data-ln="${ln}" data-u="${cr.u}">
    <div class="cltok t-${cr.type}${hurt?' hurt':''}">
     ${cr.stack.map((sid,i)=>`<div class="clunder" style="transform:translate(${-(i+1)*3}px,${(i+1)*4}px)"></div>`).join('')}
     <div class="clart">${c?cardFrontBase(c,false):'<div class="clblob"></div>'}</div>
     <div class="cltype" style="background:${CL_TC[cr.type]}">${CL_TN[cr.type][0]}</div>
     ${tr?`<div class="cltrait" title="${tr[0]}: ${tr[1]}">${tr[2]}</div>`:''}
     ${cr.stack.length?`<div class="clstk">+${cr.stack.length}</div>`:''}
     <div class="clhpbar"><i style="width:${Math.max(0,cr.hp/cr.maxHp*100)}%"></i></div>
     <div class="clstats"><span class="clatk${eff>cr.atk+cr.stack.length?' up':''}">${eff}</span><span class="clhp">${cr.hp}</span></div>
     ${mine&&cr.trait==='undertow'&&!CL.game.players[side].swapped&&clMyTurn()?'<button class="clact swap" data-swap="'+ln+'">\u21C4</button>':''}
    </div></div>`}
const CL_GEM_ON='<svg viewBox="0 0 24 24" class="clgem"><path d="M5 3h14l4 6-11 13L1 9z" fill="#1f6fd6"/><path d="M5 3h14l4 6H1z" fill="#59b6f5"/><path d="M8 3l4 6 4-6z" fill="#bfe9ff"/><path d="M1 9l11 13L23 9" fill="none" stroke="#8fd3ff" stroke-width="1.1" opacity=".55"/><path d="M12 9v13M5 3l7 6 7-6" fill="none" stroke="#cdeeff" stroke-width="1" opacity=".7"/><path d="M1 9h22" stroke="#0d3f78" stroke-width="1" opacity=".5"/></svg>';
const CL_GEM_OFF='<svg viewBox="0 0 24 24" class="clgem off"><path d="M5 3h14l4 6-11 13L1 9z" fill="#1b2a33"/><path d="M5 3h14l4 6H1z" fill="#26404e"/><path d="M1 9h22M12 9v13M5 3l7 6 7-6" fill="none" stroke="#324c5b" stroke-width="1"/><path d="M9 4l3 8-2 7" fill="none" stroke="#101a20" stroke-width="1.3"/></svg>';
const CL_BOLT_ON='<svg viewBox="0 0 24 24" class="clbolt"><path d="M13.5 1.5 4 13.5h6.2L8.5 22.5 20 9.5h-6.6z" fill="#37e23f" stroke="#0a3d12" stroke-width="1.1" stroke-linejoin="round"/><path d="M12.6 4 7 12h4.4" fill="none" stroke="#d6ffd6" stroke-width="1.1" opacity=".8"/></svg>';
const CL_BOLT_OFF='<svg viewBox="0 0 24 24" class="clbolt off"><path d="M13.5 1.5 4 13.5h6.2L8.5 22.5 20 9.5h-6.6z" fill="#1b2a33" stroke="#324c5b" stroke-width="1.1" stroke-linejoin="round"/></svg>';
function clCrys(n){let h='';for(let i=0;i<6;i++)h+=i<n?CL_GEM_ON:CL_GEM_OFF;return `<div class="clcrys">${h}</div>`}
function clEnergy(p){let h='';for(let i=0;i<p.maxEnergy;i++)h+=i<p.energy?CL_BOLT_ON:CL_BOLT_OFF;return `<div class="clnrg">${h}</div>`}
function clBoard(){CL.screen='board';const g=CL.game,st=stage();root.onkeydown=null;
  const meSide=clRel(),opp=1-meSide,me=g.players[meSide],them=g.players[opp],my=clMyTurn();
  st.innerHTML=`<div class="clash clplay${my?' myturn':''}${CL.sel!=null?' cl-selmode':''}">
   <div class="cl-oppbar"><button class="btn ghost xs" id="clQuit">\u2190</button><b>${hx(them.name)}</b>${clCrys(them.crystals)}<span class="clhand">\uD83C\uDCA0 ${them.hand.length}</span>${clEnergy(them)}</div>
   <div class="cl-rows">
    <div class="cl-row opp">${[0,1,2].map(ln=>clToken(them.lanes[ln],opp,ln,false)).join('')}</div>
    <div class="cl-mid"><div class="cl-log">${g.log.slice(-3).map(t=>`<div>${hx(t)}</div>`).join('')}</div><div class="cl-turn">${g.winner!=null?'':(my?'Your turn':hx(them.name)+'\u2019s turn')}</div></div>
    <div class="cl-row you">${[0,1,2].map(ln=>clToken(me.lanes[ln],meSide,ln,true)).join('')}</div>
   </div>
   <div class="cl-youbar"><span class="cl-deckcount">\uD83C\uDCCF ${me.deck.length}</span>${clCrys(me.crystals)}${clEnergy(me)}<button class="btn cl-end" id="clEnd" ${my?'':'disabled'}>End turn</button></div>
   <div class="cl-hand" id="clHand">${me.hand.map((id,i)=>clHandCard(g,meSide,id,i)).join('')||'<span class="cl-nohand">No cards in hand</span>'}</div>
  </div>`;
  clWire();
  if(g.winner!=null)clResult();}
function clHandCard(g,side,id,i){const info=clInfo(id),c=CARD(id),p=g.players[side];let cost=info.cost;if(p.bonds[info.line])cost=Math.max(1,cost-1);
  const playable=clMyTurn()&&[0,1,2].some(ln=>clCanPlay(g,side,i,ln)),sel=CL.sel===i;
  return `<div class="clhc t-${info.type}${sel?' sel':''}${playable?' can':' cant'}" data-hi="${i}">
    <div class="clhc-cost${cost<info.cost?' bond':''}">${cost}</div>
    <div class="clart">${cardFrontBase(c,false)}</div>
    <div class="clhc-b"><b>${hx(c.name)}</b><span><em class="a">${info.atk}</em><em class="h">${info.hp}</em></span></div></div>`}
function clWire(){const g=CL.game,side=clRel(),my=clMyTurn();
  $('#clQuit').onclick=()=>{clLeave()};
  const end=$('#clEnd');if(end&&my)end.onclick=()=>clDoEnd();
  root.querySelectorAll('.clhc').forEach(el=>el.onclick=()=>{if(!my)return zoomId(+el.dataset.hi,side);const i=+el.dataset.hi;
    if(!el.classList.contains('can')){zoomHand(g,side,i);return}CL.sel=CL.sel===i?null:i;CL.swap=null;clBoard()});
  root.querySelectorAll('.cl-row.you .cllane').forEach(el=>{el.onclick=e=>{if(!my)return;const ln=+el.dataset.ln;
    if(CL.swap!=null){if(CL.swap!==ln&&g.players[side].lanes[ln]!==undefined){clSwap(side,CL.swap,ln)}CL.swap=null;return clBoard()}
    if(CL.sel!=null){if(clCanPlay(g,side,CL.sel,ln)){clDoPlay(CL.sel,ln)}else SFX.no();return}
    const cr=g.players[side].lanes[ln];if(cr){if(cr.canAttack){clDoAttack(ln)}else zoomCreature(cr)}}});
  root.querySelectorAll('.cl-row.opp .cllane').forEach(el=>{el.onclick=()=>{const cr=g.players[1-side].lanes[+el.dataset.ln];if(cr)zoomCreature(cr)}});
  root.querySelectorAll('[data-swap]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(!my)return;CL.swap=+b.dataset.swap;CL.sel=null;SFX.tick();clBoard()});}
function clSwap(side,a,b){const p=CL.game.players[side];if(p.swapped)return;[p.lanes[a],p.lanes[b]]=[p.lanes[b],p.lanes[a]];p.swapped=true;
  clLog(CL.game,'Undertow swaps lanes '+(a+1)+' and '+(b+1));SFX.swoosh();clAfter()}
function clDoPlay(hi,ln){const side=clRel();if(clPlay(CL.game,side,hi,ln)){CL.sel=null;SFX.tick();clAfter()}}
function clDoAttack(ln){const side=clRel();const res=clAttack(CL.game,side,ln);SFX.swoosh();
  if(res&&res.target==='creature'&&!res.killed&&CL.game.winner==null){clAfter();clOfferDice(ln,res.atkU)}
  else{if(res&&res.killed)SFX.boom();clAfter()}}
function clDoEnd(){CL.sel=null;CL.swap=null;const g=CL.game;const wasPass=CL.mode==='pass';
  clEndTurn(g);SFX.tick();
  if(g.winner!=null){clBoard();return}
  if(CL.mode==='solo'&&g.turn===1){clBoard();clBroadcast();clAISoon();return}
  if(wasPass){clPassScreen();return}
  clBoard();clBroadcast()}
function clAfter(){clWinCheck(CL.game);clBoard();clBroadcast();if(CL.game.winner!=null){clBroadcast()}}
/* dice overlay */
function clOfferDice(ln,targetU){const side=clRel();const ov=document.createElement('div');ov.className='cldice';
  ov.innerHTML=`<div class="cldice-box"><b>Gamble a dice roll?</b><small>2\u20135 adds damage \u00b7 6 doubles \u00b7 1 backfires</small>
    <div class="clfaces" id="clFace">\u2680</div>
    <div class="cldice-btns"><button class="btn ghost" id="clNoRoll">Skip</button><button class="btn" id="clRoll">Roll</button></div></div>`;
  root.appendChild(ov);
  const fin=()=>{ov.remove()};
  ov.querySelector('#clNoRoll').onclick=()=>{fin();clAfter()};
  ov.querySelector('#clRoll').onclick=()=>{const btns=ov.querySelector('.cldice-btns');btns.style.visibility='hidden';const face=ov.querySelector('#clFace');
    SFX.tick();let t=0;const iv=setInterval(()=>{face.textContent='\u2680\u2681\u2682\u2683\u2684\u2685'[Math.floor(Math.random()*6)];if(++t>10){clearInterval(iv);
      const res=clDice(CL.game,side,ln,targetU);face.textContent='\u2680\u2681\u2682\u2683\u2684\u2685'[res.roll-1];
      face.className='clfaces done '+(res.roll===1?'bad':res.dbl?'crit':'good');
      const tag=document.createElement('div');tag.className='cldice-res';tag.textContent=res.txt;ov.querySelector('.cldice-box').appendChild(tag);
      res.dbl?SFX.boom():res.roll===1?SFX.no():SFX.ding(660);

/* pass-and-play cover */
function clPassScreen(){const g=CL.game,st=stage();st.innerHTML=`<div class="clash clpass"><div class="cl-passbox">

/* results */
function clResult(){const g=CL.game,meSide=CL.mode==='pass'?g.winner:CL.side,win=g.winner===meSide;
  const ov=document.createElement('div');ov.className='clover';
  ov.innerHTML=`<div class="clover-box ${win?'win':'lose'}"><small>${CL.mode==='pass'?hx(g.players[g.winner].name)+' wins':(win?'Victory':'Defeat')}</small>
    <b>${win?'You win!':(CL.mode==='pass'?g.players[g.winner].name+' takes it':'You lost')}</b>
    <div class="clover-btns"><button class="btn ghost" id="clAgain">Rematch</button><button class="btn" id="clMenuBtn">Menu</button></div></div>`;
  root.appendChild(ov);
  if(win&&CL.mode==='solo'){try{SFX.reveal('u',true);SFX.boom()}catch(e){}}
  ov.querySelector('#clAgain').onclick=()=>{ov.remove();if(CL.mode==='party'){clLeave()}else clBegin(CL.mode)};

function clLeave(){if(CL.mode==='party'){try{B.send({t:'clashLeave'})}catch(e){}}CL.game=null;CL.mode='solo';CL.screen='menu';clMenu()}
function zoomCreature(cr){if(cr.id!=null)zoom({c:CARD(cr.id),foil:false,ins:null})}
function zoomId(hi,side){const id=CL.game.players[side].hand[hi];if(id!=null)zoom({c:CARD(id),foil:false,ins:null})}
function zoomHand(g,side,i){const id=g.players[side].hand[i];if(id!=null)zoom({c:CARD(id),foil:false,ins:null})}
function clFore(g){/* human owl: simple auto-keep for now */const p=g.players[g.turn];if(p.deck.length&&clInfo(p.deck[0]).cost>p.maxEnergy+1){p.deck.push(p.deck.shift());clLog(g,'Foresight sends the top card to the bottom')}}

/* ---- AI ---- */
function clAISoon(){CL.busy=true;setTimeout(()=>clAIStep(),720)}
function clAIStep(){const g=CL.game;if(!g||g.winner!=null||g.turn!==1){CL.busy=false;return}
  if(clAIPlay(g)){clBoard();return setTimeout(clAIStep,620)}
  if(clAIAttack(g)){clBoard();return setTimeout(clAIStep,640)}
  CL.busy=false;clEndTurn(g);
  if(g.winner!=null){clBoard();return}
  clBoard();}
function clAIPlay(g){const p=g.players[1],rnd=CL.diff==='easy';
  // evolve first (prefer finals), then play babies
  const evo=[];p.lanes.forEach((cr,ln)=>{if(!cr||cr.blob||cr.stage>=2)return;
    const hi=p.hand.findIndex(id=>ID2LINE[id]===cr.line&&CARD(id).stage===cr.stage+1);if(hi>=0&&clCanPlay(g,1,hi,ln))evo.push([hi,ln,CARD(p.hand[hi]).stage])});
  if(evo.length){evo.sort((a,b)=>b[2]-a[2]);const[hi,ln]=rnd?evo[Math.floor(Math.random()*evo.length)]:evo[0];return clPlay(g,1,hi,ln)}
  const babies=[];p.hand.forEach((id,hi)=>{if(CARD(id).stage===0){const empt=[0,1,2].filter(ln=>clCanPlay(g,1,hi,ln));if(empt.length)babies.push([hi,empt])}});
  if(babies.length){const[hi,lns]=babies[Math.floor(Math.random()*babies.length)];
    // prefer a lane facing an enemy (to trade) unless easy
    let ln=lns[0];if(!rnd){const face=lns.find(l=>g.players[0].lanes[l]);ln=face!=null?face:lns[Math.floor(Math.random()*lns.length)]}else ln=lns[Math.floor(Math.random()*lns.length)];
    return clPlay(g,1,hi,ln)}
  return false}
function clAIAttack(g){const p=g.players[1];for(let ln=0;ln<3;ln++){const cr=p.lanes[ln];if(!cr||!cr.canAttack||clEffAtk(g,1,ln)<=0)continue;
    const def=g.players[0].lanes[ln];const res=clAttack(g,1,ln);
    if(res&&res.target==='creature'&&!res.killed&&CL.diff!=='easy'&&def&&def.hp<=5){const roll=clDice(g,1,ln,res.atkU);/* hard/normal gamble to finish */}
    return true}
  return false}

function clHostStart(){const L=CL.lobby;if(!L||!L.ready||!L.theirReady||!L.theirs)return;

  CL.game=clStart(L.mineCards,L.theirs.cards,{n0:me,n1:L.theirName});

  clBoard();clBroadcast()}
function clBroadcast(){if(CL.mode==='party'&&CL.game){try{B.send({t:'clashState',game:CL.game})}catch(e){}}}
function clNet(m){
  if(m.t==='clashHello'){if(CL.lobby){CL.lobby.theirName=m.name||CL.lobby.theirName;if(CL.lobby.ready)clSendReady();clLobby()}
    else{try{B.send({t:'clashHello',name:B.me?B.me():'Mate'})}catch(e){}}return}
  if(m.t==='clashReady'){if(!CL.lobby)return;CL.lobby.theirReady=true;CL.lobby.theirName=m.name||CL.lobby.theirName;CL.lobby.theirs={name:m.deckName,cards:m.cards};if(CL.screen==='lobby')clLobby();return}
  if(m.t==='clashUnready'){if(CL.lobby){CL.lobby.theirReady=false;if(CL.screen==='lobby')clLobby()}return}
  if(m.t==='clashStart'){CL.mode='party';CL.side=1;CL.game=m.game;CL.screen='board';CL.sel=null;CL.swap=null;
    curView='clash';tabOn('clash');note('Battle started vs '+(m.hostName||'your mate'));clBoard();return}

  if(m.t==='clashLeave'){if(CL.mode==='party'){note('Your mate left the battle');CL.game=null;CL.mode='solo';if(curView==='clash'){CL.screen='menu';clMenu()}}return}}

/* ---------------- PERFORMANCE TRACKER ----------------
   The FPS button in the bar opens a live meter. "Diagnose binder" runs a scripted
   20s test on the player's own machine (idle / animations paused / scrolling /

const perfWait=ms=>new Promise(r=>setTimeout(r,ms));

  go('binder');await perfWait(700);const sc=root.querySelector('.binder'),top=()=>{sc.scrollTop=0},
    scroll=()=>{sc.scrollTop+=9;if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-2)sc.scrollTop=0};

   k=0;f=0;await perfPhase('hover rest (card every 600ms)',4500,top,()=>{if(++f%36)return;const m=ms[k++%ms.length];const t=m&&m.querySelector('.tilt');t&&activate(t,'card')})}

/* Graded view: one row of chips per filter (rarity, then grade, then how to

const GF={rar:'all',gr:'all',by:'grade'};
const GR_BANDS=[['all','All'],['10','10'],['9','9'],['8','8\u20138.5'],['7','7\u20137.5'],['low','6.5 & under']];
const inBand=(g,b)=>b==='all'||(b==='10'?g===10:b==='9'?g===9:b==='8'?g>=8&&g<9:b==='7'?g>=7&&g<8:g<7);
function slabFilters(all){

function gradeFX(g){const st=stage();

/* ---------------- TRADING ----------------
   Only while in a party. You see your mate's binder (and slabs), pick what you
   want from theirs and what you'll give from yours, and send an offer.

   Your side goes into ESCROW the moment you send: it leaves your binder so it
   can't be sold, graded or offered twice while they decide. Accept -> they hand
   over their side and you receive it. Decline, disconnect or a closed tab -> it
   comes straight back. Items:
     {k:'r', id, f}   one copy of a common/holo (f=1 for reverse holo)
     {k:'i', u, ins}  one individual Full Art+ copy or slab, condition and all  */
const TR={mate:null,sel:{give:[],want:[]},incoming:null,waiting:null};
const itemKey=it=>it.k==='i'?'i:'+it.u:'r:'+it.id+':'+(it.f?1:0);
function snapshot(){const counts={};SET.concat(OBS).forEach(c=>{const e=col[c.id];if(e&&(e.n||e.f))counts[c.id]=[HI(c.t)?0:e.n,e.f]});
  return{counts,inst:col.inst.filter(i=>i.st==='raw'||i.st==='slab').map(i=>JSON.parse(JSON.stringify(i)))}}
/* remove items from our collection; returns their full payloads, or null if any are missing */
function takeItems(items){const need={};items.forEach(it=>{const k=itemKey(it);need[k]=(need[k]||0)+1});
  for(const k in need){const [kind,a,b]=k.split(':');
    if(kind==='i'){const i=instBy(a);if(!i||(i.st!=='raw'&&i.st!=='slab'))return null}
    else{const e=col[a];if(!e||(b==='1'?e.f:e.n)<need[k])return null}}
  const out=[];
  items.forEach(it=>{if(it.k==='i'){const i=instBy(it.u);col.inst=col.inst.filter(x=>x.u!==it.u);
      if(i.st==='raw'&&HI(CARD(i.id).t)&&col[i.id])col[i.id].n--;out.push({k:'i',u:i.u,ins:i})}
    else{const e=col[it.id];it.f?e.f--:e.n--;out.push({k:'r',id:it.id,f:it.f?1:0})}});
  return out}
function giveItems(items){(items||[]).forEach(it=>{
  if(it.k==='i'&&it.ins){const i=JSON.parse(JSON.stringify(it.ins));if(i.st!=='slab')i.st='raw';
    if(instBy(i.u))return;col.inst.push(i);if(i.st==='raw'&&HI(CARD(i.id).t)){const e=col[i.id]||(col[i.id]={n:0,f:0});e.n++}}
  else if(it.k==='r'){const e=col[it.id]||(col[it.id]={n:0,f:0});it.f?e.f++:e.n++}})}
const canGive=items=>{const bak=JSON.stringify(col),ok=!!takeItems(items);col=JSON.parse(bak);return ok};

/* tiles for a whole collection (ours, or the snapshot of theirs) */
function tilesOf(snap){const out=[];
  SET.concat(OBS).forEach(c=>{const v=snap.counts[c.id];if(!v)return;
    if(v[0])out.push({it:{k:'r',id:c.id,f:0},c,max:v[0],foil:false});
    if(v[1])out.push({it:{k:'r',id:c.id,f:1},c,max:v[1],foil:true})});
  snap.inst.forEach(i=>out.push({it:{k:'i',u:i.u},c:CARD(i.id),max:1,ins:i,foil:!!i.f}));
  return out.sort((a,b)=>RANK[b.c.t]-RANK[a.c.t]||(b.ins&&b.ins.st==='slab')-(a.ins&&a.ins.st==='slab')||a.c.id-b.c.id)}
function tileHTML(t,side,sel){const n=sel.filter(x=>itemKey(x)===itemKey(t.it)).length;
  const inner=t.ins&&t.ins.st==='slab'?`<div class="tslab">${slabHTML(t.ins,1)}</div>`:cardEl(t.c,t.foil,false,t.ins,1);
  return `<div class="ttile${n?' on':''}" data-side="${side}" data-k="${hx(itemKey(t.it))}">${inner}
    ${t.ins&&t.ins.st==='slab'?`<span class="qty s">STK ${t.ins.grade}</span>`:t.ins&&HI(t.c.t)?`<span class="cbadge">${condScore(t.ins.cd).toFixed(1)}</span>`:''}${vtag(t.ins)}
    ${t.max>1?`<span class="qty">\u00d7${t.max}</span>`:''}${n?`<span class="tpick">${n>1?'\u00d7'+n:'\u2713'}</span>`:''}</div>`}
const itemLabel=(it,snapInst)=>{if(it.k==='i'){const i=it.ins||(snapInst||[]).find(x=>x.u===it.u)||instBy(it.u);if(!i)return'?';
  const c=CARD(i.id),vv=isVar(i)?' \u00b7 '+VAR[i.v].n:'';
  return c.name+(i.st==='slab'?` (STK ${i.grade}${vv})`:HI(c.t)?` (${condScore(i.cd).toFixed(1)}${vv})`:vv?` (${vv.slice(3)})`:'')}
  return CARD(it.id).name+(it.f?' (Reverse)':'')};

function trade(){const st=stage();deactivate();root.onkeydown=null;const back=keepScroll(st,'trade',['.binder','.tcol:nth-child(1) .tgrid','.tcol:nth-child(2) .tgrid']);
  const party=B.party&&B.party();
  if(!party||!party.on){st.innerHTML='<div class="binder"><p class="gempty">Join a party with your mate to trade cards.</p></div>';return}
  if(!TR.mate){B.send({t:'tcgReq'});st.innerHTML=`<div class="binder"><p class="gempty">Opening ${hx(party.name)}'s binder\u2026</p></div>`;return}
  const theirs=tilesOf(TR.mate.col),mine=tilesOf(snapshot());
  const ownedT=Object.keys(TR.mate.col.counts).length,slabsT=TR.mate.col.inst.filter(i=>i.st==='slab').length;
  st.innerHTML=`<div class="binder tradev">
   ${TR.waiting?`<div class="twait">Offer sent \u2014 waiting for ${hx(TR.mate.name)} to accept\u2026 <button class="lnk" id="tCancel">Cancel offer</button></div>`:''}
   <div class="tcols">
    <div class="tcol"><div class="bhead"><span><b>${hx(TR.mate.name)}'s binder</b> \u00b7 tap to ask for</span><span>${ownedT} cards${slabsT?` \u00b7 ${slabsT} slabs`:''}</span></div>
     <div class="tgrid">${theirs.map(t=>tileHTML(t,'want',TR.sel.want)).join('')||'<p class="gempty">Their binder is empty.</p>'}</div></div>
    <div class="tcol"><div class="bhead"><span><b>Your binder</b> \u00b7 tap to offer</span><span>${mine.length} tradable</span></div>
     <div class="tgrid">${mine.map(t=>tileHTML(t,'give',TR.sel.give)).join('')||'<p class="gempty">Nothing to trade yet.</p>'}</div></div>
   </div></div>
   <div class="dock tdock"><div class="tsum"><span>You give <b>${TR.sel.give.length}</b></span><span>You get <b>${TR.sel.want.length}</b></span></div>
    <button class="btn ghost" id="tClr">Clear</button><button class="btn" id="tSend" ${(TR.sel.give.length||TR.sel.want.length)&&!TR.waiting?'':'disabled'}>Send offer</button></div>`;
  back();const pick=(side,key)=>{const arr=side==='give'?TR.sel.give:TR.sel.want,pool=side==='give'?mine:theirs;
    const t=pool.find(x=>itemKey(x.it)===key);if(!t)return;
    const have=arr.filter(x=>itemKey(x)===key).length;
    if(have>=t.max){for(let i=arr.length-1;i>=0;i--)if(itemKey(arr[i])===key)arr.splice(i,1)}else arr.push(Object.assign({},t.it));
    SFX.tick();trade()};
  st.querySelectorAll('.ttile').forEach(el=>el.onclick=()=>pick(el.dataset.side,el.dataset.k));
  $('#tClr').onclick=()=>{TR.sel={give:[],want:[]};trade()};
  $('#tSend').onclick=sendOffer;
  if($('#tCancel'))$('#tCancel').onclick=()=>{const w=TR.waiting;if(!w)return;B.send({t:'tcgCancel',oid:w});settleOffer({oid:w,ok:false},true)}}

function sendOffer(){const give=TR.sel.give.slice(),want=TR.sel.want.slice();if(!give.length&&!want.length)return;
  const out=takeItems(give);if(!out){note('Some of those cards are no longer in your binder');trade();return}
  const oid=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  col.escrow=col.escrow||{};col.escrow[oid]=out;save();
  const wantFull=want.map(it=>it.k==='i'?{k:'i',u:it.u,ins:TR.mate.col.inst.find(x=>x.u===it.u)}:it);
  B.send({t:'tcgOffer',oid,give:out,want:wantFull,from:B.me?B.me():'Your mate'});
  TR.waiting=oid;TR.sel={give:[],want:[]};SFX.slide&&SFX.slide();note('Offer sent');trade()}

function settleOffer(m,silent){const esc=col.escrow&&col.escrow[m.oid];if(TR.waiting===m.oid)TR.waiting=null;
  if(m.ok){giveItems(m.items);if(col.escrow)delete col.escrow[m.oid];save();note('Trade complete!');checkCraftable();
    try{SFX.reveal('u',true);SFX.boom()}catch(x){}}
  else{if(esc)giveItems(esc);if(col.escrow)delete col.escrow[m.oid];save();if(!silent)note(m.why==='missing'?'Trade failed \u2014 they no longer had those cards':'Trade declined')}
  TR.mate=null;if(root&&root.isConnected&&(curView==='trade'||curView==='binder'))go(curView)}

function showOffer(m){closeOffer();const el=document.createElement('div');el.className='tofr';
  const ok=canGive(m.want);
  /* show the real cards: slabs as slabs, raw copies with their own condition, wear and signed/error look */
  const tile=it=>{const i=it.k==='i'?(it.ins||instBy(it.u)):null,c=CARD(i?i.id:it.id);if(!c)return'';
    const inner=i&&i.st==='slab'?`<div class="tslab">${slabHTML(i,1)}</div>`:cardEl(c,i?!!i.f:!!it.f,false,i,1);
    return `<div class="tofr-card"><div class="ttile">${inner}${vtag(i)}</div><small>${hx(itemLabel(it))}</small></div>`};
  const row=items=>items.length?`<div class="tofr-grid">${items.map(tile).join('')}</div>`:'<p class="tofr-none">Nothing</p>';
  el.innerHTML=`<div class="tofr-box"><h3>${hx(m.from||'Your mate')} wants to trade</h3>
   <div class="tofr-cols"><div class="tofr-get"><h5>You get <small>${m.give.length}</small></h5>${row(m.give)}</div><div class="tofr-swap">⇄</div><div class="tofr-give"><h5>You give <small>${m.want.length}</small></h5>${row(m.want)}</div></div>
   ${ok?'':'<p class="twarn">You no longer have everything they asked for.</p>'}
   <div class="tofr-act"><button class="btn ghost" id="tDec">Decline</button><button class="btn" id="tAcc" ${ok?'':'disabled'}>Accept trade</button></div></div>`;
  root.appendChild(el);try{SFX.ding(990)}catch(x){}
  $('#tDec').onclick=()=>{B.send({t:'tcgResp',oid:m.oid,ok:false});TR.incoming=null;closeOffer()};
  $('#tAcc').onclick=()=>{const out=takeItems(m.want);
    if(!out){B.send({t:'tcgResp',oid:m.oid,ok:false,why:'missing'});closeOffer();return}
    giveItems(m.give);save();B.send({t:'tcgResp',oid:m.oid,ok:true,items:out});TR.incoming=null;closeOffer();checkCraftable();
    note('Trade complete!');try{SFX.reveal('u',true);SFX.boom()}catch(x){}TR.mate=null;if(curView==='trade'||curView==='binder')go(curView)}}
const closeOffer=()=>{const o=root&&root.querySelector('.tofr');o&&o.remove()};

function onNet(m){if(!m||!m.t)return;
  if(m.t.indexOf('clash')===0)return clNet(m);
  if(m.t==='tcgReq'){B.send({t:'tcgCol',col:snapshot(),name:B.me?B.me():'Your mate'});return}
  if(m.t==='tcgCol'){TR.mate={col:m.col,name:m.name||'Your mate'};if(root&&curView==='trade')trade();return}
  if(m.t==='tcgOffer'){TR.incoming=m;if(root)showOffer(m);note(`${m.from||'Your mate'} sent you a card trade offer`);return}
  if(m.t==='tcgResp'){settleOffer(m);return}
  if(m.t==='tcgCancel'){if(TR.incoming&&TR.incoming.oid===m.oid){TR.incoming=null;closeOffer();note('They withdrew the trade offer')}return}
  if(m.t==='tcgLost'){if(CL.mode==='party'){CL.game=null;CL.mode='solo';if(curView==='clash'){CL.screen='menu';if(root)clMenu()}}
    if(col.escrow){Object.keys(col.escrow).forEach(k=>giveItems(col.escrow[k]));delete col.escrow;save()}
    TR.mate=null;TR.waiting=null;TR.incoming=null;closeOffer();if(root&&curView==='trade')go('binder')}}

window.StackCards={mount,SET,forceGod:()=>{FORCE_GOD=true},get collection(){return col},
  /* the host calls this when the logged-in account changes */
  reload(){col=loadCol();backfill();TR.mate=null;TR.waiting=null;if(root&&root.isConnected){updBal();go(curView)}},
  onNet,tick:gradeTick,go:v=>root&&go(v),get view(){return curView},get root(){return root},
  /* the host calls this when the player leaves for another game */
  pause:()=>{deactivate();const z=root&&root.querySelector('.zoom');z&&z.remove()},
  /* exposed for tests */
  _:{HI,rollCond,condScore,stkGrade,newInst,sendGrade,takeItems,giveItems,snapshot,wearHTML,slabHTML,cardFront,GW,GRADE_MS,rng,artSrc:k=>Art[k](),
     OBS,CARD,lineOf,canCraft,craft,checkCraftable,stripSky,numOf,GF,
     FE_CARDS,feFront,perfToggle,perfDiagnose,perfGPU,get PERF(){return PERF},VAR,isVar,rollVar,diaHTML,DIA_ID,buyBox,boxBy,boxLeft,BOX_N,desk,cutDone,openLid,boxPackOpen,
     get DESK(){return DESK},get BOXCTX(){return BOXCTX},addCard,spareStacks,TU,tuAuto,tuSign,TU_NEXT,
     CL,clStarter,clStart,clPlay,clCanPlay,clAttack,clEndTurn,clEffAtk,clAIStep,clInfo,clStat,ID2LINE,clData,clBonds,clStStart:clStart,clBegin,clDoEnd,CL_TYPE,CL_TRAIT,clRoute,clMenu,clBuilder,clBoard,clLobbyInit,clLobby,clHostStart,clNet,clActive,
     get col(){return col},set col(v){col=v}}};
if(document.getElementById('tcg')&&!window.StackBridge)mount(document.getElementById('tcg'));
})();
</script>
