<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stack Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ STACK CARDS — every selector scoped under #tcg ============ */
#tcg{--bg:#0f212e;--panel:#1a2c38;--panel2:#213743;--line:#2f4553;--mute:#b1bad3;--dim:#557086;--green:#00e701;--cw:min(70vw,300px);
  position:relative;height:100%;min-height:100vh;background:radial-gradient(120% 80% at 50% 0%,#17334a 0%,var(--bg) 60%);
  color:#fff;font-family:Outfit,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#tcg *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
#tcg button{font-family:inherit;cursor:pointer;border:0;color:inherit}
#tcg button:focus-visible{outline:2px solid #ffc800;outline-offset:3px}
html,body{margin:0;height:100%;background:#0f212e;overflow:hidden}
#tcg .bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;z-index:50}
#tcg .title{font-weight:800;font-size:17px}#tcg .title small{display:block;font-weight:600;font-size:12px;color:var(--mute)}
#tcg .bal{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px}#tcg .bal b{color:var(--green)}
#tcg .tabs{display:flex;gap:6px}
#tcg .tab{background:var(--panel);border:1px solid var(--line)!important;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px;color:var(--mute)}
#tcg .tab.on{background:var(--panel2);color:#fff}
#tcg .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1200px}
#tcg .hint{position:absolute;bottom:92px;left:0;right:0;text-align:center;color:var(--mute);font-size:14px;font-weight:600;transition:opacity .3s;pointer-events:none}
#tcg .dock{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:40}
#tcg .btn{background:var(--green);color:#05250a!important;font-weight:800;font-size:15px;border-radius:8px;padding:14px 22px;box-shadow:0 4px 0 #00a301}
#tcg .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #00a301}
#tcg .btn.ghost{background:var(--panel2);color:#fff!important;box-shadow:0 4px 0 #0b1a24}
#tcg .odds{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(26,44,56,.85);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--mute);width:max-content;max-width:92vw;text-align:center;line-height:1.4;z-index:30}
#tcg .odds b{color:#fff}

/* ======================= PACK (realistic foil pillow) ======================= */
#tcg .packwrap{position:relative;width:min(calc(var(--cw) * 1.06),calc((100vh - 240px) * .606));margin-top:10px;aspect-ratio:63/104}
#tcg .pk-shadow{position:absolute;left:8%;right:8%;bottom:-6%;height:10%;border-radius:50%;background:rgba(0,0,0,.6);filter:blur(18px);
  transform:translateX(var(--sx,0px));transition:transform .1s linear}
#tcg .pack{--mx:50%;--my:40%;position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .1s linear}
#tcg .pk-piece{position:absolute;inset:0}
#tcg .pk-body{clip-path:polygon(0 11%,100% 11%,100% 98%,96% 100%,92% 98%,88% 100%,84% 98%,80% 100%,76% 98%,72% 100%,68% 98%,64% 100%,60% 98%,56% 100%,52% 98%,48% 100%,44% 98%,40% 100%,36% 98%,32% 100%,28% 98%,24% 100%,20% 98%,16% 100%,12% 98%,8% 100%,4% 98%,0 100%)}
#tcg .pk-top{clip-path:polygon(0 2%,4% 0,8% 2%,12% 0,16% 2%,20% 0,24% 2%,28% 0,32% 2%,36% 0,40% 2%,44% 0,48% 2%,52% 0,56% 2%,60% 0,64% 2%,68% 0,72% 2%,76% 0,80% 2%,84% 0,88% 2%,92% 0,96% 2%,100% 0,100% 11%,0 11%);
  transition:transform .75s cubic-bezier(.2,.7,.3,1),opacity .75s}
#tcg .pk-top.gone{transform:translate(150px,-240px) rotate(40deg);opacity:0}
#tcg .pk-skin{position:absolute;inset:0;isolation:isolate}
#tcg .pk-skin>*{position:absolute;inset:0;pointer-events:none}
/* 1 metal film */
#tcg .l-foil{background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),
  linear-gradient(180deg,#7f8891 0%,#e9edf1 20%,#a2aab3 42%,#f3f5f7 64%,#8c949d 86%,#c9cfd5 100%)}
/* 2 ink printed on the film (multiply lets foil show through the light ink) */
#tcg .l-print{mix-blend-mode:multiply;background:
  linear-gradient(116deg,#1a3a56 0 33%,#e7b75a 33% 35.5%,#f0cf86 35.5% 57%,#e7b75a 57% 59.5%,#1a3a56 59.5%),
  radial-gradient(70% 40% at 50% 52%,#28506f,transparent)}
#tcg .l-art{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5%;padding-top:6%}
#tcg .l-art .ring{width:46%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,#0f2436 0 58%,transparent 59%),conic-gradient(from 20deg,#f7df9a,#9a7424,#fff1c2,#8c6a1e,#f7df9a);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
#tcg .l-art .ring svg{width:70%}
#tcg .pk-logo{font-weight:900;font-size:calc(var(--cw) * .2);letter-spacing:2px;line-height:.9;
  background:linear-gradient(180deg,#fff6d0,#e0b64e 45%,#8e6a1c 55%,#f7d77a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.55))}
#tcg .pk-sub{font-size:calc(var(--cw) * .045);font-weight:800;color:#f0d690;letter-spacing:2px}
#tcg .pk-badge{margin-top:3%;font-size:calc(var(--cw) * .04);font-weight:800;color:#0f212e;background:linear-gradient(180deg,#fff3c7,#d8ad4c);padding:1.2% 4%;border-radius:40px}
/* 3 crinkle relief (SVG lighting, light follows you) */
#tcg .l-scene img,#tcg .l-scene svg{display:block;width:100%;height:100%;object-fit:cover}
#tcg .pk-skin{container-type:inline-size}
#tcg .l-title{z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:23%;left:0;right:0;gap:0}
#tcg .t3d{position:relative;display:block;font-family:Outfit,system-ui,sans-serif;font-weight:900;line-height:.9;text-align:center;white-space:nowrap}
#tcg .t3d .ex,#tcg .t3d .fc{display:block;letter-spacing:inherit}
#tcg .t3d .ex{position:absolute;left:0;right:0;top:0;color:#024a0c;
  text-shadow:0 .25cqi 0 #02520c,0 .5cqi 0 #02460a,0 .75cqi 0 #023c08,0 1cqi 0 #013206,0 1.25cqi 0 #012805,0 1.5cqi 0 #011e03,0 1.75cqi 0 #001402,0 2cqi 0 #000,0 3.5cqi 3cqi rgba(0,0,0,.85)}
#tcg .t3d .fc{position:relative;background:linear-gradient(180deg,#ffffff 0%,#c8ffb0 22%,#3aff2a 48%,#00c800 62%,#008a00 80%,#5aff4a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 .35cqi #013a08) drop-shadow(0 0 2.2cqi rgba(0,255,40,.5))}
#tcg .t3d.t1{font-size:20cqi;letter-spacing:0}
#tcg .t3d.t2{font-size:14.5cqi;letter-spacing:.08em;margin-top:1cqi}
#tcg .t3d.t2 .ex,#tcg .t3d.t2 .fc{padding-left:.03em}
#tcg .l-badge{position:relative;margin-top:4cqi;width:max-content;height:auto;font-weight:900;font-size:4.2cqi;letter-spacing:.14em;color:#021a04;
  background:linear-gradient(180deg,#d8ffc8,#00e701);padding:1cqi 4cqi;border-radius:40px;box-shadow:0 0 3cqi rgba(0,231,1,.8),inset 0 -.5cqi 0 rgba(0,0,0,.25)}
#tcg .l-gsheen{mix-blend-mode:screen;opacity:calc(var(--so,.8) * .22);background:linear-gradient(105deg,transparent calc(var(--mx) - 22%),rgba(0,255,60,.45) calc(var(--mx) - 6%),rgba(220,255,220,.7) var(--mx),rgba(0,255,60,.45) calc(var(--mx) + 6%),transparent calc(var(--mx) + 22%))}
#tcg .l-crkD{mix-blend-mode:multiply;opacity:.28;background:var(--crkD) 0 0/100% 100%}
#tcg .l-crkS{mix-blend-mode:screen;background-size:100% 100%}#tcg .l-crkS.a{background-image:var(--crkA);opacity:calc((1 - var(--lp,.5)) * .42)}#tcg .l-crkS.b{background-image:var(--crkB);opacity:calc(var(--lp,.5) * .42)}
#tcg .pk-piece,#tcg .pack{will-change:transform}
/* 4 pillow curvature: edges roll away and darken, seals pinch */
#tcg .l-shade{background:
  linear-gradient(90deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.22) 7%,transparent 22%,transparent 78%,rgba(0,0,0,.22) 93%,rgba(0,0,0,.62) 100%),
  linear-gradient(180deg,rgba(0,0,0,.35) 0 11%,rgba(0,0,0,.12) 15%,transparent 24%,transparent 84%,rgba(0,0,0,.2) 92%,rgba(0,0,0,.4) 100%)}
/* 5 specular: a tall streak because the pack only curves side-to-side */
#tcg .l-spec{mix-blend-mode:screen;opacity:calc(var(--so,.9) * .6);background:
  radial-gradient(ellipse 13% 55% at var(--mx) 52%,rgba(255,255,255,.75),rgba(255,255,255,.12) 55%,transparent 75%),
  radial-gradient(ellipse 45% 38% at var(--mx) var(--my),rgba(255,248,230,.28),transparent 70%),
  linear-gradient(180deg,rgba(255,255,255,.1),transparent 30%)}
/* 6 heat-seal ridges */
#tcg .l-seal{background:
  repeating-linear-gradient(90deg,rgba(120,255,120,.35) 0 1px,rgba(0,0,0,.45) 1px 2px,transparent 2px 4px) top/100% 10.5% no-repeat,
  repeating-linear-gradient(90deg,rgba(120,255,120,.35) 0 1px,rgba(0,0,0,.45) 1px 2px,transparent 2px 4px) bottom/100% 7.5% no-repeat,
  linear-gradient(180deg,transparent 10.3%,rgba(0,0,0,.45) 10.8%,rgba(255,255,255,.25) 11.4%,transparent 12.5%,transparent 91.5%,rgba(255,255,255,.2) 92.2%,rgba(0,0,0,.45) 92.7%,transparent 93.3%)}
#tcg .tear{position:absolute;left:0;right:0;top:10.8%;height:3px;z-index:5;background:repeating-linear-gradient(90deg,rgba(0,0,0,.5) 0 6px,transparent 6px 10px)}
#tcg .tear i{position:absolute;left:0;top:-3px;height:9px;width:var(--tp,0%);background:linear-gradient(90deg,#fff,#eaffea);box-shadow:0 0 12px #fff,0 0 30px rgba(0,231,1,.9)}
#tcg .tear-zone{position:absolute;left:-10%;right:-10%;top:-4%;height:26%;z-index:6;cursor:ew-resize}
#tcg .packwrap.shake{animation:pkshake .35s}
@keyframes pkshake{25%{translate:-6px 0}50%{translate:5px 0}75%{translate:-3px 0}}
#tcg .packwrap.drop{transition:transform .8s cubic-bezier(.5,0,.8,.4),opacity .8s;transform:translateY(120vh) rotate(8deg);opacity:.4}

/* ======================= CARD SHELL ======================= */
#tcg .deck{position:absolute;width:var(--cw);aspect-ratio:63/88}
#tcg .slot{position:absolute;inset:0;transition:transform .45s cubic-bezier(.2,.8,.2,1);will-change:transform}
#tcg .slot.drag{transition:none}
#tcg .tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .1s linear}
#tcg .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
#tcg .flip.down{transform:rotateY(180deg)}
#tcg .front,#tcg .back{position:absolute;inset:0;border-radius:4.6%/3.3%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
#tcg .front{container-type:inline-size;isolation:isolate;box-shadow:0 18px 32px rgba(0,0,0,.55)}
#tcg .front>*{position:absolute}
#tcg .back{transform:rotateY(180deg);background:
  radial-gradient(circle at 50% 50%,transparent 26%,rgba(255,200,0,.12) 26.5% 27.5%,transparent 28%),
  repeating-conic-gradient(from 0deg at 50% 50%,#12283a 0 7.5deg,#0d1f2d 7.5deg 15deg),#0f212e;
  box-shadow:inset 0 0 0 calc(var(--cw) * .045) #1a2c38,inset 0 0 0 calc(var(--cw) * .052) #c9a54a,0 18px 30px rgba(0,0,0,.5)}
#tcg .back::after{content:"S";position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:calc(var(--cw) * .32);
  background:linear-gradient(180deg,#fff6d0,#d9ae45 50%,#8e6a1c 52%,#f0cf73);-webkit-background-clip:text;background-clip:text;color:transparent}
#tcg .back .gl{position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.25),transparent 50%);mix-blend-mode:overlay}

/* placeholders instead of text */
#tcg .ph{display:block;height:2.4cqi;border-radius:9px;background:rgba(12,18,28,.4)}
#tcg .ph.t{height:1.5cqi;background:rgba(12,18,28,.26)}
#tcg .orb{flex:none;width:5cqi;height:5cqi;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 9%,hsl(var(--h) 75% 58%) 32%,hsl(var(--h) 65% 30%));
  box-shadow:0 0 0 .5cqi rgba(255,255,255,.85),0 .5cqi 1cqi rgba(0,0,0,.35)}
#tcg .star{flex:none;width:3.2cqi;height:3.2cqi;background:#15171c;clip-path:polygon(50% 0,63% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,37% 36%)}
#tcg .dot{flex:none;width:2.8cqi;height:2.8cqi;border-radius:50%;background:#15171c}
#tcg .syms{display:flex;gap:.6cqi}

/* ======================= COMMON / HOLO (standard layout) ======================= */
#tcg .std{background:linear-gradient(135deg,#ece7da,#bdb6a5 44%,#f7f3e8 56%,#aaa392)}
#tcg .std .body{inset:4.4% 5% 3.4%;border-radius:1.6%/1.2%;overflow:hidden;
  background:linear-gradient(172deg,hsl(var(--h) 40% 70%),hsl(var(--h) 34% 52%) 60%,hsl(var(--h) 30% 44%));box-shadow:inset 0 0 0 .4cqi rgba(0,0,0,.22)}
#tcg .std .body::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(35deg,rgba(255,255,255,.07) 0 1px,transparent 1px 6px),radial-gradient(90% 50% at 50% 0,rgba(255,255,255,.3),transparent)}
#tcg .body>*{position:absolute}
#tcg .nbar{left:4%;right:4%;top:1.4%;height:6%;display:flex;align-items:center;justify-content:space-between}
#tcg .nbar .ph{height:3.4cqi}
#tcg .hp{display:flex;align-items:center;gap:1.6cqi}
#tcg .win{left:4.2%;right:4.2%;top:8.4%;height:43.5%;z-index:3;overflow:hidden;
  box-shadow:0 0 0 .9cqi #efe3b3,0 0 0 1.3cqi #8d7a45,0 .8cqi 1.6cqi .8cqi rgba(0,0,0,.35)}
#tcg .win svg,#tcg .win img{display:block;width:100%;height:100%;object-fit:cover}
#tcg .win::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 2cqi rgba(0,0,0,.45);z-index:4}
#tcg .strip{left:11%;right:11%;top:54%;height:3.4%;display:grid;place-items:center;background:linear-gradient(90deg,#b7ae96,#f2ead0,#b7ae96);clip-path:polygon(3% 0,97% 0,100% 100%,0 100%)}
#tcg .strip .ph{width:62%;height:1.4cqi;background:rgba(0,0,0,.28)}
#tcg .atks{left:5%;right:5%;top:59.5%;height:25.5%;display:flex;flex-direction:column;justify-content:space-between}
#tcg .atk{display:flex;align-items:center;gap:2.4cqi}
#tcg .cost{display:flex;gap:.9cqi;width:22%}
#tcg .atk .nm{width:42%;height:3.4cqi}
#tcg .atk .dmg{margin-left:auto;width:10%;height:3.8cqi}
#tcg .desc{display:flex;flex-direction:column;gap:1.3cqi;padding:0 2%}
#tcg .wrr{left:5%;right:5%;top:86.5%;height:5%;display:flex;justify-content:space-between;align-items:center;border-top:.3cqi solid rgba(0,0,0,.18)}
#tcg .wrr span{display:flex;gap:1cqi;align-items:center}#tcg .wrr .ph{width:8cqi;height:1.4cqi}#tcg .wrr .orb{width:3.6cqi;height:3.6cqi}
#tcg .bot{left:5%;right:5%;bottom:1.2%;height:3.6%;display:flex;justify-content:space-between;align-items:center}
#tcg .bot .ph{width:24%;height:1.3cqi}

/* REVERSE HOLO — whole card is foil, art window stays matte */
#tcg .revfoil{inset:0;z-index:2;pointer-events:none;mix-blend-mode:color-dodge;opacity:var(--ho,.5);
  background:
   radial-gradient(circle,rgba(255,255,255,.9) 0 .5px,transparent 1px) 0 0/7px 7px,
   radial-gradient(circle,rgba(255,255,255,.6) 0 .4px,transparent .9px) 3px 4px/11px 9px,
   repeating-linear-gradient(115deg,hsl(0 90% 60%) 0%,hsl(50 90% 60%) 4%,hsl(120 80% 60%) 8%,hsl(190 90% 60%) 12%,hsl(260 80% 65%) 16%,hsl(320 85% 62%) 20%,hsl(360 90% 60%) 24%) var(--bgx,50%) var(--bgy,50%)/400% 400%;
  filter:brightness(.65) contrast(1.4);
  -webkit-mask:radial-gradient(farthest-corner at var(--mx) var(--my),#000 10%,rgba(0,0,0,.25) 80%);mask:radial-gradient(farthest-corner at var(--mx) var(--my),#000 10%,rgba(0,0,0,.25) 80%)}
/* HOLO RARE — foil lives only in the art window */
#tcg .cosmos{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:color-dodge;opacity:calc(var(--ho,.55) * .7);-webkit-mask:radial-gradient(farthest-corner at var(--mx) var(--my),#000 5%,rgba(0,0,0,.2) 70%);mask:radial-gradient(farthest-corner at var(--mx) var(--my),#000 5%,rgba(0,0,0,.2) 70%);
  background:
   radial-gradient(circle at 20% 30%,#fff 0 .8px,transparent 1.4px) 0 0/19px 17px,
   radial-gradient(circle at 60% 70%,#fff 0 1.2px,transparent 2px) var(--bgx) 0/37px 31px,
   radial-gradient(circle at 50% 50%,rgba(255,255,255,.8) 0 .5px,transparent 1px) 0 var(--bgy)/9px 11px,
   repeating-linear-gradient(90deg,hsl(0 95% 62%) 0%,hsl(55 95% 62%) 5%,hsl(140 85% 60%) 10%,hsl(200 95% 62%) 15%,hsl(275 85% 66%) 20%,hsl(360 95% 62%) 25%) var(--bgx) 0/300% 100%;
  filter:brightness(.5) contrast(1.5)}
#tcg .std.h .win svg{filter:brightness(.72) saturate(1.25)}

/* ======================= FULL ART ======================= */
#tcg .fa{background:linear-gradient(135deg,#f1f4f7,#9aa3ad 44%,#fff 56%,#89929c)}
#tcg .fa .full,#tcg .sir .full{inset:3.2% 4.2%;border-radius:1.8%/1.3%;overflow:hidden}
#tcg .full>svg,#tcg .full>img{display:block;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
#tcg .etchfoil{inset:3.2% 4.2%;z-index:2;pointer-events:none;mix-blend-mode:overlay;
  background:repeating-linear-gradient(-58deg,transparent 0 .8cqi,rgba(255,255,255,.85) .8cqi 1.1cqi),repeating-linear-gradient(32deg,transparent 0 2.4cqi,rgba(255,255,255,.35) 2.4cqi 2.6cqi);
  -webkit-mask:radial-gradient(circle at var(--mx) var(--my),#000 0,rgba(0,0,0,.15) 55%,transparent 75%);mask:radial-gradient(circle at var(--mx) var(--my),#000 0,rgba(0,0,0,.15) 55%,transparent 75%)}
#tcg .rainfoil{inset:3.2% 4.2%;z-index:3;pointer-events:none;mix-blend-mode:color-dodge;opacity:var(--ho,.5);
  background:repeating-linear-gradient(-58deg,hsl(0 90% 55%) 0%,hsl(45 90% 55%) 3%,hsl(120 80% 55%) 6%,hsl(195 90% 58%) 9%,hsl(265 80% 62%) 12%,hsl(330 85% 58%) 15%,hsl(360 90% 55%) 18%) var(--bgx) var(--bgy)/350% 350%;
  filter:brightness(.55) contrast(1.6);
  -webkit-mask:repeating-linear-gradient(-58deg,transparent 0 .8cqi,#000 .8cqi 1.1cqi),radial-gradient(circle at var(--mx) var(--my),#000,transparent 70%);-webkit-mask-composite:source-in;
  mask:repeating-linear-gradient(-58deg,transparent 0 .8cqi,#000 .8cqi 1.1cqi),radial-gradient(circle at var(--mx) var(--my),#000,transparent 70%);mask-composite:intersect}
#tcg .ui{inset:3.2% 4.2%;z-index:5}
#tcg .ui>*{position:absolute}
#tcg .ui .ph{background:rgba(255,255,255,.78);box-shadow:0 .3cqi .8cqi rgba(0,0,0,.4)}
#tcg .ui .ph.t{background:rgba(255,255,255,.55)}
#tcg .ui .star,#tcg .ui .dot{background:#fff}
#tcg .fa .panel{left:0;right:0;bottom:0;height:40%;background:linear-gradient(180deg,transparent,rgba(5,10,20,.35) 18%,rgba(5,10,20,.55))}
#tcg .fa .atks{top:64%;height:22%;left:6%;right:6%}
#tcg .fa .wrr{top:88.5%;height:4%;left:6%;right:6%;border-top-color:rgba(255,255,255,.3)}
#tcg .fa .bot{bottom:.6%;left:6%;right:6%}
#tcg .fa .nbar{left:5%;right:5%;top:1.6%}

/* ======================= SPECIAL ILLUSTRATION RARE ======================= */

<body>
<div id="tcg"></div>
<script>
(()=>{
/* STACK CARDS — Prestige Series. Integration: window.StackBridge {getBalance, spend, load, save}; StackCards.mount(el). */
const PACK_COST=0;let demoBal=Infinity,memSave=null;
const B=window.StackBridge||{getBalance:()=>demoBal,spend:n=>{if(demoBal<n)return false;demoBal-=n;return true},load:()=>memSave,save:o=>{memSave=JSON.parse(JSON.stringify(o))}};

/* ---------------- SET ---------------- */
const CATS={
  Motors:{h:355,svg:'<path d="M6 44 L16 31 Q28 22 46 21 L60 21 Q74 23 85 33 L93 37 Q97 40 95 45 L6 45 Z" fill="rgba(255,255,255,.14)" stroke="#fff" stroke-width="1.6"/><path d="M30 31 L38 24 L58 24 L70 32 Z" fill="rgba(160,210,255,.35)" stroke="#fff" stroke-width="1.2"/><circle cx="27" cy="45" r="8" fill="#0a0a0a" stroke="#fff" stroke-width="1.6"/><circle cx="76" cy="45" r="8" fill="#0a0a0a" stroke="#fff" stroke-width="1.6"/><circle cx="27" cy="45" r="3" fill="#ccc"/><circle cx="76" cy="45" r="3" fill="#ccc"/>'},
  Timepieces:{h:42,svg:'<rect x="41" y="2" width="18" height="12" rx="2" fill="rgba(255,255,255,.15)" stroke="#fff" stroke-width="1.3"/><rect x="41" y="46" width="18" height="12" rx="2" fill="rgba(255,255,255,.15)" stroke="#fff" stroke-width="1.3"/><circle cx="50" cy="30" r="19" fill="rgba(0,0,0,.5)" stroke="#fff" stroke-width="2"/><circle cx="50" cy="30" r="15" fill="none" stroke="rgba(255,255,255,.4)" stroke-dasharray="1 3.7"/><line x1="50" y1="30" x2="50" y2="18" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><line x1="50" y1="30" x2="59" y2="34" stroke="#ffd36a" stroke-width="1.4" stroke-linecap="round"/><circle cx="50" cy="30" r="1.8" fill="#fff"/><rect x="69" y="27" width="4" height="6" rx="1" fill="#fff"/>'},
  Estates:{h:150,svg:'<path d="M14 30 L50 8 L86 30" fill="none" stroke="#fff" stroke-width="1.8"/><rect x="20" y="29" width="60" height="25" fill="rgba(255,255,255,.14)" stroke="#fff" stroke-width="1.6"/><rect x="45" y="39" width="10" height="15" fill="rgba(0,0,0,.45)" stroke="#fff" stroke-width="1.2"/><rect x="27" y="35" width="10" height="8" fill="rgba(255,220,130,.55)" stroke="#fff"/><rect x="63" y="35" width="10" height="8" fill="rgba(255,220,130,.55)" stroke="#fff"/><line x1="4" y1="54" x2="96" y2="54" stroke="#fff" stroke-width="1.2"/>'},
  Yachts:{h:205,svg:'<path d="M6 38 L94 38 L82 50 L16 50 Z" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="1.7"/><path d="M28 38 L34 28 L66 28 L74 38 Z" fill="rgba(255,255,255,.1)" stroke="#fff" stroke-width="1.3"/><path d="M40 28 L44 21 L60 21 L63 28" fill="none" stroke="#fff" stroke-width="1.2"/><line x1="36" y1="33" x2="68" y2="33" stroke="rgba(160,210,255,.8)" stroke-width="2"/>'},
  Aviation:{h:222,svg:'<path d="M8 30 Q10 25 20 25 L82 25 Q95 27 96 30 Q95 33 82 35 L20 35 Q10 35 8 30 Z" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="1.6"/><path d="M42 33 L30 54 L40 54 L60 34 Z" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="1.3"/><path d="M44 27 L36 10 L44 10 L60 26 Z" fill="rgba(255,255,255,.08)" stroke="#fff" stroke-width="1.1"/><path d="M12 26 L6 14 L12 14 L22 25" fill="none" stroke="#fff" stroke-width="1.3"/><circle cx="30" cy="30" r="1.3" fill="#fff"/><circle cx="36" cy="30" r="1.3" fill="#fff"/><circle cx="42" cy="30" r="1.3" fill="#fff"/><circle cx="48" cy="30" r="1.3" fill="#fff"/><circle cx="54" cy="30" r="1.3" fill="#fff"/>'},
  Jewels:{h:285,svg:'<polygon points="30,18 70,18 84,28 50,56 16,28" fill="rgba(255,255,255,.16)" stroke="#fff" stroke-width="1.7"/><polyline points="16,28 84,28" fill="none" stroke="#fff" stroke-width="1.2"/><polyline points="30,18 40,28 50,56 60,28 70,18" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1"/><polyline points="40,28 50,18 60,28" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1"/><path d="M76 8 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#fff"/>'}
};
/* tiers: c common · h holo rare · fa full art · sir special illustration rare */
const RAW={
  Motors:['c Vantor GT','c Kessel Roadster','c Arden Coupé','h Marlowe V12','fa Sable Hypercar'],
  Timepieces:['c Field Chronograph','c Diver 300','c Dress Automatic','h Perpetual Calendar','sir Grand Tourbillon'],
  Estates:['c Harbour Penthouse','c Alpine Chalet','c Vineyard Manor','h Clifftop Villa','fa Private Island'],
  Yachts:['c Day Cruiser','c Sport Tender','c Classic Sloop','h Explorer 60','sir Gigayacht Aurelia'],
  Aviation:['c Twin Prop','c Light Jet','c Heli Charter','h Long Range Jet','fa Private Airliner'],
  Jewels:['c Cufflink Set','c Gold Signet','c Tennis Bracelet','h Emerald Solitaire','fa Sapphire Tiara']
};
const TORD={c:0,h:1,fa:2,sir:3,bwr:4};
const LINES=[{key:'fox',h:18,names:['Emberkit','Cinderfox','Emberfox']},
             {key:'wyrm',h:190,names:['Tidelet','Surgeling','Tidewyrm']},
             {key:'lion',h:38,names:['Aurecub','Solmane','Aurelion']},
             {key:'owl',h:265,names:['Hootlet','Duskowl','Nocturne']},
             {key:'hare',h:205,names:['Frostbun','Rimehare','Glacielle']},
             {key:'gdr',h:128,names:['Sproutling','Verdrake','Sylvanox'],mono:'Emerald'},
             {key:'rdr',h:2,names:['Cindling','Pyrodrake','Infernax'],mono:'Crimson'},
             {key:'wolf',h:50,names:['Voltpup','Stormhound','Thundrakar']},
             {key:'turt',h:30,names:['Pebbling','Boulderback','Terramont']},
             {key:'moth',h:295,names:['Lumigrub','Lumiwing','Lumoria']},
             {key:'cat',h:275,names:['Umbrakit','Shadewhisk','Nyxara']},
             {key:'stag',h:52,names:['Fawnlet','Glimmerstag','Aurastag']},
             {key:'phx',h:14,names:['Emberchick','Blazewing','Solphyre']},
             {key:'sky',h:42,names:['Wisplet','Galewyrm','Zephyrion']},
             {key:'gem',h:275,names:['Gemling','Prismdrake','Crystalor']},
             {key:'tig',h:26,names:['Tigkit','Tigrant','Tigraxis']},
             {key:'golem',h:210,names:['Rubblit','Cragguard','Monolithar']},
             {key:'yeti',h:198,names:['Yetling','Rimeclaw','Avalanchor']},
             {key:'knight',h:100,names:['Seedsprite','Thornling','Verdanthorn']},
             {key:'koi',h:355,names:['Finnet','Koiren','Koirastra']},
             {key:'angler',h:240,names:['Glimmerfry','Lanternfin','Abyssangler']},
             {key:'puffer',h:52,names:['Puffling','Spinepuff','Urchinox']},
             {key:'slime',h:160,names:['Blobbit','Gloopster','Gelatron']},
             {key:'jelly',h:318,names:['Jellet','Driftjelly','Medusira']},
             {key:'ghost',h:252,names:['Boolet','Phantomist','Spectrevail']}];
const SET=[];LINES.forEach(L=>{
  [['c',0,'0'],['c',1,'1'],['h',2,'2'],['fa',2,'FA'],['sir',2,'SIR'],...(L.mono?[['bwr',2,'MONO']]:[])].forEach(([t,st,a])=>SET.push({cat:'Mythic',name:L.names[st],t,h:L.h,mono:t==='bwr'?L.mono:null,art:L.key+a,stage:st,cost:st+1,prev:st?L.key+(st-1):null}))});
SET.forEach((c,i)=>{c.id=i;c.no=String(i+1).padStart(3,'0')});
const byT=t=>SET.filter(c=>c.t===t);
const ODDS={fa:.18,sir:.09,bwr:.03};
const TNAME={c:'Common',h:'Holo Rare',fa:'Full Art',sir:'Special Illustration Rare',bwr:'Mono Rare',obs:'Obsidian Edition'};
/* ---------------- CONDITION + GRADING MODEL ----------------
   Commons and holos are fungible, so they stay as simple counts. Full Art and
   above are INDIVIDUAL copies: each one rolls its own centering, corners, edges
   and surface the moment it is pulled, carries that wear visibly, and can be
   sent off to be graded. col.inst holds them:
     {u, id, s(seed), cd:{ctr,dir,co,ed,su}, st:'raw'|'grading'|'back'|'slab', due, grade, cert}
   Invariant: for a Full Art+ card, col[id].n == number of its copies in 'raw'. */
const HI=t=>t==='fa'||t==='sir'||t==='bwr';   // Obsidian is crafted, pristine, and never graded
const TOTAL=SET.length;
/* OBSIDIAN EDITION - one per evolution line, earned by owning every card in it.
   It takes the line's highest-rarity art (SIR, or Mono Rare for the two dragon
   lines), gets a black border and an animated sky. Kept OUT of SET so the base
   set stays 127 and every existing set number stays exactly where it is. */
const OBS=LINES.map((L,i)=>({cat:'Mythic',name:L.names[2],t:'obs',h:L.h,line:L.key,mono:null,
  art:L.key+(L.mono?'MONO':'SIR'),stage:2,cost:3,prev:L.key+'1',id:1000+i,no:String(i+1).padStart(2,'0')}));
const OBSI={};OBS.forEach(o=>{OBSI[o.id]=o});
const CARD=id=>SET[id]||OBSI[id];
const lineOf=key=>SET.filter(c=>c.art.startsWith(key));
const numOf=c=>c.t==='obs'?`OBS ${c.no}/${String(OBS.length).padStart(2,'0')}`:`#${c.no}/${String(TOTAL).padStart(3,'0')}`;
const cno=c=>`<span class="cno">${c.t==='obs'?numOf(c):c.no+'/'+String(TOTAL).padStart(3,'0')}</span>`;
const hx=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadCol(){let c=null;try{c=B.load&&B.load()}catch(e){}
  c=c&&typeof c==='object'?JSON.parse(JSON.stringify(c)):{};
  if(!c.v4)c={v4:1};if(!Array.isArray(c.inst))c.inst=[];return c}
let col=loadCol();const save=()=>B.save&&B.save(col);
const instBy=u=>col.inst.find(i=>i.u===u)||null;

/* PSA-style condition. Pack-fresh cards are usually clean, with the occasional
   factory ding or off-centre cut - exactly like the real thing. */
function rollCond(r){
  const g=()=>Math.sqrt(-2*Math.log(1-r()+1e-12))*Math.cos(6.2832*r());
  const q=b=>{let v=10-Math.abs(g())*b;if(r()<.07)v-=1+r()*3.8;return Math.round(Math.max(1,Math.min(10,v))*10)/10};
  let off=50+Math.abs(g())*3.4;if(r()<.1)off+=r()*16;
  return{ctr:Math.round(Math.min(85,off)),dir:r()<.5?-1:1,co:q(.95),ed:q(.85),su:q(.75)}}
/* PSA caps the grade on centering no matter how clean the rest is */
const CTR_CAP=x=>x<=55?10:x<=60?9:x<=65?8:x<=70?7:x<=75?6:x<=80?5:4;
function condScore(cd){const m=Math.min(cd.co,cd.ed,cd.su),a=(cd.co+cd.ed+cd.su)/3;
  return Math.round(Math.max(1,Math.min(.55*m+.45*a,CTR_CAP(cd.ctr)+.4))*10)/10}
/* The official grade. Follows the condition, with a little grader variance -
   the card you swear is a 10 sometimes comes back a 9. Deterministic per copy. */
function stkGrade(ins){const r=rng((ins.s^0x5f3759df)>>>0),cd=ins.cd,m=Math.min(cd.co,cd.ed,cd.su);
  let v=condScore(cd)+(r()-.5)*.7;
  if(v>=9.45&&m>=9.2&&cd.ctr<=55)return 10;          // a Gem needs everything, centering included
  v=Math.min(v,9.49);if(v>=9)return 9;
  return Math.max(1,Math.floor(v*2)/2)}              // halves from 1.5 to 8.5, like PSA
const GW={10:'GEM MT',9:'MINT',8.5:'NM-MT+',8:'NM-MT',7.5:'NM+',7:'NM',6.5:'EX-MT+',6:'EX-MT',5.5:'EX+',5:'EX',
  4.5:'VG-EX+',4:'VG-EX',3.5:'VG+',3:'VG',2.5:'GOOD+',2:'GOOD',1.5:'FR',1:'PR'};
let uidN=0;
function newInst(id){const sd=(Math.random()*4294967295)>>>0;
  return{u:Date.now().toString(36)+(uidN++).toString(36)+sd.toString(36).slice(0,4),id,s:sd,cd:rollCond(rng(sd)),st:'raw'}}
/* Collections from before grading existed only have counts. Give every Full
   Art+ copy a condition the first time we see it, and hand back anything that
   was sitting in trade escrow when the page closed. */
function backfill(){let ch=false;
  if(col.escrow){Object.keys(col.escrow).forEach(k=>{giveItems(col.escrow[k]);ch=true});delete col.escrow}
  SET.concat(OBS).forEach(c=>{if(!HI(c.t))return;const n=col[c.id]?col[c.id].n:0;
    const have=col.inst.filter(i=>i.id===c.id&&i.st==='raw').length;
    for(let k=have;k<n;k++){col.inst.push(newInst(c.id));ch=true}});
  if(ch)save();checkCraftable()}

/* ---------------- AUDIO ---------------- */
const SFX=(()=>{let ctx,noise;
  const init=()=>{if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();
    noise=ctx.createBuffer(1,ctx.sampleRate*1.5,ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1};
  const nz=(t,dur,f,q,g,type='bandpass',f2)=>{const s=ctx.createBufferSource();s.buffer=noise;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;
    const v=ctx.createGain();v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.004);v.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl).connect(v).connect(ctx.destination);s.start(t,Math.random());s.stop(t+dur+.05)};
  const tone=(t,f,dur,g,type='sine')=>{const o=ctx.createOscillator(),v=ctx.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(v).connect(ctx.destination);o.start(t);o.stop(t+dur+.05)};
  return{init,
    crinkle(n=4){init();const t=ctx.currentTime;for(let i=0;i<n;i++)nz(t+i*.025+Math.random()*.02,.03+Math.random()*.05,2500+Math.random()*5000,3,.12+Math.random()*.1)},
    tickP(p){init();const t=ctx.currentTime;nz(t,.03,2500+p*5000,6,.14);tone(t,300+p*900,.05,.05,'triangle')},
    ding(f){init();const t=ctx.currentTime;tone(t,f,.12,.06,'triangle');tone(t,f*2,.08,.02)},
    boom(){init();const t=ctx.currentTime;tone(t,55,.8,.45);tone(t,82,.6,.25);nz(t,.5,300,.8,.35,'lowpass',80)},
    tick(){init();const t=ctx.currentTime;nz(t,.035,3000+Math.random()*3000,6,.16);nz(t+.01,.02,7000,4,.08,'highpass')},
    rip(){init();const t=ctx.currentTime;nz(t,.45,900,1.2,.5,'bandpass',5500);nz(t+.05,.35,4000,.8,.25,'highpass');for(let i=0;i<9;i++)nz(t+i*.04,.03,3000+Math.random()*4000,5,.2);tone(t,90,.25,.3)},
    slide(){init();const t=ctx.currentTime;nz(t,.5,400,.7,.18,'lowpass',2200)},
    swoosh(){init();const t=ctx.currentTime;nz(t,.28,600,1,.35,'bandpass',3500)},
    flip(){init();const t=ctx.currentTime;nz(t,.04,1800,2,.3);nz(t+.12,.05,1200,2,.35);tone(t+.12,180,.08,.12,'triangle')},
    charge(){init();const t=ctx.currentTime;const o=ctx.createOscillator(),v=ctx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(440,t+.95);
      const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(2500,t+.95);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.09,t+.8);v.gain.linearRampToValueAtTime(0,t+1);o.connect(f).connect(v).connect(ctx.destination);o.start(t);o.stop(t+1.05)},
    reveal(r,foil){init();const t=ctx.currentTime;
      if(r==='c'){tone(t,660,.3,.12);tone(t+.06,990,.35,.07)}
      if(r==='r'){[523,659,784,1047].forEach((f,i)=>{tone(t+i*.07,f,.5,.12,'triangle');tone(t+i*.07,f*2,.3,.03)})}
      if(r==='u'){tone(t,65,.9,.35);[523,659,784,1047,1319,1568].forEach((f,i)=>{tone(t+i*.06,f,.9,.11,'triangle');tone(t+i*.06,f*1.5,.6,.03)});nz(t,.8,8000,.5,.08,'highpass')}
      if(foil){for(let i=0;i<10;i++)tone(t+.15+i*.045+Math.random()*.03,2000+Math.random()*3000,.25,.035)}},
    buy(){init();const t=ctx.currentTime;tone(t,880,.08,.1,'square');tone(t+.07,1320,.12,.08,'square')},
    no(){init();const t=ctx.currentTime;tone(t,180,.2,.15,'square')}
  }})();


/* ---------------- ART ---------------- */
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const ridge=(r,y0,amp,n,w=63,h=88)=>{let d=`M0 ${h} L0 ${y0}`;for(let i=1;i<=n;i++){const x=i*w/n;d+=` L${x.toFixed(1)} ${(y0-r()*amp).toFixed(1)}`}return d+` L${w} ${h} Z`};
function artStd(c){const H=CATS[c.cat].h,id='a'+c.id;
  return `<svg viewBox="0 0 100 70" preserveAspectRatio="xMidYMid slice"><defs>
   <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${H} 45% 68%)"/><stop offset="1" stop-color="hsl(${H} 50% 32%)"/></linearGradient>
   <radialGradient id="${id}g" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
   <rect width="100" height="70" fill="url(#${id}s)"/><rect width="100" height="70" fill="url(#${id}g)"/>
   <ellipse cx="50" cy="66" rx="60" ry="12" fill="hsl(${H} 40% 22%)" opacity=".55"/>
   <g transform="translate(6 6) scale(.88)">${CATS[c.cat].svg}</g></svg>`}
function artFA(c){const H=CATS[c.cat].h,r=rng(c.id*97+3),id='f'+c.id;let rays='';
  for(let i=0;i<36;i++){const a0=i/36*Math.PI*2,a1=a0+Math.PI*2/72;rays+=`<polygon points="31.5,34 ${31.5+Math.cos(a0)*90},${34+Math.sin(a0)*90} ${31.5+Math.cos(a1)*90},${34+Math.sin(a1)*90}" fill="hsl(${H+(r()*20-10)} 55% ${24+r()*16}%)" opacity=".8"/>`}
  return `<svg viewBox="0 0 63 88" preserveAspectRatio="xMidYMid slice"><defs>
   <radialGradient id="${id}b" cx=".5" cy=".38" r=".7"><stop offset="0" stop-color="hsl(${H} 70% 58%)"/><stop offset=".6" stop-color="hsl(${H} 60% 22%)"/><stop offset="1" stop-color="#05070c"/></radialGradient>
   <radialGradient id="${id}h" cx=".5" cy=".39" r=".32"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
   <rect width="63" height="88" fill="url(#${id}b)"/>${rays}<rect width="63" height="88" fill="url(#${id}b)" opacity=".55"/><rect width="63" height="88" fill="url(#${id}h)"/>
   <g transform="translate(-1.5 18) scale(.66)" style="filter:drop-shadow(0 1.5px 2px rgba(0,0,0,.6))">${CATS[c.cat].svg}</g></svg>`}
function artSIR(c){const H=CATS[c.cat].h,r=rng(c.id*131+7),id='s'+c.id;const sx=14+r()*35,sy=40+r()*6;let stars='';
  for(let i=0;i<26;i++)stars+=`<circle cx="${(r()*63).toFixed(1)}" cy="${(r()*30).toFixed(1)}" r="${(.15+r()*.35).toFixed(2)}" fill="#fff" opacity="${(.3+r()*.7).toFixed(2)}"/>`;
  const water=c.cat==='Yachts'||c.cat==='Estates';
  let refl='';if(water)for(let i=0;i<14;i++){const y=62+i*1.8,w=3+r()*10;refl+=`<rect x="${(sx-w/2+r()*4-2).toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height=".5" fill="#ffe0a8" opacity="${(.7-i*.045).toFixed(2)}"/>`}
  let clouds='';if(c.cat==='Aviation')for(let i=0;i<5;i++)clouds+=`<ellipse cx="${r()*63}" cy="${20+r()*30}" rx="${8+r()*10}" ry="${1.5+r()*2}" fill="#ffd9c0" opacity=".35"/>`;
  return `<svg viewBox="0 0 63 88" preserveAspectRatio="xMidYMid slice"><defs>
   <linearGradient id="${id}k" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(232 45% 14%)"/><stop offset=".38" stop-color="hsl(${(H+300)%360} 45% 38%)"/><stop offset=".6" stop-color="hsl(18 85% 64%)"/><stop offset=".7" stop-color="hsl(38 95% 78%)"/></linearGradient>
   <radialGradient id="${id}u"><stop offset="0" stop-color="#fff7de"/><stop offset=".25" stop-color="#ffd58a"/><stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/></radialGradient>

/* ================= CREATURE ART ENGINE =================

const Art=(()=>{

function frames(sp){return sp.map((p,i)=>{const a=sp[Math.max(0,i-1)],b=sp[Math.min(sp.length-1,i+1)];const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return{x:p[0],y:p[1],w:p[2],tx:dx/l,ty:dy/l,nx:-dy/l,ny:dx/l}})}

  F.forEach(q=>{const cx=q.x+q.nx*q.w*off,cy=q.y+q.ny*q.w*off,h=q.w*wk/2;L.push([cx+q.nx*h,cy+q.ny*h]);R.push([cx-q.nx*h,cy-q.ny*h])});

  .map(([k,v])=>`<span><small>${k}</small><b>${v}</b></span>`).join('');
function condPop(ins){const old=root.querySelector('.condpop');old&&old.remove();
  const el=document.createElement('div');el.className='condpop';
  el.innerHTML=`<div class="cp-sc"><small>CONDITION</small><b>${condScore(ins.cd).toFixed(1)}</b><i>/ 10</i></div><div class="cp-g">${condGrid(ins.cd)}</div>`;
  stage().appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),400)},3600)}
function zInfo(p){const ins=p.ins;
  const copies=col.inst.filter(i=>i.id===ins.id&&i.st==='raw');
  const act=ins.st==='raw'?`<button class="btn" data-z="grade">Send to STK for grading</button><small class="zn">Takes 1 minute. It leaves your binder until it's back.</small>`
   :ins.st==='grading'?`<div class="zst">At STK \u2014 back in <b class="gtimer" data-u="${ins.u}">${fmtLeft(ins.due)}</b></div>`
   :ins.st==='back'?`<button class="btn" data-z="open">It's back \u2014 open it</button>`:'';
  return `<div class="zinfo"><div class="zcond"><div class="cp-sc"><small>CONDITION</small><b>${condScore(ins.cd).toFixed(1)}</b><i>/ 10</i></div><div class="cp-g">${condGrid(ins.cd)}</div></div>
   ${copies.length>1?`<div class="zcopies">${copies.map((c,i)=>`<button class="zc${c.u===ins.u?' on':''}" data-c="${c.u}">Copy ${i+1} \u00b7 ${condScore(c.cd).toFixed(1)}</button>`).join('')}</div>`:''}
   ${act}</div>`}
function zoom(p,opt){opt=opt||{};SFX.flip();const z=document.createElement('div');z.className='zoom'+(opt.slab?' zslab':'');
  const body=opt.slab?`<div class="deck sdeck"><div class="slot">${slabHTML(opt.slab)}</div></div>`
    :`<div class="deck"><div class="slot">${cardEl(p.c,p.foil,false,p.ins)}</div></div>`;
  z.innerHTML=body+(!opt.slab&&p.ins&&HI(p.c.t)?zInfo(p):'')
    +`<div class="zhint">${opt.slab?'Drag to tilt the slab.':'Drag to spin it around.'} Tap outside to close.</div>`;
  root.appendChild(z);
  const prev=E.el,prevKind=E.kind,deck=z.querySelector('.deck');activate(z.querySelector('.tilt'),'card');E.k=.05;E.f=.07;
  let sx,sy,bx,by,lx,ly,lt,vx=0,vy=0,down=false;
  const lim=opt.slab?50:1e9;   // a slab has no back worth showing, so it tilts rather than spins
  const zt=z.querySelector('.tilt');
  deck.onpointerdown=e=>{e.stopPropagation();if(E.el!==zt){activate(zt,'card');E.k=.05;E.f=.07}down=true;E.free=true;deck.setPointerCapture(e.pointerId);sx=lx=e.clientX;sy=ly=e.clientY;lt=performance.now();bx=E.bx;by=E.by;E.k=.3;E.f=.45;SFX.tick()};
  deck.onpointermove=e=>{if(!down)return;const now=performance.now(),dt=Math.max(1,now-lt);vx=(e.clientX-lx)/dt;vy=(e.clientY-ly)/dt;lx=e.clientX;ly=e.clientY;lt=now;
    E.by=clamp(by+(e.clientX-sx)*.55,-lim,lim);E.bx=clamp(bx-(e.clientY-sy)*.55,-70,70);E.hx=E.hy=0};
  const up=()=>{if(!down)return;down=false;E.free=false;E.k=.05;E.f=.07;
    if(opt.slab){E.by=0;E.bx=0}else{E.vy+=vx*14;E.vx-=vy*10;const proj=E.ry+E.vy*14;E.by=Math.round(proj/180)*180;E.bx=0}
    if(Math.abs(vx)>.8)SFX.swoosh();E.last=performance.now()};
  deck.onpointerup=up;deck.onpointercancel=up;deck.onclick=e=>e.stopPropagation();
  const close=()=>{z.remove();E.k=.07;E.f=.14;E.bx=E.by=0;if(prev&&prev.isConnected)activate(prev,prevKind);else deactivate();if(refreshDue)softRefresh()};
  z.onclick=close;
  const zi=z.querySelector('.zinfo');
  if(zi){zi.onclick=e=>e.stopPropagation();zi.onpointerdown=e=>e.stopPropagation();
    zi.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{close();zoom({c:p.c,foil:p.foil,ins:instBy(b.dataset.c)})});
    const gb=zi.querySelector('[data-z="grade"]');if(gb)gb.onclick=()=>{sendGrade(p.ins);close();if(curView==='binder')binder()};
    const ob=zi.querySelector('[data-z="open"]');if(ob)ob.onclick=()=>{close();openGraded(p.ins)}}
  return close}
const owns=c=>{const e=col[c.id];return!!((e&&(e.n||e.f))||col.inst.some(i=>i.id===c.id&&i.st!=='raw'))};
function binder(){const st=stage();deactivate();root.onkeydown=null;
  const owned=SET.filter(owns).length,foils=SET.filter(c=>col[c.id]&&col[c.id].f).length,slabN=col.inst.filter(i=>i.st==='slab').length;
  st.innerHTML=`<div class="binder"><div class="bhead"><span>${owned} of ${SET.length} collected</span><span>${foils} reverse holos${slabN?` \u00b7 ${slabN} graded`:''} \u00b7 ${OBS.filter(o=>col.rew&&col.rew[o.line]).length}/${OBS.length} Obsidian</span></div>
   <div class="prog"><i style="width:${owned/SET.length*100}%"></i></div>
   <div class="grid">${LINES.map(L=>lineOf(L.key).map(c=>{const e=col[c.id]||{n:0,f:0},has=owns(c),hi=HI(c.t);
     const raws=hi?col.inst.filter(i=>i.id===c.id&&i.st==='raw').sort((a,b)=>condScore(b.cd)-condScore(a.cd)):[];
     const away=hi?col.inst.filter(i=>i.id===c.id&&(i.st==='grading'||i.st==='back')):[];
     const slabs=hi?col.inst.filter(i=>i.id===c.id&&i.st==='slab').length:0;
     const show=raws[0]||away[0]||null;
     return `<div class="mini${has?'':' miss'}" data-id="${c.id}" data-f="${e.f?1:0}" data-n="${c.no}" data-u="${show?show.u:''}">${cardEl(c,!!e.f,false,show,1)}
      ${e.n>1?`<span class="qty">\u00d7${e.n}</span>`:''}${e.f?`<span class="qty f">Rev \u00d7${e.f}</span>`:''}
      ${slabs?`<span class="qty s">STK \u00d7${slabs}</span>`:''}
      ${raws[0]?`<span class="cbadge">${condScore(raws[0].cd).toFixed(1)}</span>`:''}
      ${!e.n&&away.length?`<div class="gsleeve">${away[0].st==='back'?'<b>BACK!</b><small>Open in Graded</small>'
        :`<b>AT STK</b><small>Back soon \u00b7 <span class="gtimer" data-u="${away[0].u}">${fmtLeft(away[0].due)}</span></small>`}</div>`:''}
     </div>`}).join('')+obsSlot(L)).join('')}</div>
   ${owned?'':'<p style="text-align:center;color:var(--mute);margin-top:20px;font-weight:600">Buy a pack to start your collection</p>'}</div>`;
  minis(st);
  st.querySelectorAll('[data-craft]').forEach(el=>{if(el.dataset.craft)el.onclick=()=>{SFX.tick();craft(el.dataset.craft)}})}

/* ---------------- OBSIDIAN EDITION (crafted) ----------------
   Every evolution line ends in a black, face-hidden slot in the binder showing
   how much of the line you own. Own all of it - raw, at grading, or slabbed, so
   sending a card off never locks you out - and the slot becomes a Craft button.
   Crafting does NOT consume the line. Crafted cards are pristine collector
   pieces: no condition, no wear, and they can't be sent for grading.
   col.rew[line] = when it was crafted (once per line). */
const lineHave=key=>lineOf(key).filter(owns).length;
const canCraft=key=>!(col.rew&&col.rew[key])&&lineHave(key)===lineOf(key).length;
function checkCraftable(){col.ready=col.ready||{};let n=0;
  LINES.forEach(L=>{if(canCraft(L.key)&&!col.ready[L.key]){col.ready[L.key]=1;n++;
    note(`${L.names[2]} line complete \u2014 your Obsidian Edition is ready to craft in the binder`)}});
  if(n)save();return n}
function craft(key){if(!canCraft(key))return false;const o=OBS.find(x=>x.line===key);
  col.rew=col.rew||{};col.rew[key]=Date.now();(col[o.id]||(col[o.id]={n:0,f:0})).n++;save();
  if(root&&root.isConnected)craftReveal(o);return true}
function craftReveal(o){const L=LINES.find(l=>l.key===o.line);
  const ov=document.createElement('div');ov.className='rwov';ov.style.setProperty('--h',o.h);
  ov.innerHTML=`<div class="rw-rays"></div>
   <div class="rw-head"><small>OBSIDIAN EDITION \u00b7 CRAFTING</small><b>${hx(L.names[0])} \u2192 ${hx(L.names[1])} \u2192 ${hx(L.names[2])}</b></div>
   <div class="deck rwdeck"><div class="slot forge">${cardEl(o,false,true)}</div></div>
   <div class="rw-foot"><b>${hx(o.name)} crafted</b><small>${numOf(o)} \u00b7 added to your binder</small></div>
   <div class="dock"><button class="btn" id="rwOk">Back to binder</button></div>`;
  root.appendChild(ov);deactivate();
  const t=ov.querySelector('.tilt'),fl=ov.querySelector('.flip');
  try{SFX.init();SFX.charge()}catch(x){}
  setTimeout(()=>{ov.querySelector('.slot').classList.remove('forge');fl.classList.remove('down');
    try{SFX.flip();SFX.boom();SFX.reveal('u',true);setTimeout(()=>SFX.reveal('u',true),350)}catch(x){}
    activate(t,'card');root.classList.remove('shake2');void root.offsetWidth;root.classList.add('shake2','shake-bwr');
    setTimeout(()=>root.classList.remove('shake2','shake-bwr'),900);
    const bu=document.createElement('div');bu.className='burst';
    for(let k=0;k<110;k++){const a=Math.random()*Math.PI*2,d=140+Math.random()*300;
      bu.innerHTML+=`<i style="--c:${k%3?`hsl(${o.h+Math.random()*80-40} 95% 65%)`:'#fff'};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px"></i>`}
    ov.appendChild(bu);setTimeout(()=>bu.remove(),1300)},1500);
  ov.querySelector('#rwOk').onclick=()=>{ov.remove();deactivate();go('binder')}}
/* the slot that closes out each line in the binder */
function obsSlot(L){const o=OBS.find(x=>x.line===L.key),e=col[o.id];
  if(e&&(e.n||e.f))return `<div class="mini obsown" data-id="${o.id}" data-f="0" data-n="${o.no}" data-u="">${cardEl(o,false,false,null,1)}${e.n>1?`<span class="qty">\u00d7${e.n}</span>`:''}</div>`;
  const tot=lineOf(L.key).length,have=lineHave(L.key),ready=canCraft(L.key);
  return `<div class="mini miss obslock${ready?' ready':''}" data-craft="${ready?L.key:''}"><div class="oblk">
    <small>${numOf(o)}</small><b>OBSIDIAN</b>
    ${ready?`<span class="obcraft">Craft</span><small>Line complete</small>`
      :`<em>${have} / ${tot}</em><small>till you can craft</small>`}
    <span class="obtrk"><i style="width:${have/tot*100}%"></i></span></div></div>`}

/* ---------------- GRADING ---------------- */
const GRADE_MS=60000;
const note=m=>{if(B.notify)B.notify(m);else{const t=document.createElement('div');t.className='tnote';t.textContent=m;root&&root.appendChild(t);setTimeout(()=>t.remove(),3200)}};
function sendGrade(ins){if(!ins||ins.st!=='raw')return;const e=col[ins.id];if(!e||e.n<1)return;
  e.n--;ins.st='grading';ins.sent=Date.now();ins.due=Date.now()+GRADE_MS;save();
  try{SFX.slide()}catch(x){}note(`${CARD(ins.id).name} sent to STK \u2014 back in 1 minute`)}
/* re-render binder/graded in the background without yanking the player around:
   never while a card is zoomed, a slab is being opened or a craft is playing
   (it waits for them to close), and it keeps the scroll position */
let refreshDue=false;
function softRefresh(){if(!root||!root.isConnected||(curView!=='graded'&&curView!=='binder'))return;
  if(root.querySelector('.zoom,.rwov,.stkwrap')){refreshDue=true;return}
  refreshDue=false;const st=stage(),y=st?st.scrollTop:0,ry=root.scrollTop;go(curView);
  if(st)st.scrollTop=y;root.scrollTop=ry}
function gradeTick(){if(!col||!col.inst)return;const now=Date.now(),back=[];
  col.inst.forEach(i=>{if(i.st==='grading'&&now>=i.due){i.st='back';i.grade=stkGrade(i);
    i.cert='STK '+String(10000000+(i.s%89999999)).slice(-8);back.push(i)}});
  if(back.length){save();back.forEach(i=>note(`${CARD(i.id).name} is back from STK grading \u2014 open it in Stack Cards`));
    try{SFX.ding(880);setTimeout(()=>SFX.ding(1320),120)}catch(x){}
    softRefresh()}
  if(root&&root.isConnected){
    root.querySelectorAll('.gtimer').forEach(el=>{const i=instBy(el.dataset.u);if(i&&i.due)el.textContent=fmtLeft(i.due)});
    const n=col.inst.filter(i=>i.st==='back').length,dot=root.querySelector('#tcgDot');
    if(dot){dot.textContent=n||'';dot.classList.toggle('on',!!n)}
    const tt=root.querySelector('#tcgTradeTab');if(tt){const on=!!(B.party&&B.party().on);tt.hidden=!on;if(!on&&curView==='trade')go('binder')}}
  B.onGrading&&B.onGrading(col.inst.filter(i=>i.st==='back').length)}
setInterval(gradeTick,1000);

const STK_LOGO='<svg viewBox="0 0 32 32" class="stkhex"><path d="M16 2 29 9v14L16 30 3 23V9z" fill="#00e701"/><path d="M11 12h10M11 16h10M11 20h10" stroke="#0a1f12" stroke-width="2.6" stroke-linecap="round"/></svg>';
function barcode(sv){let x=0,h='';const r=rng([...sv].reduce((a,ch)=>(a*31+ch.charCodeAt(0))>>>0,7));
  for(let i=0;i<52;i++){const w=r()<.5?1:r()<.7?2:3;if(i%2===0)h+=`<rect x="${x}" y="0" width="${w}" height="20" fill="#111"/>`;x+=w}
  return `<svg class="sl-bc" viewBox="0 0 ${x} 20" preserveAspectRatio="none">${h}</svg>`}

/* The slab: thick clear acrylic, a framed label with the grade, and the card
   floating in an inner well. Modelled on a PSA case, in Stack's colours. */
function slabHTML(ins,small){const c=CARD(ins.id),g=ins.grade;
  return `<div class="tilt slabt" data-h="${c.h??0}" data-t="${c.t}" data-rev="0" data-id="${c.id}">
   <div class="slab${small?' sm':''}${g===10?' gem':''}">
    <div class="sl-label">
     <div class="sl-lt"><div class="sl-l1">2026 STACK CARDS \u00b7 MYTHIC</div>
      <div class="sl-l2">${hx(c.name.toUpperCase())}</div>
      <div class="sl-l3">${hx((TNAME[c.t]||'').toUpperCase())}${c.mono?' \u00b7 '+hx(c.mono.toUpperCase()):''}</div>
      <div class="sl-l4">${numOf(c)}</div></div>
     <div class="sl-rt"><div class="sl-gw">${GW[g]||''}</div><div class="sl-gn">${g}</div><div class="sl-veil"></div></div>
     <div class="sl-bar">${barcode(ins.cert||'STK')}<span class="sl-cert">${ins.cert||''}</span><span class="sl-logo">${STK_LOGO}<b>STK</b><i class="sl-holo"></i></span></div>
    </div>
    <div class="sl-ridge"></div>
    <div class="sl-well"><div class="sl-card">${cardFront(c,false,ins,small?1:0)}</div></div>
    <div class="sl-edge"></div><div class="sl-glare"></div>
   </div></div>`}

/* The mailer it comes back in */
function stkBoxFace(ins,mini){const c=CARD(ins.id);
  return `<div class="sbf${mini?' mini':''}"><div class="sbf-foil"></div>
   <div class="sbf-logo">${STK_LOGO}</div><div class="sbf-t1">STACK GRADING</div><div class="sbf-t2">SERVICES</div>
   <div class="sbf-rule"></div><div class="sbf-t3">AUTHENTICATED \u00b7 GRADED \u00b7 ENCAPSULATED</div>
   <div class="sbf-slip"><span>ORDER ${ins.cert||''}</span><b>${hx(c.name.toUpperCase())}</b><span>1 ITEM \u00b7 ${hx(TNAME[c.t].toUpperCase())}</span></div>
   <div class="sbf-seal">SEALED</div></div>`}

/* Graded view: one row of chips per filter (rarity, then grade, then how to
   group), and the slabs laid out in labelled rows - by grade, or by rarity. */
const GF={rar:'all',gr:'all',by:'grade'};
const GR_BANDS=[['all','All'],['10','10'],['9','9'],['8','8\u20138.5'],['7','7\u20137.5'],['low','6.5 & under']];
const inBand=(g,b)=>b==='all'||(b==='10'?g===10:b==='9'?g===9:b==='8'?g>=8&&g<9:b==='7'?g>=7&&g<8:g<7);
function slabFilters(all){
  const rars=[['all','All'],['fa','Full Art'],['sir','SIR'],['bwr','Mono Rare']];
  const chips=(k,opts)=>opts.map(([v,l])=>`<button class="gchip${GF[k]===v?' on':''}" data-gf="${k}:${v}">${l}</button>`).join('');
  const list=all.filter(i=>(GF.rar==='all'||CARD(i.id).t===GF.rar)&&inBand(i.grade,GF.gr));
  let rows;
  if(GF.by==='rarity')rows=['bwr','sir','fa'].map(t=>({title:TNAME[t],items:list.filter(i=>CARD(i.id).t===t)}));
  else{const gs=[...new Set(list.map(i=>i.grade))].sort((a,b)=>b-a);
    rows=gs.map(g=>({title:`${GW[g]} ${g}`,items:list.filter(i=>i.grade===g)}))}
  rows=rows.filter(r=>r.items.length);
  return `<div class="gfbar">
    <div class="gfg"><span>RARITY</span>${chips('rar',rars)}</div>
    <div class="gfg"><span>GRADE</span>${chips('gr',GR_BANDS)}</div>
    <div class="gfg"><span>ROWS</span>${chips('by',[['grade','By grade'],['rarity','By rarity']])}</div></div>
   ${rows.length?rows.map(r=>`<div class="grow"><h5>${r.title}<small>${r.items.length}</small></h5>
     <div class="sgrid">${r.items.map(i=>`<div class="smini" data-u="${i.u}">${slabHTML(i,1)}</div>`).join('')}</div></div>`).join('')
    :'<p class="gempty">No slabs match those filters.</p>'}`}
function graded(){const st=stage();deactivate();root.onkeydown=null;
  const back=col.inst.filter(i=>i.st==='back'),away=col.inst.filter(i=>i.st==='grading');
  const slabs=col.inst.filter(i=>i.st==='slab').sort((a,b)=>b.grade-a.grade||RANK[CARD(b.id).t]-RANK[CARD(a.id).t]);
  st.innerHTML=`<div class="binder gradedv">
   <div class="ghero"><div class="ghx">${STK_LOGO}</div><div><b>Stack Grading Services</b>
    <small>Full Art and above can be graded. Tap one in your binder and send it off \u2014 it comes back sealed in an STK slab with an official grade from 1 to 10.</small></div></div>
   ${back.length?`<h4 class="gh">Back from grading \u00b7 ready to open</h4><div class="gpk">${back.map(i=>`<div class="gbx">${stkBoxFace(i,1)}<button class="btn" data-open="${i.u}">Open</button></div>`).join('')}</div>`:''}
   ${away.length?`<h4 class="gh">At STK</h4><div class="gaway">${away.map(i=>`<div class="garow"><span>${hx(CARD(i.id).name)} <small>${TNAME[CARD(i.id).t]} \u00b7 condition ${condScore(i.cd).toFixed(1)}</small></span><b class="gtimer" data-u="${i.u}">${fmtLeft(i.due)}</b></div>`).join('')}</div>`:''}
   <h4 class="gh">Your slabs${slabs.length?` \u00b7 ${slabs.length}`:''}</h4>
   ${slabs.length?slabFilters(slabs):'<p class="gempty">No graded cards yet. Pull a Full Art or better, then send it from your binder.</p>'}
  </div>`;
  st.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{SFX.tick();openGraded(instBy(b.dataset.open))});
  st.querySelectorAll('[data-gf]').forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.gf.split(':');GF[k]=v;SFX.tick();graded()});
  st.querySelectorAll('.smini').forEach(m=>{const t=m.querySelector('.tilt');light(t,.5,.35,.6);
    m.onpointerenter=()=>{if(!root.querySelector('.zoom'))activate(t,'card')};m.onclick=()=>zoom(null,{slab:instBy(m.dataset.u)})})}

/* Opening the mailer: drag across the seal, the lid lifts away, light spills
   out and the slab rises - then the grade is unveiled. */
function openGraded(ins){if(!ins||ins.st!=='back')return;
  root.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v==='graded'));curView='graded';
  const st=stage();deactivate();root.onkeydown=null;
  st.innerHTML=`<div class="stkwrap" id="sw"><div class="stkbox" id="sb">
    <div class="sb-base"><div class="sb-glow"></div></div>
    <div class="sb-lid" id="sbLid">${stkBoxFace(ins)}</div>
    <div class="sb-zip"><i></i></div><div class="tear-zone" id="sz"></div></div></div>
   <div class="hint" id="hint">Drag across the seal to open your STK mailer</div>`;
  let pr=0,lastX=null,done=false;const sz=$('#sz'),bar=$('.sb-zip i');
  sz.onpointerdown=e=>{SFX.init();lastX=e.clientX;sz.setPointerCapture(e.pointerId);try{SFX.crinkle(2)}catch(x){}};
  sz.onpointermove=e=>{if(lastX==null||done)return;pr=Math.min(1,pr+Math.abs(e.clientX-lastX)/($('#sb').offsetWidth*1.05));lastX=e.clientX;
    bar.style.setProperty('--tp',pr*100+'%');try{SFX.tickP(pr)}catch(x){}if(pr>=1){done=true;revealSlab(ins)}};
  sz.onpointerup=()=>{lastX=null};
  $('#sb').tabIndex=0;$('#sb').onkeydown=e=>{if(e.key==='Enter'&&!done){done=true;revealSlab(ins)}}}

function revealSlab(ins){const st=stage(),g=ins.grade;
  ins.st='slab';ins.opened=Date.now();save();
  try{SFX.rip()}catch(x){}navigator.vibrate&&navigator.vibrate([10,30,20]);
  $('#sbLid').classList.add('gone');$('#sb').classList.add('open');const h=$('#hint');if(h)h.style.opacity=0;
  setTimeout(()=>{const w=document.createElement('div');w.className='slabrise';
    w.innerHTML=`<div class="deck sdeck"><div class="slot">${slabHTML(ins)}</div></div>`;st.appendChild(w);
    try{SFX.slide()}catch(x){}requestAnimationFrame(()=>activate(w.querySelector('.tilt'),'card'));
    setTimeout(()=>{w.classList.add('graded');gradeFX(g);
      const call=document.createElement('div');call.className='gradecall'+(g===10?' gem':'');
      call.innerHTML=`<small>STK GRADE</small><b>${g}</b><i>${GW[g]}</i>`;st.appendChild(call);
      const dk=document.createElement('div');dk.className='dock';
      dk.innerHTML='<button class="btn ghost" id="toG">All my slabs</button><button class="btn" id="zs">Inspect slab</button>';st.appendChild(dk);
      $('#toG').onclick=()=>{SFX.tick();go('graded')};$('#zs').onclick=()=>zoom(null,{slab:ins});
      gradeTick()},1700)},700)}

function gradeFX(g){const st=stage();
  const c=g===10?'#00e701':g>=9?'#ffd35a':g>=7?'#cfe8ff':'#b1bad3';
  if(g>=9){try{SFX.boom()}catch(x){}root.classList.remove('shake2');void root.offsetWidth;root.classList.add('shake2','shake-sir');
    setTimeout(()=>root.classList.remove('shake2','shake-sir'),900)}
  try{SFX.reveal(g>=9?'u':g>=7?'r':'c',g>=8);if(g===10){setTimeout(()=>SFX.reveal('u',true),320);setTimeout(()=>SFX.reveal('u',true),700)}}catch(x){}
  const cnt=g===10?120:g>=9?70:g>=7?30:0;
  if(cnt){const b=document.createElement('div');b.className='burst';
    for(let i=0;i<cnt;i++){const a=Math.random()*Math.PI*2,d=140+Math.random()*300;
      b.innerHTML+=`<i style="--c:${g===10?(i%2?'#00e701':'#ffd35a'):c};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px"></i>`}
    st.appendChild(b);setTimeout(()=>b.remove(),1300)}
  if(g>=9){const f=document.createElement('div');f.className='flash';f.style.setProperty('--c',c);st.appendChild(f);setTimeout(()=>f.remove(),700)}}


/* ---------------- TRADING ----------------
   Only while in a party. You see your mate's binder (and slabs), pick what you
   want from theirs and what you'll give from yours, and send an offer.

   Your side goes into ESCROW the moment you send: it leaves your binder so it
   can't be sold, graded or offered twice while they decide. Accept -> they hand
   over their side and you receive it. Decline, disconnect or a closed tab -> it
   comes straight back. Items:
     {k:'r', id, f}   one copy of a common/holo (f=1 for reverse holo)
     {k:'i', u, ins}  one individual Full Art+ copy or slab, condition and all  */
const TR={mate:null,sel:{give:[],want:[]},incoming:null,waiting:null};
const itemKey=it=>it.k==='i'?'i:'+it.u:'r:'+it.id+':'+(it.f?1:0);
function snapshot(){const counts={};SET.concat(OBS).forEach(c=>{const e=col[c.id];if(e&&(e.n||e.f))counts[c.id]=[HI(c.t)?0:e.n,e.f]});
  return{counts,inst:col.inst.filter(i=>i.st==='raw'||i.st==='slab').map(i=>JSON.parse(JSON.stringify(i)))}}
/* remove items from our collection; returns their full payloads, or null if any are missing */
function takeItems(items){const need={};items.forEach(it=>{const k=itemKey(it);need[k]=(need[k]||0)+1});
  for(const k in need){const [kind,a,b]=k.split(':');
    if(kind==='i'){const i=instBy(a);if(!i||(i.st!=='raw'&&i.st!=='slab'))return null}
    else{const e=col[a];if(!e||(b==='1'?e.f:e.n)<need[k])return null}}
  const out=[];
  items.forEach(it=>{if(it.k==='i'){const i=instBy(it.u);col.inst=col.inst.filter(x=>x.u!==it.u);
      if(i.st==='raw'&&col[i.id])col[i.id].n--;out.push({k:'i',u:i.u,ins:i})}
    else{const e=col[it.id];it.f?e.f--:e.n--;out.push({k:'r',id:it.id,f:it.f?1:0})}});
  return out}
function giveItems(items){(items||[]).forEach(it=>{
  if(it.k==='i'&&it.ins){const i=JSON.parse(JSON.stringify(it.ins));if(i.st!=='slab')i.st='raw';
    if(instBy(i.u))return;col.inst.push(i);if(i.st==='raw'){const e=col[i.id]||(col[i.id]={n:0,f:0});e.n++}}
  else if(it.k==='r'){const e=col[it.id]||(col[it.id]={n:0,f:0});it.f?e.f++:e.n++}})}
const canGive=items=>{const bak=JSON.stringify(col),ok=!!takeItems(items);col=JSON.parse(bak);return ok};

/* tiles for a whole collection (ours, or the snapshot of theirs) */
function tilesOf(snap){const out=[];
  SET.concat(OBS).forEach(c=>{const v=snap.counts[c.id];if(!v)return;
    if(v[0])out.push({it:{k:'r',id:c.id,f:0},c,max:v[0],foil:false});
    if(v[1])out.push({it:{k:'r',id:c.id,f:1},c,max:v[1],foil:true})});
  snap.inst.forEach(i=>out.push({it:{k:'i',u:i.u},c:CARD(i.id),max:1,ins:i}));
  return out.sort((a,b)=>RANK[b.c.t]-RANK[a.c.t]||(b.ins&&b.ins.st==='slab')-(a.ins&&a.ins.st==='slab')||a.c.id-b.c.id)}
function tileHTML(t,side,sel){const n=sel.filter(x=>itemKey(x)===itemKey(t.it)).length;
  const inner=t.ins&&t.ins.st==='slab'?`<div class="tslab">${slabHTML(t.ins,1)}</div>`:cardEl(t.c,t.foil,false,t.ins,1);
  return `<div class="ttile${n?' on':''}" data-side="${side}" data-k="${hx(itemKey(t.it))}">${inner}
    ${t.ins&&t.ins.st==='slab'?`<span class="qty s">STK ${t.ins.grade}</span>`:t.ins?`<span class="cbadge">${condScore(t.ins.cd).toFixed(1)}</span>`:''}
    ${t.max>1?`<span class="qty">\u00d7${t.max}</span>`:''}${n?`<span class="tpick">${n>1?'\u00d7'+n:'\u2713'}</span>`:''}</div>`}
const itemLabel=(it,snapInst)=>{if(it.k==='i'){const i=it.ins||(snapInst||[]).find(x=>x.u===it.u)||instBy(it.u);if(!i)return'?';
  return CARD(i.id).name+(i.st==='slab'?` (STK ${i.grade})`:` (${condScore(i.cd).toFixed(1)})`)}
  return CARD(it.id).name+(it.f?' (Reverse)':'')};

function trade(){const st=stage();deactivate();root.onkeydown=null;
  const party=B.party&&B.party();
  if(!party||!party.on){st.innerHTML='<div class="binder"><p class="gempty">Join a party with your mate to trade cards.</p></div>';return}
  if(!TR.mate){B.send({t:'tcgReq'});st.innerHTML=`<div class="binder"><p class="gempty">Opening ${hx(party.name)}'s binder\u2026</p></div>`;return}
  const theirs=tilesOf(TR.mate.col),mine=tilesOf(snapshot());
  const ownedT=Object.keys(TR.mate.col.counts).length,slabsT=TR.mate.col.inst.filter(i=>i.st==='slab').length;
  st.innerHTML=`<div class="binder tradev">
   ${TR.waiting?`<div class="twait">Offer sent \u2014 waiting for ${hx(TR.mate.name)} to accept\u2026 <button class="lnk" id="tCancel">Cancel offer</button></div>`:''}
   <div class="tcols">
    <div class="tcol"><div class="bhead"><span><b>${hx(TR.mate.name)}'s binder</b> \u00b7 tap to ask for</span><span>${ownedT} cards${slabsT?` \u00b7 ${slabsT} slabs`:''}</span></div>
     <div class="tgrid">${theirs.map(t=>tileHTML(t,'want',TR.sel.want)).join('')||'<p class="gempty">Their binder is empty.</p>'}</div></div>
    <div class="tcol"><div class="bhead"><span><b>Your binder</b> \u00b7 tap to offer</span><span>${mine.length} tradable</span></div>
     <div class="tgrid">${mine.map(t=>tileHTML(t,'give',TR.sel.give)).join('')||'<p class="gempty">Nothing to trade yet.</p>'}</div></div>
   </div></div>
   <div class="dock tdock"><div class="tsum"><span>You give <b>${TR.sel.give.length}</b></span><span>You get <b>${TR.sel.want.length}</b></span></div>
    <button class="btn ghost" id="tClr">Clear</button><button class="btn" id="tSend" ${(TR.sel.give.length||TR.sel.want.length)&&!TR.waiting?'':'disabled'}>Send offer</button></div>`;
  const pick=(side,key)=>{const arr=side==='give'?TR.sel.give:TR.sel.want,pool=side==='give'?mine:theirs;
    const t=pool.find(x=>itemKey(x.it)===key);if(!t)return;
    const have=arr.filter(x=>itemKey(x)===key).length;
    if(have>=t.max){for(let i=arr.length-1;i>=0;i--)if(itemKey(arr[i])===key)arr.splice(i,1)}else arr.push(Object.assign({},t.it));
    SFX.tick();trade()};
  st.querySelectorAll('.ttile').forEach(el=>el.onclick=()=>pick(el.dataset.side,el.dataset.k));
  $('#tClr').onclick=()=>{TR.sel={give:[],want:[]};trade()};
  $('#tSend').onclick=sendOffer;
  if($('#tCancel'))$('#tCancel').onclick=()=>{const w=TR.waiting;if(!w)return;B.send({t:'tcgCancel',oid:w});settleOffer({oid:w,ok:false},true)}}

function sendOffer(){const give=TR.sel.give.slice(),want=TR.sel.want.slice();if(!give.length&&!want.length)return;
  const out=takeItems(give);if(!out){note('Some of those cards are no longer in your binder');trade();return}
  const oid=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  col.escrow=col.escrow||{};col.escrow[oid]=out;save();
  const wantFull=want.map(it=>it.k==='i'?{k:'i',u:it.u,ins:TR.mate.col.inst.find(x=>x.u===it.u)}:it);
  B.send({t:'tcgOffer',oid,give:out,want:wantFull,from:B.me?B.me():'Your mate'});
  TR.waiting=oid;TR.sel={give:[],want:[]};SFX.slide&&SFX.slide();note('Offer sent');trade()}

function settleOffer(m,silent){const esc=col.escrow&&col.escrow[m.oid];if(TR.waiting===m.oid)TR.waiting=null;
  if(m.ok){giveItems(m.items);if(col.escrow)delete col.escrow[m.oid];save();note('Trade complete!');checkCraftable();
    try{SFX.reveal('u',true);SFX.boom()}catch(x){}}
  else{if(esc)giveItems(esc);if(col.escrow)delete col.escrow[m.oid];save();if(!silent)note(m.why==='missing'?'Trade failed \u2014 they no longer had those cards':'Trade declined')}
  TR.mate=null;if(root&&root.isConnected&&(curView==='trade'||curView==='binder'))go(curView)}

function showOffer(m){closeOffer();const el=document.createElement('div');el.className='tofr';
  const ok=canGive(m.want);
  const row=items=>items.length?items.map(it=>`<li>${hx(itemLabel(it))}</li>`).join(''):'<li class="none">Nothing</li>';
  el.innerHTML=`<div class="tofr-box"><h3>${hx(m.from||'Your mate')} wants to trade</h3>
   <div class="tofr-cols"><div><h5>You get</h5><ul>${row(m.give)}</ul></div><div><h5>You give</h5><ul>${row(m.want)}</ul></div></div>
   ${ok?'':'<p class="twarn">You no longer have everything they asked for.</p>'}
   <div class="tofr-act"><button class="btn ghost" id="tDec">Decline</button><button class="btn" id="tAcc" ${ok?'':'disabled'}>Accept trade</button></div></div>`;
  root.appendChild(el);try{SFX.ding(990)}catch(x){}
  $('#tDec').onclick=()=>{B.send({t:'tcgResp',oid:m.oid,ok:false});TR.incoming=null;closeOffer()};
  $('#tAcc').onclick=()=>{const out=takeItems(m.want);
    if(!out){B.send({t:'tcgResp',oid:m.oid,ok:false,why:'missing'});closeOffer();return}
    giveItems(m.give);save();B.send({t:'tcgResp',oid:m.oid,ok:true,items:out});TR.incoming=null;closeOffer();checkCraftable();
    note('Trade complete!');try{SFX.reveal('u',true);SFX.boom()}catch(x){}TR.mate=null;if(curView==='trade'||curView==='binder')go(curView)}}
const closeOffer=()=>{const o=root&&root.querySelector('.tofr');o&&o.remove()};

function onNet(m){if(!m||!m.t)return;
  if(m.t==='tcgReq'){B.send({t:'tcgCol',col:snapshot(),name:B.me?B.me():'Your mate'});return}
  if(m.t==='tcgCol'){TR.mate={col:m.col,name:m.name||'Your mate'};if(root&&curView==='trade')trade();return}
  if(m.t==='tcgOffer'){TR.incoming=m;if(root)showOffer(m);note(`${m.from||'Your mate'} sent you a card trade offer`);return}
  if(m.t==='tcgResp'){settleOffer(m);return}
  if(m.t==='tcgCancel'){if(TR.incoming&&TR.incoming.oid===m.oid){TR.incoming=null;closeOffer();note('They withdrew the trade offer')}return}
  if(m.t==='tcgLost'){if(col.escrow){Object.keys(col.escrow).forEach(k=>giveItems(col.escrow[k]));delete col.escrow;save()}
    TR.mate=null;TR.waiting=null;TR.incoming=null;closeOffer();if(root&&curView==='trade')go('binder')}}

window.StackCards={mount,SET,forceGod:()=>{FORCE_GOD=true},get collection(){return col},
  /* the host calls this when the logged-in account changes */
  reload(){col=loadCol();backfill();TR.mate=null;TR.waiting=null;if(root&&root.isConnected){updBal();go(curView)}},
  onNet,tick:gradeTick,go:v=>root&&go(v),get view(){return curView},get root(){return root},
  /* the host calls this when the player leaves for another game */
  pause:()=>{deactivate();const z=root&&root.querySelector('.zoom');z&&z.remove()},
  /* exposed for tests */
  _:{HI,rollCond,condScore,stkGrade,newInst,sendGrade,takeItems,giveItems,snapshot,wearHTML,slabHTML,cardFront,GW,GRADE_MS,rng,artSrc:k=>Art[k](),
     OBS,CARD,lineOf,canCraft,craft,checkCraftable,stripSky,numOf,GF,
     get col(){return col},set col(v){col=v}}};
if(document.getElementById('tcg')&&!window.StackBridge)mount(document.getElementById('tcg'));
})();
</script>
